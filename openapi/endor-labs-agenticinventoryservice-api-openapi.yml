openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Agentic Inventory Service API
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: AgenticInventoryService
paths:
  /v1/namespaces/{object.tenant_meta.namespace}/agentic-inventory:
    patch:
      operationId: AgenticInventoryService_UpdateAgenticInventory
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: object.tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgenticInventoryServiceUpdateAgenticInventoryBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1AgenticInventory'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: UpdateAgenticInventory updates an agentic inventory record
      tags:
      - AgenticInventoryService
      x-internal: true
  /v1/namespaces/{tenant_meta.namespace}/agentic-inventory:
    get:
      operationId: AgenticInventoryService_ListAgenticInventory
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: 'String of conditions to filter resources by.

          Filters may include any attribute along with the following operators:

          "==", "!=", ">", ">=", "<", "<=", "Contains", "In", "Matches", and

          "Exists". The logical operators "And" and "Or" are also supported.

          Expressions may be combined and grouped with parentheses.


          Examples:

          "spec.value == 5",

          "spec.value in ["a", "b", "c"]",

          "(meta.name == "xyz" and "spec.value in ["a","b"]) or (spec.value ==

          "c")".'
        in: query
        name: list_parameters.filter
        schema:
          type: string
      - description: 'Set the page token to start from.

          Use page tokens to page through list results or list specific pages.'
        in: query
        name: list_parameters.page_token
        schema:
          format: int32
          type: integer
      - description: 'Set the page size to limit the number of results returned.

          Default: 100. Max: 500.'
        in: query
        name: list_parameters.page_size
        schema:
          format: int32
          type: integer
      - description: Action to be executed with a request. Not supported for all endpoints.
        in: query
        name: list_parameters.action
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: list_parameters.mask
        schema:
          type: string
      - description: Get data from any child namespaces as well.
        in: query
        name: list_parameters.traverse
        schema:
          type: boolean
      - description: Field to sort objects by, for example, meta.name.
        in: query
        name: list_parameters.sort.path
        schema:
          type: string
      - description: 'Sort order. Default: ASC.'
        in: query
        name: list_parameters.sort.order
        schema:
          default: SORT_ENTRY_ORDER_UNSPECIFIED
          enum:
          - SORT_ENTRY_ORDER_UNSPECIFIED
          - SORT_ENTRY_ORDER_ASC
          - SORT_ENTRY_ORDER_DESC
          type: string
      - description: 'Return the number of objects matching the given list parameters.

          If count is set to true, the response is a CountResponse.

          Can be used together with filter and traverse.'
        in: query
        name: list_parameters.count
        schema:
          type: boolean
      - description: 'Group the objects based on this field.

          If there are multiple fields then the objects are grouped

          based on the uniqueness of all fields.

          Supports composite paths.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.aggregation_paths
        schema:
          type: string
      - description: 'Return the UUID of each object in each group as specified by

          aggregation_paths.'
        in: query
        name: list_parameters.group.show_aggregation_uuids
        schema:
          type: boolean
      - description: 'List of fields for which we want the unique count.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_count_paths
        schema:
          type: string
      - description: 'List of fields for which we want the unique values.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_value_paths
        schema:
          type: string
      - description: Only return objects from PR scans that match this context id.
        in: query
        name: list_parameters.ci_run_uuid
        schema:
          type: string
      - description: Page ID to retrieve.
        in: query
        name: list_parameters.page_id
        schema:
          type: string
      - description: 'Group the objects based on this time field,

          for example, meta.create_time.'
        in: query
        name: list_parameters.group_by_time.aggregation_paths
        schema:
          type: string
      - description: Return the UUIDs of the objects in each group.
        in: query
        name: list_parameters.group_by_time.show_aggregation_uuids
        schema:
          type: boolean
      - description: Interval unit by which the objects should be grouped.
        in: query
        name: list_parameters.group_by_time.interval
        schema:
          default: GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          enum:
          - GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          - GROUP_BY_TIME_INTERVAL_YEAR
          - GROUP_BY_TIME_INTERVAL_QUARTER
          - GROUP_BY_TIME_INTERVAL_MONTH
          - GROUP_BY_TIME_INTERVAL_WEEK
          - GROUP_BY_TIME_INTERVAL_DAY
          - GROUP_BY_TIME_INTERVAL_HOUR
          - GROUP_BY_TIME_INTERVAL_MINUTE
          - GROUP_BY_TIME_INTERVAL_SECOND
          type: string
      - description: 'Size of the time interval to group the objects by,

          for example, to group objects by 2-week intervals, set interval

          to GROUP_BY_TIME_INTERVAL_WEEK and group_size to 2.'
        in: query
        name: list_parameters.group_by_time.group_size
        schema:
          format: int32
          type: integer
      - description: 'Beginning of the time period to group objects.

          Defaults to the beginning of time.'
        in: query
        name: list_parameters.group_by_time.start_time
        schema:
          format: date-time
          type: string
      - description: 'End of the time period to group objects.

          Defaults to the current time.'
        in: query
        name: list_parameters.group_by_time.end_time
        schema:
          format: date-time
          type: string
      - description: 'The mode determines how the matching objects are counted

          in the produced time-series. Values allowed are:

          count (default) : is the number of items matching in every interval.

          sum: is the total number of items matching since the beginning of the

          aggregation time.'
        in: query
        name: list_parameters.group_by_time.mode
        schema:
          type: string
      - description: 'The aggregation_field is a field on the matched objects that we want to

          perform some operation in each interval (example : min, max, avg)'
        in: query
        name: list_parameters.group_by_time.aggregation_value_field
        schema:
          type: string
      - description: 'The aggreation_operator is the operator that we should use for the

          aggregation. Allowed values are: min, max, sum, avg'
        in: query
        name: list_parameters.group_by_time.aggregation_operator
        schema:
          type: string
      - description: 'If true, the results will not be paginated and

          only the first page will be returned. The order

          of the results is not guaranteed.'
        in: query
        name: list_parameters.disable_pagination
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListAgenticInventoryResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: ListAgenticInventory lists agentic inventory records
      tags:
      - AgenticInventoryService
      x-internal: true
  /v1/namespaces/{tenant_meta.namespace}/agentic-inventory/{uuid}:
    delete:
      operationId: AgenticInventoryService_DeleteAgenticInventory
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the resource to be deleted.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: Action to be executed with delete request.
        in: query
        name: delete_parameters.action
        schema:
          type: string
      - description: 'Force will force the deletion of the resource if any

          checks fail.'
        in: query
        name: delete_parameters.force
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: DeleteAgenticInventory deletes an agentic inventory record by UUID
      tags:
      - AgenticInventoryService
      x-internal: true
    get:
      operationId: AgenticInventoryService_GetAgenticInventory
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the requested resource.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: get_parameters.mask
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1AgenticInventory'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: GetAgenticInventory returns an agentic inventory record by UUID
      tags:
      - AgenticInventoryService
      x-internal: true
components:
  schemas:
    v1AgenticInventorySpec:
      properties:
        active_sessions:
          description: 'Number of sessions currently in progress (incremented on SESSION_START,

            decremented on SESSION_STOP).'
          format: int64
          type: string
        agent:
          $ref: '#/components/schemas/AgenticInventoryAgentMeta'
        ai_tool:
          $ref: '#/components/schemas/AgenticInventoryAiToolMeta'
        cmd_hook_events:
          description: Number of command hook events.
          format: int64
          type: string
        config_hook_events:
          description: 'Number of agent configuration change events. Counted separately from

            file_hook_events even though a config change is physically a file write,

            so that file activity and settings churn stay distinguishable.'
          format: int64
          type: string
        error_hook_events:
          description: Number of hook events that had an error.
          format: int64
          type: string
        file_hook_events:
          description: Number of file hook events.
          format: int64
          type: string
        interrupted_hook_events:
          description: Number of events that were interrupted.
          format: int64
          type: string
        last_seen:
          description: Timestamp when this inventory was last seen (most recent activity).
          format: date-time
          type: string
        mcp_server:
          $ref: '#/components/schemas/AgenticInventoryMcpMeta'
        model:
          $ref: '#/components/schemas/AgenticInventoryModelMeta'
        name:
          description: Unique name within the type (e.g. server name for MCP, agent name, model name).
          type: string
        repositories:
          description: Number of distinct repositories associated with this inventory item.
          format: int64
          type: string
        session_hook_events:
          description: Number of session hook events.
          format: int64
          type: string
        skill:
          $ref: '#/components/schemas/AgenticInventorySkillMeta'
        tool_hook_events:
          description: Number of tool hook events.
          format: int64
          type: string
        total_duration_msec:
          description: Sum of all hook event durations in milliseconds.
          format: int64
          type: string
        total_hook_events:
          description: Total number of hook events.
          format: int64
          type: string
        type:
          $ref: '#/components/schemas/v1InventoryType'
        user_prompt_hook_events:
          description: Number of user prompts submitted.
          format: int64
          type: string
        users:
          description: Number of distinct users that triggered events for this inventory item.
          format: int64
          type: string
      required:
      - type
      - name
      type: object
    v1InventoryType:
      default: INVENTORY_TYPE_UNSPECIFIED
      description: InventoryType discriminates agent, model, MCP server, skill, and AI tool inventory in the unified collection.
      enum:
      - INVENTORY_TYPE_UNSPECIFIED
      - INVENTORY_TYPE_AGENT
      - INVENTORY_TYPE_MODEL
      - INVENTORY_TYPE_MCP_SERVER
      - INVENTORY_TYPE_SKILL
      - INVENTORY_TYPE_AI_TOOL
      type: string
    AgenticInventoryMcpMeta:
      description: McpMeta holds MCP server-specific inventory fields.
      properties:
        admin_classification:
          $ref: '#/components/schemas/v1InventoryAdminClassification'
        agents_used:
          description: Agents that have used this MCP server.
          items:
            type: string
          type: array
        command:
          description: Command + args for stdio transport (e.g. ["npx","-y","@some/mcp"]).
          items:
            type: string
          type: array
        endpoint:
          description: Endpoint URL for http/sse transport.
          type: string
        env_keys:
          description: Names of env vars passed to the server. Values are NEVER persisted.
          items:
            type: string
          type: array
        models_used:
          description: Models that have been used with this MCP server.
          items:
            type: string
          type: array
        score_meta:
          $ref: '#/components/schemas/AgenticInventoryMcpScoreMeta'
        server_host:
          description: Host or URL of the server (e.g. "localhost", "https://api.example.com").
          type: string
        server_type:
          $ref: '#/components/schemas/v1ServerType'
        source:
          $ref: '#/components/schemas/v1McpServerSource'
        threat_classification:
          $ref: '#/components/schemas/v1InventoryThreatClassification'
        tools:
          description: List of tool names available/used from this server.
          items:
            type: string
          type: array
        transport:
          description: 'Transport: "stdio", "http", "sse" (from AgentMCPServer.transport).'
          type: string
      type: object
    AgenticInventorySkillRiskDimensions:
      description: 'Deprecated: use SkillScoreDimensions instead.'
      properties:
        data_protection:
          $ref: '#/components/schemas/AgenticInventorySkillRiskDimension'
        external_dependencies:
          $ref: '#/components/schemas/AgenticInventorySkillRiskDimension'
        instruction_integrity:
          $ref: '#/components/schemas/AgenticInventorySkillRiskDimension'
        permission_boundaries:
          $ref: '#/components/schemas/AgenticInventorySkillRiskDimension'
      type: object
    AgenticInventorySkillRiskDimension:
      description: 'Deprecated: use SkillScoreDimension instead.'
      properties:
        evidence:
          type: string
        score:
          format: float
          type: number
      type: object
    GroupResponseGroupData:
      description: Information about objects matching the given key.
      properties:
        aggregation_count:
          $ref: '#/components/schemas/v1CountResponse'
        aggregation_uuids:
          description: 'List of UUIDs of the objects in the group.

            Only populated if show_aggregation_uuids is set.'
          items:
            type: string
          type: array
        aggregation_value:
          $ref: '#/components/schemas/v1GroupAggregationValueResponse'
        unique_counts:
          additionalProperties:
            $ref: '#/components/schemas/v1CountResponse'
          description: 'Map of counts for the given unique_count_paths fields.

            Only populated if unique_count_paths is set.'
          type: object
        unique_values:
          additionalProperties:
            items:
              type: object
            type: array
          description: 'Map of values for the given unique_value_paths fields.

            Only populated if unique_value_paths is set.'
          type: object
      type: object
    AgenticInventoryModelMeta:
      description: ModelMeta holds model-specific inventory fields.
      properties:
        agents_used:
          description: Agents that have used this model.
          items:
            type: string
          type: array
        mcp_servers_used:
          description: MCP servers used with this model.
          items:
            type: string
          type: array
      type: object
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    v1ListAgenticInventoryResponse:
      description: Response to list agentic inventory records.
      properties:
        count_response:
          $ref: '#/components/schemas/v1CountResponse'
        group_response:
          $ref: '#/components/schemas/v1GroupResponse'
        list:
          $ref: '#/components/schemas/v1ListAgenticInventoryResponseList'
      type: object
    AgenticInventoryMcpRiskLevel:
      default: MCP_RISK_LEVEL_UNSPECIFIED
      description: McpRiskLevel is the categorical risk level produced by the aggregator.
      enum:
      - MCP_RISK_LEVEL_UNSPECIFIED
      - MCP_RISK_LEVEL_LOW
      - MCP_RISK_LEVEL_MEDIUM
      - MCP_RISK_LEVEL_HIGH
      - MCP_RISK_LEVEL_CRITICAL
      type: string
    AgenticInventoryMcpScoreDimension:
      description: McpScoreDimension is a single category's score block.
      properties:
        evidence:
          description: 'Human-readable evidence of what brought the score down. One line per

            triggered check, formatted as "[SEVERITY] CheckName: Detail". Unset when

            no findings fired in this category.'
          type: string
        score:
          description: Score 1-10 (higher = safer); unset if no checks ran for this category.
          format: float
          type: number
      type: object
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    v1AgenticInventory:
      description: 'AgenticInventory represents aggregated metrics for agents, models, MCP servers, skills, and AI tools.

        One collection with type discriminator. Upserted on agent hook events.'
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1AgenticInventorySpec'
        tenant_meta:
          $ref: '#/components/schemas/v1TenantMeta'
        uuid:
          description: The UUID of the inventory record.
          readOnly: true
          type: string
      required:
      - meta
      type: object
    AgenticInventoryAiToolMeta:
      description: AiToolMeta holds AI tool-specific inventory fields.
      properties:
        category:
          $ref: '#/components/schemas/v1AiToolCategory'
        evidence:
          description: Evidence supporting the detection.
          items:
            $ref: '#/components/schemas/v1AiToolEvidence'
          type: array
        sandbox_capable:
          description: Whether this tool supports a built-in sandbox.
          readOnly: true
          type: boolean
        vendor:
          description: Vendor of the tool (e.g. "Anthropic", "OpenSource", "Google").
          type: string
      type: object
    v1InventoryClassificationEvidence:
      description: 'InventoryClassificationEvidence records the policy that assigned the

        current value on a single classification axis. Snapshotted from the

        matching AgentHookPolicy so the inventory record remains self-describing

        after the policy is renamed or deleted.'
      properties:
        policy_name:
          description: Policy name at the time of match (snapshot — not refreshed later).
          type: string
      type: object
    v1UpdateRequest:
      description: Message used for all update requests.
      properties:
        force:
          description: 'Force will force the update of the resource if any

            checks fail.'
          type: boolean
        update_mask:
          description: Fields to update. Defaults to all fields.
          type: string
      type: object
    v1InventoryThreatClassification:
      description: 'InventoryThreatClassification carries the suspicious/malicious axis plus

        evidence. Within a single event, when multiple matching policies disagree,

        the stronger value wins (MALICIOUS dominates SUSPICIOUS dominates

        UNSPECIFIED). Across events, the current policy set is authoritative:

        see InventoryAdminClassification for the full semantics.'
      properties:
        evidence:
          $ref: '#/components/schemas/v1InventoryClassificationEvidence'
        value:
          $ref: '#/components/schemas/InventoryThreatClassificationThreatLevel'
      type: object
    v1GroupAggregationValueResponse:
      description: 'GroupAggregationValueResponse returns the value of the aggregation if

        requested.'
      properties:
        value:
          format: float
          type: number
      type: object
    AgenticInventorySkillScoreDimensions:
      description: 'SkillScoreDimensions holds per-dimension scores from LLM security analysis.

        Each dimension is scored 1-10 (higher = safer) with evidence.'
      properties:
        data_protection:
          $ref: '#/components/schemas/AgenticInventorySkillScoreDimension'
        external_dependencies:
          $ref: '#/components/schemas/AgenticInventorySkillScoreDimension'
        instruction_integrity:
          $ref: '#/components/schemas/AgenticInventorySkillScoreDimension'
        permission_boundaries:
          $ref: '#/components/schemas/AgenticInventorySkillScoreDimension'
      type: object
    AgenticInventoryAgentMeta:
      description: AgentMeta holds agent-specific inventory fields.
      properties:
        agent_version:
          description: Agent version if available.
          type: string
        mcp_servers_used:
          description: MCP servers used by this agent.
          items:
            type: string
          type: array
        models_used:
          description: Models that have been used with this agent.
          items:
            type: string
          type: array
        sandbox_capable:
          description: Whether this agent supports a built-in sandbox.
          readOnly: true
          type: boolean
      type: object
    InventoryThreatClassificationThreatLevel:
      default: THREAT_LEVEL_UNSPECIFIED
      description: "ThreatLevel is the threat classification level on the suspicious/malicious axis.\n\n - THREAT_LEVEL_UNSPECIFIED: No threat classification has been assigned.\n - THREAT_LEVEL_SUSPICIOUS: Flagged as suspicious by an AgentHookPolicy match.\n - THREAT_LEVEL_MALICIOUS: Flagged as malicious by an AgentHookPolicy match."
      enum:
      - THREAT_LEVEL_UNSPECIFIED
      - THREAT_LEVEL_SUSPICIOUS
      - THREAT_LEVEL_MALICIOUS
      type: string
    v1ListAgenticInventoryResponseList:
      properties:
        objects:
          items:
            $ref: '#/components/schemas/v1AgenticInventory'
          type: array
        response:
          $ref: '#/components/schemas/v1ListResponse'
      type: object
    v1TenantMeta:
      description: Tenant related data for the tenant containing the resource.
      properties:
        namespace:
          description: 'Namespaces are a way to organize organizational units into virtual

            groupings of resources. Namespaces must be a fully qualified name,

            for example, the child namespace of namespace "endor.prod" called "app"

            is called "endor.prod.app".'
          type: string
      required:
      - namespace
      type: object
    v1InventoryAdminClassification:
      description: 'InventoryAdminClassification carries the allow/block axis plus evidence.

        Within a single event, when multiple matching policies disagree, the

        stronger value wins (BLOCKED dominates ALLOWED dominates UNSPECIFIED).

        Across events, the current policy set is authoritative: a later event

        that no longer matches any classification policy leaves the field

        untouched, but a later event matching a different policy reclassifies

        the record accordingly.'
      properties:
        evidence:
          $ref: '#/components/schemas/v1InventoryClassificationEvidence'
