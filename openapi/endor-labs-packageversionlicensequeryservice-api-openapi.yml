openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Package Version License Query…
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: PackageVersionLicenseQueryService
paths:
  /v1/namespaces/{tenant_meta.namespace}/queries/package-version-licenses:
    post:
      operationId: PackageVersionLicenseQueryService_CreatePackageVersionLicenseQuery
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageVersionLicenseQueryServiceCreatePackageVersionLicenseQueryBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1PackageVersionLicenseQuery'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      tags:
      - PackageVersionLicenseQueryService
      x-internal: true
      summary: Package version license query service create package version license query
      x-summary-source: derived
components:
