openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Segment Index Request Service…
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: SegmentIndexRequestService
paths:
  /v1/namespaces/{tenant_meta.namespace}/segment-index-request:
    post:
      description: Creates a segment index request.
      operationId: SegmentIndexRequestService_CreateSegmentIndexRequest
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentIndexRequestServiceCreateSegmentIndexRequestBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1SegmentIndexRequest'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreateSegmentIndexRequest
      tags:
      - SegmentIndexRequestService
      x-internal: true
components:
  schemas:
    v1TenantMeta:
      description: Tenant related data for the tenant containing the resource.
      properties:
        namespace:
          description: 'Namespaces are a way to organize organizational units into virtual

            groupings of resources. Namespaces must be a fully qualified name,

            for example, the child namespace of namespace "endor.prod" called "app"

            is called "endor.prod.app".'
          type: string
      required:
      - namespace
      type: object
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    v1Meta:
      description: Common fields for all Endor Labs resources.
      properties:
        annotations:
          additionalProperties:
            type: string
          description: 'Annotations can be used to attach metadata to a resource message.

            Annotation values can be small or large, structured or unstructured,

            and may include characters not permitted by labels.

            The keys may contain alphanumerics, underscores (_), dots (.) and dashes

            (-). The values of an annotation must be 16384 bytes or smaller.'
          type: object
        create_time:
          description: 'Time the resource was created.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: 'Name and authentication source of the user who created the object,

            for example, ewok@endor.ai@google@api-key.'
          readOnly: true
          type: string
        description:
          description: Resource description. Must be less than 1024 bytes.
          type: string
        index_data:
          $ref: '#/components/schemas/v1IndexData'
        kind:
          description: 'Resource kind, for example, HelloResponse.

            Auto-generated using the protobuf message proto.MessageName().Name().'
          readOnly: true
          type: string
        name:
          description: Resource name. Must be 63 characters or less.
          type: string
        parent_kind:
          description: Parent object resource kind, for example, Project.
          type: string
        parent_uuid:
          description: Parent object UUID.
          type: string
        references:
          additionalProperties:
            $ref: '#/components/schemas/googleprotobufAny'
          description: Map of objects referenced in a query API.
          readOnly: true
          type: object
        tags:
          description: 'List of tags attached to the resource.

            Tags can be used to select objects and to find collections of objects that

            satisfy certain conditions. A tag must be 255 characters or less.'
          items:
            type: string
          type: array
        update_time:
          description: 'Time the resource was last updated.

            Note: Updated on all create/patch/delete operations.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: 'Name and authentication source of the last user who updated the object,

            for example, vulnerabilityingestor@endor.ai@x509.'
          readOnly: true
          type: string
        upsert_time:
          description: 'Time the resource was last upserted.


            Note:

            create_time is only set the first time the resource is created.

            upsert_time is set every time the resource is upseted.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        version:
          description: Message version.
          readOnly: true
          type: string
      required:
      - name
      type: object
    v1SegmentIndexRequestSpec:
      properties:
        function_summary_prompt_version:
          description: 'Prompt schema version the server currently requires for function

            summaries.'
          format: int32
          readOnly: true
          type: integer
        generate_embeddings:
          description: 'Whether the client wants embedding vectors computed for the segments

            in this request. Defaults to true when unset, so a client sent before

            this field existed keeps its current embedding behavior; only an

            explicit false skips embedding generation.'
          type: boolean
        project_uuid:
          description: Project UUID.
          type: string
        ref:
          description: Resolved ref of the source control version.
          type: string
        segmentation_done:
          description: Set to true for the last index request for the source control version.
          type: boolean
        segmentation_starting:
          description: Set to true for the first index request for the source control version.
          type: boolean
        segmenter_version:
          format: int32
          title: Segmenter version
          type: integer
        segments:
          description: List of segments to index.
          items:
            $ref: '#/components/schemas/v1Segment'
          type: array
        sha:
          description: SHA of the source control version.
          type: string
        summaries:
          description: 'Function summaries the client computed for segments in this request

            that the server reported as missing one (see Segment.has_summary).'
          items:
            $ref: '#/components/schemas/SegmentIndexRequestFunctionSummaryReport'
          type: array
        summary_done:
          description: 'Set by the server response to indicate every function segment

            indexed for this source control version already has a usable

            summary, so the client does not need to summarize any of them.'
          readOnly: true
          type: boolean
      type: object
    ContextContextType:
      default: CONTEXT_TYPE_UNSPECIFIED
      description: " - CONTEXT_TYPE_MAIN: Objects from a scan of the default branch.\nAll objects in the oss namespace are in the main context.\nThe context id is always \"default\".\n - CONTEXT_TYPE_EXTERNAL: Indicates that this object is a copy/temporary value of an object in\nanother project. Used for same-tenant dependencies. In source code\nreference this is equivalent to \"vendor\" folders. Package versions in\nthe external context are only scanned for call graphs. No other\noperations are performed on them.\n - CONTEXT_TYPE_CI_RUN: Objects from a PR scan. The context id is the PR UUID.\nObjects in this context are deleted after 30 days.\n - CONTEXT_TYPE_SBOM: Objects from an SBOM scan. The context id is the SBOM serial number or\nsome other unique identifier.\n - CONTEXT_TYPE_REF: Objects from a scan of a specific branch. The context id is the branch\nreference name."
      enum:
      - CONTEXT_TYPE_UNSPECIFIED
      - CONTEXT_TYPE_MAIN
      - CONTEXT_TYPE_EXTERNAL
      - CONTEXT_TYPE_CI_RUN
      - CONTEXT_TYPE_SBOM
      - CONTEXT_TYPE_REF
      type: string
    v1Language:
      default: LANGUAGE_UNSPECIFIED
      description: ' - LANGUAGE_GOSU: Gosu, a JVM language used by Guidewire applications.'
      enum:
      - LANGUAGE_UNSPECIFIED
      - LANGUAGE_GO
      - LANGUAGE_JAVA
      - LANGUAGE_SCALA
      - LANGUAGE_PYTHON
      - LANGUAGE_RUST
      - LANGUAGE_JS
      - LANGUAGE_RUBY
      - LANGUAGE_CSHARP
      - LANGUAGE_PHP
      - LANGUAGE_TYPESCRIPT
      - LANGUAGE_KOTLIN
      - LANGUAGE_SWIFT
      - LANGUAGE_OBJECTIVEC
      - LANGUAGE_C
      - LANGUAGE_CPP
      - LANGUAGE_SWIFTURL
      - LANGUAGE_CONAN
      - LANGUAGE_GOSU
      type: string
    v1SegmentIndexRequest:
      description: 'A segment index request allows the caller to provide a set of code

        segments with their associated metadata that should be indexed as part the

        embeddings store. Embeddings are only created. They are only read through the

        SegmentQueryRequest. The request can include multiple segments to allow

        parallel execution.'
      properties:
        context:
          $ref: '#/components/schemas/v1Context'
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1SegmentIndexRequestSpec'
        tenant_meta:
          $ref: '#/components/schemas/v1TenantMeta'
        uuid:
          description: The UUID of the segment index request.
          readOnly: true
          type: string
      required:
      - meta
      - spec
      type: object
    v1EmbeddingVector:
      description: Embedding vector for one code segment.
      properties:
        vector:
          items:
            format: float
            type: number
          type: array
      type: object
    googleprotobufAny:
      additionalProperties: {}
      description: "`Any` contains an arbitrary serialized protocol buffer message along with a\nURL that describes the type of the serialized message.\n\nProtobuf library provides support to pack/unpack Any values in the form\nof utility functions or additional generated methods of the Any type.\n\nExample 1: Pack and unpack a message in C++.\n\n    Foo foo = ...;\n    Any any;\n    any.PackFrom(foo);\n    ...\n    if (any.UnpackTo(&foo)) {\n      ...\n    }\n\nExample 2: Pack and unpack a message in Java.\n\n    Foo foo = ...;\n    Any any = Any.pack(foo);\n    ...\n    if (any.is(Foo.class)) {\n      foo = any.unpack(Foo.class);\n    }\n    // or ...\n    if (any.isSameTypeAs(Foo.getDefaultInstance())) {\n      foo = any.unpack(Foo.getDefaultInstance());\n    }\n\n Example 3: Pack and unpack a message in Python.\n\n    foo = Foo(...)\n    any = Any()\n    any.Pack(foo)\n    ...\n    if any.Is(Foo.DESCRIPTOR):\n      any.Unpack(foo)\n      ...\n\n Example 4: Pack and unpack a message in Go\n\n     foo := &pb.Foo{...}\n     any, err := anypb.New(foo)\n     if err != nil {\n       ...\n     }\n     ...\n     foo := &pb.Foo{}\n     if err := any.UnmarshalTo(foo); err != nil {\n       ...\n     }\n\nThe pack methods provided by protobuf library will by default use\n'type.googleapis.com/full.type.name' as the type URL and the unpack\nmethods only use the fully qualified type name after the last '/'\nin the type URL, for example \"foo.bar.com/x/y.z\" will yield type\nname \"y.z\".\n\nJSON\n====\nThe JSON representation of an `Any` value uses the regular\nrepresentation of the deserialized, embedded message, with an\nadditional field `@type` which contains the type URL. Example:\n\n    package google.profile;\n    message Person {\n      string first_name = 1;\n      string last_name = 2;\n    }\n\n    {\n      \"@type\": \"type.googleapis.com/google.profile.Person\",\n      \"firstName\": <string>,\n      \"lastName\": <string>\n    }\n\nIf the embedded message type is well-known and has a custom JSON\nrepresentation, that representation will be embedded adding a field\n`value` which holds the custom JSON in addition to the `@type`\nfield. Example (for message [google.protobuf.Duration][]):\n\n    {\n      \"@type\": \"type.googleapis.com/google.protobuf.Duration\",\n      \"value\": \"1.212s\"\n    }"
      properties:
        '@type':
          description: "A URL/resource name that uniquely identifies the type of the serialized\nprotocol buffer message. This string must contain at least\none \"/\" character. The last segment of the URL's path must represent\nthe fully qualified name of the type (as in\n`path/google.protobuf.Duration`). The name should be in a canonical form\n(e.g., leading \".\" is not accepted).\n\nIn practice, teams usually precompile into the binary all types that they\nexpect it to use in the context of Any. However, for URLs which use the\nscheme `http`, `https`, or no scheme, one can optionally set up a type\nserver that maps type URLs to message definitions as follows:\n\n* If no scheme is provided, `https` is assumed.\n* An HTTP GET on the URL must yield a [google.protobuf.Type][]\n  value in binary format, or produce an error.\n* Applications are allowed to cache lookup results based on the\n  URL, or have them precompiled into a binary to avoid any\n  lookup. Therefore, binary compatibility needs to be preserved\n  on changes to types. (Use versioned type names to manage\n  breaking changes.)\n\nNote: this functionality is not currently available in the official\nprotobuf release, and it is not used for type URLs beginning with\ntype.googleapis.com. As of May 2023, there are no widely used type server\nimplementations and no plans to implement one.\n\nSchemes other than `http`, `https` (or the empty scheme) might be\nused with implementation specific semantics."
          type: string
      type: object
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    SegmentIndexRequestServiceCreateSegmentIndexRequestBody:
      description: 'A segment index request allows the caller to provide a set of code

        segments with their associated metadata that should be indexed as part the

        embeddings store. Embeddings are only created. They are only read through the

        SegmentQueryRequest. The request can include multiple segments to allow

        parallel execution.'
      properties:
        context:
          $ref: '#/components/schemas/v1Context'
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1SegmentIndexRequestSpec'
        tenant_meta:
          description: Namespace of the segment index request.
          title: Namespace of the segment index request.
          type: object
        uuid:
          description: The UUID of the segment index request.
          readOnly: true
          type: string
      required:
      - meta
      - spec
      type: object
    SegmentIndexRequestFunctionSummaryReport:
      description: 'FunctionSummaryReport is one function summary computed by the client

        for a segment in this request, identified by its segment signature hash.'
      properties:
        data_flow:
          description: Description of data flow through the function.
          type: string
        hash:
          description: 'Segment signature hash this summary belongs to, matching the

            corresponding Segment.metadata.signature in this request.'
          type: string
        is_critical_api:
          description: Whether the function is itself a security-critical API.
          type: boolean
        is_entry_point:
          description: Whether the function is an application entry point.
          type: boolean
        is_sanitizer:
          description: Whether the function sanitizes untrusted data.
          type: boolean
        is_sink:
          description: Whether the function consumes data in a security-sensitive operation.
          type: boolean
        is_source:
          description: Whether the function introduces untrusted data.
          type: boolean
        is_trivial:
          description: Whether the function is classified as trivial.
          type: boolean
        keywords:
          description: Searchable concepts associated with the function.
          items:
            type: string
          type: array
        language:
          $ref: '#/components/schemas/v1Language'
        model:
          description: AI model that produced the summary.
          type: string
        postconditions:
          description: Conditions expected to hold after the function executes.
          items:
            type: string
          type: array
        preconditions:
          description: Conditions expected to hold before the function executes.
          items:
            type: string
          type: array
        prompt_version:
          description: Prompt schema version that produced the summary.
          format: int32
          type: integer
        rest_path:
          description: REST route associated with an entry-point function.
          type: string
        sanitizes_for:
          description: Vulnerability classes mitigated by the function.
          items:
            type: string
          type: array
        summary:
          description: Human-readable description of the function behavior.
          type: string
        uses_critical_api:
          description: Whether the function invokes a security-critical API.
          type: boolean
      required:
      - hash
      - model
      - prompt_version
      - language
      type: object
    v1Segment:
      description: Index segment with associated metadata.
      properties:
        annotations:
          additionalProperties:
            type: string
          description: 'Extensibility field of additonal metadata

            that we might want to carry with the segment.'
          type: object
        blame_time:
          description: Git blame time of this segment.
          format: date-time
          type: string
        commit_time:
          description: Time of the repo version that this segment belongs to.
          format: date-time
          type: string
        content:
          description: Content of the segment.
          format: byte
          type: string
        cyclomatic_complexity:
          description: CyclomaticComplexity represents the complexity of the control flow.
          format: int32
          type: integer
        file_hash:
          description: SHA256 for the file that contains this segment.
          format: byte
          type: string
        function_ref:
          description: Function signature of the segment.
          type: string
        has_summary:
          description: 'Set by the server response to indicate this segment already has a

            usable function summary, so the client does not need to summarize it.'
          readOnly: true
          type: boolean
        language:
          $ref: '#/components/schemas/v1Language'
        line_end:
          description: The last line of the segment.
          format: int32
          type: integer
        line_start:
          description: The first line of the segment.
          format: int32
          type: integer
        metadata:
          $ref: '#/components/schemas/v1SegmentMetadata'
        package_version:
          description: 'Canonical representation of the version of the package

            following all our conventions about package URLs.

            For example, "c://github.com/my/repo@v1.2.3".'
          type: string
        path:
          description: Relative path of the file where this segment was found.
          type: string
        rest:
          description: Flag to indicate the segment is a REST segment.
          type: boolean
        sha:
          description: Commit sha of the segment.
          type: string
        source_uri:
          description: Source of this segment.
          type: string
      type: object
    v1Context:
      description: Contexts keep objects from different scans separated.
      properties:
        id:
          description: The context ID, such as a pull request ID or branch reference.
          type: string
        tags:
          description: 'A list of tags applied to a context. Used primarily for CI and SBOM

            contexts.'
          items:
            type: string
          type: array
        type:
          $ref: '#/components/schemas/ContextContextType'
        will_be_deleted_at:
          description: 'Time that all objects in this context will be deleted.

            This field is deprecated and will be removed in the future.

            Please use the meta.will_be_deleted_at field instead.'
          format: date-time
          readOnly: true
          type: string
      required:
      - type
      - id
      type: object
    v1SegmentMetadata:
      properties:
        code_size:
          description: Size of code for this segment.
          format: int64
          type: string
        content_kind:
          $ref: '#/components/schemas/v1SegmentContentKind'
        embedding:
          $ref: '#/components/schemas/v1EmbeddingVector'
        signature:
          description: Signature for this segment.
          type: string
      type: object
    v1SegmentContentKind:
      default: SEGMENT_CONTENT_KIND_UNSPECIFIED
      description: SegmentContentKind is the kind of the segment.
      enum:
      - SEGMENT_CONTENT_KIND_UNSPECIFIED
      - SEGMENT_CONTENT_KIND_FUNCTION
      - SEGMENT_CONTENT_KIND_TYPE
      - SEGMENT_CONTENT_KIND_LICENSE
      type: string
