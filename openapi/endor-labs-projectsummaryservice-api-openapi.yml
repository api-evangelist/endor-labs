openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Project Summary Service API
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: ProjectSummaryService
paths:
  /v1/namespaces/{object.tenant_meta.namespace}/project-summaries:
    patch:
      description: Updates a project summary with the information in the request body.
      operationId: ProjectSummaryService_UpdateProjectSummary
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: object.tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectSummaryServiceUpdateProjectSummaryBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ProjectSummary'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: UpdateProjectSummary
      tags:
      - ProjectSummaryService
      x-internal: true
  /v1/namespaces/{tenant_meta.namespace}/project-summaries:
    get:
      description: Lists all project summaries in the given namespace.
      operationId: ProjectSummaryService_ListProjectSummaries
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: 'String of conditions to filter resources by.

          Filters may include any attribute along with the following operators:

          "==", "!=", ">", ">=", "<", "<=", "Contains", "In", "Matches", and

          "Exists". The logical operators "And" and "Or" are also supported.

          Expressions may be combined and grouped with parentheses.


          Examples:

          "spec.value == 5",

          "spec.value in ["a", "b", "c"]",

          "(meta.name == "xyz" and "spec.value in ["a","b"]) or (spec.value ==

          "c")".'
        in: query
        name: list_parameters.filter
        schema:
          type: string
      - description: 'Set the page token to start from.

          Use page tokens to page through list results or list specific pages.'
        in: query
        name: list_parameters.page_token
        schema:
          format: int32
          type: integer
      - description: 'Set the page size to limit the number of results returned.

          Default: 100. Max: 500.'
        in: query
        name: list_parameters.page_size
        schema:
          format: int32
          type: integer
      - description: Action to be executed with a request. Not supported for all endpoints.
        in: query
        name: list_parameters.action
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: list_parameters.mask
        schema:
          type: string
      - description: Get data from any child namespaces as well.
        in: query
        name: list_parameters.traverse
        schema:
          type: boolean
      - description: Field to sort objects by, for example, meta.name.
        in: query
        name: list_parameters.sort.path
        schema:
          type: string
      - description: 'Sort order. Default: ASC.'
        in: query
        name: list_parameters.sort.order
        schema:
          default: SORT_ENTRY_ORDER_UNSPECIFIED
          enum:
          - SORT_ENTRY_ORDER_UNSPECIFIED
          - SORT_ENTRY_ORDER_ASC
          - SORT_ENTRY_ORDER_DESC
          type: string
      - description: 'Return the number of objects matching the given list parameters.

          If count is set to true, the response is a CountResponse.

          Can be used together with filter and traverse.'
        in: query
        name: list_parameters.count
        schema:
          type: boolean
      - description: 'Group the objects based on this field.

          If there are multiple fields then the objects are grouped

          based on the uniqueness of all fields.

          Supports composite paths.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.aggregation_paths
        schema:
          type: string
      - description: 'Return the UUID of each object in each group as specified by

          aggregation_paths.'
        in: query
        name: list_parameters.group.show_aggregation_uuids
        schema:
          type: boolean
      - description: 'List of fields for which we want the unique count.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_count_paths
        schema:
          type: string
      - description: 'List of fields for which we want the unique values.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_value_paths
        schema:
          type: string
      - description: Only return objects from PR scans that match this context id.
        in: query
        name: list_parameters.ci_run_uuid
        schema:
          type: string
      - description: Page ID to retrieve.
        in: query
        name: list_parameters.page_id
        schema:
          type: string
      - description: 'Group the objects based on this time field,

          for example, meta.create_time.'
        in: query
        name: list_parameters.group_by_time.aggregation_paths
        schema:
          type: string
      - description: Return the UUIDs of the objects in each group.
        in: query
        name: list_parameters.group_by_time.show_aggregation_uuids
        schema:
          type: boolean
      - description: Interval unit by which the objects should be grouped.
        in: query
        name: list_parameters.group_by_time.interval
        schema:
          default: GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          enum:
          - GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          - GROUP_BY_TIME_INTERVAL_YEAR
          - GROUP_BY_TIME_INTERVAL_QUARTER
          - GROUP_BY_TIME_INTERVAL_MONTH
          - GROUP_BY_TIME_INTERVAL_WEEK
          - GROUP_BY_TIME_INTERVAL_DAY
          - GROUP_BY_TIME_INTERVAL_HOUR
          - GROUP_BY_TIME_INTERVAL_MINUTE
          - GROUP_BY_TIME_INTERVAL_SECOND
          type: string
      - description: 'Size of the time interval to group the objects by,

          for example, to group objects by 2-week intervals, set interval

          to GROUP_BY_TIME_INTERVAL_WEEK and group_size to 2.'
        in: query
        name: list_parameters.group_by_time.group_size
        schema:
          format: int32
          type: integer
      - description: 'Beginning of the time period to group objects.

          Defaults to the beginning of time.'
        in: query
        name: list_parameters.group_by_time.start_time
        schema:
          format: date-time
          type: string
      - description: 'End of the time period to group objects.

          Defaults to the current time.'
        in: query
        name: list_parameters.group_by_time.end_time
        schema:
          format: date-time
          type: string
      - description: 'The mode determines how the matching objects are counted

          in the produced time-series. Values allowed are:

          count (default) : is the number of items matching in every interval.

          sum: is the total number of items matching since the beginning of the

          aggregation time.'
        in: query
        name: list_parameters.group_by_time.mode
        schema:
          type: string
      - description: 'The aggregation_field is a field on the matched objects that we want to

          perform some operation in each interval (example : min, max, avg)'
        in: query
        name: list_parameters.group_by_time.aggregation_value_field
        schema:
          type: string
      - description: 'The aggreation_operator is the operator that we should use for the

          aggregation. Allowed values are: min, max, sum, avg'
        in: query
        name: list_parameters.group_by_time.aggregation_operator
        schema:
          type: string
      - description: 'If true, the results will not be paginated and

          only the first page will be returned. The order

          of the results is not guaranteed.'
        in: query
        name: list_parameters.disable_pagination
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListProjectSummariesResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: ListProjectSummaries
      tags:
      - ProjectSummaryService
      x-internal: true
    post:
      description: 'Creates a project summary.


        The creation of the resource will be an upsert if the given

        meta.parent_uuid is already available.'
      operationId: ProjectSummaryService_CreateProjectSummary
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectSummaryServiceCreateProjectSummaryBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ProjectSummary'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreateProjectSummary
      tags:
      - ProjectSummaryService
      x-internal: true
  /v1/namespaces/{tenant_meta.namespace}/project-summaries/{uuid}:
    delete:
      description: Deletes a project summary specified by the UUID.
      operationId: ProjectSummaryService_DeleteProjectSummary
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the resource to be deleted.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: Action to be executed with delete request.
        in: query
        name: delete_parameters.action
        schema:
          type: string
      - description: 'Force will force the deletion of the resource if any

          checks fail.'
        in: query
        name: delete_parameters.force
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: DeleteProjectSummary
      tags:
      - ProjectSummaryService
      x-internal: true
    get:
      description: Fetches a project summary identified by the UUID.
      operationId: ProjectSummaryService_GetProjectSummary
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the requested resource.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: get_parameters.mask
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ProjectSummary'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: GetProjectSummary
      tags:
      - ProjectSummaryService
      x-internal: true
components:
  schemas:
    SpecPackageCoverage:
      description: Package coverage and success rates.
      properties:
        call_graph_available:
          format: int32
          type: integer
        call_graph_errors:
          format: int32
          type: integer
        call_graph_success_rate:
          format: float
          type: number
        ecosystem_counts:
          additionalProperties:
            format: int32
            type: integer
          type: object
        ecosystems:
          items:
            $ref: '#/components/schemas/v1Ecosystem'
          type: array
        scan_failures:
          format: int32
          type: integer
        success_rate:
          format: float
          type: number
        total:
          format: int32
          type: integer
      required:
      - total
      - scan_failures
      - success_rate
      - call_graph_errors
      - call_graph_available
      - call_graph_success_rate
      - ecosystems
      - ecosystem_counts
      type: object
    ProjectSummarySpecDependencyCounts:
      description: DependencyCounts tracks different types of dependencies in the project.
      properties:
        direct:
          description: Direct dependencies declared in the project.
          format: int32
          type: integer
        outdated:
          description: Dependencies that have newer versions available.
          format: int32
          type: integer
        total:
          description: Total number of dependencies.
          format: int32
          type: integer
        transitive:
          description: Transitive dependencies pulled in by direct dependencies.
          format: int32
          type: integer
        unmaintained:
          description: Dependencies that are no longer maintained.
          format: int32
          type: integer
      required:
      - total
      - direct
      - transitive
      - outdated
      - unmaintained
      type: object
    GroupResponseGroupData:
      description: Information about objects matching the given key.
      properties:
        aggregation_count:
          $ref: '#/components/schemas/v1CountResponse'
        aggregation_uuids:
          description: 'List of UUIDs of the objects in the group.

            Only populated if show_aggregation_uuids is set.'
          items:
            type: string
          type: array
        aggregation_value:
          $ref: '#/components/schemas/v1GroupAggregationValueResponse'
        unique_counts:
          additionalProperties:
            $ref: '#/components/schemas/v1CountResponse'
          description: 'Map of counts for the given unique_count_paths fields.

            Only populated if unique_count_paths is set.'
          type: object
        unique_values:
          additionalProperties:
            items:
              type: object
            type: array
          description: 'Map of values for the given unique_value_paths fields.

            Only populated if unique_value_paths is set.'
          type: object
      type: object
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    v1Ecosystem:
      default: ECOSYSTEM_UNSPECIFIED
      description: " - ECOSYSTEM_GO: GoLang.\n - ECOSYSTEM_MAVEN: Maven.\n - ECOSYSTEM_PYPI: Python.\n - ECOSYSTEM_CARGO: Rust.\n - ECOSYSTEM_NPM: Javascript.\n - ECOSYSTEM_GEM: Ruby.\n - ECOSYSTEM_NUGET: Dotnet.\n - ECOSYSTEM_PACKAGIST: PHP.\n - ECOSYSTEM_SBOM: SBOMs.\n - ECOSYSTEM_RPM: RPM.\n - ECOSYSTEM_DEBIAN: Debian.\n - ECOSYSTEM_GITHUB_ACTION: GitHub Actions.\n - ECOSYSTEM_COCOAPOD: Cocoapods.\n - ECOSYSTEM_APK: APK (alpine et.al).\n - ECOSYSTEM_CONTAINER: Containers.\n - ECOSYSTEM_HUGGING_FACE: Hugging Face.\n - ECOSYSTEM_C: C/C++.\n - ECOSYSTEM_GIT: ecosystem GIT for GIT repository dependencies.\nThis can be used for package name of the resolved dependencies when a\ngiven repository has dependencies to other GIT repositories. Currently we\nuse this to represent vulnerabilities for the given GIT repository. ex:\ngit submodules, C/C++ dependencies.\n - ECOSYSTEM_AI_MODEL: AI models.\n - ECOSYSTEM_SWIFT: Ecosystem Swift consists of native Swift packages, which are defined\nusing the Package.swift manifest file and managed by the Swift Package\nManager. There is a separate ecosystem for Cocoapod packages called\nECOSYSTEM_COCOAPOD, which is an alternative package manager for Swift\npackages.\n - ECOSYSTEM_CONAN: Ecosystem Conan for C/C++ packages managed by the Conan 2.x package manager.\n - ECOSYSTEM_VSCODE: VS Code editor extensions, distributed via the Microsoft Visual Studio\nMarketplace."
      enum:
      - ECOSYSTEM_UNSPECIFIED
      - ECOSYSTEM_GO
      - ECOSYSTEM_MAVEN
      - ECOSYSTEM_PYPI
      - ECOSYSTEM_CARGO
      - ECOSYSTEM_NPM
      - ECOSYSTEM_GEM
      - ECOSYSTEM_NUGET
      - ECOSYSTEM_PACKAGIST
      - ECOSYSTEM_SBOM
      - ECOSYSTEM_RPM
      - ECOSYSTEM_DEBIAN
      - ECOSYSTEM_GITHUB_ACTION
      - ECOSYSTEM_COCOAPOD
      - ECOSYSTEM_APK
      - ECOSYSTEM_CONTAINER
      - ECOSYSTEM_HUGGING_FACE
      - ECOSYSTEM_C
      - ECOSYSTEM_GIT
      - ECOSYSTEM_AI_MODEL
      - ECOSYSTEM_SWIFT
      - ECOSYSTEM_CONAN
      - ECOSYSTEM_VSCODE
      type: string
    v1ProjectSummary:
      description: ProjectSummary is an internal API to accelerate the UI operations.
      properties:
        context:
          $ref: '#/components/schemas/v1Context'
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1ProjectSummarySpec'
        tenant_meta:
          $ref: '#/components/schemas/v1TenantMeta'
        uuid:
          description: The UUID of the for the project summary.
          readOnly: true
          type: string
      required:
      - meta
      - context
      type: object
    v1ListProjectSummariesResponseList:
      properties:
        objects:
          items:
            $ref: '#/components/schemas/v1ProjectSummary'
          type: array
        response:
          $ref: '#/components/schemas/v1ListResponse'
      type: object
    v1ListProjectSummariesResponse:
      description: Response returned for requests to list project summaries.
      properties:
        count_response:
          $ref: '#/components/schemas/v1CountResponse'
        group_response:
          $ref: '#/components/schemas/v1GroupResponse'
        list:
          $ref: '#/components/schemas/v1ListProjectSummariesResponseList'
      type: object
    v1UpdateRequest:
      description: Message used for all update requests.
      properties:
        force:
          description: 'Force will force the update of the resource if any

            checks fail.'
          type: boolean
        update_mask:
          description: Fields to update. Defaults to all fields.
          type: string
      type: object
    ProjectSummarySpecVulnerabilityCounts:
      description: VulnerabilityCounts tracks different categories of vulnerabilities in the project.
      properties:
        exploitable_likelihood:
          $ref: '#/components/schemas/ProjectSummarySpecFindingCounts'
        exploitable_likelihood_potentially_reachable:
          $ref: '#/components/schemas/ProjectSummarySpecFindingCounts'
        exploitable_likelihood_reachable:
          $ref: '#/components/schemas/ProjectSummarySpecFindingCounts'
        low_upgrade_risk:
          $ref: '#/components/schemas/ProjectSummarySpecFindingCounts'
        low_upgrade_risk_potentially_reachable:
          $ref: '#/components/schemas/ProjectSummarySpecFindingCounts'
        low_upgrade_risk_reachable:
          $ref: '#/components/schemas/ProjectSummarySpecFindingCounts'
        normal:
          $ref: '#/components/schemas/ProjectSummarySpecFindingCounts'
        normal_fixable:
          $ref: '#/components/schemas/ProjectSummarySpecFindingCounts'
        normal_fixable_potentially_reachable:
          $ref: '#/components/schemas/ProjectSummarySpecFindingCounts'
        normal_fixable_reachable:
          $ref: '#/components/schemas/ProjectSummarySpecFindingCounts'
        normal_fixable_unreachable:
          $ref: '#/components/schemas/ProjectSummarySpecFindingCounts'
        potentially_reachable:
          $ref: '#/components/schemas/ProjectSummarySpecFindingCounts'
        reachable:
          $ref: '#/components/schemas/ProjectSummarySpecFindingCounts'
        total:
          $ref: '#/components/schemas/ProjectSummarySpecFindingCounts'
        unreachable:
          $ref: '#/components/schemas/ProjectSummarySpecFindingCounts'
      required:
      - total
      - normal
      - normal_fixable
      - reachable
      - normal_fixable_reachable
      - potentially_reachable
      - normal_fixable_potentially_reachable
      - unreachable
      - normal_fixable_unreachable
      - exploitable_likelihood
      type: object
    ProjectSummaryServiceCreateProjectSummaryBody:
      description: ProjectSummary is an internal API to accelerate the UI operations.
      properties:
        context:
          $ref: '#/components/schemas/v1Context'
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1ProjectSummarySpec'
        tenant_meta:
          description: Project Summary are associated with a  tenant.
          title: Project Summary are associated with a  tenant.
          type: object
        uuid:
          description: The UUID of the for the project summary.
          readOnly: true
          type: string
      required:
      - meta
      - context
      type: object
    ProjectSummarySpecTopPackages:
      description: TopPackages tracks the most significant packages in various categories.
      properties:
        by_critical_findings:
          description: Top packages by critical findings.
          items:
            $ref: '#/components/schemas/ProjectSummarySpecTopPackagesPackageInfo'
          type: array
        by_critical_reachable_vulnerabilities:
          description: Top packages by critical reachable vulnerabilities.
          items:
            $ref: '#/components/schemas/ProjectSummarySpecTopPackagesPackageInfo'
          type: array
        by_critical_vulnerabilities:
          description: Top packages by critical vulnerabilities.
          items:
            $ref: '#/components/schemas/ProjectSummarySpecTopPackagesPackageInfo'
          type: array
        by_findings:
          description: Top packages by total findings.
          items:
            $ref: '#/components/schemas/ProjectSummarySpecTopPackagesPackageInfo'
          type: array
        by_high_findings:
          description: Top packages by high severity findings.
          items:
            $ref: '#/components/schemas/ProjectSummarySpecTopPackagesPackageInfo'
          type: array
        by_high_reachable_vulnerabilities:
          description: Top packages by high severity reachable vulnerabilities.
          items:
            $ref: '#/components/schemas/ProjectSummarySpecTopPackagesPackageInfo'
          type: array
        by_high_vulnerabilities:
          description: Top packages by high severity vulnerabilities.
          items:
            $ref: '#/components/schemas/ProjectSummarySpecTopPackagesPackageInfo'
          type: array
        by_low_findings:
          description: Top packages by low severity findings.
          items:
            $ref: '#/components/schemas/ProjectSummarySpecTopPackagesPackageInfo'
          type: array
        by_low_reachable_vulnerabilities:
          description: Top packages by low severity reachable vulnerabilities.
          items:
            $ref: '#/components/schemas/ProjectSummarySpecTopPackagesPackageInfo'
          type: array
        by_low_vulnerabilities:
          description: Top packages by low severity vulnerabilities.
          items:
            $ref: '#/components/schemas/ProjectSummarySpecTopPackagesPackageInfo'
          type: array
        by_medium_findings:
          description: Top packages by medium severity findings.
          items:
            $ref: '#/components/schemas/ProjectSummarySpecTopPackagesPackageInfo'
          type: array
        by_medium_reachable_vulnerabilities:
          description: Top packages by medium severity reachable vulnerabilities.
          items:
            $ref: '#/components/schemas/ProjectSummarySpecTopPackagesPackageInfo'
          type: array
        by_medium_vulnerabilities:
          description: Top packages by medium severity vulnerabilities.
          items:
            $ref: '#/components/schemas/ProjectSummarySpecTopPackagesPackageInfo'
          type: array
        by_outdated_dependencies:
          description: Top packages by outdated dependencies.
          items:
            $ref: '#/components/schemas/ProjectSummarySpecTopPackagesPackageInfo'
          type: array
        by_reachable_vulnerabilities:
          description: Top packages by reachable vulnerabilities.
          items:
            $ref: '#/components/schemas/ProjectSummarySpecTopPackagesPackageInfo'
          type: array
        by_unmaintained_dependencies:
          description: Top packages by unmaintained dependencies.
          items:
            $ref: '#/components/schemas/ProjectSummarySpecTopPackagesPackageInfo'
