openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference SCM Webhook Event Service API
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: SCMWebhookEventService
paths:
  /v1/scm-webhook-events:
    post:
      description: Creates a SCM webhook event.
      operationId: SCMWebhookEventService_CreateSCMWebhookEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1SCMWebhookEvent'
        description: SCMWebhookEvent represents SCM webhook events that are processed by the system.
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1SCMWebhookEvent'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreateSCMWebhookEvent
      tags:
      - SCMWebhookEventService
      x-internal: true
components:
  schemas:
    v1GitLabEventEventType:
      default: EVENT_TYPE_UNSPECIFIED
      enum:
      - EVENT_TYPE_UNSPECIFIED
      - EVENT_TYPE_MERGE_REQUEST
      type: string
    v1GitHubEventEventType:
      default: EVENT_TYPE_UNSPECIFIED
      enum:
      - EVENT_TYPE_UNSPECIFIED
      - EVENT_TYPE_INSTALLATION
      - EVENT_TYPE_PULL_REQUEST
      - EVENT_TYPE_CHECK_SUITE
      - EVENT_TYPE_CHECK_RUN
      - EVENT_TYPE_REPOSITORY
      - EVENT_TYPE_ISSUE_COMMENT
      type: string
    v1BitbucketEvent:
      properties:
        event_type:
          $ref: '#/components/schemas/v1BitbucketEventEventType'
      required:
      - event_type
      type: object
    v1BitbucketEventEventType:
      default: EVENT_TYPE_UNSPECIFIED
      enum:
      - EVENT_TYPE_UNSPECIFIED
      - EVENT_TYPE_PULL_REQUEST
      type: string
    v1Meta:
      description: Common fields for all Endor Labs resources.
      properties:
        annotations:
          additionalProperties:
            type: string
          description: 'Annotations can be used to attach metadata to a resource message.

            Annotation values can be small or large, structured or unstructured,

            and may include characters not permitted by labels.

            The keys may contain alphanumerics, underscores (_), dots (.) and dashes

            (-). The values of an annotation must be 16384 bytes or smaller.'
          type: object
        create_time:
          description: 'Time the resource was created.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: 'Name and authentication source of the user who created the object,

            for example, ewok@endor.ai@google@api-key.'
          readOnly: true
          type: string
        description:
          description: Resource description. Must be less than 1024 bytes.
          type: string
        index_data:
          $ref: '#/components/schemas/v1IndexData'
        kind:
          description: 'Resource kind, for example, HelloResponse.

            Auto-generated using the protobuf message proto.MessageName().Name().'
          readOnly: true
          type: string
        name:
          description: Resource name. Must be 63 characters or less.
          type: string
        parent_kind:
          description: Parent object resource kind, for example, Project.
          type: string
        parent_uuid:
          description: Parent object UUID.
          type: string
        references:
          additionalProperties:
            $ref: '#/components/schemas/googleprotobufAny'
          description: Map of objects referenced in a query API.
          readOnly: true
          type: object
        tags:
          description: 'List of tags attached to the resource.

            Tags can be used to select objects and to find collections of objects that

            satisfy certain conditions. A tag must be 255 characters or less.'
          items:
            type: string
          type: array
        update_time:
          description: 'Time the resource was last updated.

            Note: Updated on all create/patch/delete operations.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: 'Name and authentication source of the last user who updated the object,

            for example, vulnerabilityingestor@endor.ai@x509.'
          readOnly: true
          type: string
        upsert_time:
          description: 'Time the resource was last upserted.


            Note:

            create_time is only set the first time the resource is created.

            upsert_time is set every time the resource is upseted.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        version:
          description: Message version.
          readOnly: true
          type: string
      required:
      - name
      type: object
    v1SCMWebhookEvent:
      description: SCMWebhookEvent represents SCM webhook events that are processed by the system.
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1SCMWebhookEventSpec'
        uuid:
          readOnly: true
          type: string
      required:
      - meta
      - spec
      type: object
    v1PlatformSource:
      default: PLATFORM_SOURCE_UNSPECIFIED
      description: Type of source control platform a resource was discovered on.
      enum:
      - PLATFORM_SOURCE_UNSPECIFIED
      - PLATFORM_SOURCE_GITHUB
      - PLATFORM_SOURCE_GITLAB
      - PLATFORM_SOURCE_GITSERVER
      - PLATFORM_SOURCE_BITBUCKET
      - PLATFORM_SOURCE_BINARY
      - PLATFORM_SOURCE_HUGGING_FACE
      - PLATFORM_SOURCE_AZURE
      - PLATFORM_SOURCE_ARCHIVE
      - PLATFORM_SOURCE_EXTERNAL_AI_SERVICE
      - PLATFORM_SOURCE_GITHUB_ENTERPRISE
      type: string
    v1AzureEvent:
      properties:
        event_type:
          $ref: '#/components/schemas/v1AzureEventEventType'
      required:
      - event_type
      type: object
    v1SCMWebhookEventSpec:
      properties:
        azure_event:
          $ref: '#/components/schemas/v1AzureEvent'
        bitbucket_event:
          $ref: '#/components/schemas/v1BitbucketEvent'
        github_event:
          $ref: '#/components/schemas/v1GitHubEvent'
        gitlab_event:
          $ref: '#/components/schemas/v1GitLabEvent'
        payload:
          description: Payload of the event.
          format: byte
          type: string
        platform_source:
          $ref: '#/components/schemas/v1PlatformSource'
      required:
      - platform_source
      - payload
      type: object
    googleprotobufAny:
      additionalProperties: {}
      description: "`Any` contains an arbitrary serialized protocol buffer message along with a\nURL that describes the type of the serialized message.\n\nProtobuf library provides support to pack/unpack Any values in the form\nof utility functions or additional generated methods of the Any type.\n\nExample 1: Pack and unpack a message in C++.\n\n    Foo foo = ...;\n    Any any;\n    any.PackFrom(foo);\n    ...\n    if (any.UnpackTo(&foo)) {\n      ...\n    }\n\nExample 2: Pack and unpack a message in Java.\n\n    Foo foo = ...;\n    Any any = Any.pack(foo);\n    ...\n    if (any.is(Foo.class)) {\n      foo = any.unpack(Foo.class);\n    }\n    // or ...\n    if (any.isSameTypeAs(Foo.getDefaultInstance())) {\n      foo = any.unpack(Foo.getDefaultInstance());\n    }\n\n Example 3: Pack and unpack a message in Python.\n\n    foo = Foo(...)\n    any = Any()\n    any.Pack(foo)\n    ...\n    if any.Is(Foo.DESCRIPTOR):\n      any.Unpack(foo)\n      ...\n\n Example 4: Pack and unpack a message in Go\n\n     foo := &pb.Foo{...}\n     any, err := anypb.New(foo)\n     if err != nil {\n       ...\n     }\n     ...\n     foo := &pb.Foo{}\n     if err := any.UnmarshalTo(foo); err != nil {\n       ...\n     }\n\nThe pack methods provided by protobuf library will by default use\n'type.googleapis.com/full.type.name' as the type URL and the unpack\nmethods only use the fully qualified type name after the last '/'\nin the type URL, for example \"foo.bar.com/x/y.z\" will yield type\nname \"y.z\".\n\nJSON\n====\nThe JSON representation of an `Any` value uses the regular\nrepresentation of the deserialized, embedded message, with an\nadditional field `@type` which contains the type URL. Example:\n\n    package google.profile;\n    message Person {\n      string first_name = 1;\n      string last_name = 2;\n    }\n\n    {\n      \"@type\": \"type.googleapis.com/google.profile.Person\",\n      \"firstName\": <string>,\n      \"lastName\": <string>\n    }\n\nIf the embedded message type is well-known and has a custom JSON\nrepresentation, that representation will be embedded adding a field\n`value` which holds the custom JSON in addition to the `@type`\nfield. Example (for message [google.protobuf.Duration][]):\n\n    {\n      \"@type\": \"type.googleapis.com/google.protobuf.Duration\",\n      \"value\": \"1.212s\"\n    }"
      properties:
        '@type':
          description: "A URL/resource name that uniquely identifies the type of the serialized\nprotocol buffer message. This string must contain at least\none \"/\" character. The last segment of the URL's path must represent\nthe fully qualified name of the type (as in\n`path/google.protobuf.Duration`). The name should be in a canonical form\n(e.g., leading \".\" is not accepted).\n\nIn practice, teams usually precompile into the binary all types that they\nexpect it to use in the context of Any. However, for URLs which use the\nscheme `http`, `https`, or no scheme, one can optionally set up a type\nserver that maps type URLs to message definitions as follows:\n\n* If no scheme is provided, `https` is assumed.\n* An HTTP GET on the URL must yield a [google.protobuf.Type][]\n  value in binary format, or produce an error.\n* Applications are allowed to cache lookup results based on the\n  URL, or have them precompiled into a binary to avoid any\n  lookup. Therefore, binary compatibility needs to be preserved\n  on changes to types. (Use versioned type names to manage\n  breaking changes.)\n\nNote: this functionality is not currently available in the official\nprotobuf release, and it is not used for type URLs beginning with\ntype.googleapis.com. As of May 2023, there are no widely used type server\nimplementations and no plans to implement one.\n\nSchemes other than `http`, `https` (or the empty scheme) might be\nused with implementation specific semantics."
          type: string
      type: object
    v1GitLabEvent:
      properties:
        event_type:
          $ref: '#/components/schemas/v1GitLabEventEventType'
      required:
      - event_type
      type: object
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    v1GitHubEvent:
      properties:
        event_type:
          $ref: '#/components/schemas/v1GitHubEventEventType'
      required:
      - event_type
      type: object
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    v1AzureEventEventType:
      default: EVENT_TYPE_UNSPECIFIED
      enum:
      - EVENT_TYPE_UNSPECIFIED
      - EVENT_TYPE_PULL_REQUEST
      type: string
