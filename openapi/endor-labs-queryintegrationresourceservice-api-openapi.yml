openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Query Integration Resource…
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: QueryIntegrationResourceService
paths:
  /v1/namespaces/{tenant_meta.namespace}/queries/integration-resources:
    post:
      description: 'Lists the selectable resources of the requested kind visible to the

        supplied credentials. Synchronous and read-only; persists nothing.'
      operationId: QueryIntegrationResourceService_CreateQueryIntegrationResource
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryIntegrationResourceServiceCreateQueryIntegrationResourceBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1QueryIntegrationResource'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreateQueryIntegrationResource
      tags:
      - QueryIntegrationResourceService
      x-internal: true
components:
  schemas:
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    v1AdoBoardsProjectsResult:
      description: AdoBoardsProjectsResult is a single page of ADO Boards projects.
      properties:
        continuation_token:
          description: Opaque cursor for the next page; unset when the list is exhausted.
          type: string
        projects:
          description: The projects in this page.
          items:
            $ref: '#/components/schemas/v1AdoBoardsProject'
          type: array
      type: object
    AdoBoardsWorkItemTypesResultProjectWorkItemTypes:
      description: ProjectWorkItemTypes groups the work item types available for one project.
      properties:
        project_name:
          description: The project these work item types belong to.
          type: string
        work_item_types:
          description: The work item types available for the project.
          items:
            $ref: '#/components/schemas/AdoBoardsWorkItemTypesResultWorkItemType'
          type: array
      type: object
    AdoBoardsWorkItemTypesResultWorkItemType:
      description: WorkItemType is a selectable ADO Boards work item type.
      properties:
        name:
          description: The display name (e.g. Bug, User Story).
          type: string
        reference_name:
          description: The reference name (e.g. Microsoft.VSTS.WorkItemTypes.Bug).
          type: string
      type: object
    v1QueryIntegrationResource:
      description: 'QueryIntegrationResource brokers a synchronous, read-only lookup against a

        third-party provider (Azure DevOps Boards, Jira, ...) so the frontend can

        prefill guided setup dropdowns. A query-as-resource: it persists nothing.'
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1QueryIntegrationResourceSpec'
        tenant_meta:
          $ref: '#/components/schemas/v1TenantMeta'
        uuid:
          description: Server-assigned query id.
          readOnly: true
          type: string
      required:
      - meta
      - spec
      type: object
    v1AdoBoardsWorkItemTypesResult:
      description: AdoBoardsWorkItemTypesResult is the set of work item types per requested project.
      properties:
        project_work_item_types:
          description: The per-project work item types, one entry per requested project.
          items:
            $ref: '#/components/schemas/AdoBoardsWorkItemTypesResultProjectWorkItemTypes'
          type: array
      type: object
    QueryIntegrationResourceCredentialSourcePatAuth:
      description: PatAuth authenticates with a personal access token.
      properties:
        token:
          description: Write-only PAT; never echoed back in responses.
          type: string
      required:
      - token
      type: object
    v1AdoBoardsWorkItemTypesQuery:
      description: 'AdoBoardsWorkItemTypesQuery lists the work item types available for one or

        more projects.'
      properties:
        project_names:
          description: The project names to scope work item types to; at least one is required.
          items:
            type: string
          type: array
      required:
      - project_names
      type: object
    v1TenantMeta:
      description: Tenant related data for the tenant containing the resource.
      properties:
        namespace:
          description: 'Namespaces are a way to organize organizational units into virtual

            groupings of resources. Namespaces must be a fully qualified name,

            for example, the child namespace of namespace "endor.prod" called "app"

            is called "endor.prod.app".'
          type: string
      required:
      - namespace
      type: object
    v1QueryIntegrationResourceSpec:
      properties:
        credential_source:
          $ref: '#/components/schemas/v1QueryIntegrationResourceCredentialSource'
        request:
          $ref: '#/components/schemas/v1QueryIntegrationResourceRequest'
        response:
          $ref: '#/components/schemas/v1QueryIntegrationResourceResponse'
      required:
      - credential_source
      - request
      type: object
    v1QueryIntegrationResourceRequest:
      description: Request selects which provider resource to list.
      properties:
        ado_boards_projects:
          $ref: '#/components/schemas/v1AdoBoardsProjectsQuery'
        ado_boards_work_item_types:
          $ref: '#/components/schemas/v1AdoBoardsWorkItemTypesQuery'
      type: object
    googleprotobufAny:
      additionalProperties: {}
      description: "`Any` contains an arbitrary serialized protocol buffer message along with a\nURL that describes the type of the serialized message.\n\nProtobuf library provides support to pack/unpack Any values in the form\nof utility functions or additional generated methods of the Any type.\n\nExample 1: Pack and unpack a message in C++.\n\n    Foo foo = ...;\n    Any any;\n    any.PackFrom(foo);\n    ...\n    if (any.UnpackTo(&foo)) {\n      ...\n    }\n\nExample 2: Pack and unpack a message in Java.\n\n    Foo foo = ...;\n    Any any = Any.pack(foo);\n    ...\n    if (any.is(Foo.class)) {\n      foo = any.unpack(Foo.class);\n    }\n    // or ...\n    if (any.isSameTypeAs(Foo.getDefaultInstance())) {\n      foo = any.unpack(Foo.getDefaultInstance());\n    }\n\n Example 3: Pack and unpack a message in Python.\n\n    foo = Foo(...)\n    any = Any()\n    any.Pack(foo)\n    ...\n    if any.Is(Foo.DESCRIPTOR):\n      any.Unpack(foo)\n      ...\n\n Example 4: Pack and unpack a message in Go\n\n     foo := &pb.Foo{...}\n     any, err := anypb.New(foo)\n     if err != nil {\n       ...\n     }\n     ...\n     foo := &pb.Foo{}\n     if err := any.UnmarshalTo(foo); err != nil {\n       ...\n     }\n\nThe pack methods provided by protobuf library will by default use\n'type.googleapis.com/full.type.name' as the type URL and the unpack\nmethods only use the fully qualified type name after the last '/'\nin the type URL, for example \"foo.bar.com/x/y.z\" will yield type\nname \"y.z\".\n\nJSON\n====\nThe JSON representation of an `Any` value uses the regular\nrepresentation of the deserialized, embedded message, with an\nadditional field `@type` which contains the type URL. Example:\n\n    package google.profile;\n    message Person {\n      string first_name = 1;\n      string last_name = 2;\n    }\n\n    {\n      \"@type\": \"type.googleapis.com/google.profile.Person\",\n      \"firstName\": <string>,\n      \"lastName\": <string>\n    }\n\nIf the embedded message type is well-known and has a custom JSON\nrepresentation, that representation will be embedded adding a field\n`value` which holds the custom JSON in addition to the `@type`\nfield. Example (for message [google.protobuf.Duration][]):\n\n    {\n      \"@type\": \"type.googleapis.com/google.protobuf.Duration\",\n      \"value\": \"1.212s\"\n    }"
      properties:
        '@type':
          description: "A URL/resource name that uniquely identifies the type of the serialized\nprotocol buffer message. This string must contain at least\none \"/\" character. The last segment of the URL's path must represent\nthe fully qualified name of the type (as in\n`path/google.protobuf.Duration`). The name should be in a canonical form\n(e.g., leading \".\" is not accepted).\n\nIn practice, teams usually precompile into the binary all types that they\nexpect it to use in the context of Any. However, for URLs which use the\nscheme `http`, `https`, or no scheme, one can optionally set up a type\nserver that maps type URLs to message definitions as follows:\n\n* If no scheme is provided, `https` is assumed.\n* An HTTP GET on the URL must yield a [google.protobuf.Type][]\n  value in binary format, or produce an error.\n* Applications are allowed to cache lookup results based on the\n  URL, or have them precompiled into a binary to avoid any\n  lookup. Therefore, binary compatibility needs to be preserved\n  on changes to types. (Use versioned type names to manage\n  breaking changes.)\n\nNote: this functionality is not currently available in the official\nprotobuf release, and it is not used for type URLs beginning with\ntype.googleapis.com. As of May 2023, there are no widely used type server\nimplementations and no plans to implement one.\n\nSchemes other than `http`, `https` (or the empty scheme) might be\nused with implementation specific semantics."
          type: string
      type: object
    QueryIntegrationResourceCredentialSourceInlineCredentials:
      description: InlineCredentials carries raw, per-call credentials for the host and one authentication mode.
      properties:
        host_url:
          description: The provider host (e.g. https://dev.azure.com/myorg).
          type: string
        pat:
          $ref: '#/components/schemas/QueryIntegrationResourceCredentialSourcePatAuth'
      required:
      - host_url
      type: object
    v1AdoBoardsProjectsQuery:
      description: AdoBoardsProjectsQuery lists the ADO Boards projects visible to the credentials.
      properties:
        continuation_token:
          description: Opaque cursor from a prior response; unset for the first page.
          type: string
        page_size:
          description: 'Maximum projects to return per page; the broker maps this to the ADO $top

            page size and applies a default when unset.'
          format: int32
          type: integer
      type: object
    v1Meta:
      description: Common fields for all Endor Labs resources.
      properties:
        annotations:
          additionalProperties:
            type: string
          description: 'Annotations can be used to attach metadata to a resource message.

            Annotation values can be small or large, structured or unstructured,

            and may include characters not permitted by labels.

            The keys may contain alphanumerics, underscores (_), dots (.) and dashes

            (-). The values of an annotation must be 16384 bytes or smaller.'
          type: object
        create_time:
          description: 'Time the resource was created.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: 'Name and authentication source of the user who created the object,

            for example, ewok@endor.ai@google@api-key.'
          readOnly: true
          type: string
        description:
          description: Resource description. Must be less than 1024 bytes.
          type: string
        index_data:
          $ref: '#/components/schemas/v1IndexData'
        kind:
          description: 'Resource kind, for example, HelloResponse.

            Auto-generated using the protobuf message proto.MessageName().Name().'
          readOnly: true
          type: string
        name:
          description: Resource name. Must be 63 characters or less.
          type: string
        parent_kind:
          description: Parent object resource kind, for example, Project.
          type: string
        parent_uuid:
          description: Parent object UUID.
          type: string
        references:
          additionalProperties:
            $ref: '#/components/schemas/googleprotobufAny'
          description: Map of objects referenced in a query API.
          readOnly: true
          type: object
        tags:
          description: 'List of tags attached to the resource.

            Tags can be used to select objects and to find collections of objects that

            satisfy certain conditions. A tag must be 255 characters or less.'
          items:
            type: string
          type: array
        update_time:
          description: 'Time the resource was last updated.

            Note: Updated on all create/patch/delete operations.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: 'Name and authentication source of the last user who updated the object,

            for example, vulnerabilityingestor@endor.ai@x509.'
          readOnly: true
          type: string
        upsert_time:
          description: 'Time the resource was last upserted.


            Note:

            create_time is only set the first time the resource is created.

            upsert_time is set every time the resource is upseted.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        version:
          description: Message version.
          readOnly: true
          type: string
      required:
      - name
      type: object
    QueryIntegrationResourceServiceCreateQueryIntegrationResourceBody:
      description: 'QueryIntegrationResource brokers a synchronous, read-only lookup against a

        third-party provider (Azure DevOps Boards, Jira, ...) so the frontend can

        prefill guided setup dropdowns. A query-as-resource: it persists nothing.'
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1QueryIntegrationResourceSpec'
        tenant_meta:
          description: Associates the query with a tenant; drives namespace-scoped authorization.
          title: Associates the query with a tenant; drives namespace-scoped authorization.
          type: object
        uuid:
          description: Server-assigned query id.
          readOnly: true
          type: string
      required:
      - meta
      - spec
      type: object
    v1AdoBoardsProject:
      description: AdoBoardsProject is a selectable ADO Boards project.
      properties:
        id:
          description: The provider-assigned project id.
          type: string
        name:
          description: The project display name.
          type: string
      type: object
    v1QueryIntegrationResourceResponse:
      description: Response carries the payload for the requested resource kind.
      properties:
        ado_boards_projects:
          $ref: '#/components/schemas/v1AdoBoardsProjectsResult'
        ado_boards_work_item_types:
          $ref: '#/components/schemas/v1AdoBoardsWorkItemTypesResult'
      type: object
    v1QueryIntegrationResourceCredentialSource:
      description: 'QueryIntegrationResourceCredentialSource is how the broker obtains the provider host

        and credentials: inline for the create flow, or a reference to a stored record

        in the caller''s namespace for the edit flow (so secrets never leave the backend).'
      properties:
        inline:
          $ref: '#/components/schemas/QueryIntegrationResourceCredentialSourceInlineCredentials'
        installation_ref:
          description: UUID of an existing Installation to read credentials from.
          type: string
        notification_target_ref:
          description: UUID of an existing NotificationTarget to read credentials from.
          type: string
      type: object
