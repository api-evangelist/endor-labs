    v1VectorStoreDataDeleteQuerySpecRequest:
      description: Request contains the input parameters for the delete operation.
      properties:
        filter:
          description: 'filter scopes the deletion to documents matching this filter.

            e.g., {"repo": "/path/to/repo"} to only affect documents from a specific repo.'
          type: object
        keep_filters:
          description: 'keep_filters contains the filters to keep.

            Each entry is a Struct with field values matching the vector store''s fields.

            e.g., {"fqn": "com.example.Foo.bar", "repo": "/path/to/repo"} to keep documents from a specific repo and fqn.'
          items:
            type: object
          type: array
        vector_store_uuid:
