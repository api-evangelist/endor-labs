openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Policy Service API
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: PolicyService
paths:
  /v1/namespaces/{object.tenant_meta.namespace}/policies:
    patch:
      description: Updates the policy.
      operationId: PolicyService_UpdatePolicy
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: object.tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyServiceUpdatePolicyBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Policy'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: UpdatePolicy
      tags:
      - PolicyService
  /v1/namespaces/{tenant_meta.namespace}/policies:
    get:
      description: Lists all policies in a namespace.
      operationId: PolicyService_ListPolicies
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: 'String of conditions to filter resources by.

          Filters may include any attribute along with the following operators:

          "==", "!=", ">", ">=", "<", "<=", "Contains", "In", "Matches", and

          "Exists". The logical operators "And" and "Or" are also supported.

          Expressions may be combined and grouped with parentheses.


          Examples:

          "spec.value == 5",

          "spec.value in ["a", "b", "c"]",

          "(meta.name == "xyz" and "spec.value in ["a","b"]) or (spec.value ==

          "c")".'
        in: query
        name: list_parameters.filter
        schema:
          type: string
      - description: 'Set the page token to start from.

          Use page tokens to page through list results or list specific pages.'
        in: query
        name: list_parameters.page_token
        schema:
          format: int32
          type: integer
      - description: 'Set the page size to limit the number of results returned.

          Default: 100. Max: 500.'
        in: query
        name: list_parameters.page_size
        schema:
          format: int32
          type: integer
      - description: Action to be executed with a request. Not supported for all endpoints.
        in: query
        name: list_parameters.action
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: list_parameters.mask
        schema:
          type: string
      - description: Get data from any child namespaces as well.
        in: query
        name: list_parameters.traverse
        schema:
          type: boolean
      - description: Field to sort objects by, for example, meta.name.
        in: query
        name: list_parameters.sort.path
        schema:
          type: string
      - description: 'Sort order. Default: ASC.'
        in: query
        name: list_parameters.sort.order
        schema:
          default: SORT_ENTRY_ORDER_UNSPECIFIED
          enum:
          - SORT_ENTRY_ORDER_UNSPECIFIED
          - SORT_ENTRY_ORDER_ASC
          - SORT_ENTRY_ORDER_DESC
          type: string
      - description: 'Return the number of objects matching the given list parameters.

          If count is set to true, the response is a CountResponse.

          Can be used together with filter and traverse.'
        in: query
        name: list_parameters.count
        schema:
          type: boolean
      - description: 'Group the objects based on this field.

          If there are multiple fields then the objects are grouped

          based on the uniqueness of all fields.

          Supports composite paths.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.aggregation_paths
        schema:
          type: string
      - description: 'Return the UUID of each object in each group as specified by

          aggregation_paths.'
        in: query
        name: list_parameters.group.show_aggregation_uuids
        schema:
          type: boolean
      - description: 'List of fields for which we want the unique count.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_count_paths
        schema:
          type: string
      - description: 'List of fields for which we want the unique values.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_value_paths
        schema:
          type: string
      - description: Only return objects from PR scans that match this context id.
        in: query
        name: list_parameters.ci_run_uuid
        schema:
          type: string
      - description: Page ID to retrieve.
        in: query
        name: list_parameters.page_id
        schema:
          type: string
      - description: 'Group the objects based on this time field,

          for example, meta.create_time.'
        in: query
        name: list_parameters.group_by_time.aggregation_paths
        schema:
          type: string
      - description: Return the UUIDs of the objects in each group.
        in: query
        name: list_parameters.group_by_time.show_aggregation_uuids
        schema:
          type: boolean
      - description: Interval unit by which the objects should be grouped.
        in: query
        name: list_parameters.group_by_time.interval
        schema:
          default: GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          enum:
          - GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          - GROUP_BY_TIME_INTERVAL_YEAR
          - GROUP_BY_TIME_INTERVAL_QUARTER
          - GROUP_BY_TIME_INTERVAL_MONTH
          - GROUP_BY_TIME_INTERVAL_WEEK
          - GROUP_BY_TIME_INTERVAL_DAY
          - GROUP_BY_TIME_INTERVAL_HOUR
          - GROUP_BY_TIME_INTERVAL_MINUTE
          - GROUP_BY_TIME_INTERVAL_SECOND
          type: string
      - description: 'Size of the time interval to group the objects by,

          for example, to group objects by 2-week intervals, set interval

          to GROUP_BY_TIME_INTERVAL_WEEK and group_size to 2.'
        in: query
        name: list_parameters.group_by_time.group_size
        schema:
          format: int32
          type: integer
      - description: 'Beginning of the time period to group objects.

          Defaults to the beginning of time.'
        in: query
        name: list_parameters.group_by_time.start_time
        schema:
          format: date-time
          type: string
      - description: 'End of the time period to group objects.

          Defaults to the current time.'
        in: query
        name: list_parameters.group_by_time.end_time
        schema:
          format: date-time
          type: string
      - description: 'The mode determines how the matching objects are counted

          in the produced time-series. Values allowed are:

          count (default) : is the number of items matching in every interval.

          sum: is the total number of items matching since the beginning of the

          aggregation time.'
        in: query
        name: list_parameters.group_by_time.mode
        schema:
          type: string
      - description: 'The aggregation_field is a field on the matched objects that we want to

          perform some operation in each interval (example : min, max, avg)'
        in: query
        name: list_parameters.group_by_time.aggregation_value_field
        schema:
          type: string
      - description: 'The aggreation_operator is the operator that we should use for the

          aggregation. Allowed values are: min, max, sum, avg'
        in: query
        name: list_parameters.group_by_time.aggregation_operator
        schema:
          type: string
      - description: 'If true, the results will not be paginated and

          only the first page will be returned. The order

          of the results is not guaranteed.'
        in: query
        name: list_parameters.disable_pagination
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListPoliciesResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: ListPolicies
      tags:
      - PolicyService
    post:
      description: Creates a policy.
      operationId: PolicyService_CreatePolicy
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyServiceCreatePolicyBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Policy'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreatePolicy
      tags:
      - PolicyService
  /v1/namespaces/{tenant_meta.namespace}/policies/{uuid}:
    delete:
      description: Deletes the policy specified by the UUID.
      operationId: PolicyService_DeletePolicy
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the resource to be deleted.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: Action to be executed with delete request.
        in: query
        name: delete_parameters.action
        schema:
          type: string
      - description: 'Force will force the deletion of the resource if any

          checks fail.'
        in: query
        name: delete_parameters.force
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: DeletePolicy
      tags:
      - PolicyService
    get:
      description: Fetches the policy identified by the UUID.
      operationId: PolicyService_GetPolicy
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the requested resource.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: get_parameters.mask
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Policy'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: GetPolicy
      tags:
      - PolicyService
components:
  schemas:
    PolicyExceptionAction:
      properties:
        expiration_time:
          description: Expiration time of the exception policy.
          format: date-time
          type: string
        reason:
          $ref: '#/components/schemas/v1ExceptionReason'
        tags:
          description: '[Optional] List of tags to add to spec.exception.tags in matching

            findings.'
          items:
            type: string
          type: array
      required:
      - reason
      type: object
    GroupResponseGroupData:
      description: Information about objects matching the given key.
      properties:
        aggregation_count:
          $ref: '#/components/schemas/v1CountResponse'
        aggregation_uuids:
          description: 'List of UUIDs of the objects in the group.

            Only populated if show_aggregation_uuids is set.'
          items:
            type: string
          type: array
        aggregation_value:
          $ref: '#/components/schemas/v1GroupAggregationValueResponse'
        unique_counts:
          additionalProperties:
            $ref: '#/components/schemas/v1CountResponse'
          description: 'Map of counts for the given unique_count_paths fields.

            Only populated if unique_count_paths is set.'
          type: object
        unique_values:
          additionalProperties:
            items:
              type: object
            type: array
          description: 'Map of values for the given unique_value_paths fields.

            Only populated if unique_value_paths is set.'
          type: object
      type: object
    v1ListPoliciesResponseList:
      properties:
        objects:
          items:
            $ref: '#/components/schemas/v1Policy'
          type: array
        response:
          $ref: '#/components/schemas/v1ListResponse'
      type: object
    v1PolicySpec:
      properties:
        admission:
          $ref: '#/components/schemas/PolicyAdmissionAction'
        disable:
          description: Disables a policy without deleting it.
          type: boolean
        exception:
          $ref: '#/components/schemas/PolicyExceptionAction'
        finding:
          $ref: '#/components/schemas/PolicyFindingAction'
        finding_categories:
          description: 'List of finding categories that the policy creates or acts on findings

            for. This field can be used to group policies.'
          items:
            $ref: '#/components/schemas/v1FindingCategory'
          type: array
        finding_level:
          $ref: '#/components/schemas/SpecFindingLevel'
        group_by_fields:
          description: 'Custom fields to group policy output by. This may be a

            subset of all custom keys in the policy output. You do not need to

            add all custom fields here, just the ones you want to be used to

            group the matches by. The corresponding values

            are always treated as a single string.'
          items:
            type: string
          type: array
        notification:
          $ref: '#/components/schemas/v1PolicyNotificationAction'
        policy_type:
          $ref: '#/components/schemas/PolicyPolicyType'
        project_exceptions:
          description: 'The set of tags that projects that are matched

            with are excluded from the policy. Allows exceptions. Exceptions

            can be provided with or without selectors.'
          items:
            type: string
          type: array
        project_selector:
          description: 'The set of tags that projects must have for the policy to be executed

            against. If left empty, the policy applies to all projects of the

            namespace. The items in the array correspond to an OR operator. That is,

            any project with a tag that matches any of the project_selector values

            will be matched.'
          items:
            type: string
          type: array
        query_statements:
          description: 'The list of OPA query statements that must be executed to evaluate the

            policy. For example, [ "data.packagename.allow" ], [opulated from

            template if applicable.'
          items:
            type: string
          type: array
        resource_kinds:
          description: 'Identifies all resources that a policy requires.

            For example, "Project", "Repository", "RepositoryVersion",

            "PackageVersion", "DependencyMetadata", "Metric", "LinterResult",

            "Finding", etc. For the "Metric" resource you must also specify the

            corresponding parent resource kind.'
          items:
            type: string
          type: array
        rule:
          description: "The policy rule in text format.\n\nFor example:\n\npackage policyexample\n\ndefault allow = false\n\nallow {\n   data.resources.Project[_].meta.name = go-memdb\"\n}"
          type: string
        template_parameters:
          description: Template parameter metadata for this template version.
          items:
            $ref: '#/components/schemas/PolicyTemplateParameter'
          type: array
        template_uuid:
          description: Indicates that the policy is created from a template.
          type: string
        template_values:
          additionalProperties:
            $ref: '#/components/schemas/PolicyTemplateParameterValues'
          description: The map of key-value pairs for parameters used to customize the template.
          type: object
        template_version:
          description: Template version.
          type: string
      required:
      - policy_type
      type: object
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    v1Policy:
      description: Policy represents a policy in the system.
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        propagate:
          description: Whether the object should be visible in child namespaces or not.
          type: boolean
        spec:
          $ref: '#/components/schemas/v1PolicySpec'
        tenant_meta:
          $ref: '#/components/schemas/v1TenantMeta'
        uuid:
          description: The UUID of the policy.
          readOnly: true
          type: string
      required:
      - meta
      - spec
      type: object
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    PolicyFindingAction:
      properties:
        categories:
          description: 'List of categories that capture the use cases the finding fits in.

            For policy templates, this is used as the default value but

            it can be changed.'
          items:
            $ref: '#/components/schemas/v1FindingCategory'
          type: array
        explanation:
          description: 'Explanation provides information about the reason this is considered

            noteworthy. For policy templates this is used as the default value but

            it can be changed to any free form string.'
          type: string
        external_name:
          description: 'External finding name.

            For policy templates this is used as the default value but

            it can be changed to any free form string.'
          type: string
        level:
          $ref: '#/components/schemas/SpecFindingLevel'
        meta_tags:
          description: Additional meta tags for the finding that is created.
          items:
            type: string
          type: array
        remediation:
          description: 'Remediation instructions.

            For policy templates this is used as the default value but

            it can be changed to any free form string.'
          type: string
        summary:
          description: 'Summary of the finding that is created.

            For policy templates this is used as the default value but

            it can be changed to any free form string.'
          type: string
        tags:
          description: 'Additional tags for the finding that is created.

            For policy templates, this is used as the default value but

            it can be changed.'
          items:
            $ref: '#/components/schemas/v1FindingTags'
          type: array
        target_kind:
          description: 'Repository, RepositoryVersion, or PackageVersion.

            This is usually the same as the finding parent kind.'
          type: string
      required:
      - level
      - summary
      - explanation
      - remediation
      type: object
    v1ExceptionReason:
      default: EXCEPTION_REASON_UNSPECIFIED
      description: "Reasons for dismissing a finding.\n\n - EXCEPTION_REASON_FALSE_POSITIVE: Tool is incorrect. This is not a real issue.\n - EXCEPTION_REASON_RISK_ACCEPTED: Risk acknowledged and accepted.\n - EXCEPTION_REASON_IN_TRIAGE: Issue is actively being triaged.\n - EXCEPTION_REASON_OTHER: Other reason. Use policy description or dismiss comments to elaborate.\n - EXCEPTION_REASON_RESOLVED: Issue has been resolved. For example, a secret is no longer valid.\n - EXCEPTION_REASON_PRESENT_IN_BASELINE: The finding is also present in the baseline scan this one was diffed\nagainst, so it is not newly introduced. Set only by container diff\ntooling, never by a human."
      enum:
      - EXCEPTION_REASON_UNSPECIFIED
      - EXCEPTION_REASON_FALSE_POSITIVE
      - EXCEPTION_REASON_RISK_ACCEPTED
      - EXCEPTION_REASON_IN_TRIAGE
      - EXCEPTION_REASON_OTHER
      - EXCEPTION_REASON_RESOLVED
      - EXCEPTION_REASON_PRESENT_IN_BASELINE
      type: string
    v1UpdateRequest:
      description: Message used for all update requests.
      properties:
        force:
          description: 'Force will force the update of the resource if any

            checks fail.'
          type: boolean
        update_mask:
          description: Fields to update. Defaults to all fields.
          type: string
      type: object
    PolicyAdmissionAction:
      properties:
        bypass_exceptions:
          description: 'Set to true if exception policies should be ignored for findings

            matching this policy.'
          type: boolean
        disable_enforcement:
          description: 'If disable_enforcement is set the policy will just log the result

            and not enforce an action. This allows debugging and observation

            of the system.'
          type: boolean
      type: object
    v1FindingTags:
      default: FINDING_TAGS_UNSPECIFIED
      description: "Finding attributes.\n\n - FINDING_TAGS_DIRECT: Finding applies to a direct dependency.\n - FINDING_TAGS_TRANSITIVE: Finding applies to a transitive (indirect) dependency.\n - FINDING_TAGS_PROJECT_INTERNAL: Finding applies to a dependency that belongs to the same project.\n - FINDING_TAGS_NAMESPACE_INTERNAL: Finding applies to a dependency that belongs to the same namespace.\n - FINDING_TAGS_REACHABLE_DEPENDENCY: Finding applies to a reachable dependency.\n - FINDING_TAGS_UNREACHABLE_DEPENDENCY: Finding applies to an unreachable dependency.\n - FINDING_TAGS_POTENTIALLY_REACHABLE_DEPENDENCY: Finding applies to a potentially reachable dependency.\n - FINDING_TAGS_REACHABLE_FUNCTION: Finding applies to a reachable function.\n - FINDING_TAGS_UNREACHABLE_FUNCTION: Finding applies to an unreachable function.\n - FINDING_TAGS_POTENTIALLY_REACHABLE_FUNCTION: Finding applies to a potentially reachable function.\n - FINDING_TAGS_FIXABLE: Deprecated.\n - FINDING_TAGS_UNFIXABLE: Finding is unfixable.\n - FINDING_TAGS_PRODUCTION: Deprecated.\n - FINDING_TAGS_TEST: Finding applies to a dependency not in production code.\n - FINDING_TAGS_NORMAL: Finding applies to a normal, non-test, dependency.\n - FINDING_TAGS_FIX_AVAILABLE: There is a fix available for the CVE reported in this finding.\n - FINDING_TAGS_SELF: Finding applies only to the analyzed package version, there is no\ndependency involved.\n - FINDING_TAGS_POLICY: Deprecated.\n - FINDING_TAGS_CI_BLOCKER: Finding caused a CI failure.\n - FINDING_TAGS_VALID_SECRET: Finding applies to a valid secret.\n - FINDING_TAGS_INVALID_SECRET: Finding applies to an invalid secret.\n - FINDING_TAGS_PATH_EXTERNAL: Finding applies to a transitive dependency that can only be reached via\nexternal, non-OSS, project paths.\n - FINDING_TAGS_MALWARE: Finding applies to malicious package.\n - FINDING_TAGS_UNDER_REVIEW: Finding applies to suspicious package under review.\n - FINDING_TAGS_PHANTOM: Finding applies to a phantom dependency.\n - FINDING_TAGS_EXCEPTION: Finding is exempt from action policies.\n - FINDING_TAGS_CI_WARNING: Finding caused a CI warning.\n - FINDING_TAGS_NOTIFICATION: Finding triggered a notification.\n - FINDING_TAGS_EXPLOITED: This vulnerability is known to be exploited.\n - FINDING_TAGS_DISPUTED: This vulnerability has been marked as 'disputed'.\n - FINDING_TAGS_WITHDRAWN: This vulnerability has been marked as 'withdrawn'.\n - FINDING_TAGS_FALSE_POSITIVE: This finding has been analyzed to be a false positive.\n - FINDING_TAGS_TRUE_POSITIVE: This finding has been analyzed to be a true positive.\n - FINDING_TAGS_SNOOZED: Finding has been snoozed.\n - FINDING_TAGS_AI: This finding was generated using AI.\n - FINDING_TAGS_IGNORED: Finding has been ignored via the ignore file.\n - FINDING_TAGS_SEGMENT_MATCH: Finding applies to a dependency discovered via segment-matching.\n - FINDING_TAGS_REACHABLE_BY_INCLUSION: The vulnerability is assumed reachable because the package is included;\nno call path to a vulnerable function exists.\n - FINDING_TAGS_POTENTIALLY_VALID_SECRET: Finding applies to a secret that has not been validated.\n - FINDING_TAGS_INFERRED: Finding applies to this package as it was forked from an upstream package\nthat is vulnerable to this CVE."
      enum:
      - FINDING_TAGS_UNSPECIFIED
      - FINDING_TAGS_DIRECT
      - FINDING_TAGS_TRANSITIVE
      - FINDING_TAGS_PROJECT_INTERNAL
      - FINDING_TAGS_NAMESPACE_INTERNAL
      - FINDING_TAGS_REACHABLE_DEPENDENCY
      - FINDING_TAGS_UNREACHABLE_DEPENDENCY
      - FINDING_TAGS_POTENTIALLY_REACHABLE_DEPENDENCY
      - FINDING_TAGS_REACHABLE_FUNCTION
