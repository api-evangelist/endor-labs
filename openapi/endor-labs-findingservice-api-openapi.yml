          type: array
        version_constraints:
          title: 'Package version number rules.

            Example-1: ^1.5.3 || ^2.0

            Example-2: ^1.8.1

            Example-3: ^2.8.52 || ^3.4.35 || ^4.4 || ^5.0 || ^6.0'
