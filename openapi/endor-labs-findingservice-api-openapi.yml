openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Finding Service API
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: FindingService
paths:
  /v1/namespaces/{object.tenant_meta.namespace}/findings:
    patch:
      description: Update a specified finding.
      operationId: FindingService_UpdateFinding
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: object.tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindingServiceUpdateFindingBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Finding'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: UpdateFinding
      tags:
      - FindingService
      x-internal: false
  /v1/namespaces/{tenant_meta.namespace}/findings:
    get:
      description: List findings based on the specified list parameters.
      operationId: FindingService_ListFindings
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: 'String of conditions to filter resources by.

          Filters may include any attribute along with the following operators:

          "==", "!=", ">", ">=", "<", "<=", "Contains", "In", "Matches", and

          "Exists". The logical operators "And" and "Or" are also supported.

          Expressions may be combined and grouped with parentheses.


          Examples:

          "spec.value == 5",

          "spec.value in ["a", "b", "c"]",

          "(meta.name == "xyz" and "spec.value in ["a","b"]) or (spec.value ==

          "c")".'
        in: query
        name: list_parameters.filter
        schema:
          type: string
      - description: 'Set the page token to start from.

          Use page tokens to page through list results or list specific pages.'
        in: query
        name: list_parameters.page_token
        schema:
          format: int32
          type: integer
      - description: 'Set the page size to limit the number of results returned.

          Default: 100. Max: 500.'
        in: query
        name: list_parameters.page_size
        schema:
          format: int32
          type: integer
      - description: Action to be executed with a request. Not supported for all endpoints.
        in: query
        name: list_parameters.action
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: list_parameters.mask
        schema:
          type: string
      - description: Get data from any child namespaces as well.
        in: query
        name: list_parameters.traverse
        schema:
          type: boolean
      - description: Field to sort objects by, for example, meta.name.
        in: query
        name: list_parameters.sort.path
        schema:
          type: string
      - description: 'Sort order. Default: ASC.'
        in: query
        name: list_parameters.sort.order
        schema:
          default: SORT_ENTRY_ORDER_UNSPECIFIED
          enum:
          - SORT_ENTRY_ORDER_UNSPECIFIED
          - SORT_ENTRY_ORDER_ASC
          - SORT_ENTRY_ORDER_DESC
          type: string
      - description: 'Return the number of objects matching the given list parameters.

          If count is set to true, the response is a CountResponse.

          Can be used together with filter and traverse.'
        in: query
        name: list_parameters.count
        schema:
          type: boolean
      - description: 'Group the objects based on this field.

          If there are multiple fields then the objects are grouped

          based on the uniqueness of all fields.

          Supports composite paths.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.aggregation_paths
        schema:
          type: string
      - description: 'Return the UUID of each object in each group as specified by

          aggregation_paths.'
        in: query
        name: list_parameters.group.show_aggregation_uuids
        schema:
          type: boolean
      - description: 'List of fields for which we want the unique count.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_count_paths
        schema:
          type: string
      - description: 'List of fields for which we want the unique values.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_value_paths
        schema:
          type: string
      - description: Only return objects from PR scans that match this context id.
        in: query
        name: list_parameters.ci_run_uuid
        schema:
          type: string
      - description: Page ID to retrieve.
        in: query
        name: list_parameters.page_id
        schema:
          type: string
      - description: 'Group the objects based on this time field,

          for example, meta.create_time.'
        in: query
        name: list_parameters.group_by_time.aggregation_paths
        schema:
          type: string
      - description: Return the UUIDs of the objects in each group.
        in: query
        name: list_parameters.group_by_time.show_aggregation_uuids
        schema:
          type: boolean
      - description: Interval unit by which the objects should be grouped.
        in: query
        name: list_parameters.group_by_time.interval
        schema:
          default: GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          enum:
          - GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          - GROUP_BY_TIME_INTERVAL_YEAR
          - GROUP_BY_TIME_INTERVAL_QUARTER
          - GROUP_BY_TIME_INTERVAL_MONTH
          - GROUP_BY_TIME_INTERVAL_WEEK
          - GROUP_BY_TIME_INTERVAL_DAY
          - GROUP_BY_TIME_INTERVAL_HOUR
          - GROUP_BY_TIME_INTERVAL_MINUTE
          - GROUP_BY_TIME_INTERVAL_SECOND
          type: string
      - description: 'Size of the time interval to group the objects by,

          for example, to group objects by 2-week intervals, set interval

          to GROUP_BY_TIME_INTERVAL_WEEK and group_size to 2.'
        in: query
        name: list_parameters.group_by_time.group_size
        schema:
          format: int32
          type: integer
      - description: 'Beginning of the time period to group objects.

          Defaults to the beginning of time.'
        in: query
        name: list_parameters.group_by_time.start_time
        schema:
          format: date-time
          type: string
      - description: 'End of the time period to group objects.

          Defaults to the current time.'
        in: query
        name: list_parameters.group_by_time.end_time
        schema:
          format: date-time
          type: string
      - description: 'The mode determines how the matching objects are counted

          in the produced time-series. Values allowed are:

          count (default) : is the number of items matching in every interval.

          sum: is the total number of items matching since the beginning of the

          aggregation time.'
        in: query
        name: list_parameters.group_by_time.mode
        schema:
          type: string
      - description: 'The aggregation_field is a field on the matched objects that we want to

          perform some operation in each interval (example : min, max, avg)'
        in: query
        name: list_parameters.group_by_time.aggregation_value_field
        schema:
          type: string
      - description: 'The aggreation_operator is the operator that we should use for the

          aggregation. Allowed values are: min, max, sum, avg'
        in: query
        name: list_parameters.group_by_time.aggregation_operator
        schema:
          type: string
      - description: 'If true, the results will not be paginated and

          only the first page will be returned. The order

          of the results is not guaranteed.'
        in: query
        name: list_parameters.disable_pagination
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListFindingsResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: ListFindings
      tags:
      - FindingService
      x-internal: false
    post:
      description: Create a finding.
      operationId: FindingService_CreateFinding
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindingServiceCreateFindingBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Finding'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreateFinding
      tags:
      - FindingService
      x-internal: true
  /v1/namespaces/{tenant_meta.namespace}/findings/{uuid}:
    delete:
      description: Delete the finding specified by the UUID.
      operationId: FindingService_DeleteFinding
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the resource to be deleted.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: Action to be executed with delete request.
        in: query
        name: delete_parameters.action
        schema:
          type: string
      - description: 'Force will force the deletion of the resource if any

          checks fail.'
        in: query
        name: delete_parameters.force
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: DeleteFinding
      tags:
      - FindingService
      x-internal: false
    get:
      description: Fetch the finding identified by the UUID.
      operationId: FindingService_GetFinding
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the requested resource.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: get_parameters.mask
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Finding'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: GetFinding
      tags:
      - FindingService
      x-internal: false
components:
  schemas:
    v1NVDV40Safety:
      default: NVDV40_SAFETY_UNSPECIFIED
      enum:
      - NVDV40_SAFETY_UNSPECIFIED
      - NVDV40_SAFETY_NEGLIGIBLE
      - NVDV40_SAFETY_PRESENT
      - NVDV40_SAFETY_NOT_DEFINED
      type: string
    v1FileType:
      default: FILE_TYPE_UNSPECIFIED
      enum:
      - FILE_TYPE_UNSPECIFIED
      - FILE_TYPE_FILE
      - FILE_TYPE_SYMLINK
      type: string
    v1ListFindingsResponseList:
      properties:
        objects:
          items:
            $ref: '#/components/schemas/v1Finding'
          type: array
        response:
          $ref: '#/components/schemas/v1ListResponse'
      type: object
    v1NVDUserInteraction:
      default: NVD_USER_INTERACTION_UNSPECIFIED
      enum:
      - NVD_USER_INTERACTION_UNSPECIFIED
      - NVD_USER_INTERACTION_NONE
      - NVD_USER_INTERACTION_REQUIRED
      type: string
    v1AISASTContextRegion:
      description: 'A source region whose content is hashed so a scheduled AI SAST refresh can

        detect whether that region changed since the finding was last scanned.'
      properties:
        content_hash:
          description: SHA-256 hex hash of the region's source at scan time.
          type: string
        location:
          $ref: '#/components/schemas/v1SourceLocation'
      type: object
    v1LinterCorrectnessAnalysis:
      description: LinterCorrectnessAnalysis represents an analysis of a linter result.
      properties:
        analysis_summary:
          description: Analysis summary, providing an explanation of the linter result and classification.
          type: string
        analyzer:
          $ref: '#/components/schemas/v1CorrectnessAnalyzer'
        code_fixes:
          description: Code fixes are potential fixes to the identified issue.
          items:
            $ref: '#/components/schemas/LinterCorrectnessAnalysisCodeFix'
          type: array
        code_references:
          description: Textual description of line references/ fields/variables , etc for the linter result.
          type: string
        confidence_level:
          $ref: '#/components/schemas/v1AIMetaConfidenceLevel'
        content_hash:
          description: 'sha256 over the source spans (finding location + taint dataflow) this analysis

            was computed against; a mismatch on rescan invalidates the cached verdict and

            forces re-analysis of the result.'
          type: string
        correctness:
          $ref: '#/components/schemas/v1Correctness'
        data_flow:
          description: Textual Description of the source to sink data flow analysis for the linter result.
          items:
            $ref: '#/components/schemas/LinterCorrectnessAnalysisDataFlowNode'
          type: array
        description:
          description: The textual description of the linter correctness analysis.
          type: string
        risk_assessment:
          description: Risk assessment for the linter result. Provides False/True positive classifaction and reasoning for the linter result..
          type: string
        sanitizers:
          description: The sanitizers used to determine the correctness of the linter result.
          items:
            type: string
          type: array
        security_control:
          description: Description of any sanitizers, validators, or mitigations found (or lack thereof) for the linter result.
          type: string
        security_impact:
          description: Description of the security impact/potential consequences for the linter result.
          type: string
        symbols:
          description: Key variables/symbols in the data flow path for the linter result.
          type: string
        technical_detail:
          description: Further technical details (eg results about the vulnerability type and exploitation potential) for the linter result.
          type: string
        version:
          description: The version of the linter correctness analysis.
          type: string
      required:
      - version
      - analyzer
      - correctness
      - confidence_level
      type: object
    PackageVersionDependencyCargoDependencySpec:
      description: 'CargoDependencySpec specifies a dependency for

        type defined in the Rust cargo_metadata crate.'
      properties:
        cfg:
          $ref: '#/components/schemas/CargoDependencySpecCfg'
        features:
          description: The list of features enabled for this dependency.
          items:
            type: string
          type: array
        kind:
          $ref: '#/components/schemas/CargoDependencySpecDependencyKind'
        name:
          description: The name of dependency.
          type: string
        named:
          $ref: '#/components/schemas/CargoDependencySpecNamedPlatform'
        optional:
          description: Whether this dependency is required or optional.
          type: boolean
        path:
          description: / The file system path for a local path dependency.
          type: string
        registry:
          description: '/ The URL of the index of the registry where this dependency is from.

            / If not specified, the dependency is from crates.io.'
          type: string
        rename:
          description: If the dependency is renamed, this is the new name for the dependency.
          type: string
        req:
          description: 'The required version, specified as a list of version requirements.

            that all have to be satisfied.'
          items:
            $ref: '#/components/schemas/CargoDependencySpecCargoVersionReq'
          type: array
        source:
          description: The source repository query string to use, if any.
          type: string
        targets:
          description: 'The targets to which this dependency applies.

            If there is no target then this dependency will be applicable for all

            the targets. A dependency can be valid for multiple targets.'
          items:
            $ref: '#/components/schemas/v1Target'
          type: array
        uses_default_features:
          description: Whether the default features in this dependency are used or not.
          type: boolean
        version_constraints:
          description: Package version number rules.
          type: string
      required:
      - name
      - kind
      - optional
      - uses_default_features
      - version_constraints
      type: object
    SpecMalwareRanges:
      properties:
        ranges:
          items:
            $ref: '#/components/schemas/SpecMalwareRange'
          type: array
      type: object
    v1CvssDataV2:
      properties:
        access_complexity:
          $ref: '#/components/schemas/CvssDataV2AccessComplexity'
        access_vector:
          $ref: '#/components/schemas/v1NVDAttackVector'
        authentication:
          $ref: '#/components/schemas/CvssDataV2Auth'
        availability_impact:
          $ref: '#/components/schemas/CvssDataV2V2Impact'
        availability_requirement:
          $ref: '#/components/schemas/v1NVDRequirement'
        base_score:
          format: float
          type: number
        collateral_damage_potential:
          $ref: '#/components/schemas/CvssDataV2CollateralDamagePotential'
        confidentiality_impact:
          $ref: '#/components/schemas/CvssDataV2V2Impact'
        confidentiality_requirement:
          $ref: '#/components/schemas/v1NVDRequirement'
        environmental_score:
          format: float
          type: number
        exploitability:
          $ref: '#/components/schemas/CvssDataV2Exploitability'
        integrity_impact:
          $ref: '#/components/schemas/CvssDataV2V2Impact'
        integrity_requirement:
          $ref: '#/components/schemas/v1NVDRequirement'
        remediation_level:
          $ref: '#/components/schemas/v1NVDRemediationLevel'
        report_confidence:
          $ref: '#/components/schemas/CvssDataV2ReportConfidence'
        target_distribution:
          $ref: '#/components/schemas/CvssDataV2TargetDistribution'
        temporal_score:
          format: float
          type: number
        vector_string:
          type: string
        version:
          type: string
      required:
      - version
      - vector_string
      - base_score
      type: object
    v1NVDV40ModifiedImpact:
      default: NVDV40_MODIFIED_IMPACT_UNSPECIFIED
      enum:
      - NVDV40_MODIFIED_IMPACT_UNSPECIFIED
      - NVDV40_MODIFIED_IMPACT_NONE
      - NVDV40_MODIFIED_IMPACT_LOW
      - NVDV40_MODIFIED_IMPACT_HIGH
      - NVDV40_MODIFIED_IMPACT_NOT_DEFINED
      type: string
    LLMContextStructuredContent:
      properties:
        data:
          description: The actual content data.
          type: string
        schema:
          description: The schema defining the structure and validation rules for the content.
          type: object
      type: object
    v1SecurityReviewFindingData:
      properties:
        ai_meta:
          $ref: '#/components/schemas/v1AIMeta'
        category:
          $ref: '#/components/schemas/PullRequestSecurityReviewResultInfoSecurityReviewCategory'
        code_snippet:
          $ref: '#/components/schemas/PullRequestSecurityReviewResultInfoCodeSnippet'
        justification:
          description: Justification for the security review category.
          type: string
        security_impact_type:
          $ref: '#/components/schemas/SecurityAspectMetricSecurityImpactType'
      type: object
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    v1NVDV40Recovery:
      default: NVDV40_RECOVERY_UNSPECIFIED
      enum:
      - NVDV40_RECOVERY_UNSPECIFIED
      - NVDV40_RECOVERY_AUTOMATIC
      - NVDV40_RECOVERY_USER
      - NVDV40_RECOVERY_IRRECOVERABLE
      - NVDV40_RECOVERY_NOT_DEFINED
      type: string
    v1FindingClassification:
      default: FINDING_CLASSIFICATION_UNSPECIFIED
      description: "Classification of the finding type. Extensible for future categories.\n\n - FINDING_CLASSIFICATION_SECURITY_VULNERABILITY: Security vulnerability (e.g. SQL injection, XSS, hardcoded creds).\n - FINDING_CLASSIFICATION_LOGICAL_BUG: Logical bug (e.g. null pointer, resource leak, race condition)."
      enum:
      - FINDING_CLASSIFICATION_UNSPECIFIED
      - FINDING_CLASSIFICATION_SECURITY_VULNERABILITY
      - FINDING_CLASSIFICATION_LOGICAL_BUG
      type: string
    v1IOCType:
      default: IOC_TYPE_UNSPECIFIED
      description: IOCType classifies the type of Indicator of Compromise.
      enum:
      - IOC_TYPE_UNSPECIFIED
      - IOC_TYPE_URL
      - IOC_TYPE_IP
      - IOC_TYPE_DOMAIN
      - IOC_TYPE_FILENAME
      - IOC_TYPE_FILEPATH
      - IOC_TYPE_DIGEST_SHA1
      - IOC_TYPE_DIGEST_SHA256
      - IOC_TYPE_DIGEST_SHA512
      - IOC_TYPE_DIGEST_MD5
      - IOC_TYPE_WALLET_ADDRESS
      - IOC_TYPE_REGISTRY_ACCOUNT_NAME
      - IOC_TYPE_REGISTRY_ACCOUNT_EMAIL
      - IOC_TYPE_DEPENDENCY
      type: string
    PackageVersionDependencyPypiDependencySpec:
      description: 'PypiDependencySpec specifies a dependency for

        Python based repositories or packages.'
      properties:
        name:
          title: 'The package name of the python dependency.

            Example: multidict'
          type: string
        package_manager_type:
          $ref: '#/components/schemas/PackageVersionDependencyPypiDependencySpecPackageManagerType'
        scope_type:
          $ref: '#/components/schemas/PackageVersionDependencyPypiDependencySpecScope'
        targets:
          description: 'The targets to which this dependency applies.

            If there is no target then this dependency will be applicable for all the

            targets. A dependency can be valid for multiple targets.'
          items:
            $ref: '#/components/schemas/v1Target'
          type: array
        version_constraints:
          title: 'Package version number rules.

            Example-1: ~= 3.2

            Example-2: >= 2.0.0, < 3.0.0

            Example-3: == 4.7.0'
          type: string
      required:
      - name
      - version_constraints
      type: object
    CvssDataV2Auth:
      default: AUTH_UNSPECIFIED
      enum:
      - AUTH_UNSPECIFIED
      - AUTH_MULTIPLE
      - AUTH_SINGLE
      - AUTH_NONE
      type: string
    SpecRaw:
      properties:
        endor_vulnerability:
          $ref: '#/components/schemas/endorv1Vulnerability'
        epss_record:
          $ref: '#/components/schemas/SpecEPSSRecord'
        kev_record:
          $ref: '#/components/schemas/SpecKEVRecord'
        nvd_vulnerability:
          $ref: '#/components/schemas/v1NVDVulnerability'
        osv_vulnerability:
          $ref: '#/components/schemas/osvVulnerability'
      type: object
    v1NVDVulnerability:
      description: 'NVD Vulnerability.

        Based on schema definition provided by NVD here. https://csrc.nist.gov/schema/nvd/api/2.0/cve_api_json_2.0.schema.'
      properties:
        cve:
          $ref: '#/components/schemas/NVDVulnerabilityRootCve'
      type: object
    v1Bom:
      properties:
        dependencies:
          description: 'Different package managers use different dependency graph serialization

            strategies. Include the serialized list here to avoid re-implementing

            this within endoctl.'
          items:
            $ref: '#/components/schemas/BomDependency'
          type: array
        dependency_files:
          description: 'The list of the dependency files used to create the BOM.

            This field is optional and is only set when the source code of the

            package versions is known. It will contain the list of relative path of

            files used to compute the BOM. For instance for Golang, it will contain

            the go.mod and go.sum.'
          items:
            $ref: '#/components/schemas/BomDependencyFile'
          type: array
        dependency_graph:
          additionalProperties:
            items:
              type: object
            type: array
          title: 'A dependency graph is a K/V pair of package names.

            The format of the key must be:

            - mvn://MVN_CENTRAL/foo:bar@2.1

            - mvn://CLIENT_REPO/foo:bar@2.1-SNAPSHOT

            - go://github.com/myorg/myrepo/mypkg@sha'
