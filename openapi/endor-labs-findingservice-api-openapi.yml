          $ref: '#/components/schemas/v1PlatformSource'
        public:
          description: 'A boolean to know if the dependency is public or not.

            This field might not be set.'
          type: boolean
        purl:
          description: 'purl is the package URL notation of the dependency. Populated only for

            containers and OS packages.'
          type: string
        pypi_dependency_scope:
          $ref: '#/components/schemas/PackageVersionDependencyPypiDependencySpecScope'
        release_date:
          description: The date that the dependency was released, if known.
          format: date-time
          type: string
        runtime_files:
          description: 'A list of files accessed when a dependency is called at runtime in the container image.

            This is an optional field. It is only set when a

