        resolution_timestamp:
          format: date-time
          type: string
      required:
      - resolution_timestamp
      type: object
    v1FindingTags:
      default: FINDING_TAGS_UNSPECIFIED
      description: "Finding attributes.\n\n - FINDING_TAGS_DIRECT: Finding applies to a direct dependency.\n - FINDING_TAGS_TRANSITIVE: Finding applies to a transitive (indirect) dependency.\n - FINDING_TAGS_PROJECT_INTERNAL: Finding applies to a dependency that belongs to the same project.\n - FINDING_TAGS_NAMESPACE_INTERNAL: Finding applies to a dependency that belongs to the same namespace.\n - FINDING_TAGS_REACHABLE_DEPENDENCY: Finding applies to a reachable dependency.\n - FINDING_TAGS_UNREACHABLE_DEPENDENCY: Finding applies to an unreachable dependency.\n - FINDING_TAGS_POTENTIALLY_REACHABLE_DEPENDENCY: Finding applies to a potentially reachable dependency.\n - FINDING_TAGS_REACHABLE_FUNCTION: Finding applies to a reachable function.\n - FINDING_TAGS_UNREACHABLE_FUNCTION: Finding applies to an unreachable function.\n - FINDING_TAGS_POTENTIALLY_REACHABLE_FUNCTION: Finding applies to a potentially reachable function.\n - FINDING_TAGS_FIXABLE: Deprecated.\n - FINDING_TAGS_UNFIXABLE: Finding is unfixable.\n - FINDING_TAGS_PRODUCTION: Deprecated.\n - FINDING_TAGS_TEST: Finding applies to a dependency not in production code.\n - FINDING_TAGS_NORMAL: Finding applies to a normal, non-test, dependency.\n - FINDING_TAGS_FIX_AVAILABLE: There is a fix available for the CVE reported in this finding.\n - FINDING_TAGS_SELF: Finding applies only to the analyzed package version, there is no\ndependency involved.\n - FINDING_TAGS_POLICY: Deprecated.\n - FINDING_TAGS_CI_BLOCKER: Finding caused a CI failure.\n - FINDING_TAGS_VALID_SECRET: Finding applies to a valid secret.\n - FINDING_TAGS_INVALID_SECRET: Finding applies to an invalid secret.\n - FINDING_TAGS_PATH_EXTERNAL: Finding applies to a transitive dependency that can only be reached via\nexternal, non-OSS, project paths.\n - FINDING_TAGS_MALWARE: Finding applies to malicious package.\n - FINDING_TAGS_UNDER_REVIEW: Finding applies to suspicious package under review.\n - FINDING_TAGS_PHANTOM: Finding applies to a phantom dependency.\n - FINDING_TAGS_EXCEPTION: Finding is exempt from action policies.\n - FINDING_TAGS_CI_WARNING: Finding caused a CI warning.\n - FINDING_TAGS_NOTIFICATION: Finding triggered a notification.\n - FINDING_TAGS_EXPLOITED: This vulnerability is known to be exploited.\n - FINDING_TAGS_DISPUTED: This vulnerability has been marked as 'disputed'.\n - FINDING_TAGS_WITHDRAWN: This vulnerability has been marked as 'withdrawn'.\n - FINDING_TAGS_FALSE_POSITIVE: This finding has been analyzed to be a false positive.\n - FINDING_TAGS_TRUE_POSITIVE: This finding has been analyzed to be a true positive.\n - FINDING_TAGS_SNOOZED: Finding has been snoozed.\n - FINDING_TAGS_AI: This finding was generated using AI.\n - FINDING_TAGS_IGNORED: Finding has been ignored via the ignore file.\n - FINDING_TAGS_SEGMENT_MATCH: Finding applies to a dependency discovered via segment-matching.\n - FINDING_TAGS_REACHABLE_BY_INCLUSION: The vulnerability is assumed reachable because the package is included;\nno call path to a vulnerable function exists.\n - FINDING_TAGS_POTENTIALLY_VALID_SECRET: Finding applies to a secret that has not been validated.\n - FINDING_TAGS_INFERRED: Finding applies to this package as it was forked from an upstream package\nthat is vulnerable to this CVE."
      enum:
      - FINDING_TAGS_UNSPECIFIED
      - FINDING_TAGS_DIRECT
      - FINDING_TAGS_TRANSITIVE
      - FINDING_TAGS_PROJECT_INTERNAL
      - FINDING_TAGS_NAMESPACE_INTERNAL
      - FINDING_TAGS_REACHABLE_DEPENDENCY
      - FINDING_TAGS_UNREACHABLE_DEPENDENCY
      - FINDING_TAGS_POTENTIALLY_REACHABLE_DEPENDENCY
      - FINDING_TAGS_REACHABLE_FUNCTION
      - FINDING_TAGS_UNREACHABLE_FUNCTION
      - FINDING_TAGS_POTENTIALLY_REACHABLE_FUNCTION
      - FINDING_TAGS_FIXABLE
      - FINDING_TAGS_UNFIXABLE
      - FINDING_TAGS_PRODUCTION
      - FINDING_TAGS_TEST
      - FINDING_TAGS_NORMAL
      - FINDING_TAGS_FIX_AVAILABLE
      - FINDING_TAGS_SELF
      - FINDING_TAGS_POLICY
      - FINDING_TAGS_CI_BLOCKER
      - FINDING_TAGS_VALID_SECRET
      - FINDING_TAGS_INVALID_SECRET
      - FINDING_TAGS_PATH_EXTERNAL
      - FINDING_TAGS_MALWARE
      - FINDING_TAGS_UNDER_REVIEW
      - FINDING_TAGS_PHANTOM
      - FINDING_TAGS_EXCEPTION
      - FINDING_TAGS_CI_WARNING
      - FINDING_TAGS_NOTIFICATION
      - FINDING_TAGS_EXPLOITED
      - FINDING_TAGS_DISPUTED
      - FINDING_TAGS_WITHDRAWN
      - FINDING_TAGS_FALSE_POSITIVE
      - FINDING_TAGS_TRUE_POSITIVE
      - FINDING_TAGS_SNOOZED
      - FINDING_TAGS_AI
      - FINDING_TAGS_IGNORED
      - FINDING_TAGS_SEGMENT_MATCH
