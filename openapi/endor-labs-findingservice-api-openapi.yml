      type: object
    v1CategoryScore:
      description: 'The score for one score category. The is the overall score

        for a specific category. It is computed from the score factors that

        have been created for the category. There is going to be only a single

        instance of this information for the repo per score category.


        Example:


        Category: SCORE_CATEGORY_BEST_PRACTICES


        Score: 5


        Description: This score provides an overview of how this repo does when considering security best practices.


        The value is a number in the range 1 to 10, with 10 being the best.'
      properties:
        category:
          $ref: '#/components/schemas/v1ScoreCategory'
        centered_score:
          description: 'Centered score for the category. This score is

            normalized to be centered on 5 and is a float, so it has a higher resolution.'
          format: float
          type: number
        description:
          description: Text description of the category.
          type: string
        raw_score:
          description: 'Raw score for the category. This is the score by

            adding up the score factors, not centered around 5.'
          format: float
          type: number
        score:
          description: The score for this score.
          format: int32
          type: integer
      type: object
    PackageVersionDependencyPackagistDependencySpec:
      description: 'PackagistDependencySpec specifies storing a dependency for php

        based repositories or packages.'
      properties:
        name:
          title: 'The name of the PHP package dependency.

            Example: monolog/monolog'
          type: string
        scope_type:
