      - NVDV40_VULNERABILITY_RESPONSE_EFFORT_LOW
      - NVDV40_VULNERABILITY_RESPONSE_EFFORT_MODERATE
      - NVDV40_VULNERABILITY_RESPONSE_EFFORT_HIGH
      - NVDV40_VULNERABILITY_RESPONSE_EFFORT_NOT_DEFINED
      type: string
    PackageVersionDependencyGoDependencySpecScope:
      default: SCOPE_UNSPECIFIED
      enum:
      - SCOPE_UNSPECIFIED
      - SCOPE_NORMAL
      - SCOPE_TEST
      type: string
    v1FindingSpec:
      description: Finding specific data.
      properties:
        actions:
          $ref: '#/components/schemas/v1Actions'
        approximation:
          description: 'True if this finding is for an approximate dependency

            based on the unresolved package dependencies.'
          type: boolean
        call_graph_analysis_type:
          $ref: '#/components/schemas/v1CallGraphAnalysisType'
        code_owners:
          $ref: '#/components/schemas/v1CodeOwnerData'
        dependency_file_paths:
          description: 'List of relative paths to the dependency files used to create the bom, if

            applicable. This field is optional and is only set when the source code

            of the package version is known. For example, for Golang it contains

            go.mod and go.sum.'
          items:
            type: string
          type: array
        dismiss:
          description: 'Set to true to exclude finding from action policies

            (a.k.a. admission and notification policies).

            Findings can be dismissed in bulk by exception policies

            and/or individually via the snooze parameters or

            the ignore file.'
          type: boolean
        ecosystem:
          $ref: '#/components/schemas/v1Ecosystem'
        exceptions:
          $ref: '#/components/schemas/v1Exceptions'
        explanation:
          description: Information about why this finding is considered noteworthy.
          type: string
        extra_key:
          description: 'Additional information used to create a unique finding.


            In some cases we want to create multiple findings for the same

            combination of parent_uuid, meta.name, and target_uuid, for example when

            there are multiple vulnerabilities affecting the same dependency. By

            setting different values in this field, we are able to create a unique

            finding per combination of parent_uuid, meta.name, target_uuid, and

            extra_key.'
          type: string
        finding_categories:
          description: List of categories that capture the use case the finding fits in.
          items:
            $ref: '#/components/schemas/v1FindingCategory'
          type: array
        finding_metadata:
          $ref: '#/components/schemas/v1FindingMetadata'
        finding_tags:
          description: 'List of tags, or attributes, that describe the scope of the finding

            and can be used to filter findings.'
          items:
            $ref: '#/components/schemas/v1FindingTags'
          type: array
        fixing_patch:
          $ref: '#/components/schemas/v1FindingFixingPatch'
        fixing_upgrades:
          $ref: '#/components/schemas/v1FindingFixingUpgrades'
        ignore:
          $ref: '#/components/schemas/v1DismissParams'
        last_processed:
          description: Last time the finding was processed.
          format: date-time
          type: string
        latest_version:
          description: Latest version of dependency, if available.
          type: string
        level:
          $ref: '#/components/schemas/SpecFindingLevel'
        location_urls:
          additionalProperties:
            type: string
          description: The URLs that correspond to the paths contained in dependency_file_paths.
          type: object
        method:
