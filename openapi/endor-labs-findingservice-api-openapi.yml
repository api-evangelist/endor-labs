          $ref: '#/components/schemas/PackageVersionDependencyGoDependencySpecScope'
        hugging_face_dependency_scope:
          $ref: '#/components/schemas/v1DependencyScope'
        import_path:
          description: 'The path the source imports this dependency by, set only when it differs

            from the path inside name. Empty whenever the two agree, which is every

            ordinary dependency.


            A Golang "replace" that redirects one module path to another leaves the

            source importing the original path, so name carries the module that

            supplied the code and this carries the path the compiler sees.'
          type: string
        imported_type:
          $ref: '#/components/schemas/DependencyImportedType'
        js_dependency_scope:
          $ref: '#/components/schemas/PackageVersionDependencyNpmDependencySpecScope'
        locked:
          description: 'Set to true if the dependency is fixed to a specific version by a

            lock file at install time (outcome).


            If a dependency is locked, but not pinned, it could drift if the

            lock file is regenerated (for example, by ''npm update'').'
          type: boolean
        maven_dependency_scope:
          $ref: '#/components/schemas/PackageVersionDependencyMavenDependencySpecScope'
        name:
          type: string
        nuget_dependency_scope:
          $ref: '#/components/schemas/v1DependencyScope'
        packagist_dependency_scope:
          $ref: '#/components/schemas/PackageVersionDependencyPackagistDependencySpecScope'
        patched:
          description: patched indicates whether the dependency version was patched or not.
          type: boolean
        pinned:
          description: 'Set to true of the dependency is fixed to a specific version by a

            manifest file (intent).


            For example, in package.json, "lodash": "4.17.21" is pinned while

            "lodash": "^4.0.0" is not (it''s a range, "any 4.x").'
          type: boolean
