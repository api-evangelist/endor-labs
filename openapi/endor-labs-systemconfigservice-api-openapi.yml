    SystemConfigPackageFirewallConfig:
      description: 'PackageFirewallConfig contains package firewall configuration for exceptions,

        malware enforcement, restricted license enforcement, and minimum package age enforcement.

        Cached per namespace in endorfactory and enforced on versioned requests.'
      properties:
        cvss_severity_action:
          $ref: '#/components/schemas/v1PackageFirewallAction'
        cvss_severity_threshold:
          $ref: '#/components/schemas/SpecCVSSSeverityLevel'
        ecosystem_package_manager_uuid:
          additionalProperties:
            type: string
          description: 'UUID of the PackageManager whose artifact repository serves an ecosystem, keyed by the name of

            the Ecosystem enum value, for example "ECOSYSTEM_NPM". A named ecosystem is served from that

            repository instead of its public registry.


            An ecosystem absent from the map keeps its public registry, so an empty map preserves current

            behavior and an ecosystem can be adopted on its own.


            One UUID per ecosystem: a request resolves to exactly one repository, and there is no fallback

            to a second one or to the public registry.


            The referenced PackageManager must live in the same namespace as this config, and its

            AuthProvider.package_manager_type must match the ecosystem its key names, so an "ECOSYSTEM_NPM"

            key cannot point at a Maven repository. The rules below constrain the shape of the value only.

            Whether the UUID names a PackageManager at all, and one of the right kind, is checked against

            the referenced object.'
          type: object
        exceptions:
          description: Exception rules. If any exception matches the request, all checks are skipped.
          items:
            $ref: '#/components/schemas/PackageFirewallConfigException'
          type: array
        fail_closed:
          description: Whether to fail closed when a firewall decision cannot be reached.
          type: boolean
        malware_action:
          $ref: '#/components/schemas/v1PackageFirewallAction'
        min_age_action:
          $ref: '#/components/schemas/v1PackageFirewallAction'
        min_age_hours:
          description: Minimum age in hours for a package to be allowed (0 = disabled).
          format: int32
          type: integer
        notification_rules:
          description: 'Notification rules evaluated when the firewall blocks or warns on a request.

            A rule matches when the event''s reason is in reasons (or reasons is empty) and

            its action is in on_actions (or on_actions is empty). Each matching rule sends

            a Slack message to every referenced notification target. Only Slack targets

            are supported for now; other target types are skipped.'
          items:
            $ref: '#/components/schemas/PackageFirewallConfigFirewallNotificationRule'
          type: array
        restricted_license_action:
          $ref: '#/components/schemas/v1PackageFirewallAction'
        restricted_licenses:
          description: 'List of restricted SPDX license identifiers.

            Packages with these licenses are subject to restricted_license_action.'
          items:
            type: string
          type: array
      type: object
