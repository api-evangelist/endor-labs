openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Security Review Query Service…
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: SecurityReviewQueryService
paths:
  /v1/namespaces/{tenant_meta.namespace}/queries/security-review:
    post:
      description: Creates a security review dashboard summary query.
      operationId: SecurityReviewQueryService_CreateSecurityReviewQuery
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityReviewQueryServiceCreateSecurityReviewQueryBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1SecurityReviewQuery'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreateSecurityReviewQuery
      tags:
      - SecurityReviewQueryService
      x-internal: true
components:
  schemas:
    SecurityReviewQueryServiceCreateSecurityReviewQueryBody:
      description: SecurityReviewQuery is an internal API to accelerate the Security Review dashboard operations.
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1SecurityReviewQuerySpec'
        tenant_meta:
          description: Security Review Dashboard Summary are associated with a tenant.
          title: Security Review Dashboard Summary are associated with a tenant.
          type: object
        uuid:
          description: The UUID of the security review dashboard summary.
          readOnly: true
          type: string
      required:
      - meta
      type: object
    SpecSRRequest:
      properties:
        finding_severities:
          description: Severities to include in the summary.
          items:
            $ref: '#/components/schemas/SpecSecurityReviewLevel'
          type: array
        project_filter:
          description: Filter to select project.
          type: string
        review_time_config:
          $ref: '#/components/schemas/DashboardConfigReviewTimeConfig'
        time_range:
          $ref: '#/components/schemas/SpecSRRequestTimeRange'
        traverse:
          description: Whether to traverse child namespaces.
          type: boolean
      type: object
    SRResponseCategoryInfo:
      properties:
        finding_counts:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        name:
          description: Category name.
          readOnly: true
          type: string
      type: object
    v1SecurityReviewQuery:
      description: SecurityReviewQuery is an internal API to accelerate the Security Review dashboard operations.
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1SecurityReviewQuerySpec'
        tenant_meta:
          $ref: '#/components/schemas/v1TenantMeta'
        uuid:
          description: The UUID of the security review dashboard summary.
          readOnly: true
          type: string
      required:
      - meta
      type: object
    DashboardConfigReviewTimeConfig:
      description: Configuration for calculating review time saved.
      properties:
        large_pr_minutes:
          description: Time in minutes to review a large PR (more than 500 lines).
          format: int32
          type: integer
        medium_pr_minutes:
          description: Time in minutes to review a medium PR (100-500 lines).
          format: int32
          type: integer
        small_pr_minutes:
          description: Time in minutes to review a small PR (less than 100 lines).
          format: int32
          type: integer
      type: object
    SpecResponseDependencyCounts:
      properties:
        direct:
          description: Number of direct dependencies.
          format: int32
          readOnly: true
          type: integer
        outdated:
          description: Number of outdated dependencies.
          format: int32
          readOnly: true
          type: integer
        total:
          description: Total number of dependencies.
          format: int32
          readOnly: true
          type: integer
        transitive:
          description: Number of transitive dependencies.
          format: int32
          readOnly: true
          type: integer
        unmaintained:
          description: Number of unmaintained dependencies.
          format: int32
          readOnly: true
          type: integer
      type: object
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    SpecSRRequestTimeRange:
      description: Time range filtering.
      properties:
        end:
          description: End time for filtering (inclusive).
          format: date-time
          type: string
        start:
          description: Start time for filtering (inclusive).
          format: date-time
          type: string
      type: object
    SpecResponseVulnerabilityCounts:
      properties:
        exploitable_likelihood:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        exploitable_likelihood_potentially_reachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        exploitable_likelihood_reachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        low_upgrade_risk:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        low_upgrade_risk_potentially_reachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        low_upgrade_risk_reachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        normal:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        normal_fixable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        normal_fixable_potentially_reachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        normal_fixable_reachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        normal_fixable_unreachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        potentially_reachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        reachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        total:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        unreachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
      type: object
    SpecResponseFindingCounts:
      properties:
        critical:
          description: Number of critical findings.
          format: int32
          readOnly: true
          type: integer
        dismissed:
          description: Number of dismissed findings.
          format: int32
          readOnly: true
          type: integer
        high:
          description: Number of high severity findings.
          format: int32
          readOnly: true
          type: integer
        low:
          description: Number of low severity findings.
          format: int32
          readOnly: true
          type: integer
        medium:
          description: Number of medium severity findings.
          format: int32
          readOnly: true
          type: integer
        total:
          description: Total number of findings.
          format: int32
          readOnly: true
          type: integer
      type: object
    SpecSRResponse:
      properties:
        commits:
          description: Total number of commits reviewed.
          format: int32
          readOnly: true
          type: integer
        projects:
          description: Projects enabled for security review.
          format: int32
          readOnly: true
          type: integer
        prs_with_summaries:
          description: Total number of PRs with summaries.
          format: int32
          readOnly: true
          type: integer
        prs_without_summaries:
          description: Total number of PRs without summaries.
          format: int32
          readOnly: true
          type: integer
        pull_requests:
          description: Pull requests reviewed (latest PR scans only).
          format: int32
          readOnly: true
          type: integer
        review_time_saved_min:
          description: Review time saved (in minutes).
          format: double
          readOnly: true
          type: number
        safe_pull_requests:
          description: Number of safe pull requests.
          format: int32
          readOnly: true
          type: integer
        security_review_findings:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        security_reviews:
          description: Total number of security review performed.
          format: int32
          readOnly: true
          type: integer
        top_categories:
          description: Top categories by various metrics.
          items:
            $ref: '#/components/schemas/SRResponseCategoryInfo'
          readOnly: true
          type: array
        top_languages:
          description: Top languages by various metrics.
          items:
            $ref: '#/components/schemas/SRResponseLanguageInfo'
          readOnly: true
          type: array
        top_projects:
          description: Top projects by various metrics.
          items:
            $ref: '#/components/schemas/TopProjectsProjectInfo'
          readOnly: true
          type: array
      type: object
    TopProjectsProjectInfo:
      properties:
        dependency_counts:
          $ref: '#/components/schemas/SpecResponseDependencyCounts'
        finding_counts:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        name:
          description: Project name.
          readOnly: true
          type: string
        uuid:
          description: Project UUID.
          readOnly: true
          type: string
        vulnerability_counts:
          $ref: '#/components/schemas/SpecResponseVulnerabilityCounts'
      type: object
    v1TenantMeta:
      description: Tenant related data for the tenant containing the resource.
      properties:
        namespace:
          description: 'Namespaces are a way to organize organizational units into virtual

            groupings of resources. Namespaces must be a fully qualified name,

            for example, the child namespace of namespace "endor.prod" called "app"

            is called "endor.prod.app".'
          type: string
      required:
      - namespace
      type: object
    googleprotobufAny:
      additionalProperties: {}
      description: "`Any` contains an arbitrary serialized protocol buffer message along with a\nURL that describes the type of the serialized message.\n\nProtobuf library provides support to pack/unpack Any values in the form\nof utility functions or additional generated methods of the Any type.\n\nExample 1: Pack and unpack a message in C++.\n\n    Foo foo = ...;\n    Any any;\n    any.PackFrom(foo);\n    ...\n    if (any.UnpackTo(&foo)) {\n      ...\n    }\n\nExample 2: Pack and unpack a message in Java.\n\n    Foo foo = ...;\n    Any any = Any.pack(foo);\n    ...\n    if (any.is(Foo.class)) {\n      foo = any.unpack(Foo.class);\n    }\n    // or ...\n    if (any.isSameTypeAs(Foo.getDefaultInstance())) {\n      foo = any.unpack(Foo.getDefaultInstance());\n    }\n\n Example 3: Pack and unpack a message in Python.\n\n    foo = Foo(...)\n    any = Any()\n    any.Pack(foo)\n    ...\n    if any.Is(Foo.DESCRIPTOR):\n      any.Unpack(foo)\n      ...\n\n Example 4: Pack and unpack a message in Go\n\n     foo := &pb.Foo{...}\n     any, err := anypb.New(foo)\n     if err != nil {\n       ...\n     }\n     ...\n     foo := &pb.Foo{}\n     if err := any.UnmarshalTo(foo); err != nil {\n       ...\n     }\n\nThe pack methods provided by protobuf library will by default use\n'type.googleapis.com/full.type.name' as the type URL and the unpack\nmethods only use the fully qualified type name after the last '/'\nin the type URL, for example \"foo.bar.com/x/y.z\" will yield type\nname \"y.z\".\n\nJSON\n====\nThe JSON representation of an `Any` value uses the regular\nrepresentation of the deserialized, embedded message, with an\nadditional field `@type` which contains the type URL. Example:\n\n    package google.profile;\n    message Person {\n      string first_name = 1;\n      string last_name = 2;\n    }\n\n    {\n      \"@type\": \"type.googleapis.com/google.profile.Person\",\n      \"firstName\": <string>,\n      \"lastName\": <string>\n    }\n\nIf the embedded message type is well-known and has a custom JSON\nrepresentation, that representation will be embedded adding a field\n`value` which holds the custom JSON in addition to the `@type`\nfield. Example (for message [google.protobuf.Duration][]):\n\n    {\n      \"@type\": \"type.googleapis.com/google.protobuf.Duration\",\n      \"value\": \"1.212s\"\n    }"
      properties:
        '@type':
          description: "A URL/resource name that uniquely identifies the type of the serialized\nprotocol buffer message. This string must contain at least\none \"/\" character. The last segment of the URL's path must represent\nthe fully qualified name of the type (as in\n`path/google.protobuf.Duration`). The name should be in a canonical form\n(e.g., leading \".\" is not accepted).\n\nIn practice, teams usually precompile into the binary all types that they\nexpect it to use in the context of Any. However, for URLs which use the\nscheme `http`, `https`, or no scheme, one can optionally set up a type\nserver that maps type URLs to message definitions as follows:\n\n* If no scheme is provided, `https` is assumed.\n* An HTTP GET on the URL must yield a [google.protobuf.Type][]\n  value in binary format, or produce an error.\n* Applications are allowed to cache lookup results based on the\n  URL, or have them precompiled into a binary to avoid any\n  lookup. Therefore, binary compatibility needs to be preserved\n  on changes to types. (Use versioned type names to manage\n  breaking changes.)\n\nNote: this functionality is not currently available in the official\nprotobuf release, and it is not used for type URLs beginning with\ntype.googleapis.com. As of May 2023, there are no widely used type server\nimplementations and no plans to implement one.\n\nSchemes other than `http`, `https` (or the empty scheme) might be\nused with implementation specific semantics."
          type: string
      type: object
    v1Meta:
      description: Common fields for all Endor Labs resources.
      properties:
        annotations:
          additionalProperties:
            type: string
          description: 'Annotations can be used to attach metadata to a resource message.

            Annotation values can be small or large, structured or unstructured,

            and may include characters not permitted by labels.

            The keys may contain alphanumerics, underscores (_), dots (.) and dashes

            (-). The values of an annotation must be 16384 bytes or smaller.'
          type: object
        create_time:
          description: 'Time the resource was created.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: 'Name and authentication source of the user who created the object,

            for example, ewok@endor.ai@google@api-key.'
          readOnly: true
          type: string
        description:
          description: Resource description. Must be less than 1024 bytes.
          type: string
        index_data:
          $ref: '#/components/schemas/v1IndexData'
        kind:
          description: 'Resource kind, for example, HelloResponse.

            Auto-generated using the protobuf message proto.MessageName().Name().'
          readOnly: true
          type: string
        name:
          description: Resource name. Must be 63 characters or less.
          type: string
        parent_kind:
          description: Parent object resource kind, for example, Project.
          type: string
        parent_uuid:
          description: Parent object UUID.
          type: string
        references:
          additionalProperties:
            $ref: '#/components/schemas/googleprotobufAny'
          description: Map of objects referenced in a query API.
          readOnly: true
          type: object
        tags:
          description: 'List of tags attached to the resource.

            Tags can be used to select objects and to find collections of objects that

            satisfy certain conditions. A tag must be 255 characters or less.'
          items:
            type: string
          type: array
        update_time:
          description: 'Time the resource was last updated.

            Note: Updated on all create/patch/delete operations.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: 'Name and authentication source of the last user who updated the object,

            for example, vulnerabilityingestor@endor.ai@x509.'
          readOnly: true
          type: string
        upsert_time:
          description: 'Time the resource was last upserted.


            Note:

            create_time is only set the first time the resource is created.

            upsert_time is set every time the resource is upseted.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        version:
          description: Message version.
          readOnly: true
          type: string
      required:
      - name
      type: object
    SpecSecurityReviewLevel:
      default: SECURITY_REVIEW_LEVEL_UNSPECIFIED
      description: "SecurityReviewLevel severity level.\n\n - SECURITY_REVIEW_LEVEL_CRITICAL: Critical Security Review.\n - SECURITY_REVIEW_LEVEL_HIGH: Very important Security Review.\n - SECURITY_REVIEW_LEVEL_MEDIUM: Important Security Review.\n - SECURITY_REVIEW_LEVEL_LOW: Low priority Security Review."
      enum:
      - SECURITY_REVIEW_LEVEL_UNSPECIFIED
      - SECURITY_REVIEW_LEVEL_CRITICAL
      - SECURITY_REVIEW_LEVEL_HIGH
      - SECURITY_REVIEW_LEVEL_MEDIUM
      - SECURITY_REVIEW_LEVEL_LOW
      type: string
    SRResponseLanguageInfo:
      properties:
        finding_counts:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        language:
          description: Programming language.
          readOnly: true
          type: string
      type: object
    v1SecurityReviewQuerySpec:
      properties:
        request:
          $ref: '#/components/schemas/SpecSRRequest'
        response:
          $ref: '#/components/schemas/SpecSRResponse'
      type: object
