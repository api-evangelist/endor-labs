openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Container Context Diff Query…
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: ContainerContextDiffQueryService
paths:
  /v1/namespaces/{tenant_meta.namespace}/queries/container-context-diffs:
    post:
      description: 'Computes (does not persist) the finding delta between two scanned

        container PackageVersions.'
      operationId: ContainerContextDiffQueryService_CreateContainerContextDiffQuery
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerContextDiffQueryServiceCreateContainerContextDiffQueryBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ContainerContextDiffQuery'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreateContainerContextDiffQuery
      tags:
      - ContainerContextDiffQueryService
      x-internal: true
components:
  schemas:
    SpecResponseReachabilityRecords:
      description: Top changed findings, grouped by reachability.
      properties:
        potentially_reachable:
          $ref: '#/components/schemas/ResponseDiffFindingRecordSet'
        reachable:
          $ref: '#/components/schemas/ResponseDiffFindingRecordSet'
        unreachable:
          $ref: '#/components/schemas/ResponseDiffFindingRecordSet'
      type: object
    v1ContainerContextDiffQuerySpecResponse:
      description: 'Computed results: both sides'' identity, shared current counts, and the

        delta between them.'
      properties:
        all_changes:
          $ref: '#/components/schemas/ResponseDiffSeverityCounts'
        all_counts:
          $ref: '#/components/schemas/ResponseDiffSeverityCounts'
        all_reachability_counts:
          $ref: '#/components/schemas/ResponseDiffReachabilityCounts'
        all_target_counts:
          $ref: '#/components/schemas/ResponseDiffSeverityCounts'
        baseline:
          $ref: '#/components/schemas/v1ContainerScanRef'
        reachability_available:
          description: 'True when OS reachability analysis was enabled and succeeded on the

            target scan. When true, the *_reachability_counts fields are

            populated; when false they are left unset and only the *_counts

            severity breakdowns are returned.'
          readOnly: true
          type: boolean
        reachability_records:
          $ref: '#/components/schemas/SpecResponseReachabilityRecords'
        severity_records:
          $ref: '#/components/schemas/SpecResponseSeverityRecords'
        target:
          $ref: '#/components/schemas/v1ContainerScanRef'
        vuln_changes:
          $ref: '#/components/schemas/ResponseDiffSeverityCounts'
        vuln_counts:
          $ref: '#/components/schemas/ResponseDiffSeverityCounts'
        vuln_reachability_counts:
          $ref: '#/components/schemas/ResponseDiffReachabilityCounts'
        vuln_target_counts:
          $ref: '#/components/schemas/ResponseDiffSeverityCounts'
      type: object
    ContainerContextDiffQueryServiceCreateContainerContextDiffQueryBody:
      description: 'ContainerContextDiffQuery computes, on demand, the finding delta between two

        scanned container PackageVersions: typically a MAIN-context baseline scan

        of an image and an alternative-context (REF) scan of a newer build of the

        same image. It is a computed query in the style of

        ContainerBaseImageUpdateImpactQuery: the response is derived live from

        existing Finding and PackageVersion records and is never persisted, so it

        cannot go stale as findings are recomputed.'
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1ContainerContextDiffQuerySpec'
        tenant_meta:
          description: The query is scoped to a tenant.
          title: The query is scoped to a tenant.
          type: object
        uuid:
          description: The UUID of the query.
          readOnly: true
          type: string
      required:
      - meta
      type: object
    v1ContainerScanRef:
      description: 'Identifies one side of a ContainerContextDiffQuery: which scan it is and

        which context (MAIN/REF/CI_RUN) it was scanned into.'
      properties:
        context:
          $ref: '#/components/schemas/v1Context'
        digest:
          description: 'The image manifest digest, copied from this PackageVersion''s

            spec.container_metadata.digest.'
          readOnly: true
          type: string
        image:
          description: 'The scanned image reference, copied from this PackageVersion''s meta.name

            (e.g. "container://nginx@1.29").'
          readOnly: true
          type: string
        namespace:
          description: 'The namespace this PackageVersion was found in. May differ from the

            caller''s own namespace when resolution traversed into a child

            namespace. Suppression callers use this to enforce that both sides

            share a namespace before writing.'
          readOnly: true
          type: string
        package_version_uuid:
          description: The PackageVersion UUID for this side of the diff.
          readOnly: true
          type: string
        project_uuid:
          description: 'The project this PackageVersion belongs to. Callers that apply

            suppression on top of the diff (endorctl''s --snooze-baseline-findings)

            use this to enforce that both sides share a project before writing.'
          readOnly: true
          type: string
      type: object
    v1ContainerContextDiffQuerySpec:
      description: Spec carries the request and the computed response.
      properties:
        request:
          $ref: '#/components/schemas/v1ContainerContextDiffQuerySpecRequest'
        response:
          $ref: '#/components/schemas/v1ContainerContextDiffQuerySpecResponse'
      type: object
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    v1BaseImageFindingRecord:
      description: 'BaseImageFindingRecord is a compact projection of one changed finding in the

        base-image update impact record lists (the per-bucket fixed/introduced lists

        and the records drill-down page). Feature-local by design: it is intentionally

        NOT the shared FindingSummaryInfo, so the version-upgrade surface that consumes

        that message is left untouched.'
      properties:
        finding_categories:
          description: Finding categories (e.g. FINDING_CATEGORY_VULNERABILITY).
          items:
            $ref: '#/components/schemas/v1FindingCategory'
          readOnly: true
          type: array
        finding_tags:
          description: 'Projected reachability of the finding''s dependency in the app image.

            Populated only when Response.reachability_available is true.'
          items:
            $ref: '#/components/schemas/v1FindingTags'
          readOnly: true
          type: array
        finding_uuids:
          description: 'Every finding UUID that shares this record''s diff key (fixed/introduced/

            common are keyed by finding identity plus version-stripped dependency

            package, and more than one finding can share a key). `uuid` above is only

            the deterministic representative chosen for display; a caller acting on

            this record (e.g. suppressing it) must act on every UUID here, not just

            the representative.'
          items:
            type: string
          readOnly: true
          type: array
        level:
          $ref: '#/components/schemas/SpecFindingLevel'
        summary:
          description: 'Human-readable finding text, copied from the finding''s spec.summary

            (e.g. "<pkg> has a <type> vulnerability identified by <id>: <summary>. ...").'
          readOnly: true
          type: string
        target_dependency_package:
          description: 'Fully qualified dependency package in "ecosystem://package@version" form.

            Populated from the finding''s spec.target_dependency_package_name when set,

            otherwise from dependency_package_version_metadata.meta.name. Never the

            bare target_dependency_name.'
          readOnly: true
          type: string
        uuid:
          description: The finding UUID.
          readOnly: true
          type: string
        vulnerability_id:
          description: 'Preferred single vulnerability identifier for VULNERABILITY findings: the

            CVE ID when the advisory has one, otherwise the primary advisory ID (e.g. a

            GHSA). Empty for non-vulnerability findings. For the complete set of IDs use

            vulnerability_ids.'
          readOnly: true
          type: string
        vulnerability_ids:
          description: 'All identifiers for the advisory behind a VULNERABILITY finding: the primary

            advisory ID (vulnerability.meta.name) first, followed by every alias

            (vulnerability.spec.aliases, e.g. CVE / GHSA cross-references), de-duplicated

            and order-preserving. Empty for non-vulnerability findings.'
          items:
            type: string
          readOnly: true
          type: array
      type: object
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    v1ContainerContextDiffQuery:
      description: 'ContainerContextDiffQuery computes, on demand, the finding delta between two

        scanned container PackageVersions: typically a MAIN-context baseline scan

        of an image and an alternative-context (REF) scan of a newer build of the

        same image. It is a computed query in the style of

        ContainerBaseImageUpdateImpactQuery: the response is derived live from

        existing Finding and PackageVersion records and is never persisted, so it

        cannot go stale as findings are recomputed.'
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1ContainerContextDiffQuerySpec'
        tenant_meta:
          $ref: '#/components/schemas/v1TenantMeta'
        uuid:
          description: The UUID of the query.
          readOnly: true
          type: string
      required:
      - meta
      type: object
    v1FindingTags:
      default: FINDING_TAGS_UNSPECIFIED
      description: "Finding attributes.\n\n - FINDING_TAGS_DIRECT: Finding applies to a direct dependency.\n - FINDING_TAGS_TRANSITIVE: Finding applies to a transitive (indirect) dependency.\n - FINDING_TAGS_PROJECT_INTERNAL: Finding applies to a dependency that belongs to the same project.\n - FINDING_TAGS_NAMESPACE_INTERNAL: Finding applies to a dependency that belongs to the same namespace.\n - FINDING_TAGS_REACHABLE_DEPENDENCY: Finding applies to a reachable dependency.\n - FINDING_TAGS_UNREACHABLE_DEPENDENCY: Finding applies to an unreachable dependency.\n - FINDING_TAGS_POTENTIALLY_REACHABLE_DEPENDENCY: Finding applies to a potentially reachable dependency.\n - FINDING_TAGS_REACHABLE_FUNCTION: Finding applies to a reachable function.\n - FINDING_TAGS_UNREACHABLE_FUNCTION: Finding applies to an unreachable function.\n - FINDING_TAGS_POTENTIALLY_REACHABLE_FUNCTION: Finding applies to a potentially reachable function.\n - FINDING_TAGS_FIXABLE: Deprecated.\n - FINDING_TAGS_UNFIXABLE: Finding is unfixable.\n - FINDING_TAGS_PRODUCTION: Deprecated.\n - FINDING_TAGS_TEST: Finding applies to a dependency not in production code.\n - FINDING_TAGS_NORMAL: Finding applies to a normal, non-test, dependency.\n - FINDING_TAGS_FIX_AVAILABLE: There is a fix available for the CVE reported in this finding.\n - FINDING_TAGS_SELF: Finding applies only to the analyzed package version, there is no\ndependency involved.\n - FINDING_TAGS_POLICY: Deprecated.\n - FINDING_TAGS_CI_BLOCKER: Finding caused a CI failure.\n - FINDING_TAGS_VALID_SECRET: Finding applies to a valid secret.\n - FINDING_TAGS_INVALID_SECRET: Finding applies to an invalid secret.\n - FINDING_TAGS_PATH_EXTERNAL: Finding applies to a transitive dependency that can only be reached via\nexternal, non-OSS, project paths.\n - FINDING_TAGS_MALWARE: Finding applies to malicious package.\n - FINDING_TAGS_UNDER_REVIEW: Finding applies to suspicious package under review.\n - FINDING_TAGS_PHANTOM: Finding applies to a phantom dependency.\n - FINDING_TAGS_EXCEPTION: Finding is exempt from action policies.\n - FINDING_TAGS_CI_WARNING: Finding caused a CI warning.\n - FINDING_TAGS_NOTIFICATION: Finding triggered a notification.\n - FINDING_TAGS_EXPLOITED: This vulnerability is known to be exploited.\n - FINDING_TAGS_DISPUTED: This vulnerability has been marked as 'disputed'.\n - FINDING_TAGS_WITHDRAWN: This vulnerability has been marked as 'withdrawn'.\n - FINDING_TAGS_FALSE_POSITIVE: This finding has been analyzed to be a false positive.\n - FINDING_TAGS_TRUE_POSITIVE: This finding has been analyzed to be a true positive.\n - FINDING_TAGS_SNOOZED: Finding has been snoozed.\n - FINDING_TAGS_AI: This finding was generated using AI.\n - FINDING_TAGS_IGNORED: Finding has been ignored via the ignore file.\n - FINDING_TAGS_SEGMENT_MATCH: Finding applies to a dependency discovered via segment-matching.\n - FINDING_TAGS_REACHABLE_BY_INCLUSION: The vulnerability is assumed reachable because the package is included;\nno call path to a vulnerable function exists.\n - FINDING_TAGS_POTENTIALLY_VALID_SECRET: Finding applies to a secret that has not been validated.\n - FINDING_TAGS_INFERRED: Finding applies to this package as it was forked from an upstream package\nthat is vulnerable to this CVE."
      enum:
      - FINDING_TAGS_UNSPECIFIED
      - FINDING_TAGS_DIRECT
      - FINDING_TAGS_TRANSITIVE
      - FINDING_TAGS_PROJECT_INTERNAL
      - FINDING_TAGS_NAMESPACE_INTERNAL
      - FINDING_TAGS_REACHABLE_DEPENDENCY
      - FINDING_TAGS_UNREACHABLE_DEPENDENCY
      - FINDING_TAGS_POTENTIALLY_REACHABLE_DEPENDENCY
      - FINDING_TAGS_REACHABLE_FUNCTION
      - FINDING_TAGS_UNREACHABLE_FUNCTION
      - FINDING_TAGS_POTENTIALLY_REACHABLE_FUNCTION
      - FINDING_TAGS_FIXABLE
      - FINDING_TAGS_UNFIXABLE
      - FINDING_TAGS_PRODUCTION
      - FINDING_TAGS_TEST
      - FINDING_TAGS_NORMAL
      - FINDING_TAGS_FIX_AVAILABLE
      - FINDING_TAGS_SELF
      - FINDING_TAGS_POLICY
      - FINDING_TAGS_CI_BLOCKER
      - FINDING_TAGS_VALID_SECRET
      - FINDING_TAGS_INVALID_SECRET
      - FINDING_TAGS_PATH_EXTERNAL
      - FINDING_TAGS_MALWARE
      - FINDING_TAGS_UNDER_REVIEW
      - FINDING_TAGS_PHANTOM
      - FINDING_TAGS_EXCEPTION
      - FINDING_TAGS_CI_WARNING
      - FINDING_TAGS_NOTIFICATION
      - FINDING_TAGS_EXPLOITED
      - FINDING_TAGS_DISPUTED
      - FINDING_TAGS_WITHDRAWN
      - FINDING_TAGS_FALSE_POSITIVE
      - FINDING_TAGS_TRUE_POSITIVE
      - FINDING_TAGS_SNOOZED
      - FINDING_TAGS_AI
      - FINDING_TAGS_IGNORED
      - FINDING_TAGS_SEGMENT_MATCH
      - FINDING_TAGS_REACHABLE_BY_INCLUSION
      - FINDING_TAGS_POTENTIALLY_VALID_SECRET
      - FINDING_TAGS_INFERRED
      type: string
    v1Context:
      description: Contexts keep objects from different scans separated.
      properties:
        id:
          description: The context ID, such as a pull request ID or branch reference.
          type: string
        tags:
          description: 'A list of tags applied to a context. Used primarily for CI and SBOM

            contexts.'
          items:
            type: string
          type: array
        type:
          $ref: '#/components/schemas/ContextContextType'
        will_be_deleted_at:
          description: 'Time that all objects in this context will be deleted.

            This field is deprecated and will be removed in the future.

            Please use the meta.will_be_deleted_at field instead.'
          format: date-time
          readOnly: true
          type: string
      required:
      - type
      - id
      type: object
    v1TenantMeta:
      description: Tenant related data for the tenant containing the resource.
      properties:
        namespace:
          description: 'Namespaces are a way to organize organizational units into virtual

            groupings of resources. Namespaces must be a fully qualified name,

            for example, the child namespace of namespace "endor.prod" called "app"

            is called "endor.prod.app".'
          type: string
      required:
      - namespace
      type: object
    ResponseDiffFindingRecordSet:
      description: 'One bucket''s top changed findings (of the requested record_scope),

        with fixed, introduced, and common kept as separate lists plus their

        full totals.'
      properties:
        common:
          description: 'Top findings present on both sides, unaffected by the diff. Taken

            from the target side, since those are the finding UUIDs the caller

            can act on (e.g. suppress). Capped at max_top_records_per_bucket.'
          items:
            $ref: '#/components/schemas/v1BaseImageFindingRecord'
          readOnly: true
          type: array
        common_num_results:
          description: 'Total number of common findings in this bucket (may exceed

            len(common) when capped).'
          format: int32
          readOnly: true
          type: integer
        fixed:
          description: 'Top findings fixed relative to baseline (present on the baseline,

            gone on the target), capped at max_top_records_per_bucket.'
          items:
            $ref: '#/components/schemas/v1BaseImageFindingRecord'
          readOnly: true
          type: array
        fixed_num_results:
          description: 'Total number of fixed findings in this bucket (may exceed

            len(fixed) when capped).'
          format: int32
          readOnly: true
          type: integer
        introduced:
          description: 'Top findings introduced relative to baseline (absent on the

            baseline, present on the target), capped at

            max_top_records_per_bucket.'
          items:
            $ref: '#/components/schemas/v1BaseImageFindingRecord'
          readOnly: true
          type: array
        introduced_num_results:
          description: 'Total number of introduced findings in this bucket (may exceed

            len(introduced) when capped).'
          format: int32
          readOnly: true
          type: integer
      type: object
    ResponseDiffSeverityCounts:
      description: 'Aggregate finding counts broken out by severity. A feature-local twin

        of ContainerBaseImageUpdateImpactQuery.Spec.Response.SeverityCounts:

        that message is nested under a sibling query''s Response and

        referencing it here would read wrong; promoting it to top level would

        require renaming the existing message, which is breaking.'
      properties:
        critical:
          description: Number of critical severity findings.
          format: int32
          readOnly: true
          type: integer
        high:
          description: Number of high severity findings.
          format: int32
          readOnly: true
          type: integer
        low:
          description: Number of low severity findings.
          format: int32
          readOnly: true
          type: integer
        medium:
          description: Number of medium severity findings.
          format: int32
          readOnly: true
          type: integer
        total:
          description: Total number of findings across all severities.
          format: int32
          readOnly: true
          type: integer
      type: object
    SpecFindingLevel:
      default: FINDING_LEVEL_UNSPECIFIED
      description: "Finding severity level.\n\n - FINDING_LEVEL_CRITICAL: Critical finding.\n - FINDING_LEVEL_HIGH: Very important findings.\n - FINDING_LEVEL_MEDIUM: Important findings.\n - FINDING_LEVEL_LOW: Low priority finding."
      enum:
      - FINDING_LEVEL_UNSPECIFIED
      - FINDING_LEVEL_CRITICAL
      - FINDING_LEVEL_HIGH
      - FINDING_LEVEL_MEDIUM
      - FINDING_LEVEL_LOW
      type: string
    googleprotobufAny:
      additionalProperties: {}
      description: "`Any` contains an arbitrary serialized protocol buffer message along with a\nURL that describes the type of the serialized message.\n\nProtobuf library provides support to pack/unpack Any values in the form\nof utility functions or additional generated methods of the Any type.\n\nExample 1: Pack and unpack a message in C++.\n\n    Foo foo = ...;\n    Any any;\n    any.PackFrom(foo);\n    ...\n    if (any.UnpackTo(&foo)) {\n      ...\n    }\n\nExample 2: Pack and unpack a message in Java.\n\n    Foo foo = ...;\n    Any any = Any.pack(foo);\n    ...\n    if (any.is(Foo.class)) {\n      foo = any.unpack(Foo.class);\n    }\n    // or ...\n    if (any.isSameTypeAs(Foo.getDefaultInstance())) {\n      foo = any.unpack(Foo.getDefaultInstance());\n    }\n\n Example 3: Pack and unpack a message in Python.\n\n    foo = Foo(...)\n    any = Any()\n    any.Pack(foo)\n    ...\n    if any.Is(Foo.DESCRIPTOR):\n      any.Unpack(foo)\n      ...\n\n Example 4: Pack and unpack a message in Go\n\n     foo := &pb.Foo{...}\n     any, err := anypb.New(foo)\n     if err != nil {\n       ...\n     }\n     ...\n     foo := &pb.Foo{}\n     if err := any.UnmarshalTo(foo); err != nil {\n       ...\n     }\n\nThe pack methods provided by protobuf library will by default use\n'type.googleapis.com/full.type.name' as the type URL and the unpack\nmethods only use the fully qualified type name after the last '/'\nin the type URL, for example \"foo.bar.com/x/y.z\" will yield type\nname \"y.z\".\n\nJSON\n====\nThe JSON representation of an `Any` value uses the regular\nrepresentation of the deserialized, embedded message, with an\nadditional field `@type` which contains the type URL. Example:\n\n    package google.profile;\n    message Person {\n      string first_name = 1;\n      string last_name = 2;\n    }\n\n    {\n      \"@type\": \"type.googleapis.com/google.profile.Person\",\n      \"firstName\": <string>,\n      \"lastName\": <string>\n    }\n\nIf the embedded message type is well-known and has a custom JSON\nrepresentation, that representation will be embedded adding a field\n`value` which holds the custom JSON in addition to the `@type`\nfield. Example (for message [google.protobuf.Duration][]):\n\n    {\n      \"@type\": \"type.googleapis.com/google.protobuf.Duration\",\n      \"value\": \"1.212s\"\n    }"
      properties:
        '@type':
          description: "A URL/resource name that uniquely identifies the type of the serialized\nprotocol buffer message. This string must contain at least\none \"/\" character. The last segment of the URL's path must represent\nthe fully qualified name of the type (as in\n`path/google.protobuf.Duration`). The name should be in a canonical form\n(e.g., leading \".\" is not accepted).\n\nIn practice, teams usually precompile into the binary all types that they\nexpect it to use in the context of Any. However, for URLs which use the\nscheme `http`, `https`, or no scheme, one can optionally set up a type\nserver that maps type URLs to message definitions as follows:\n\n* If no scheme is provided, `https` is assumed.\n* An HTTP GET on the URL must yield a [google.protobuf.Type][]\n  value in binary format, or produce an error.\n* Applications are allowed to cache lookup results based on the\n  URL, or have them precompiled into a binary to avoid any\n  lookup. Therefore, binary compatibility needs to be preserved\n  on changes to types. (Use versioned type names to manage\n  breaking changes.)\n\nNote: this functionality is not currently available in the official\nprotobuf release, and it is not used for type URLs beginning with\ntype.googleapis.com. As of May 2023, there are no widely used type server\nimplementations and no plans to implement one.\n\nSchemes other than `http`, `https` (or the empty scheme) might be\nused with implementation specific semantics."
          type: string
      type: object
    ResponseDiffReachabilityCounts:
      description: 'Finding counts bucketed by reachability. Each bucket is a severity

        breakdown. Reachability is projected from the target scan. The

        overall total lives on the sibling DiffSeverityCounts field, so there is

        no total bucket here.'
      properties:
        potentially_reachable:
          $ref: '#/components/schemas/ResponseDiffSeverityCounts'
        reachable:
          $ref: '#/components/schemas/ResponseDiffSeverityCounts'
        unreachable:
          $ref: '#/components/schemas/ResponseDiffSeverityCounts'
      type: object
    v1FindingRecordScope:
      default: FINDING_RECORD_SCOPE_UNSPECIFIED
      description: "Which finding types populate the record-level fixed/introduced lists. Shared\nby the impact query, the records drill-down query, and the container context\ndiff queries. The severity/reachability COUNT fields are always computed both\nways (all_counts and vuln_counts); this selects only which findings appear in\nthe record lists and, correspondingly, which totals those record views\nreconcile against.\n\n - FINDING_RECORD_SCOPE_UNSPECIFIED: Unset; treated as FINDING_RECORD_SCOPE_ALL.\n - FINDING_RECORD_SCOPE_ALL: All finding types. Record views reconcile with all_counts / all_changes.\n - FINDING_RECORD_SCOPE_VULNERABILITY: Vulnerability findings only. Record views reconcile with vuln_counts /\nvuln_changes."
      enum:
      - FINDING_RECORD_SCOPE_UNSPECIFIED
      - FINDING_RECORD_SCOPE_ALL
      - FINDING_RECORD_SCOPE_VULNERABILITY
      type: string
    v1Meta:
      description: Common fields for all Endor Labs resources.
      properties:
        annotations:
          additionalProperties:
            type: string
          description: 'Annotations can be used to attach metadata to a resource message.

            Annotation values can be small or large, structured or unstructured,

            and may include characters not permitted by labels.

            The keys may contain alphanumerics, underscores (_), dots (.) and dashes

            (-). The values of an annotation must be 16384 bytes or smaller.'
          type: object
        create_time:
          description: 'Time the resource was created.


