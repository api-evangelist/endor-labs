openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Async Job Service API
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: AsyncJobService
paths:
  /v1/namespaces/{tenant_meta.namespace}/async-jobs:
    post:
      description: 'Initiates asynchronous execution of a job. Returns immediately with the job

        UUID and state=JOB_STATE_NEW; poll GetAsyncJob to track progress.'
      operationId: AsyncJobService_CreateAsyncJob
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsyncJobServiceCreateAsyncJobBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1AsyncJob'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreateAsyncJob
      tags:
      - AsyncJobService
  /v1/namespaces/{tenant_meta.namespace}/async-jobs/{uuid}:
    get:
      description: 'Fetches an async job by UUID. When state = JOB_STATE_SUCCESS, spec.response

        carries the type-specific arm (sbom or vex) with a freshly signed download

        URL (5-minute TTL) and the stable object-store file_path.'
      operationId: AsyncJobService_GetAsyncJob
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the requested resource.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: get_parameters.mask
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1AsyncJob'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: GetAsyncJob
      tags:
      - AsyncJobService
components:
  schemas:
    SpecJobState:
      default: JOB_STATE_UNSPECIFIED
      description: " - JOB_STATE_NEW: The job was just created but never executed.\n - JOB_STATE_RUNNING: The job is running.\n - JOB_STATE_SUCCESS: The job has been successfully executed.\n - JOB_STATE_FAILED: The job has failed and will not be retried.\n - JOB_STATE_CANCELLED: The job has been cancelled/aborted by the service and will be retried.\n - JOB_STATE_RETRY: The job has failed but will be retried up to the max_retries limit."
      enum:
      - JOB_STATE_UNSPECIFIED
      - JOB_STATE_NEW
      - JOB_STATE_RUNNING
      - JOB_STATE_SUCCESS
      - JOB_STATE_FAILED
      - JOB_STATE_CANCELLED
      - JOB_STATE_RETRY
      type: string
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    v1CycloneDxSpecVersion:
      default: CYCLONE_DX_SPEC_VERSION_UNSPECIFIED
      description: "CycloneDx specification versions Endor emits. Values are added as Endor adds\nsupport, so this list is the supported set.\n\n - CYCLONE_DX_SPEC_VERSION_UNSPECIFIED: Unset. The export uses CycloneDx 1.5.\n - CYCLONE_DX_SPEC_VERSION_1_5: CycloneDx 1.5. The default when no version is requested.\n - CYCLONE_DX_SPEC_VERSION_1_6: CycloneDx 1.6.\n - CYCLONE_DX_SPEC_VERSION_1_7: CycloneDx 1.7."
      enum:
      - CYCLONE_DX_SPEC_VERSION_UNSPECIFIED
      - CYCLONE_DX_SPEC_VERSION_1_5
      - CYCLONE_DX_SPEC_VERSION_1_6
      - CYCLONE_DX_SPEC_VERSION_1_7
      type: string
    v1VEXExportJobRequest:
      description: Request holds the input parameters for running a VEX export job.
      properties:
        component_type:
          $ref: '#/components/schemas/v1ExportedVEXComponentType'
        cyclonedx_spec_version:
          $ref: '#/components/schemas/v1CycloneDxSpecVersion'
        export_parameters:
          $ref: '#/components/schemas/v1ExportParameters'
        format:
          $ref: '#/components/schemas/v1ExportedVEXFormat'
        include_test_dependencies:
          description: 'Whether to include findings against test/dev/build/optional dependencies.

            When false (default), findings whose target dependency is non-production —

            or only reachable from the root through non-production paths — are excluded.'
          type: boolean
        kind:
          $ref: '#/components/schemas/v1SBOMKind'
        package_version_uuid:
          description: 'UUID of a single PackageVersion to export. When set, the handler generates

            a VEX containing just this package version''s findings. Mutually exclusive

            with export_parameters.'
          type: string
      required:
      - component_type
      type: object
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    v1AsyncJobSpecRequest:
      description: Wrapper holding the type-specific request arm.
      properties:
        sbom:
          $ref: '#/components/schemas/v1SBOMExportJobRequest'
        vex:
          $ref: '#/components/schemas/v1VEXExportJobRequest'
      type: object
    v1AsyncJobType:
      default: TYPE_UNSPECIFIED
      description: "The kind of async job being run.\n\n - TYPE_UNSPECIFIED: Unset.\n - TYPE_SBOM: Software Bill of Materials.\n - TYPE_VEX: Vulnerability Exploitability eXchange."
      enum:
      - TYPE_UNSPECIFIED
      - TYPE_SBOM
      - TYPE_VEX
      type: string
    AsyncJobServiceCreateAsyncJobBody:
      description: 'AsyncJob is an asynchronous job — SBOM export or VEX export

        types today, with more types added as they ship.'
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1AsyncJobSpec'
        tenant_meta:
          description: Tenant the async job belongs to.
          title: Tenant the async job belongs to.
          type: object
        uuid:
          description: 'UUID of the AsyncJob. Assigned by the server on Create; use it to

            fetch the job via GetAsyncJob.'
          readOnly: true
          type: string
      required:
      - meta
      - spec
      type: object
    v1AsyncJob:
      description: 'AsyncJob is an asynchronous job — SBOM export or VEX export

        types today, with more types added as they ship.'
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1AsyncJobSpec'
        tenant_meta:
          $ref: '#/components/schemas/v1TenantMeta'
        uuid:
          description: 'UUID of the AsyncJob. Assigned by the server on Create; use it to

            fetch the job via GetAsyncJob.'
          readOnly: true
          type: string
      required:
      - meta
      - spec
      type: object
    v1ExportParameters:
      description: Parameters to export a SBOM/VEX.
      properties:
        package_version_uuids:
          description: List of package version UUIDs.
          items:
            type: object
          type: array
        project_name:
          description: Name of the project.
          type: string
        project_uuid:
          description: The UUID of the project.
          type: string
        repository_version:
          description: 'Repository version is used to select the package versions for the export.

            This is an optional field, If not set then the default repository version

            will be used.'
          type: string
      type: object
    v1VEXExportJobResponse:
      description: Response holds the output after the VEX export job completes.
      properties:
        file_path:
          description: 'The file path of the generated VEX document in object storage.

            Stored on the Job by the handler; the apiserver Job RPC layer reads this

            on every GetJob and produces a fresh signed download URL.'
          type: string
        report_url:
          description: 'The signed download URL for the generated VEX document. Populated by the

            apiserver Job RPC layer on each GetJob call (5-minute TTL).'
          type: string
        resource_namespace:
          description: 'Namespace jobctl read the referenced resources from — the caller''s

            tenant, or "oss" if the fallback fired.'
          type: string
        vex_size_bytes:
          description: 'Byte length of the generated VEX artifact in object storage. Useful for

            clients deciding whether to show a download progress indicator and for

            operational reporting on export sizes.'
          format: uint64
          type: string
      type: object
    v1SBOMExportJobRequest:
      description: Request holds the input parameters for running an SBOM export job.
      properties:
        component_type:
          $ref: '#/components/schemas/v1ExportedSBOMComponentType'
        cyclonedx_spec_version:
          $ref: '#/components/schemas/v1CycloneDxSpecVersion'
        export_parameters:
          $ref: '#/components/schemas/v1ExportParameters'
        format:
          $ref: '#/components/schemas/v1ExportedSBOMFormat'
        hide_private_components:
          description: Whether to hide private (internal) packages in the SBOM output.
          type: boolean
        include_test_dependencies:
          description: 'Whether to include test/dev/build/optional dependencies. When false

            (default), non-production dependencies are excluded along with any

            transitive dependencies reachable only through them.'
          type: boolean
        include_vulnerabilities:
          description: 'When true, embed the scope''s vulnerabilities as a top-level

            vulnerabilities[] array in the SBOM, producing one unified document.

            CycloneDx only.'
          type: boolean
        kind:
          $ref: '#/components/schemas/v1SBOMKind'
        package_version_uuid:
          description: 'UUID of a single PackageVersion to export. When set, the handler

            generates an SBOM containing just this package version. Mutually

            exclusive with export_parameters.'
          type: string
        spdx_spec_version:
          $ref: '#/components/schemas/v1SPDXSpecVersion'
      required:
      - component_type
      type: object
    v1TenantMeta:
      description: Tenant related data for the tenant containing the resource.
      properties:
        namespace:
          description: 'Namespaces are a way to organize organizational units into virtual

            groupings of resources. Namespaces must be a fully qualified name,

            for example, the child namespace of namespace "endor.prod" called "app"

            is called "endor.prod.app".'
          type: string
      required:
      - namespace
      type: object
    v1AsyncJobSpec:
      description: AsyncJob inputs and outputs.
      properties:
        request:
          $ref: '#/components/schemas/v1AsyncJobSpecRequest'
        response:
          $ref: '#/components/schemas/v1AsyncJobSpecResponse'
        state:
          $ref: '#/components/schemas/SpecJobState'
        type:
          $ref: '#/components/schemas/v1AsyncJobType'
      required:
      - type
      - request
      type: object
    v1ExportedSBOMFormat:
      default: FORMAT_UNSPECIFIED
      description: "Specifies the output of SBOM. (For example, JSON and XML).\n\n - FORMAT_JSON: SBOM of JSON format output.\n - FORMAT_XML: SBOM of XML format output.\n - FORMAT_TAG_VALUE: SBOM of Tag Value format output."
      enum:
      - FORMAT_UNSPECIFIED
      - FORMAT_JSON
      - FORMAT_XML
      - FORMAT_TAG_VALUE
      type: string
    v1SBOMKind:
      default: SBOM_KIND_UNSPECIFIED
      description: SBOM type.
      enum:
      - SBOM_KIND_UNSPECIFIED
      - SBOM_KIND_CYCLONEDX
      - SBOM_KIND_SPDX
      type: string
    googleprotobufAny:
      additionalProperties: {}
      description: "`Any` contains an arbitrary serialized protocol buffer message along with a\nURL that describes the type of the serialized message.\n\nProtobuf library provides support to pack/unpack Any values in the form\nof utility functions or additional generated methods of the Any type.\n\nExample 1: Pack and unpack a message in C++.\n\n    Foo foo = ...;\n    Any any;\n    any.PackFrom(foo);\n    ...\n    if (any.UnpackTo(&foo)) {\n      ...\n    }\n\nExample 2: Pack and unpack a message in Java.\n\n    Foo foo = ...;\n    Any any = Any.pack(foo);\n    ...\n    if (any.is(Foo.class)) {\n      foo = any.unpack(Foo.class);\n    }\n    // or ...\n    if (any.isSameTypeAs(Foo.getDefaultInstance())) {\n      foo = any.unpack(Foo.getDefaultInstance());\n    }\n\n Example 3: Pack and unpack a message in Python.\n\n    foo = Foo(...)\n    any = Any()\n    any.Pack(foo)\n    ...\n    if any.Is(Foo.DESCRIPTOR):\n      any.Unpack(foo)\n      ...\n\n Example 4: Pack and unpack a message in Go\n\n     foo := &pb.Foo{...}\n     any, err := anypb.New(foo)\n     if err != nil {\n       ...\n     }\n     ...\n     foo := &pb.Foo{}\n     if err := any.UnmarshalTo(foo); err != nil {\n       ...\n     }\n\nThe pack methods provided by protobuf library will by default use\n'type.googleapis.com/full.type.name' as the type URL and the unpack\nmethods only use the fully qualified type name after the last '/'\nin the type URL, for example \"foo.bar.com/x/y.z\" will yield type\nname \"y.z\".\n\nJSON\n====\nThe JSON representation of an `Any` value uses the regular\nrepresentation of the deserialized, embedded message, with an\nadditional field `@type` which contains the type URL. Example:\n\n    package google.profile;\n    message Person {\n      string first_name = 1;\n      string last_name = 2;\n    }\n\n    {\n      \"@type\": \"type.googleapis.com/google.profile.Person\",\n      \"firstName\": <string>,\n      \"lastName\": <string>\n    }\n\nIf the embedded message type is well-known and has a custom JSON\nrepresentation, that representation will be embedded adding a field\n`value` which holds the custom JSON in addition to the `@type`\nfield. Example (for message [google.protobuf.Duration][]):\n\n    {\n      \"@type\": \"type.googleapis.com/google.protobuf.Duration\",\n      \"value\": \"1.212s\"\n    }"
      properties:
        '@type':
          description: "A URL/resource name that uniquely identifies the type of the serialized\nprotocol buffer message. This string must contain at least\none \"/\" character. The last segment of the URL's path must represent\nthe fully qualified name of the type (as in\n`path/google.protobuf.Duration`). The name should be in a canonical form\n(e.g., leading \".\" is not accepted).\n\nIn practice, teams usually precompile into the binary all types that they\nexpect it to use in the context of Any. However, for URLs which use the\nscheme `http`, `https`, or no scheme, one can optionally set up a type\nserver that maps type URLs to message definitions as follows:\n\n* If no scheme is provided, `https` is assumed.\n* An HTTP GET on the URL must yield a [google.protobuf.Type][]\n  value in binary format, or produce an error.\n* Applications are allowed to cache lookup results based on the\n  URL, or have them precompiled into a binary to avoid any\n  lookup. Therefore, binary compatibility needs to be preserved\n  on changes to types. (Use versioned type names to manage\n  breaking changes.)\n\nNote: this functionality is not currently available in the official\nprotobuf release, and it is not used for type URLs beginning with\ntype.googleapis.com. As of May 2023, there are no widely used type server\nimplementations and no plans to implement one.\n\nSchemes other than `http`, `https` (or the empty scheme) might be\nused with implementation specific semantics."
          type: string
      type: object
    v1AsyncJobSpecResponse:
      description: Wrapper holding the type-specific response arm and any error message.
      properties:
        error_message:
          description: Reason for failure. Populated when state = Job.Spec.JobState.JOB_STATE_FAILED.
          readOnly: true
          type: string
        sbom:
          $ref: '#/components/schemas/v1SBOMExportJobResponse'
        vex:
          $ref: '#/components/schemas/v1VEXExportJobResponse'
      type: object
    v1Meta:
      description: Common fields for all Endor Labs resources.
      properties:
        annotations:
          additionalProperties:
            type: string
          description: 'Annotations can be used to attach metadata to a resource message.

            Annotation values can be small or large, structured or unstructured,

            and may include characters not permitted by labels.

            The keys may contain alphanumerics, underscores (_), dots (.) and dashes

            (-). The values of an annotation must be 16384 bytes or smaller.'
          type: object
        create_time:
          description: 'Time the resource was created.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: 'Name and authentication source of the user who created the object,

            for example, ewok@endor.ai@google@api-key.'
          readOnly: true
          type: string
        description:
          description: Resource description. Must be less than 1024 bytes.
          type: string
        index_data:
          $ref: '#/components/schemas/v1IndexData'
        kind:
          description: 'Resource kind, for example, HelloResponse.

            Auto-generated using the protobuf message proto.MessageName().Name().'
          readOnly: true
          type: string
        name:
          description: Resource name. Must be 63 characters or less.
          type: string
        parent_kind:
          description: Parent object resource kind, for example, Project.
          type: string
        parent_uuid:
          description: Parent object UUID.
          type: string
        references:
          additionalProperties:
            $ref: '#/components/schemas/googleprotobufAny'
          description: Map of objects referenced in a query API.
          readOnly: true
          type: object
        tags:
          description: 'List of tags attached to the resource.

            Tags can be used to select objects and to find collections of objects that

            satisfy certain conditions. A tag must be 255 characters or less.'
          items:
            type: string
          type: array
        update_time:
          description: 'Time the resource was last updated.

            Note: Updated on all create/patch/delete operations.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: 'Name and authentication source of the last user who updated the object,

            for example, vulnerabilityingestor@endor.ai@x509.'
          readOnly: true
          type: string
        upsert_time:
          description: 'Time the resource was last upserted.


            Note:

            create_time is only set the first time the resource is created.

            upsert_time is set every time the resource is upseted.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        version:
          description: Message version.
          readOnly: true
          type: string
      required:
      - name
      type: object
    v1ExportedSBOMComponentType:
      default: COMPONENT_TYPE_UNSPECIFIED
      description: 'The kind of component for which we are creating an SBOM.

        This is a mandatory field.'
      enum:
      - COMPONENT_TYPE_UNSPECIFIED
      - COMPONENT_TYPE_LIBRARY
      - COMPONENT_TYPE_APPLICATION
      type: string
    v1ExportedVEXFormat:
      default: FORMAT_UNSPECIFIED
      description: "The output of VEX. (For example, JSON and XML).\n\n - FORMAT_JSON: SBOM of the JSON format output.\n - FORMAT_XML: SBOM of the XML format output."
      enum:
      - FORMAT_UNSPECIFIED
      - FORMAT_JSON
      - FORMAT_XML
      type: string
    v1SPDXSpecVersion:
      default: SPDX_SPEC_VERSION_UNSPECIFIED
      description: "SPDX specification versions Endor emits. Values are added as Endor adds\nsupport, so this list is the supported set.\n\n - SPDX_SPEC_VERSION_UNSPECIFIED: Unset. The export uses the current SPDX default.\n - SPDX_SPEC_VERSION_2_3: SPDX 2.3."
      enum:
      - SPDX_SPEC_VERSION_UNSPECIFIED
      - SPDX_SPEC_VERSION_2_3
      type: string
    v1SBOMExportJobResponse:
      description: Response holds the output after the SBOM export job completes.
      properties:
        file_path:
          description: 'The file path of the generated SBOM in object storage.

            Stored on the Job by the handler; the apiserver Job RPC layer reads

            this on every GetJob and produces a fresh signed download URL.'
          type: string
        report_url:
          description: 'The signed download URL for the generated SBOM. Populated by the

            apiserver Job RPC layer on each GetJob call (5-minute TTL).'
          type: string
        resource_namespace:
          description: 'Namespace jobctl read the referenced resources from — the caller''s

            tenant, or "oss" if the fallback fired.'
          type: string
        sbom_size_bytes:
          description: 'Byte length of the generated SBOM artifact in object storage. Useful

            for clients deciding whether to display a download progress indicator

            and for operational reporting on export sizes.'
          format: uint64
          type: string
      type: object
    v1ExportedVEXComponentType:
      default: COMPONENT_TYPE_UNSPECIFIED
      description: 'The kind of component for which we are creating an SBOM.

        This is a mandatory field.'
      enum:
      - COMPONENT_TYPE_UNSPECIFIED
      - COMPONENT_TYPE_LIBRARY
      - COMPONENT_TYPE_APPLICATION
      type: string
