openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Scan Workflow Result Service…
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: ScanWorkflowResultService
paths:
  /v1/namespaces/{object.tenant_meta.namespace}/scan-workflow-results:
    patch:
      description: Updates the specified scan workflow result with the information in the request body.
      operationId: ScanWorkflowResultService_UpdateScanWorkflowResult
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: object.tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanWorkflowResultServiceUpdateScanWorkflowResultBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ScanWorkflowResult'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: UpdateScanWorkflowResult
      tags:
      - ScanWorkflowResultService
  /v1/namespaces/{tenant_meta.namespace}/scan-workflow-results:
    get:
      description: Lists all scan workflow results in a given namespace.
      operationId: ScanWorkflowResultService_ListScanWorkflowResults
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: 'String of conditions to filter resources by.

          Filters may include any attribute along with the following operators:

          "==", "!=", ">", ">=", "<", "<=", "Contains", "In", "Matches", and

          "Exists". The logical operators "And" and "Or" are also supported.

          Expressions may be combined and grouped with parentheses.


          Examples:

          "spec.value == 5",

          "spec.value in ["a", "b", "c"]",

          "(meta.name == "xyz" and "spec.value in ["a","b"]) or (spec.value ==

          "c")".'
        in: query
        name: list_parameters.filter
        schema:
          type: string
      - description: 'Set the page token to start from.

          Use page tokens to page through list results or list specific pages.'
        in: query
        name: list_parameters.page_token
        schema:
          format: int32
          type: integer
      - description: 'Set the page size to limit the number of results returned.

          Default: 100. Max: 500.'
        in: query
        name: list_parameters.page_size
        schema:
          format: int32
          type: integer
      - description: Action to be executed with a request. Not supported for all endpoints.
        in: query
        name: list_parameters.action
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: list_parameters.mask
        schema:
          type: string
      - description: Get data from any child namespaces as well.
        in: query
        name: list_parameters.traverse
        schema:
          type: boolean
      - description: Field to sort objects by, for example, meta.name.
        in: query
        name: list_parameters.sort.path
        schema:
          type: string
      - description: 'Sort order. Default: ASC.'
        in: query
        name: list_parameters.sort.order
        schema:
          default: SORT_ENTRY_ORDER_UNSPECIFIED
          enum:
          - SORT_ENTRY_ORDER_UNSPECIFIED
          - SORT_ENTRY_ORDER_ASC
          - SORT_ENTRY_ORDER_DESC
          type: string
      - description: 'Return the number of objects matching the given list parameters.

          If count is set to true, the response is a CountResponse.

          Can be used together with filter and traverse.'
        in: query
        name: list_parameters.count
        schema:
          type: boolean
      - description: 'Group the objects based on this field.

          If there are multiple fields then the objects are grouped

          based on the uniqueness of all fields.

          Supports composite paths.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.aggregation_paths
        schema:
          type: string
      - description: 'Return the UUID of each object in each group as specified by

          aggregation_paths.'
        in: query
        name: list_parameters.group.show_aggregation_uuids
        schema:
          type: boolean
      - description: 'List of fields for which we want the unique count.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_count_paths
        schema:
          type: string
      - description: 'List of fields for which we want the unique values.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_value_paths
        schema:
          type: string
      - description: Only return objects from PR scans that match this context id.
        in: query
        name: list_parameters.ci_run_uuid
        schema:
          type: string
      - description: Page ID to retrieve.
        in: query
        name: list_parameters.page_id
        schema:
          type: string
      - description: 'Group the objects based on this time field,

          for example, meta.create_time.'
        in: query
        name: list_parameters.group_by_time.aggregation_paths
        schema:
          type: string
      - description: Return the UUIDs of the objects in each group.
        in: query
        name: list_parameters.group_by_time.show_aggregation_uuids
        schema:
          type: boolean
      - description: Interval unit by which the objects should be grouped.
        in: query
        name: list_parameters.group_by_time.interval
        schema:
          default: GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          enum:
          - GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          - GROUP_BY_TIME_INTERVAL_YEAR
          - GROUP_BY_TIME_INTERVAL_QUARTER
          - GROUP_BY_TIME_INTERVAL_MONTH
          - GROUP_BY_TIME_INTERVAL_WEEK
          - GROUP_BY_TIME_INTERVAL_DAY
          - GROUP_BY_TIME_INTERVAL_HOUR
          - GROUP_BY_TIME_INTERVAL_MINUTE
          - GROUP_BY_TIME_INTERVAL_SECOND
          type: string
      - description: 'Size of the time interval to group the objects by,

          for example, to group objects by 2-week intervals, set interval

          to GROUP_BY_TIME_INTERVAL_WEEK and group_size to 2.'
        in: query
        name: list_parameters.group_by_time.group_size
        schema:
          format: int32
          type: integer
      - description: 'Beginning of the time period to group objects.

          Defaults to the beginning of time.'
        in: query
        name: list_parameters.group_by_time.start_time
        schema:
          format: date-time
          type: string
      - description: 'End of the time period to group objects.

          Defaults to the current time.'
        in: query
        name: list_parameters.group_by_time.end_time
        schema:
          format: date-time
          type: string
      - description: 'The mode determines how the matching objects are counted

          in the produced time-series. Values allowed are:

          count (default) : is the number of items matching in every interval.

          sum: is the total number of items matching since the beginning of the

          aggregation time.'
        in: query
        name: list_parameters.group_by_time.mode
        schema:
          type: string
      - description: 'The aggregation_field is a field on the matched objects that we want to

          perform some operation in each interval (example : min, max, avg)'
        in: query
        name: list_parameters.group_by_time.aggregation_value_field
        schema:
          type: string
      - description: 'The aggreation_operator is the operator that we should use for the

          aggregation. Allowed values are: min, max, sum, avg'
        in: query
        name: list_parameters.group_by_time.aggregation_operator
        schema:
          type: string
      - description: 'If true, the results will not be paginated and

          only the first page will be returned. The order

          of the results is not guaranteed.'
        in: query
        name: list_parameters.disable_pagination
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListScanWorkflowResultsResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: ListScanWorkflowResults
      tags:
      - ScanWorkflowResultService
    post:
      description: Creates a scan workflow result in a given namespace.
      operationId: ScanWorkflowResultService_CreateScanWorkflowResult
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanWorkflowResultServiceCreateScanWorkflowResultBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ScanWorkflowResult'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreateScanWorkflowResult
      tags:
      - ScanWorkflowResultService
  /v1/namespaces/{tenant_meta.namespace}/scan-workflow-results/{uuid}:
    delete:
      description: Deletes a scan workflow result specified by its UUID.
      operationId: ScanWorkflowResultService_DeleteScanWorkflowResult
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the resource to be deleted.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: Action to be executed with delete request.
        in: query
        name: delete_parameters.action
        schema:
          type: string
      - description: 'Force will force the deletion of the resource if any

          checks fail.'
        in: query
        name: delete_parameters.force
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: DeleteScanWorkflowResult
      tags:
      - ScanWorkflowResultService
    get:
      description: Fetches comprehensive information about a scan workflow result identified by a given UUID.
      operationId: ScanWorkflowResultService_GetScanWorkflowResult
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the requested resource.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: get_parameters.mask
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ScanWorkflowResult'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: GetScanWorkflowResult
      tags:
      - ScanWorkflowResultService
components:
  schemas:
    v1ScanWorkflowResultSpec:
      properties:
        end_time:
          description: Time the scan ended.
          format: date-time
          type: string
        execution_id:
          description: The execution ID for all scans.
          type: string
        start_time:
          description: Time the scan started.
          format: date-time
          type: string
        stats:
          additionalProperties:
            format: int32
            type: integer
          description: Map of stats such as how many issues were ingested during the scan.
          type: object
        status:
          $ref: '#/components/schemas/ScanResultSpecStatus'
        versions:
          description: Version information for each ref.
          items:
            $ref: '#/components/schemas/v1Version'
          type: array
        workflow_results:
          description: The workflow step results.
          items:
            $ref: '#/components/schemas/SpecWorkflowResult'
          type: array
      required:
      - status
      type: object
    v1EndorctlRC:
      default: ENDORCTL_RC_UNSPECIFIED
      description: "Endorctl return codes.\n\n - ENDORCTL_RC_SUCCESS: Success (translates to exit code 0).\n - ENDORCTL_RC_ERROR: Unspecified error.\n - ENDORCTL_RC_INVALID_ARGS: Invalid input.\n - ENDORCTL_RC_ENDOR_AUTH_FAILURE: Endor API authentication failure.\n - ENDORCTL_RC_DOCTOR_FAILURE: Endor host-check failure.\n - ENDORCTL_RC_GITHUB_AUTH_FAILURE: GitHub authentication failure.\n - ENDORCTL_RC_ANALYTICS_ERROR: Error running analytics.\n - ENDORCTL_RC_FINDINGS_ERROR: Error generating findings.\n - ENDORCTL_RC_NOTIFICATIONS_ERROR: Error generating notifications.\n - ENDORCTL_RC_GITHUB_API_ERROR: Error calling GitHub API.\n - ENDORCTL_RC_GITHUB_PERMISSIONS_ERROR: Insufficient GitHub token permissions.\n - ENDORCTL_RC_GIT_ERROR: Error while performing a Git operation.\n - ENDORCTL_RC_DEPENDENCY_RESOLUTION_ERROR: Error during dependency resolution.\n - ENDORCTL_RC_DEPENDENCY_SCANNING_ERROR: Error during dependency scanning.\n - ENDORCTL_RC_CALL_GRAPH_ERROR: Error while generating call graphs.\n - ENDORCTL_RC_LINTER_ERROR: Error while running the linter scanner.\n - ENDORCTL_RC_BAD_POLICY_TYPE: A user defined policy has a policy type reserved for system policies.\n - ENDORCTL_RC_POLICY_ERROR: Error evaluating one or more policies.\n - ENDORCTL_RC_INTERNAL_ERROR: Internal error while running endorctl.\n - ENDORCTL_RC_DEADLINE_EXCEEDED: Deadline exceeded while running endorctl.\n - ENDORCTL_RC_NOT_FOUND: Requested entity was not found.\n - ENDORCTL_RC_ALREADY_EXISTS: Attempt to create an entity failed because it already exists.\n - ENDORCTL_RC_UNAUTHENTICATED: Unable to authenticate request.\n - ENDORCTL_RC_VULN_ERROR: Error related to vulnerability ingestion and processing.\n - ENDORCTL_RC_INITIALIZATION_ERROR: Error related to initializing the repository.\n - ENDORCTL_RC_HOST_CHECK_FAILURE: Endor host-check failure.\n - ENDORCTL_RC_SBOM_IMPORT_ERROR: Error importing an sbom.\n - ENDORCTL_RC_PRE_COMMIT_CHECK_FAILURE: A pre-commit check failed.\n - ENDORCTL_RC_GH_ACTION_WORKFLOW_SCAN_FAILURE: GitHub action workflow scan failed.\n - ENDORCTL_RC_FILE_ANALYTICS_ERROR: Error while reading files for analytics processing.\n - ENDORCTL_RC_SIGNATURE_VERIFICATION_FAILURE: Signature verification failure.\n - ENDORCTL_RC_LICENSE_ERROR: The requested operation requires additional licensing.\n - ENDORCTL_RC_HUGGING_FACE_ERROR: Error while running the huggingface scanner.\n - ENDORCTL_RC_SAST_ERROR: Error while running the SAST scanner.\n - ENDORCTL_RC_ARTIFACT_OPERATION_FAILURE: Artifact operation failure.\n - ENDORCTL_RC_SEGMENTATION_ERROR: Error during file segmentation.\n - ENDORCTL_RC_TOOLCHAIN_ERROR: Error generating toolchains.\n - ENDORCTL_RC_SANDBOX_ERROR: Error running endorctl sandbox.\n - ENDORCTL_RC_RULE_SET_ERROR: Error performing rule set operations.\n - ENDORCTL_RC_SECURITY_REVIEW_ERROR: Error while running the PR security review.\n - ENDORCTL_RC_CODE_API_ERROR: Error while running codeAPI.\n - ENDORCTL_RC_BASELINE_NOT_FOUND: Baseline is invalid or has not been scanned yet.\n - ENDORCTL_RC_SCAN_CANCELLED: Scan was cancelled.\n - ENDORCTL_RC_CLONE_ERROR: Error while cloning a git repository.\n - ENDORCTL_RC_FAILED_PRECONDITION: The server refused the request because of the current tenant state or the\nsupplied configuration. The error details say what the caller must correct.\n - ENDORCTL_RC_POLICY_VIOLATION: One or more, enforced, admission policy violations detected.\n - ENDORCTL_RC_POLICY_WARNING: One ore more, unenforced, admission policy violations detected.\n - ENDORCTL_RC_PR_SECURITY_REVIEW_ERROR: Deprecated: Use ENDORCTL_RC_SECURITY_REVIEW_ERROR instead.\n - ENDORCTL_RC_EXPORTER_WARNING: Warning while running the exporter. This does not prevent the main scan\nfrom completing.\n - ENDORCTL_RC_CONTAINER_PROFILING_WARNING: Warning while profiling a container image.\n - ENDORCTL_RC_DEPENDENCY_SETUP_WARNING: Warning during dependency environment setup (e.g. truststore creation).\nThe scan continues with a fallback configuration but may encounter issues."
      enum:
      - ENDORCTL_RC_UNSPECIFIED
      - ENDORCTL_RC_SUCCESS
      - ENDORCTL_RC_ERROR
      - ENDORCTL_RC_INVALID_ARGS
      - ENDORCTL_RC_ENDOR_AUTH_FAILURE
      - ENDORCTL_RC_DOCTOR_FAILURE
      - ENDORCTL_RC_GITHUB_AUTH_FAILURE
      - ENDORCTL_RC_ANALYTICS_ERROR
      - ENDORCTL_RC_FINDINGS_ERROR
      - ENDORCTL_RC_NOTIFICATIONS_ERROR
      - ENDORCTL_RC_GITHUB_API_ERROR
      - ENDORCTL_RC_GITHUB_PERMISSIONS_ERROR
      - ENDORCTL_RC_GIT_ERROR
      - ENDORCTL_RC_DEPENDENCY_RESOLUTION_ERROR
      - ENDORCTL_RC_DEPENDENCY_SCANNING_ERROR
      - ENDORCTL_RC_CALL_GRAPH_ERROR
      - ENDORCTL_RC_LINTER_ERROR
      - ENDORCTL_RC_BAD_POLICY_TYPE
      - ENDORCTL_RC_POLICY_ERROR
      - ENDORCTL_RC_INTERNAL_ERROR
      - ENDORCTL_RC_DEADLINE_EXCEEDED
      - ENDORCTL_RC_NOT_FOUND
      - ENDORCTL_RC_ALREADY_EXISTS
      - ENDORCTL_RC_UNAUTHENTICATED
      - ENDORCTL_RC_VULN_ERROR
      - ENDORCTL_RC_INITIALIZATION_ERROR
      - ENDORCTL_RC_HOST_CHECK_FAILURE
      - ENDORCTL_RC_SBOM_IMPORT_ERROR
      - ENDORCTL_RC_PRE_COMMIT_CHECK_FAILURE
      - ENDORCTL_RC_GH_ACTION_WORKFLOW_SCAN_FAILURE
      - ENDORCTL_RC_FILE_ANALYTICS_ERROR
      - ENDORCTL_RC_SIGNATURE_VERIFICATION_FAILURE
      - ENDORCTL_RC_LICENSE_ERROR
      - ENDORCTL_RC_HUGGING_FACE_ERROR
      - ENDORCTL_RC_SAST_ERROR
      - ENDORCTL_RC_ARTIFACT_OPERATION_FAILURE
      - ENDORCTL_RC_SEGMENTATION_ERROR
      - ENDORCTL_RC_TOOLCHAIN_ERROR
      - ENDORCTL_RC_SANDBOX_ERROR
      - ENDORCTL_RC_RULE_SET_ERROR
      - ENDORCTL_RC_SECURITY_REVIEW_ERROR
      - ENDORCTL_RC_CODE_API_ERROR
      - ENDORCTL_RC_BASELINE_NOT_FOUND
      - ENDORCTL_RC_SCAN_CANCELLED
      - ENDORCTL_RC_CLONE_ERROR
      - ENDORCTL_RC_FAILED_PRECONDITION
      - ENDORCTL_RC_POLICY_VIOLATION
      - ENDORCTL_RC_POLICY_WARNING
      - ENDORCTL_RC_PR_SECURITY_REVIEW_ERROR
      - ENDORCTL_RC_EXPORTER_WARNING
      - ENDORCTL_RC_CONTAINER_PROFILING_WARNING
      - ENDORCTL_RC_DEPENDENCY_SETUP_WARNING
      type: string
    GroupResponseGroupData:
      description: Information about objects matching the given key.
      properties:
        aggregation_count:
          $ref: '#/components/schemas/v1CountResponse'
        aggregation_uuids:
          description: 'List of UUIDs of the objects in the group.

            Only populated if show_aggregation_uuids is set.'
          items:
            type: string
          type: array
        aggregation_value:
          $ref: '#/components/schemas/v1GroupAggregationValueResponse'
        unique_counts:
          additionalProperties:
            $ref: '#/components/schemas/v1CountResponse'
          description: 'Map of counts for the given unique_count_paths fields.

            Only populated if unique_count_paths is set.'
          type: object
        unique_values:
          additionalProperties:
            items:
              type: object
            type: array
          description: 'Map of values for the given unique_value_paths fields.

            Only populated if unique_value_paths is set.'
          type: object
      type: object
    ScanWorkflowResultServiceCreateScanWorkflowResultBody:
      description: ScanWorkflowResult corresponds to a workflow scan result.
      properties:
        context:
          $ref: '#/components/schemas/v1Context'
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1ScanWorkflowResultSpec'
        tenant_meta:
          description: The tenant to which the scan workflow result belongs.
          title: The tenant to which the scan workflow result belongs.
          type: object
        uuid:
          description: The unique identifier of the scan workflow result.
          readOnly: true
          type: string
      required:
      - meta
      - spec
      - context
      type: object
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    ScanWorkflowResultServiceUpdateScanWorkflowResultBody:
      description: Request used to update a scan workflow result.
      properties:
        object:
          description: ScanWorkflowResult corresponds to a workflow scan result.
          properties:
            context:
              $ref: '#/components/schemas/v1Context'
            meta:
              $ref: '#/components/schemas/v1Meta'
            spec:
              $ref: '#/components/schemas/v1ScanWorkflowResultSpec'
            tenant_meta:
              description: The tenant to which the scan workflow result belongs.
              title: The tenant to which the scan workflow result belongs.
              type: object
            uuid:
              description: The unique identifier of the scan workflow result.
              readOnly: true
              type: string
          type: object
        request:
          $ref: '#/components/schemas/v1UpdateRequest'
      required:
      - meta
      - spec
      - context
      type: object
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    ScanResultSpecStatus:
      default: STATUS_UNSPECIFIED
      description: "Success state.\n\n - STATUS_SKIPPED: The scan stopped on purpose before it analyzed anything, for example\nbecause a newer commit replaced the one it was dispatched for. It is not\na failure and produced no findings. exit_code records why."
      enum:
      - STATUS_UNSPECIFIED
      - STATUS_SUCCESS
      - STATUS_PARTIAL_SUCCESS
      - STATUS_FAILURE
      - STATUS_RUNNING
      - STATUS_SKIPPED
      type: string
    v1UpdateRequest:
      description: Message used for all update requests.
      properties:
        force:
          description: 'Force will force the update of the resource if any

            checks fail.'
          type: boolean
        update_mask:
          description: Fields to update. Defaults to all fields.
          type: string
      type: object
    v1GroupAggregationValueResponse:
      description: 'GroupAggregationValueResponse returns the value of the aggregation if

        requested.'
      properties:
        value:
          format: float
          type: number
      type: object
    v1Context:
      description: Contexts keep objects from different scans separated.
      properties:
        id:
          description: The context ID, such as a pull request ID or branch reference.
          type: string
        tags:
          description: 'A list of tags applied to a context. Used primarily for CI and SBOM

            contexts.'
          items:
            type: string
          type: array
        type:
          $ref: '#/components/schemas/ContextContextType'
        will_be_deleted_at:
          description: 'Time that all objects in this context will be deleted.

            This field is deprecated and will be removed in the future.

            Please use the meta.will_be_deleted_at field instead.'
          format: date-time
          readOnly: true
          type: string
      required:
      - type
      - id
      type: object
    v1TenantMeta:
      description: Tenant related data for the tenant containing the resource.
      properties:
        namespace:
          description: 'Namespaces are a way to organize organizational units into virtual

