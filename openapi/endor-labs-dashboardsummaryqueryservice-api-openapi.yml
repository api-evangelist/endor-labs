openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Dashboard Summary Query…
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: DashboardSummaryQueryService
paths:
  /v1/namespaces/{tenant_meta.namespace}/queries/dashboard-summaries:
    post:
      description: Creates a dashboard summary query.
      operationId: DashboardSummaryQueryService_CreateDashboardSummaryQuery
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardSummaryQueryServiceCreateDashboardSummaryQueryBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1DashboardSummaryQuery'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreateDashboardSummaryQuery
      tags:
      - DashboardSummaryQueryService
      x-internal: true
components:
  schemas:
    v1DashboardSummaryQuerySpecResponse:
      properties:
        dependency_counts:
          $ref: '#/components/schemas/SpecResponseDependencyCounts'
        finding_count_entries:
          description: 'Namespace roll-up of the per-project finding_count_entries, summed per group and stage.

            Entries arrive in the registry''s group and stage order. Only projects whose summaries

            carry finding_count_entries contribute, so until every project has been rescanned this

            roll-up can cover fewer projects than vulnerability_counts in the same response.'
          items:
            $ref: '#/components/schemas/v1FindingCountEntry'
          readOnly: true
          type: array
        top_dependencies:
          $ref: '#/components/schemas/SpecResponseTopDependencies'
        top_packages:
          $ref: '#/components/schemas/SpecResponseTopPackages'
        top_projects:
          $ref: '#/components/schemas/ResponseTopProjects'
        total_notifications:
          description: Total number of notifications.
          format: int32
          readOnly: true
          type: integer
        total_packages:
          description: Total number of packages.
          format: int32
          readOnly: true
          type: integer
        total_projects:
          description: Total number of projects.
          format: int32
          readOnly: true
          type: integer
        total_scans:
          description: Total number of scans.
          format: int32
          readOnly: true
          type: integer
        vulnerability_counts:
          $ref: '#/components/schemas/SpecResponseVulnerabilityCounts'
      type: object
    SpecResponseDependencyCounts:
      properties:
        direct:
          description: Number of direct dependencies.
          format: int32
          readOnly: true
          type: integer
        outdated:
          description: Number of outdated dependencies.
          format: int32
          readOnly: true
          type: integer
        total:
          description: Total number of dependencies.
          format: int32
          readOnly: true
          type: integer
        transitive:
          description: Number of transitive dependencies.
          format: int32
          readOnly: true
          type: integer
        unmaintained:
          description: Number of unmaintained dependencies.
          format: int32
          readOnly: true
          type: integer
      type: object
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    SpecResponseTopPackagesPackageInfo:
      properties:
        dependency_counts:
          $ref: '#/components/schemas/SpecResponseDependencyCounts'
        finding_counts:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        name:
          description: Package name.
          readOnly: true
          type: string
        uuid:
          description: Package UUID.
          readOnly: true
          type: string
        vulnerability_counts:
          $ref: '#/components/schemas/SpecResponseVulnerabilityCounts'
      type: object
    v1DashboardSummaryQuerySpec:
      properties:
        request:
          $ref: '#/components/schemas/v1DashboardSummaryQuerySpecRequest'
        response:
          $ref: '#/components/schemas/v1DashboardSummaryQuerySpecResponse'
      type: object
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    SpecResponseVulnerabilityCounts:
      properties:
        exploitable_likelihood:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        exploitable_likelihood_potentially_reachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        exploitable_likelihood_reachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        low_upgrade_risk:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        low_upgrade_risk_potentially_reachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        low_upgrade_risk_reachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        normal:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        normal_fixable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        normal_fixable_potentially_reachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        normal_fixable_reachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        normal_fixable_unreachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        potentially_reachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        reachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        total:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        unreachable:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
      type: object
    SpecResponseTopPackages:
      properties:
        by_findings:
          description: Packages sorted by finding counts.
          items:
            $ref: '#/components/schemas/SpecResponseTopPackagesPackageInfo'
          readOnly: true
          type: array
        by_outdated_dependencies:
          description: Packages sorted by outdated dependency counts.
          items:
            $ref: '#/components/schemas/SpecResponseTopPackagesPackageInfo'
          readOnly: true
          type: array
        by_reachable_vulnerabilities:
          description: Packages sorted by reachable vulnerability counts.
          items:
            $ref: '#/components/schemas/SpecResponseTopPackagesPackageInfo'
          readOnly: true
          type: array
        by_unmaintained_dependencies:
          description: Packages sorted by unmaintained dependency counts.
          items:
            $ref: '#/components/schemas/SpecResponseTopPackagesPackageInfo'
          readOnly: true
          type: array
        by_vulnerabilities:
          description: Packages sorted by vulnerability counts.
          items:
            $ref: '#/components/schemas/SpecResponseTopPackagesPackageInfo'
          readOnly: true
          type: array
      type: object
    SpecResponseFindingCounts:
      properties:
        critical:
          description: Number of critical findings.
          format: int32
          readOnly: true
          type: integer
        dismissed:
          description: Number of dismissed findings.
          format: int32
          readOnly: true
          type: integer
        high:
          description: Number of high severity findings.
          format: int32
          readOnly: true
          type: integer
        low:
          description: Number of low severity findings.
          format: int32
          readOnly: true
          type: integer
        medium:
          description: Number of medium severity findings.
          format: int32
          readOnly: true
          type: integer
        total:
          description: Total number of findings.
          format: int32
          readOnly: true
          type: integer
      type: object
    v1FindingCountEntry:
      description: 'Counts for one stage of one group.

        An entry is emitted only where the group matched at least one finding, so a missing entry reads

        as zero rather than as absent data.'
      properties:
        counts:
          $ref: '#/components/schemas/endorv1FindingCounts'
        group:
          $ref: '#/components/schemas/v1FindingCountGroup'
        stage:
          $ref: '#/components/schemas/v1FindingCountStage'
      type: object
    TopProjectsProjectInfo:
      properties:
        dependency_counts:
          $ref: '#/components/schemas/SpecResponseDependencyCounts'
        finding_counts:
          $ref: '#/components/schemas/SpecResponseFindingCounts'
        name:
          description: Project name.
          readOnly: true
          type: string
        uuid:
          description: Project UUID.
          readOnly: true
          type: string
        vulnerability_counts:
          $ref: '#/components/schemas/SpecResponseVulnerabilityCounts'
      type: object
    v1FindingCountStage:
      default: FINDING_COUNT_STAGE_UNSPECIFIED
      description: "Identifies one step in a group's stage tree.\nEach value names only the criteria that step narrows by. A stage counts what is left once its own\ncriteria and every criteria on its path from the tree's root have been applied, so the same stage\ncounts a different set in each group it appears in, and the registry's stage tree is the only\nplace a stage's full criteria can be read. Sibling stages fork the funnel: each narrows their\nshared parent independently, and their sets may overlap.\n\n - FINDING_COUNT_STAGE_UNSPECIFIED: No stage has been set.\n - FINDING_COUNT_STAGE_TOTAL: Narrows by nothing; counts every finding matching the group's own criteria.\n - FINDING_COUNT_STAGE_NOT_IN_TEST: Narrows to findings carrying the normal tag, which marks findings outside test code.\n - FINDING_COUNT_STAGE_FIX_AVAILABLE: Narrows to findings carrying the fix available tag.\n - FINDING_COUNT_STAGE_REACHABLE: Narrows to findings carrying the reachable function tag for SCA vulnerabilities, or the\nreachable dependency tag for containers.\n - FINDING_COUNT_STAGE_EXPLOITABLE: Narrows to findings with an EPSS probability at or above 1%, the threshold for exploitation in\nthe wild. Follows REACHABLE in every group that uses it, so it never counts an unreachable\nfinding.\n - FINDING_COUNT_STAGE_TRUE_POSITIVE: Narrows to findings carrying the true positive tag.\n - FINDING_COUNT_STAGE_VALID_SECRET: Narrows to findings carrying the valid secret tag, set when the secret still authenticates\nagainst its provider.\n - FINDING_COUNT_STAGE_POTENTIALLY_REACHABLE: Narrows to findings carrying a potentially reachable tag. Forks from the same parent as\nREACHABLE, and the two branches may overlap: a finding tagged both reachable and potentially\nreachable is counted in each.\n - FINDING_COUNT_STAGE_POTENTIALLY_EXPLOITABLE: Narrows by the same EPSS threshold as EXPLOITABLE, but follows POTENTIALLY_REACHABLE, so it\ncounts the exploitable findings on the potentially reachable branch."
      enum:
      - FINDING_COUNT_STAGE_UNSPECIFIED
      - FINDING_COUNT_STAGE_TOTAL
      - FINDING_COUNT_STAGE_NOT_IN_TEST
      - FINDING_COUNT_STAGE_FIX_AVAILABLE
      - FINDING_COUNT_STAGE_REACHABLE
      - FINDING_COUNT_STAGE_EXPLOITABLE
      - FINDING_COUNT_STAGE_TRUE_POSITIVE
      - FINDING_COUNT_STAGE_VALID_SECRET
      - FINDING_COUNT_STAGE_POTENTIALLY_REACHABLE
      - FINDING_COUNT_STAGE_POTENTIALLY_EXPLOITABLE
      type: string
    v1TenantMeta:
      description: Tenant related data for the tenant containing the resource.
      properties:
        namespace:
          description: 'Namespaces are a way to organize organizational units into virtual

            groupings of resources. Namespaces must be a fully qualified name,

            for example, the child namespace of namespace "endor.prod" called "app"

            is called "endor.prod.app".'
          type: string
      required:
      - namespace
      type: object
    endorv1FindingCounts:
      description: 'Counts of findings broken down by severity.

        A dismissed finding is counted only in dismissed, never in total or in one of the severities.'
      properties:
        critical:
          description: Number of critical findings.
          format: int32
          type: integer
        dismissed:
          description: Number of dismissed findings.
          format: int32
          type: integer
        high:
          description: Number of high severity findings.
          format: int32
          type: integer
        low:
          description: Number of low severity findings.
          format: int32
          type: integer
        medium:
          description: Number of medium severity findings.
          format: int32
          type: integer
        total:
          description: Total number of findings.
          format: int32
          type: integer
      type: object
    v1DashboardSummaryQuery:
      description: DashboardSummaryQuery is an internal API to accelerate the UI operations.
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1DashboardSummaryQuerySpec'
        tenant_meta:
          $ref: '#/components/schemas/v1TenantMeta'
