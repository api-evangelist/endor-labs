      type: object
    v1FindingCountGroup:
      default: FINDING_COUNT_GROUP_UNSPECIFIED
      description: "Identifies a group: a set of finding-matching criteria, and a tree of stages that narrows it.\nBoth the criteria and the stage tree live in the backend registry, which is the only emitter of\nthese counts. Groups are not mutually exclusive, so a finding matching two of them would be\ncounted in each.\n\n - FINDING_COUNT_GROUP_UNSPECIFIED: No group has been set.\n - FINDING_COUNT_GROUP_SCA_VULNERABILITY: Findings carrying both the SCA and vulnerability categories.\n - FINDING_COUNT_GROUP_AI_SAST: Findings carrying the SAST category and the AI tag.\n - FINDING_COUNT_GROUP_SECRETS: Findings carrying the secrets category.\n - FINDING_COUNT_GROUP_CONTAINER: Findings carrying the container category."
      enum:
      - FINDING_COUNT_GROUP_UNSPECIFIED
      - FINDING_COUNT_GROUP_SCA_VULNERABILITY
      - FINDING_COUNT_GROUP_AI_SAST
      - FINDING_COUNT_GROUP_SECRETS
      - FINDING_COUNT_GROUP_CONTAINER
      type: string
