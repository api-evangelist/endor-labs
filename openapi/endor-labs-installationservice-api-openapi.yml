openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Installation Service API
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: InstallationService
paths:
  /v1/namespaces/{object.tenant_meta.namespace}/installations:
    patch:
      description: Updates an installation.
      operationId: InstallationService_UpdateInstallation
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: object.tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallationServiceUpdateInstallationBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Installation'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: UpdateInstallation
      tags:
      - InstallationService
  /v1/namespaces/{tenant_meta.namespace}/installations:
    get:
      description: Lists all installations.
      operationId: InstallationService_ListInstallations
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: 'String of conditions to filter resources by.

          Filters may include any attribute along with the following operators:

          "==", "!=", ">", ">=", "<", "<=", "Contains", "In", "Matches", and

          "Exists". The logical operators "And" and "Or" are also supported.

          Expressions may be combined and grouped with parentheses.


          Examples:

          "spec.value == 5",

          "spec.value in ["a", "b", "c"]",

          "(meta.name == "xyz" and "spec.value in ["a","b"]) or (spec.value ==

          "c")".'
        in: query
        name: list_parameters.filter
        schema:
          type: string
      - description: 'Set the page token to start from.

          Use page tokens to page through list results or list specific pages.'
        in: query
        name: list_parameters.page_token
        schema:
          format: int32
          type: integer
      - description: 'Set the page size to limit the number of results returned.

          Default: 100. Max: 500.'
        in: query
        name: list_parameters.page_size
        schema:
          format: int32
          type: integer
      - description: Action to be executed with a request. Not supported for all endpoints.
        in: query
        name: list_parameters.action
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: list_parameters.mask
        schema:
          type: string
      - description: Get data from any child namespaces as well.
        in: query
        name: list_parameters.traverse
        schema:
          type: boolean
      - description: Field to sort objects by, for example, meta.name.
        in: query
        name: list_parameters.sort.path
        schema:
          type: string
      - description: 'Sort order. Default: ASC.'
        in: query
        name: list_parameters.sort.order
        schema:
          default: SORT_ENTRY_ORDER_UNSPECIFIED
          enum:
          - SORT_ENTRY_ORDER_UNSPECIFIED
          - SORT_ENTRY_ORDER_ASC
          - SORT_ENTRY_ORDER_DESC
          type: string
      - description: 'Return the number of objects matching the given list parameters.

          If count is set to true, the response is a CountResponse.

          Can be used together with filter and traverse.'
        in: query
        name: list_parameters.count
        schema:
          type: boolean
      - description: 'Group the objects based on this field.

          If there are multiple fields then the objects are grouped

          based on the uniqueness of all fields.

          Supports composite paths.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.aggregation_paths
        schema:
          type: string
      - description: 'Return the UUID of each object in each group as specified by

          aggregation_paths.'
        in: query
        name: list_parameters.group.show_aggregation_uuids
        schema:
          type: boolean
      - description: 'List of fields for which we want the unique count.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_count_paths
        schema:
          type: string
      - description: 'List of fields for which we want the unique values.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_value_paths
        schema:
          type: string
      - description: Only return objects from PR scans that match this context id.
        in: query
        name: list_parameters.ci_run_uuid
        schema:
          type: string
      - description: Page ID to retrieve.
        in: query
        name: list_parameters.page_id
        schema:
          type: string
      - description: 'Group the objects based on this time field,

          for example, meta.create_time.'
        in: query
        name: list_parameters.group_by_time.aggregation_paths
        schema:
          type: string
      - description: Return the UUIDs of the objects in each group.
        in: query
        name: list_parameters.group_by_time.show_aggregation_uuids
        schema:
          type: boolean
      - description: Interval unit by which the objects should be grouped.
        in: query
        name: list_parameters.group_by_time.interval
        schema:
          default: GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          enum:
          - GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          - GROUP_BY_TIME_INTERVAL_YEAR
          - GROUP_BY_TIME_INTERVAL_QUARTER
          - GROUP_BY_TIME_INTERVAL_MONTH
          - GROUP_BY_TIME_INTERVAL_WEEK
          - GROUP_BY_TIME_INTERVAL_DAY
          - GROUP_BY_TIME_INTERVAL_HOUR
          - GROUP_BY_TIME_INTERVAL_MINUTE
          - GROUP_BY_TIME_INTERVAL_SECOND
          type: string
      - description: 'Size of the time interval to group the objects by,

          for example, to group objects by 2-week intervals, set interval

          to GROUP_BY_TIME_INTERVAL_WEEK and group_size to 2.'
        in: query
        name: list_parameters.group_by_time.group_size
        schema:
          format: int32
          type: integer
      - description: 'Beginning of the time period to group objects.

          Defaults to the beginning of time.'
        in: query
        name: list_parameters.group_by_time.start_time
        schema:
          format: date-time
          type: string
      - description: 'End of the time period to group objects.

          Defaults to the current time.'
        in: query
        name: list_parameters.group_by_time.end_time
        schema:
          format: date-time
          type: string
      - description: 'The mode determines how the matching objects are counted

          in the produced time-series. Values allowed are:

          count (default) : is the number of items matching in every interval.

          sum: is the total number of items matching since the beginning of the

          aggregation time.'
        in: query
        name: list_parameters.group_by_time.mode
        schema:
          type: string
      - description: 'The aggregation_field is a field on the matched objects that we want to

          perform some operation in each interval (example : min, max, avg)'
        in: query
        name: list_parameters.group_by_time.aggregation_value_field
        schema:
          type: string
      - description: 'The aggreation_operator is the operator that we should use for the

          aggregation. Allowed values are: min, max, sum, avg'
        in: query
        name: list_parameters.group_by_time.aggregation_operator
        schema:
          type: string
      - description: 'If true, the results will not be paginated and

          only the first page will be returned. The order

          of the results is not guaranteed.'
        in: query
        name: list_parameters.disable_pagination
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListInstallationsResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: ListInstallations
      tags:
      - InstallationService
    post:
      description: 'creates a installation.

        The creation of the resource will be an upsert if the given

        spec.external_id and spec.platform_resource were already created.'
      operationId: InstallationService_CreateInstallation
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallationServiceCreateInstallationBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Installation'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreateInstallation
      tags:
      - InstallationService
  /v1/namespaces/{tenant_meta.namespace}/installations/{uuid}:
    delete:
      description: Deletes an installation specified by the UUID.
      operationId: InstallationService_DeleteInstallation
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the resource to be deleted.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: Action to be executed with delete request.
        in: query
        name: delete_parameters.action
        schema:
          type: string
      - description: 'Force will force the deletion of the resource if any

          checks fail.'
        in: query
        name: delete_parameters.force
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: DeleteInstallation
      tags:
      - InstallationService
    get:
      description: Fetches an installation identified by the UUID.
      operationId: InstallationService_GetInstallation
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the requested resource.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: get_parameters.mask
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Installation'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: GetInstallation
      tags:
      - InstallationService
components:
  schemas:
    v1BitBucketConfig:
      properties:
        cloud:
          $ref: '#/components/schemas/v1BitBucketCloudAuthConfig'
        data_center:
          $ref: '#/components/schemas/v1BitBucketDataCenterAuthConfig'
        enable_full_scan:
          description: 'enable_full_scan is a boolean value that indicates if the full scan should

            be enabled.'
          type: boolean
        enable_pr_comments:
          description: 'enable_pr_comments is a boolean value that indicates if the automated PR

            comments should be enabled.'
          type: boolean
        enable_pr_scans:
          description: 'enable_pr_scans is a boolean value that indicates if the automated PR scans

            are enabled.'
          type: boolean
        host_url:
          description: The URL of the workspace (only for cloud) or project.
          type: string
        webhook_secret:
          description: 'The webhook secret configured in Bitbucket for validating incoming webhook

            events.'
          type: string
      required:
      - host_url
      type: object
    v1ProcessingStatusMetadata:
      properties:
        full_history_scan_time:
          format: date-time
          title: Last time a project was scanned with deep secrets scanning
          type: string
      type: object
    GroupResponseGroupData:
      description: Information about objects matching the given key.
      properties:
        aggregation_count:
          $ref: '#/components/schemas/v1CountResponse'
        aggregation_uuids:
          description: 'List of UUIDs of the objects in the group.

            Only populated if show_aggregation_uuids is set.'
          items:
            type: string
          type: array
        aggregation_value:
          $ref: '#/components/schemas/v1GroupAggregationValueResponse'
        unique_counts:
          additionalProperties:
            $ref: '#/components/schemas/v1CountResponse'
          description: 'Map of counts for the given unique_count_paths fields.

            Only populated if unique_count_paths is set.'
          type: object
        unique_values:
          additionalProperties:
            items:
              type: object
            type: array
          description: 'Map of values for the given unique_value_paths fields.

            Only populated if unique_value_paths is set.'
          type: object
      type: object
    SpecEnabledFeatureType:
      default: ENABLED_FEATURE_TYPE_UNSPECIFIED
      description: ' - ENABLED_FEATURE_TYPE_AI_SAST_SCAN: Enables AI-powered SAST scanning of source code for security vulnerabilities.'
      enum:
      - ENABLED_FEATURE_TYPE_UNSPECIFIED
      - ENABLED_FEATURE_TYPE_GIT_SCAN
      - ENABLED_FEATURE_TYPE_GITHUB_SCAN
      - ENABLED_FEATURE_TYPE_SECRETS_SCAN
      - ENABLED_FEATURE_TYPE_TOOLS_SCAN
      - ENABLED_FEATURE_TYPE_GITHUB_ACTION_SCAN
      - ENABLED_FEATURE_TYPE_SAST_SCAN
      - ENABLED_FEATURE_TYPE_AI_MODELS_SCAN
      - ENABLED_FEATURE_TYPE_AI_SAST_SCAN
      type: string
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    v1Installation:
      description: Installation represents an installation request in the system.
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        processing_status:
          $ref: '#/components/schemas/v1ProcessingStatus'
        propagate:
          description: Propagate indicates that the object should be visible in child namespaces.
          type: boolean
        spec:
          $ref: '#/components/schemas/v1InstallationSpec'
        tenant_meta:
          $ref: '#/components/schemas/v1TenantMeta'
        uuid:
          description: The UUID of the installation.
          readOnly: true
          type: string
      required:
      - meta
      - tenant_meta
      type: object
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    v1UpdateRequest:
      description: Message used for all update requests.
      properties:
        force:
          description: 'Force will force the update of the resource if any

            checks fail.'
          type: boolean
        update_mask:
          description: Fields to update. Defaults to all fields.
          type: string
      type: object
    v1ProcessingStatus:
      properties:
        analytic_time:
          description: 'Last time a project was analyzed.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          type: string
        deactivated:
          description: 'Indicates whether the project is deactivated.

            Deactivated projects are not scanned and are not visible to users in the UI by default.'
          type: boolean
        disable_automated_scan:
          description: 'This is a private package and it must not be scanned by the background

            scheduler. It will be scanned by an endorctl client instead. Default:

            false.'
          type: boolean
        metadata:
          $ref: '#/components/schemas/v1ProcessingStatusMetadata'
        queue_time:
          description: 'Last time a project was queued.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          type: string
        scan_state:
          $ref: '#/components/schemas/v1ScanState'
        scan_time:
          description: 'Last time a project was ingested.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt'
          format: date-time
          type: string
      type: object
    v1GroupAggregationValueResponse:
      description: 'GroupAggregationValueResponse returns the value of the aggregation if

        requested.'
      properties:
        value:
          format: float
          type: number
      type: object
    v1InstallationSpec:
      properties:
        azure_config:
          $ref: '#/components/schemas/v1AzureConfig'
        bitbucket_config:
          $ref: '#/components/schemas/v1BitBucketConfig'
        cleanup_stale_namespaces:
          description: 'Indicates whether stale managed namespaces that no longer correspond

            to groups or projects in the SCM should be automatically deleted

            during installation reconciliation. Default value is false.'
          type: boolean
        enabled_features:
          items:
            $ref: '#/components/schemas/SpecEnabledFeatureType'
          title: Enabled features. The valid values are "git, github"
          type: array
        exclude_project_regexes:
          description: 'exclude_project_regexes is a list of RE2 regular expression patterns used

            to exclude repositories from ingestion during SCM integration

            reconciliation. A repository is excluded if its name (leaf name only, not

            the full URL or path) matches any pattern in this list. Matching is

            case-sensitive. An empty list means no filtering is applied. Supports a

            maximum of 20 patterns.'
          items:
            type: string
          type: array
        external_id:
          description: The external ID of the installation.
          type: string
        external_name:
          description: The external name of the installation.
          readOnly: true
          type: string
        github_config:
          $ref: '#/components/schemas/v1GitHubConfig'
        gitlab_config:
          $ref: '#/components/schemas/v1GitLabConfig'
        huggingface_config:
          $ref: '#/components/schemas/v1HuggingFaceConfig'
        include_archived_repos:
          description: 'include_archived_repos is a boolean value that indicates if the archived

            repos should be included. Default will be off.'
          type: boolean
        ingestion_time:
          description: The last time that we ingested the installation data.
          format: date-time
          readOnly: true
          type: string
        ingestion_token:
          description: 'The API token that the scanner can use for scanning installation

            related information. If it is empty, the scanner will use local

            authentication information.'
          readOnly: true
          type: string
        installation_error_message:
          description: 'Message explaining why the installation is invalid.

            This field is populated when invalid is true.'
          type: string
        invalid:
          description: 'Identifies the installations that are in the system,

            but potentially their corresponding configuration has been removed

            from GitHub and thus we cannot authenticate. In this case,

            we stop trying to re-sync with this installation.'
          type: boolean
        login:
          description: 'The login of the account taken directly from the GitHub response

            VS spec.user, which is inferred from the identity token in the request

            context.'
          type: string
        marked_for_deletion:
          description: 'Indicates the installation is marked for deletion,

            and in next sync call the installation with its related data will be

            deleted.'
          type: boolean
        platform_source:
          $ref: '#/components/schemas/SpecPlatformSourceType'
        platform_type:
          $ref: '#/components/schemas/v1PlatformSource'
        project_uuids:
          description: The list of projects that are associated with this installation.
          items:
            type: string
          type: array
        public:
          description: Apply only to public repositories. Default value is false.
          type: boolean
        scm_app_uuid:
          description: The UUID of the SCM app being installed.
          type: string
        suspended:
          description: Indicates if the installation is suspended.
          type: boolean
        target_type:
          description: The target of the installation (Organization or User).
          readOnly: true
          type: string
        user:
          description: 'The user name of the user that initiated the installation.

            Refers back to the GitHub user name.'
          readOnly: true
          type: string
      type: object
    v1ListInstallationsResponse:
      description: Response to the request to list installations.
      properties:
        count_response:
          $ref: '#/components/schemas/v1CountResponse'
        group_response:
          $ref: '#/components/schemas/v1GroupResponse'
        list:
          $ref: '#/components/schemas/v1ListInstallationsResponseList'
      type: object
    v1GitLabConfig:
      properties:
        enable_full_scan:
          description: 'enable_full_scan is a boolean value that indicates if the full scan should

            be enabled.'
          type: boolean
        enable_mr_comments:
          description: 'enable_mr_comments is a boolean value that indicates if the automated MR

            comments should be enabled.'
          type: boolean
        enable_mr_scans:
          description: 'enable_mr_scans is a boolean value that indicates if the automated MR scans

            are enabled.'
          type: boolean
        host_url:
          description: The URL of the group/sub-group.
          type: string
        personal_access_token:
          description: PAT of the user doing integration to fetch resources using REST APIs.
          type: string
        webhook_secret:
          description: 'The webhook secret configured in GitLab for validating incoming webhook

            events.'
          type: string
      required:
      - host_url
      type: object
    v1TenantMeta:
      description: Tenant related data for the tenant containing the resource.
      properties:
        namespace:
          description: 'Namespaces are a way to organize organizational units into virtual

            groupings of resources. Namespaces must be a fully qualified name,

            for example, the child namespace of namespace "endor.prod" called "app"

            is called "endor.prod.app".'
          type: string
      required:
      - namespace
      type: object
    v1AzureConfig:
      properties:
        enable_full_scan:
          description: 'enable_full_scan is a boolean value that indicates if the full scan should

            be enabled for Azure DevOps PR scans.'
          type: boolean
        enable_pr_comments:
          description: 'enable_pr_comments is a boolean value that indicates if automated PR

            comments are enabled for Azure DevOps repositories.'
          type: boolean
        enable_pr_scans:
          description: 'enable_pr_scans is a boolean value that indicates if automated PR scans

            are enabled for Azure DevOps repositories.'
          type: boolean
        host_url:
          description: The URL of the project.
          type: string
        personal_access_token:
          description: PAT of the user doing integration to fetch resources using REST APIs.
          type: string
        webhook_secret:
          description: 'The shared password configured as the basic authentication credential for

            Azure DevOps Service Hook deliveries belonging to this installation.'
          type: string
      required:
      - host_url
      type: object
    v1BitBucketCloudAuthConfig:
      description: Configuration for Bitbucket Cloud authentication.
      properties:
        access_token:
          title: 'The access token associated with the Bitbucket Cloud account.

            https://support.atlassian.com/bitbucket-cloud/docs/access-tokens'
          type: string
        app_password_config:
          $ref: '#/components/schemas/v1AppPasswordConfig'
      required:
      - access_token
      type: object
    v1HuggingFaceConfig:
      properties:
        access_token:
          description: 'Optional HuggingFace API token used to authenticate requests for

            private models within the organization. When omitted, only publicly

            accessible models are discovered.'
          type: string
        avatar_url:
          description: Avatar URL of the HuggingFace organization.
          type: string
        host_url:
          title: 'The HuggingFace organization URL.

            Example: "https://huggingface.co/meta-llama"'
          type: string
      required:
