openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Package Manager Service API
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: PackageManagerService
paths:
  /v1/namespaces/{object.tenant_meta.namespace}/package-managers:
    patch:
      description: Updates a specified package manager.
      operationId: PackageManagerService_UpdatePackageManager
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: object.tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageManagerServiceUpdatePackageManagerBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1PackageManager'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: UpdatePackageManager
      tags:
      - PackageManagerService
  /v1/namespaces/{tenant_meta.namespace}/package-managers:
    get:
      description: Lists all package managers in a given namespace
      operationId: PackageManagerService_ListPackageManagers
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: 'String of conditions to filter resources by.

          Filters may include any attribute along with the following operators:

          "==", "!=", ">", ">=", "<", "<=", "Contains", "In", "Matches", and

          "Exists". The logical operators "And" and "Or" are also supported.

          Expressions may be combined and grouped with parentheses.


          Examples:

          "spec.value == 5",

          "spec.value in ["a", "b", "c"]",

          "(meta.name == "xyz" and "spec.value in ["a","b"]) or (spec.value ==

          "c")".'
        in: query
        name: list_parameters.filter
        schema:
          type: string
      - description: 'Set the page token to start from.

          Use page tokens to page through list results or list specific pages.'
        in: query
        name: list_parameters.page_token
        schema:
          format: int32
          type: integer
      - description: 'Set the page size to limit the number of results returned.

          Default: 100. Max: 500.'
        in: query
        name: list_parameters.page_size
        schema:
          format: int32
          type: integer
      - description: Action to be executed with a request. Not supported for all endpoints.
        in: query
        name: list_parameters.action
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: list_parameters.mask
        schema:
          type: string
      - description: Get data from any child namespaces as well.
        in: query
        name: list_parameters.traverse
        schema:
          type: boolean
      - description: Field to sort objects by, for example, meta.name.
        in: query
        name: list_parameters.sort.path
        schema:
          type: string
      - description: 'Sort order. Default: ASC.'
        in: query
        name: list_parameters.sort.order
        schema:
          default: SORT_ENTRY_ORDER_UNSPECIFIED
          enum:
          - SORT_ENTRY_ORDER_UNSPECIFIED
          - SORT_ENTRY_ORDER_ASC
          - SORT_ENTRY_ORDER_DESC
          type: string
      - description: 'Return the number of objects matching the given list parameters.

          If count is set to true, the response is a CountResponse.

          Can be used together with filter and traverse.'
        in: query
        name: list_parameters.count
        schema:
          type: boolean
      - description: 'Group the objects based on this field.

          If there are multiple fields then the objects are grouped

          based on the uniqueness of all fields.

          Supports composite paths.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.aggregation_paths
        schema:
          type: string
      - description: 'Return the UUID of each object in each group as specified by

          aggregation_paths.'
        in: query
        name: list_parameters.group.show_aggregation_uuids
        schema:
          type: boolean
      - description: 'List of fields for which we want the unique count.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_count_paths
        schema:
          type: string
      - description: 'List of fields for which we want the unique values.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_value_paths
        schema:
          type: string
      - description: Only return objects from PR scans that match this context id.
        in: query
        name: list_parameters.ci_run_uuid
        schema:
          type: string
      - description: Page ID to retrieve.
        in: query
        name: list_parameters.page_id
        schema:
          type: string
      - description: 'Group the objects based on this time field,

          for example, meta.create_time.'
        in: query
        name: list_parameters.group_by_time.aggregation_paths
        schema:
          type: string
      - description: Return the UUIDs of the objects in each group.
        in: query
        name: list_parameters.group_by_time.show_aggregation_uuids
        schema:
          type: boolean
      - description: Interval unit by which the objects should be grouped.
        in: query
        name: list_parameters.group_by_time.interval
        schema:
          default: GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          enum:
          - GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          - GROUP_BY_TIME_INTERVAL_YEAR
          - GROUP_BY_TIME_INTERVAL_QUARTER
          - GROUP_BY_TIME_INTERVAL_MONTH
          - GROUP_BY_TIME_INTERVAL_WEEK
          - GROUP_BY_TIME_INTERVAL_DAY
          - GROUP_BY_TIME_INTERVAL_HOUR
          - GROUP_BY_TIME_INTERVAL_MINUTE
          - GROUP_BY_TIME_INTERVAL_SECOND
          type: string
      - description: 'Size of the time interval to group the objects by,

          for example, to group objects by 2-week intervals, set interval

          to GROUP_BY_TIME_INTERVAL_WEEK and group_size to 2.'
        in: query
        name: list_parameters.group_by_time.group_size
        schema:
          format: int32
          type: integer
      - description: 'Beginning of the time period to group objects.

          Defaults to the beginning of time.'
        in: query
        name: list_parameters.group_by_time.start_time
        schema:
          format: date-time
          type: string
      - description: 'End of the time period to group objects.

          Defaults to the current time.'
        in: query
        name: list_parameters.group_by_time.end_time
        schema:
          format: date-time
          type: string
      - description: 'The mode determines how the matching objects are counted

          in the produced time-series. Values allowed are:

          count (default) : is the number of items matching in every interval.

          sum: is the total number of items matching since the beginning of the

          aggregation time.'
        in: query
        name: list_parameters.group_by_time.mode
        schema:
          type: string
      - description: 'The aggregation_field is a field on the matched objects that we want to

          perform some operation in each interval (example : min, max, avg)'
        in: query
        name: list_parameters.group_by_time.aggregation_value_field
        schema:
          type: string
      - description: 'The aggreation_operator is the operator that we should use for the

          aggregation. Allowed values are: min, max, sum, avg'
        in: query
        name: list_parameters.group_by_time.aggregation_operator
        schema:
          type: string
      - description: 'If true, the results will not be paginated and

          only the first page will be returned. The order

          of the results is not guaranteed.'
        in: query
        name: list_parameters.disable_pagination
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListPackageManagersResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: ListPackageManagers
      tags:
      - PackageManagerService
    post:
      description: Creates a package manager in a given namespace.
      operationId: PackageManagerService_CreatePackageManager
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageManagerServiceCreatePackageManagerBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1PackageManager'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreatePackageManager
      tags:
      - PackageManagerService
  /v1/namespaces/{tenant_meta.namespace}/package-managers/{uuid}:
    delete:
      description: Deletes a package manager specified by its UUID.
      operationId: PackageManagerService_DeletePackageManager
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the resource to be deleted.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: Action to be executed with delete request.
        in: query
        name: delete_parameters.action
        schema:
          type: string
      - description: 'Force will force the deletion of the resource if any

          checks fail.'
        in: query
        name: delete_parameters.force
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: DeletePackageManager
      tags:
      - PackageManagerService
    get:
      description: Fetches the package manager identified by the UUID.
      operationId: PackageManagerService_GetPackageManager
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the requested resource.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: get_parameters.mask
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1PackageManager'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: GetPackageManager
      tags:
      - PackageManagerService
components:
  schemas:
    v1SwiftSpecBasicAuth:
      properties:
        password:
          type: string
        username:
          type: string
      type: object
    v1MavenSpec:
      description: MavenSpec represents a configuration for the Maven package manager.
      properties:
        basic_auth:
          $ref: '#/components/schemas/endorv1BasicAuth'
        id:
          description: 'A string that uniquely identifies this proxy/server. This is the

            UUID of the object if not provided.'
          type: string
        is_plugin_repository:
          description: Indicates whether the repository is a plugin or binary repository.
          type: boolean
        mtls:
          $ref: '#/components/schemas/v1MTLSAuth'
        name:
          description: 'User identifiable name for the repository. This is the name

            of the package manager if not provided.'
          type: string
        password:
          description: 'An encrypted password that must be provided by the repository owner.

            Superseded by `auth`; kept only for migration, removed in a later CR.'
          type: string
        priority:
          description: 'The priority of the Maven package manager.

            Priorities are relative. If multiple package managers

            have the same priority, the order between them can be random.

            Lower number means higher priority.'
          format: int32
          type: integer
        public_repository:
          description: Indicates if cloud storage is accessible publicly.
          type: boolean
        region:
          title: Region to be used for cloud storage integration
          type: string
        snapshots:
          description: Indicates whether the repository can contain snapshot versions.
          type: boolean
        token_auth:
          $ref: '#/components/schemas/v1TokenAuth'
        url:
          description: The URL of the registry that the Maven package manager must use.
          type: string
        user:
          description: 'The user name to use to access this repo.

            Superseded by `auth`; kept only for migration, removed in a later CR.'
          type: string
      required:
      - priority
      type: object
    v1ConanSpecBasicAuth:
      properties:
        password:
          description: Password or API token for basic auth.
          type: string
        username:
          description: Username for basic auth (JFrog Artifactory or self-hosted).
          type: string
      required:
      - username
      - password
      type: object
    v1GemSpec:
      description: GemSpec represents a configuration for the Ruby gems package manager.
      properties:
        basic_auth:
          $ref: '#/components/schemas/endorv1BasicAuth'
        password:
          description: 'An encrypted password that must be provided by the repository owner.

            Superseded by `auth`; kept only for migration, removed in a later CR.'
          type: string
        priority:
          description: 'The priority of the Ruby gems package manager.

            Priorities are relative. If multiple package managers

            have the same priority, the order between them can be random.

            Lower number means higher priority.'
          format: int32
          type: integer
        token_auth:
          $ref: '#/components/schemas/v1TokenAuth'
        url:
          description: The URL of the registry that the Ruby gems package manager must use.
          type: string
        user:
          description: 'The user name to use to access this repository.

            Superseded by `auth`; kept only for migration, removed in a later CR.'
          type: string
      required:
      - priority
      type: object
    v1PackagistSpec:
      description: Represents a configuration for the Packagist(PHP) package manager.
      properties:
        auth_kind:
          $ref: '#/components/schemas/PackagistSpecAuthKind'
        host:
          description: 'The host name of the registry or repository where the PHP packages are

            hosted.'
          type: string
        password:
          description: An encrypted password that must be provided by the repository owner.
          type: string
        user:
          description: The user name to use to access the given host.
          type: string
      required:
      - auth_kind
      type: object
    GroupResponseGroupData:
      description: Information about objects matching the given key.
      properties:
        aggregation_count:
          $ref: '#/components/schemas/v1CountResponse'
        aggregation_uuids:
          description: 'List of UUIDs of the objects in the group.

            Only populated if show_aggregation_uuids is set.'
          items:
            type: string
          type: array
        aggregation_value:
          $ref: '#/components/schemas/v1GroupAggregationValueResponse'
        unique_counts:
          additionalProperties:
            $ref: '#/components/schemas/v1CountResponse'
          description: 'Map of counts for the given unique_count_paths fields.

            Only populated if unique_count_paths is set.'
          type: object
        unique_values:
          additionalProperties:
            items:
              type: object
            type: array
          description: 'Map of values for the given unique_value_paths fields.

            Only populated if unique_value_paths is set.'
          type: object
      type: object
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    v1CocoapodSpec:
      description: 'Represents a configuration for the Cocoapod package manager.

        Cocoapods does not support any registry authentication.'
      properties:
        priority:
          description: 'The priority of the Cocoapod package manager.

            Priorities are relative. If multiple package managers

            have the same priority, the order between them can be random.

            Lower number means higher priority.'
          format: int32
          type: integer
        url:
          description: The URL of the registry that the Cocoapods package manager must use.
          type: string
      required:
      - priority
      type: object
    v1ListPackageManagersResponseList:
      properties:
        objects:
          items:
            $ref: '#/components/schemas/v1PackageManager'
          type: array
        response:
          $ref: '#/components/schemas/v1ListResponse'
      type: object
    v1ConanSpec:
      description: Represents a configuration for the Conan package manager.
      properties:
        aws:
          $ref: '#/components/schemas/PackageManagerAWSAuthProvider'
        basic_auth:
          $ref: '#/components/schemas/v1ConanSpecBasicAuth'
        priority:
          description: 'The priority of the Conan package manager.

            Priorities are relative. If multiple package managers

            have the same priority, the order between them can be random.

            Lower number means higher priority.'
          format: int32
          type: integer
        remote_name:
          description: The logical name of the remote in the Conan client configuration.
          type: string
        url:
          description: The URL of the Conan remote registry.
          type: string
      required:
      - priority
      type: object
    PackageManagerAuthProvider:
      properties:
        aws:
          $ref: '#/components/schemas/PackageManagerAWSAuthProvider'
        gar:
          $ref: '#/components/schemas/PackageManagerGARAuthProvider'
        package_manager_type:
          $ref: '#/components/schemas/PackageManagerAuthProviderPackageManagerType'
      required:
      - package_manager_type
      type: object
    PackageManagerServiceCreatePackageManagerBody:
      description: 'PackageManager holds the data for the various package

        managers of the enterprise. Mainly locations and

        access credentials when needed to resolve/scan packages

        from private package managers.

        An enterprise can create one or more package managers

        in a namespace. All the package managers of the given

        namespace will be taken into account when resolving.'
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        propagate:
          description: Propagate indicates that the object should be visible in child namespaces.
          type: boolean
        spec:
          $ref: '#/components/schemas/v1PackageManagerSpec'
        tenant_meta:
          description: Git repositories are associated tenant.
          title: Git repositories are associated tenant.
          type: object
        uuid:
          description: The UUID of the package manager.
          readOnly: true
          type: string
      required:
      - meta
      - spec
      type: object
    SpecPackageManagerStatus:
      properties:
        error_message:
          description: error_message if any was found.
          readOnly: true
          type: string
        last_tested_at:
          description: last_tested_at is the time when the package manager was last tested.
          format: date-time
          type: string
        state:
          $ref: '#/components/schemas/SpecPackageManagerStatusState'
      type: object
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    PackageManagerServiceUpdatePackageManagerBody:
      description: Request to update the package manager.
      properties:
        object:
          description: 'PackageManager holds the data for the various package

            managers of the enterprise. Mainly locations and

            access credentials when needed to resolve/scan packages

            from private package managers.

            An enterprise can create one or more package managers

            in a namespace. All the package managers of the given

            namespace will be taken into account when resolving.'
          properties:
            meta:
              $ref: '#/components/schemas/v1Meta'
            propagate:
              description: Propagate indicates that the object should be visible in child namespaces.
              type: boolean
            spec:
              $ref: '#/components/schemas/v1PackageManagerSpec'
            tenant_meta:
              description: Git repositories are associated tenant.
              title: Git repositories are associated tenant.
              type: object
            uuid:
              description: The UUID of the package manager.
              readOnly: true
              type: string
          type: object
        request:
          $ref: '#/components/schemas/v1UpdateRequest'
      required:
      - meta
      - spec
      type: object
    v1UpdateRequest:
      description: Message used for all update requests.
      properties:
        force:
          description: 'Force will force the update of the resource if any

            checks fail.'
          type: boolean
        update_mask:
          description: Fields to update. Defaults to all fields.
          type: string
      type: object
    PackageManagerAuthProviderPackageManagerType:
      default: PACKAGE_MANAGER_TYPE_UNSPECIFIED
      enum:
      - PACKAGE_MANAGER_TYPE_UNSPECIFIED
      - PACKAGE_MANAGER_TYPE_NPM
      - PACKAGE_MANAGER_TYPE_MVN
      - PACKAGE_MANAGER_TYPE_CARGO
      - PACKAGE_MANAGER_TYPE_PYPI
      - PACKAGE_MANAGER_TYPE_GEM
      - PACKAGE_MANAGER_TYPE_NUGET
      - PACKAGE_MANAGER_TYPE_PACKAGIST
      - PACKAGE_MANAGER_TYPE_GRADLE
      - PACKAGE_MANAGER_TYPE_COCOAPOD
      - PACKAGE_MANAGER_TYPE_SWIFT
      - PACKAGE_MANAGER_TYPE_CONAN
      type: string
    v1GroupAggregationValueResponse:
      description: 'GroupAggregationValueResponse returns the value of the aggregation if

        requested.'
      properties:
        value:
          format: float
          type: number
      type: object
    PackageManagerAWSAuthProvider:
      description: 'AWSAuthProvider represents a configuration for the authentication with the

        AWS Code Artifact repository.'
      properties:
        allowed_audience:
          description: allowed_audience is the allowed audience value to retrieve the role.
          type: string
        domain:
          description: domain name of the AWS Code Artifact repository.
          type: string
        domain_owner:
          description: domain_owner of the AWS Code Artifact repository.
          type: string
        region:
          description: region is the region of the AWS Code Artifact repository.
          type: string
        repository:
          description: repositiry of the AWS Code Artifact repository.
          type: string
        target_role_arn:
          description: target_role_arn is the role that we need to assume in AWS.
          type: string
      required:
      - domain
      - domain_owner
      - repository
      - target_role_arn
      - allowed_audience
      - region
      type: object
    PackagistSpecAuthKind:
      default: AUTH_KIND_UNSPECIFIED
      description: 'Auth methods for Packagist - reference

        https://getcomposer.org/doc/articles/authentication-for-private-packages.md.'
      enum:
      - AUTH_KIND_UNSPECIFIED
      - AUTH_KIND_HTTP_BASIC
      - AUTH_KIND_HTTP_BEARER
      - AUTH_KIND_GITHUB_OAUTH
      - AUTH_KIND_GITLAB_OAUTH
      - AUTH_KIND_GITLAB_TOKEN
      - AUTH_KIND_BITBUCKET_OAUTH
      type: string
    v1PypiSpec:
      description: PypiSpec represents a configuration for the Python package manager.
      properties:
        basic_auth:
          $ref: '#/components/schemas/endorv1BasicAuth'
        mtls:
          $ref: '#/components/schemas/v1MTLSAuth'
        password:
          description: 'An encrypted password that must be provided by the repository owner.

            Superseded by `auth`; kept only for migration, removed in a later CR.'
          type: string
        priority:
          description: 'The priority of the Python package manager.

            Priorities are relative. If multiple package managers

            have the same priority, the order between them can be random.

            Lower number means higher priority.'
          format: int32
          type: integer
        token_auth:
          $ref: '#/components/schemas/v1TokenAuth'
        url:
          description: The URL of the registry that the Python package manager must use.
          type: string
        user:
          description: 'The user name to use to access this repository.

