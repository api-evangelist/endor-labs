    v1AutomatedScanParameters:
      description: 'AutomatedScanParameters represents the parameters that must be applied during

        automated cloud scans to the projects associated with the corresponding

        profile.'
      properties:
        additional_environment_variables:
          description: 'additional_environment_variables sets extra environment variables for the

            scan, specific to languages or tools. By design only ENDOR_-prefixed

            variables are honored; any entry without the ENDOR_ prefix is silently

            dropped, as are a few reserved ENDOR_ variables the scanner sets itself.'
          items:
            type: string
          type: array
        bazel_configuration:
          $ref: '#/components/schemas/AutomatedScanParametersBazelConfiguration'
        call_graph_languages:
          description: 'call_graph_languages is the list of languages that should be used to

            calculate call graphs. If empty, default values are used.'
          items:
            type: string
          type: array
        disable_code_snippet_storage:
          description: 'disable_code_snippet_storage is a boolean value that indicates if the source code snippet

            related to a finding should be stored or displayed. Default will be off.'
          type: boolean
        disable_code_storage:
          description: 'disable_code_storage is a boolean value that indicates if the source code related to a finding

            should be stored or displayed. Default will be off.'
          type: boolean
        enable_ai_sast_scan:
          description: enable_ai_sast_scan is a boolean value that indicates if AI SAST scan should be requested.
          type: boolean
        enable_automated_pr_scans:
          description: 'enable_automated_pr_scans for this repository will allow the github

            app to selectively scan PRs and merges for this repository.

            If the project is not part of a github app, this setting will be ingored.'
          type: boolean
        enable_full_git_log_secret_scan:
          description: enable_full_git_log_secret_scan for this repository.
          type: boolean
        enable_pr_comments:
          description: enable_pr_comments for this repository.
          type: boolean
        enable_pr_incremental_scan:
          description: enable_pr_incremental_scan is a boolean value that indicates if the PR incremental scan should be requested.
          type: boolean
        enable_pr_security_review_scan:
          description: enable_pr_security_review_scan is a boolean value that indicates if a Security Review scan should be requested.
          type: boolean
        enable_remediation_action:
          description: enable_remediation_action for this repository.
          type: boolean
        enable_sast_scan:
          description: enable_sast_scan for this repository.
          type: boolean
        enable_secret_scan:
          description: enable_secret_scan for this repository.
          type: boolean
        excluded_paths:
          description: excluded_paths is a list of paths that should be excluded from the scan.
          items:
            type: string
          type: array
        full_pr_scan:
          description: full_pr_scan indicates whether a full scan should be enabled during PRs.
          type: boolean
        full_push_scan:
          description: 'full_push_scan indicates whether a full scan should be enabled during

            pushes.'
          type: boolean
        included_paths:
          description: included_paths is a list of paths that should be included in the scan.
          items:
            type: string
          type: array
        languages:
          description: 'languages is a list of languages that should be scanned. If emtpy

            default values are used.'
          items:
            type: string
          type: array
        segment_match_languages:
          description: 'segment_match_languages is the list of languages to enable segment-match based analysis for.

            Clears the default languages if languages is not set explicitly.'
          items:
            type: string
          type: array
      type: object
    v1ToolChainVersion:
      description: ToolChainVersion defines the tool chain's source from where it can be installed.
      properties:
        name:
          description: name of the tool chain.
          type: string
        relative_tool_chain_path:
          description: relative path of the tool chain in tar ball.
          type: string
        sha256_sum:
          description: SHA256 Digest of the tool that will be downloaded.
          type: string
        urls:
          description: http mirros from where the tool can be downloaded.
          items:
            type: string
          type: array
      type: object
