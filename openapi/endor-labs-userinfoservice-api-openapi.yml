openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference User Info Service API
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: UserInfoService
paths:
  /v1/auth:
    get:
      description: Returns user authentication data and allows a user to validate their token.
      operationId: UserInfoService_Verify
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1UserInfoResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: Verify
      tags:
      - UserInfoService
      x-internal: true
  /v1/namespaces/{target_namespace}/auth:
    get:
      description: Returns user authentication data and allows a user to validate their token.
      operationId: UserInfoService_GetActivePermissions
      parameters:
      - in: path
        name: target_namespace
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1UserInfoResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: GetActivePermissions
      tags:
      - UserInfoService
      x-internal: true
components:
  schemas:
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    v1Meta:
      description: Common fields for all Endor Labs resources.
      properties:
        annotations:
          additionalProperties:
            type: string
          description: 'Annotations can be used to attach metadata to a resource message.

            Annotation values can be small or large, structured or unstructured,

            and may include characters not permitted by labels.

            The keys may contain alphanumerics, underscores (_), dots (.) and dashes

            (-). The values of an annotation must be 16384 bytes or smaller.'
          type: object
        create_time:
          description: 'Time the resource was created.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: 'Name and authentication source of the user who created the object,

            for example, ewok@endor.ai@google@api-key.'
          readOnly: true
          type: string
        description:
          description: Resource description. Must be less than 1024 bytes.
          type: string
        index_data:
          $ref: '#/components/schemas/v1IndexData'
        kind:
          description: 'Resource kind, for example, HelloResponse.

            Auto-generated using the protobuf message proto.MessageName().Name().'
          readOnly: true
          type: string
        name:
          description: Resource name. Must be 63 characters or less.
          type: string
        parent_kind:
          description: Parent object resource kind, for example, Project.
          type: string
        parent_uuid:
          description: Parent object UUID.
          type: string
        references:
          additionalProperties:
            $ref: '#/components/schemas/googleprotobufAny'
          description: Map of objects referenced in a query API.
          readOnly: true
          type: object
        tags:
          description: 'List of tags attached to the resource.

            Tags can be used to select objects and to find collections of objects that

            satisfy certain conditions. A tag must be 255 characters or less.'
          items:
            type: string
          type: array
        update_time:
          description: 'Time the resource was last updated.

            Note: Updated on all create/patch/delete operations.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: 'Name and authentication source of the last user who updated the object,

            for example, vulnerabilityingestor@endor.ai@x509.'
          readOnly: true
          type: string
        upsert_time:
          description: 'Time the resource was last upserted.


            Note:

            create_time is only set the first time the resource is created.

            upsert_time is set every time the resource is upseted.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        version:
          description: Message version.
          readOnly: true
          type: string
      required:
      - name
      type: object
    v1User:
      description: 'User represents a user in the system.


        Mostly includes configuration parameters that are user wise.'
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1UserSpec'
        uuid:
          description: The UUID of a user.
          readOnly: true
          type: string
      required:
      - meta
      type: object
    v1UserSpec:
      properties:
        email:
          description: Email of the user. It can be changed.
          type: string
        event_tracking:
          additionalProperties:
            $ref: '#/components/schemas/v1Events'
          description: Lists of user events indexed by event type.
          type: object
        first_name:
          description: First name of the user as identified. It can be changed.
          type: string
        groups:
          description: 'Groups that the user is a member of, as identified by the

            claims returned by the identity provider.'
          items:
            type: string
          type: array
        last_login_time:
          description: 'Last login time keeps a record of the last time

            that the user logged in.'
          format: date-time
          readOnly: true
          type: string
        last_name:
          description: Last name of the user. It can be changed.
          type: string
        token_hash:
          description: 'The hash of the last token issued to the user.

            During authentication we make sure that this hash matches

            the token provided.'
          type: string
        user_name:
          readOnly: true
          title: 'Username of a user.

            Usernames are automatically derived from the token.

            Depending on the identity source it can be the

            nickname (GitHub) or email (Google and others)'
          type: string
      type: object
    v1Events:
      properties:
        event:
          items:
            type: string
          title: List of user events
          type: array
      type: object
    googleprotobufAny:
      additionalProperties: {}
      description: "`Any` contains an arbitrary serialized protocol buffer message along with a\nURL that describes the type of the serialized message.\n\nProtobuf library provides support to pack/unpack Any values in the form\nof utility functions or additional generated methods of the Any type.\n\nExample 1: Pack and unpack a message in C++.\n\n    Foo foo = ...;\n    Any any;\n    any.PackFrom(foo);\n    ...\n    if (any.UnpackTo(&foo)) {\n      ...\n    }\n\nExample 2: Pack and unpack a message in Java.\n\n    Foo foo = ...;\n    Any any = Any.pack(foo);\n    ...\n    if (any.is(Foo.class)) {\n      foo = any.unpack(Foo.class);\n    }\n    // or ...\n    if (any.isSameTypeAs(Foo.getDefaultInstance())) {\n      foo = any.unpack(Foo.getDefaultInstance());\n    }\n\n Example 3: Pack and unpack a message in Python.\n\n    foo = Foo(...)\n    any = Any()\n    any.Pack(foo)\n    ...\n    if any.Is(Foo.DESCRIPTOR):\n      any.Unpack(foo)\n      ...\n\n Example 4: Pack and unpack a message in Go\n\n     foo := &pb.Foo{...}\n     any, err := anypb.New(foo)\n     if err != nil {\n       ...\n     }\n     ...\n     foo := &pb.Foo{}\n     if err := any.UnmarshalTo(foo); err != nil {\n       ...\n     }\n\nThe pack methods provided by protobuf library will by default use\n'type.googleapis.com/full.type.name' as the type URL and the unpack\nmethods only use the fully qualified type name after the last '/'\nin the type URL, for example \"foo.bar.com/x/y.z\" will yield type\nname \"y.z\".\n\nJSON\n====\nThe JSON representation of an `Any` value uses the regular\nrepresentation of the deserialized, embedded message, with an\nadditional field `@type` which contains the type URL. Example:\n\n    package google.profile;\n    message Person {\n      string first_name = 1;\n      string last_name = 2;\n    }\n\n    {\n      \"@type\": \"type.googleapis.com/google.profile.Person\",\n      \"firstName\": <string>,\n      \"lastName\": <string>\n    }\n\nIf the embedded message type is well-known and has a custom JSON\nrepresentation, that representation will be embedded adding a field\n`value` which holds the custom JSON in addition to the `@type`\nfield. Example (for message [google.protobuf.Duration][]):\n\n    {\n      \"@type\": \"type.googleapis.com/google.protobuf.Duration\",\n      \"value\": \"1.212s\"\n    }"
      properties:
        '@type':
          description: "A URL/resource name that uniquely identifies the type of the serialized\nprotocol buffer message. This string must contain at least\none \"/\" character. The last segment of the URL's path must represent\nthe fully qualified name of the type (as in\n`path/google.protobuf.Duration`). The name should be in a canonical form\n(e.g., leading \".\" is not accepted).\n\nIn practice, teams usually precompile into the binary all types that they\nexpect it to use in the context of Any. However, for URLs which use the\nscheme `http`, `https`, or no scheme, one can optionally set up a type\nserver that maps type URLs to message definitions as follows:\n\n* If no scheme is provided, `https` is assumed.\n* An HTTP GET on the URL must yield a [google.protobuf.Type][]\n  value in binary format, or produce an error.\n* Applications are allowed to cache lookup results based on the\n  URL, or have them precompiled into a binary to avoid any\n  lookup. Therefore, binary compatibility needs to be preserved\n  on changes to types. (Use versioned type names to manage\n  breaking changes.)\n\nNote: this functionality is not currently available in the official\nprotobuf release, and it is not used for type URLs beginning with\ntype.googleapis.com. As of May 2023, there are no widely used type server\nimplementations and no plans to implement one.\n\nSchemes other than `http`, `https` (or the empty scheme) might be\nused with implementation specific semantics."
          type: string
      type: object
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    SpecEndorLicenseType:
      default: ENDOR_LICENSE_TYPE_UNSPECIFIED
      description: "EndorLicenseType represents the type of Endor Labs license.\n\n - ENDOR_LICENSE_TYPE_UNSPECIFIED: Type is undefined.\n - ENDOR_LICENSE_TYPE_FREE_TRIAL: FREE TRIAL license is used for self-service signup workflow.\n - ENDOR_LICENSE_TYPE_FREE_TIER: FREE TIER license for free restricted access to Endor Labs products.\n - ENDOR_LICENSE_TYPE_PREMIUM: PREMIUM license for paid customers.\n - ENDOR_LICENSE_TYPE_POV: Sales-led POC Customer."
      enum:
      - ENDOR_LICENSE_TYPE_UNSPECIFIED
      - ENDOR_LICENSE_TYPE_FREE_TRIAL
      - ENDOR_LICENSE_TYPE_FREE_TIER
      - ENDOR_LICENSE_TYPE_PREMIUM
      - ENDOR_LICENSE_TYPE_POV
      type: string
    UserInfoResponseTenantInfo:
      properties:
        expiry:
          description: The timestamp indicating when the tenant is scheduled to expire.
          format: date-time
          type: string
        license_type:
          $ref: '#/components/schemas/SpecEndorLicenseType'
        name:
          description: The tenant name.
          readOnly: true
          type: string
        organizational_entity_name:
          readOnly: true
          title: The human-readable name of the organization associated with this tenant
          type: string
        uuid:
          description: The UUID of the resource.
          readOnly: true
          type: string
      type: object
    PermissionsMethods:
      description: An array of allowed methods.
      properties:
        methods:
          items:
            $ref: '#/components/schemas/v1Method'
          type: array
      type: object
    v1UserInfoResponse:
      description: UserInfoResponse returns information about a user and their authentication token.
      properties:
        authentication_source:
          readOnly: true
          type: string
        expiration_time:
          format: date-time
          readOnly: true
          type: string
        namespaces:
          items:
            type: string
          readOnly: true
          type: array
        permissions:
          $ref: '#/components/schemas/v1Permissions'
        tenants:
          items:
            $ref: '#/components/schemas/UserInfoResponseTenantInfo'
          readOnly: true
          type: array
        user:
          $ref: '#/components/schemas/v1User'
      type: object
    v1Method:
      default: METHOD_UNSPECIFIED
      description: "The type of allowed action.\n\n - METHOD_READ: METHOD_READ is for LIST/GET\n - METHOD_CREATE: METHOD_CREATE is for POST\n - METHOD_UPDATE: METHOD_UPDATE is for PATCH\n - METHOD_DELETE: METHOD_DELETE is for DELETE\n - METHOD_ALL: METHOD_ALL is for all methods (essentially *)"
      enum:
      - METHOD_UNSPECIFIED
      - METHOD_READ
      - METHOD_CREATE
      - METHOD_UPDATE
      - METHOD_DELETE
      - METHOD_ALL
      type: string
    v1Permissions:
      description: "Holds a map associating each resource kind with the\n set of methods that are allowed for this kind.\n\n For example:"
      properties:
        except_resources:
          description: List of resources that should not be accounted in any * resource rules.
          items:
            type: string
          type: array
        roles:
          items:
            $ref: '#/components/schemas/v1SystemRole'
          type: array
        rules:
          additionalProperties:
            $ref: '#/components/schemas/PermissionsMethods'
          title: 'For message (or resource) repository, I want to provide permissions READ

            only. This will create map["repository"] = []{READ}'
          type: object
      type: object
    v1SystemRole:
      default: SYSTEM_ROLE_UNSPECIFIED
      description: "Captures the default system roles for permissions.\n\n - SYSTEM_ROLE_ADMIN: ADMIN has read/write access to all objects in the tenant.\n - SYSTEM_ROLE_READ_ONLY: READ_ONLY only can read all data, but perform no updates.\n - SYSTEM_ROLE_POLICY_EDITOR: Policy editor has read access on all objects, and the ability to create and\nmanage policies.\n - SYSTEM_ROLE_CODE_SCANNER: CODE_SCANNER has all permissions to run a scan and view the results.\n - SYSTEM_ROLE_ENDOR_PATCHING: ENDOR_PATCHING has permissions to use Endor Lab's factory.\n - SYSTEM_ROLE_SYNC_ORG: SYNC_ORG has permissions to perform a sync-org scan on all supported\nplatforms (GitHub, Azure, GitLab etc).\n - SYSTEM_ROLE_ONPREM_SCHEDULER: ONPREM_SCHEDULER has permissions to perform sync-org, scans and manage\nonprem scheduler related objects.\n - SYSTEM_ROLE_ENDOR_PROXY: Deprecated: Use SYSTEM_ROLE_PACKAGE_FIREWALL instead.\nENDOR_PROXY has permissions to access proxy endpoints in endorfactory service.\n - SYSTEM_ROLE_PACKAGE_FIREWALL: PACKAGE_FIREWALL has permissions to access firewall endpoints for package firewall in endorfactory service.\n - SYSTEM_ROLE_AI_AUDIT: AI_AUDIT has least-privilege permissions to run ai-audit hooks (agent session events)."
      enum:
      - SYSTEM_ROLE_UNSPECIFIED
      - SYSTEM_ROLE_ADMIN
      - SYSTEM_ROLE_READ_ONLY
      - SYSTEM_ROLE_POLICY_EDITOR
      - SYSTEM_ROLE_CODE_SCANNER
      - SYSTEM_ROLE_ENDOR_PATCHING
      - SYSTEM_ROLE_SYNC_ORG
      - SYSTEM_ROLE_ONPREM_SCHEDULER
      - SYSTEM_ROLE_ENDOR_PROXY
      - SYSTEM_ROLE_PACKAGE_FIREWALL
      - SYSTEM_ROLE_AI_AUDIT
      type: string
