openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Semgrep Rule Service API
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: SemgrepRuleService
paths:
  /v1/namespaces/{object.tenant_meta.namespace}/semgrep-rules:
    patch:
      description: Updates the Semgrep rule.
      operationId: SemgrepRuleService_UpdateSemgrepRule
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: object.tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemgrepRuleServiceUpdateSemgrepRuleBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1SemgrepRule'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: UpdateSemgrepRule
      tags:
      - SemgrepRuleService
  /v1/namespaces/{tenant_meta.namespace}/semgrep-rules:
    get:
      description: Lists all Semgrep rules in the namespace.
      operationId: SemgrepRuleService_ListSemgrepRules
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: 'String of conditions to filter resources by.

          Filters may include any attribute along with the following operators:

          "==", "!=", ">", ">=", "<", "<=", "Contains", "In", "Matches", and

          "Exists". The logical operators "And" and "Or" are also supported.

          Expressions may be combined and grouped with parentheses.


          Examples:

          "spec.value == 5",

          "spec.value in ["a", "b", "c"]",

          "(meta.name == "xyz" and "spec.value in ["a","b"]) or (spec.value ==

          "c")".'
        in: query
        name: list_parameters.filter
        schema:
          type: string
      - description: 'Set the page token to start from.

          Use page tokens to page through list results or list specific pages.'
        in: query
        name: list_parameters.page_token
        schema:
          format: int32
          type: integer
      - description: 'Set the page size to limit the number of results returned.

          Default: 100. Max: 500.'
        in: query
        name: list_parameters.page_size
        schema:
          format: int32
          type: integer
      - description: Action to be executed with a request. Not supported for all endpoints.
        in: query
        name: list_parameters.action
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: list_parameters.mask
        schema:
          type: string
      - description: Get data from any child namespaces as well.
        in: query
        name: list_parameters.traverse
        schema:
          type: boolean
      - description: Field to sort objects by, for example, meta.name.
        in: query
        name: list_parameters.sort.path
        schema:
          type: string
      - description: 'Sort order. Default: ASC.'
        in: query
        name: list_parameters.sort.order
        schema:
          default: SORT_ENTRY_ORDER_UNSPECIFIED
          enum:
          - SORT_ENTRY_ORDER_UNSPECIFIED
          - SORT_ENTRY_ORDER_ASC
          - SORT_ENTRY_ORDER_DESC
          type: string
      - description: 'Return the number of objects matching the given list parameters.

          If count is set to true, the response is a CountResponse.

          Can be used together with filter and traverse.'
        in: query
        name: list_parameters.count
        schema:
          type: boolean
      - description: 'Group the objects based on this field.

          If there are multiple fields then the objects are grouped

          based on the uniqueness of all fields.

          Supports composite paths.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.aggregation_paths
        schema:
          type: string
      - description: 'Return the UUID of each object in each group as specified by

          aggregation_paths.'
        in: query
        name: list_parameters.group.show_aggregation_uuids
        schema:
          type: boolean
      - description: 'List of fields for which we want the unique count.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_count_paths
        schema:
          type: string
      - description: 'List of fields for which we want the unique values.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_value_paths
        schema:
          type: string
      - description: Only return objects from PR scans that match this context id.
        in: query
        name: list_parameters.ci_run_uuid
        schema:
          type: string
      - description: Page ID to retrieve.
        in: query
        name: list_parameters.page_id
        schema:
          type: string
      - description: 'Group the objects based on this time field,

          for example, meta.create_time.'
        in: query
        name: list_parameters.group_by_time.aggregation_paths
        schema:
          type: string
      - description: Return the UUIDs of the objects in each group.
        in: query
        name: list_parameters.group_by_time.show_aggregation_uuids
        schema:
          type: boolean
      - description: Interval unit by which the objects should be grouped.
        in: query
        name: list_parameters.group_by_time.interval
        schema:
          default: GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          enum:
          - GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          - GROUP_BY_TIME_INTERVAL_YEAR
          - GROUP_BY_TIME_INTERVAL_QUARTER
          - GROUP_BY_TIME_INTERVAL_MONTH
          - GROUP_BY_TIME_INTERVAL_WEEK
          - GROUP_BY_TIME_INTERVAL_DAY
          - GROUP_BY_TIME_INTERVAL_HOUR
          - GROUP_BY_TIME_INTERVAL_MINUTE
          - GROUP_BY_TIME_INTERVAL_SECOND
          type: string
      - description: 'Size of the time interval to group the objects by,

          for example, to group objects by 2-week intervals, set interval

          to GROUP_BY_TIME_INTERVAL_WEEK and group_size to 2.'
        in: query
        name: list_parameters.group_by_time.group_size
        schema:
          format: int32
          type: integer
      - description: 'Beginning of the time period to group objects.

          Defaults to the beginning of time.'
        in: query
        name: list_parameters.group_by_time.start_time
        schema:
          format: date-time
          type: string
      - description: 'End of the time period to group objects.

          Defaults to the current time.'
        in: query
        name: list_parameters.group_by_time.end_time
        schema:
          format: date-time
          type: string
      - description: 'The mode determines how the matching objects are counted

          in the produced time-series. Values allowed are:

          count (default) : is the number of items matching in every interval.

          sum: is the total number of items matching since the beginning of the

          aggregation time.'
        in: query
        name: list_parameters.group_by_time.mode
        schema:
          type: string
      - description: 'The aggregation_field is a field on the matched objects that we want to

          perform some operation in each interval (example : min, max, avg)'
        in: query
        name: list_parameters.group_by_time.aggregation_value_field
        schema:
          type: string
      - description: 'The aggreation_operator is the operator that we should use for the

          aggregation. Allowed values are: min, max, sum, avg'
        in: query
        name: list_parameters.group_by_time.aggregation_operator
        schema:
          type: string
      - description: 'If true, the results will not be paginated and

          only the first page will be returned. The order

          of the results is not guaranteed.'
        in: query
        name: list_parameters.disable_pagination
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListSemgrepRulesResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: ListSemgrepRules
      tags:
      - SemgrepRuleService
    post:
      description: Creates a Semgrep rule.
      operationId: SemgrepRuleService_CreateSemgrepRule
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemgrepRuleServiceCreateSemgrepRuleBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1SemgrepRule'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreateSemgrepRule
      tags:
      - SemgrepRuleService
  /v1/namespaces/{tenant_meta.namespace}/semgrep-rules/{uuid}:
    delete:
      description: Deletes the rule specified by the UUID.
      operationId: SemgrepRuleService_DeleteSemgrepRule
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the resource to be deleted.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: Action to be executed with delete request.
        in: query
        name: delete_parameters.action
        schema:
          type: string
      - description: 'Force will force the deletion of the resource if any

          checks fail.'
        in: query
        name: delete_parameters.force
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: DeleteSemgrepRule
      tags:
      - SemgrepRuleService
    get:
      description: Fetches a Semgrep rule identified by the UUID.
      operationId: SemgrepRuleService_GetSemgrepRule
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the requested resource.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: get_parameters.mask
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1SemgrepRule'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: GetSemgrepRule
      tags:
      - SemgrepRuleService
components:
  schemas:
    v1SemgrepOptions:
      properties:
        constant_propagation:
          description: Enables constant propagation analysis.
          type: boolean
        generic_ellipsis_max_span:
          description: Maximum span for generic ellipsis patterns.
          format: int32
          type: integer
        generic_engine:
          description: Specifies the generic engine to use for analysis.
          type: string
        implicit_deep_exprstmt:
          description: Enables implicit deep expression statement analysis.
          type: boolean
        interfile:
          description: Enables interfile analysis for cross-file taint tracking.
          type: boolean
        symbolic_propagation:
          description: Enables symbolic propagation analysis for taint tracking.
          type: boolean
        taint_assume_safe_booleans:
          description: Assumes boolean values are safe in taint analysis.
          type: boolean
        taint_assume_safe_functions:
          description: Assumes function calls are safe in taint analysis.
          type: boolean
        taint_assume_safe_numbers:
          description: Assumes numeric values are safe in taint analysis.
          type: boolean
        taint_unify_mvars:
          description: Enables unification of metavariables in taint analysis.
          type: boolean
      type: object
    SemgrepRuleServiceCreateSemgrepRuleBody:
      properties:
        disabled:
          type: boolean
        meta:
          $ref: '#/components/schemas/v1Meta'
        propagate:
          description: Propagate indicates that the object should be visible in child namespaces.
          type: boolean
        spec:
          $ref: '#/components/schemas/v1SemgrepRuleSpec'
        tenant_meta:
          description: Rules are associated with a tenant and namespace.
          title: Rules are associated with a tenant and namespace.
          type: object
        uuid:
          description: The UUID of the Semgrep rule.
          readOnly: true
          type: string
      required:
      - meta
      - spec
      type: object
    GroupResponseGroupData:
      description: Information about objects matching the given key.
      properties:
        aggregation_count:
          $ref: '#/components/schemas/v1CountResponse'
        aggregation_uuids:
          description: 'List of UUIDs of the objects in the group.

            Only populated if show_aggregation_uuids is set.'
          items:
            type: string
          type: array
        aggregation_value:
          $ref: '#/components/schemas/v1GroupAggregationValueResponse'
        unique_counts:
          additionalProperties:
            $ref: '#/components/schemas/v1CountResponse'
          description: 'Map of counts for the given unique_count_paths fields.

            Only populated if unique_count_paths is set.'
          type: object
        unique_values:
          additionalProperties:
            items:
              type: object
            type: array
          description: 'Map of values for the given unique_value_paths fields.

            Only populated if unique_value_paths is set.'
          type: object
      type: object
    v1EndorRuleOrigin:
      properties:
        license:
          type: string
        url:
          type: string
      type: object
    v1SemgrepRuleSpecSeverityLevel:
      default: SEVERITY_LEVEL_UNSPECIFIED
      description: 'The severity level of the rule. This is computed using the values of the

        confidence and the impact from the rule itself. If those values are not

        defined, the severity level is set to LOW.'
      enum:
      - SEVERITY_LEVEL_UNSPECIFIED
      - SEVERITY_LEVEL_LOW
      - SEVERITY_LEVEL_MEDIUM
      - SEVERITY_LEVEL_HIGH
      - SEVERITY_LEVEL_CRITICAL
      type: string
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    v1SemgrepMetavariableComparison:
      properties:
        base:
          type: boolean
        comparison:
          type: string
        metavariable:
          type: string
        strip:
          type: boolean
      type: object
    v1SemgrepRule:
      properties:
        disabled:
          type: boolean
        meta:
          $ref: '#/components/schemas/v1Meta'
        propagate:
          description: Propagate indicates that the object should be visible in child namespaces.
          type: boolean
        spec:
          $ref: '#/components/schemas/v1SemgrepRuleSpec'
        tenant_meta:
          $ref: '#/components/schemas/v1TenantMeta'
        uuid:
          description: The UUID of the Semgrep rule.
          readOnly: true
          type: string
      required:
      - meta
      - spec
      type: object
    v1SemgrepMetavariableRegex:
      properties:
        metavariable:
          type: string
        regex:
          type: string
        x:
          type: string
      type: object
    v1SemgrepPaths:
      properties:
        exclude:
          items:
            type: string
          type: array
        include:
          items:
            type: string
          type: array
      type: object
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    v1SemgrepFixRegex:
      properties:
        count:
          format: int32
          type: integer
        regex:
          type: string
        replacement:
          type: string
      type: object
    v1SemgrepMetaAsvs:
      properties:
        control_id:
          type: string
        control_url:
          type: string
        section:
          type: string
        version:
          type: string
      type: object
    v1SemgrepWeb:
      properties:
        exposure:
          $ref: '#/components/schemas/v1SemgrepExposure'
      type: object
    v1UpdateRequest:
      description: Message used for all update requests.
      properties:
        force:
          description: 'Force will force the update of the resource if any

            checks fail.'
          type: boolean
        update_mask:
          description: Fields to update. Defaults to all fields.
          type: string
      type: object
    v1ListSemgrepRulesResponseList:
      properties:
        objects:
          items:
            $ref: '#/components/schemas/v1SemgrepRule'
          type: array
        response:
          $ref: '#/components/schemas/v1ListResponse'
      type: object
    v1GroupAggregationValueResponse:
      description: 'GroupAggregationValueResponse returns the value of the aggregation if

        requested.'
      properties:
        value:
          format: float
          type: number
      type: object
    v1EndorTarget:
      default: ENDOR_TARGET_UNSPECIFIED
      description: 'EndorTarget determines the origin of the files that will be analyzed by a

        rule.'
      enum:
      - ENDOR_TARGET_UNSPECIFIED
      - ENDOR_TARGET_PACKAGE
      - ENDOR_TARGET_REPOSITORY
      type: string
    v1SemgrepNativeRule:
      description: SemgrepNativeRule reflects the Semgrep rules as per the specification.
      properties:
        fix:
          type: string
        fix_regex:
          $ref: '#/components/schemas/v1SemgrepFixRegex'
        focus_metavariable:
          items:
            type: string
          type: array
        id:
          type: string
        languages:
          items:
            type: string
          type: array
        message:
          type: string
        metadata:
          $ref: '#/components/schemas/v1SemgrepRuleMeta'
        metavariable_pattern:
          $ref: '#/components/schemas/v1SemgrepMetavariablePattern'
        metavariable_regex:
          $ref: '#/components/schemas/v1SemgrepMetavariableRegex'
        min_version:
          type: string
        mode:
          type: string
        options:
          $ref: '#/components/schemas/v1SemgrepOptions'
        paths:
          $ref: '#/components/schemas/v1SemgrepPaths'
        pattern:
          type: string
        pattern_either:
          items:
            $ref: '#/components/schemas/v1SemgrepRulePatternType'
          type: array
        pattern_inside:
          type: string
        pattern_inside_either:
          items:
            $ref: '#/components/schemas/v1SemgrepRulePatternType'
          type: array
        pattern_not:
          items:
            $ref: '#/components/schemas/v1SemgrepRulePatternType'
          type: array
        pattern_propagators:
          items:
            $ref: '#/components/schemas/v1SemgrepRulePatternType'
          type: array
        pattern_regex:
          type: string
        pattern_sanitizers:
          items:
            $ref: '#/components/schemas/v1SemgrepRulePatternType'
          type: array
        pattern_sinks:
          items:
            $ref: '#/components/schemas/v1SemgrepRulePatternType'
          type: array
        pattern_sources:
          items:
            $ref: '#/components/schemas/v1SemgrepRulePatternType'
          type: array
        patterns:
          items:
            $ref: '#/components/schemas/v1SemgrepRulePatternType'
          type: array
        references:
          items:
            type: string
          type: array
        severity:
          type: string
      type: object
    v1SemgrepRuleMeta:
      properties:
        ai_provider:
          type: string
        asvs:
          $ref: '#/components/schemas/v1SemgrepMetaAsvs'
        author:
          type: string
        bandit_code:
          type: string
        category:
          type: string
        confidence:
          type: string
        confidence_level:
          $ref: '#/components/schemas/endorv1ConfidenceLevel'
        cwe:
          items:
            type: string
          type: array
        cwe2020_top25:
          type: boolean
        cwe2021_top25:
          type: boolean
        cwe2022_top25:
          type: boolean
        cwe2023_top25:
          type: boolean
        deprecated:
          type: boolean
        description:
          description: A description of the rule.
          type: string
        display_name:
          type: string
        endor_attack_examples:
          description: 'References to the description of an attack (if any) that used the

            respective code.'
          items:
            type: string
          type: array
        endor_category:
          description: 'Determines what a rule is used for (possible values: vulnerability,

            malware-detection, critical-api, or llm).'
          type: string
        endor_rule_origin:
          $ref: '#/components/schemas/v1EndorRuleOrigin'
        endor_tags:
          description: "ENDOR_TAG_SEMGREP_IGNORE\n  ENDOR_TAG_ANALYTICS_INFO\n  ENDOR_TAG_ANALYTICS_IMPACT"
          items:
            type: string
          title: 'Container for generic tags that control later processing of rule results.

            Certain ENDOR specific tags exist and are reserved for internal use, like:'
          type: array
        endor_targets:
          description: 'Determines whether a rule is run against the repository and/or package

            (possible values: package, repository).'
          items:
            $ref: '#/components/schemas/v1EndorTarget'
          type: array
        explanation:
          type: string
        functional_categories:
          items:
            type: string
          type: array
        help:
          type: string
        impact:
          type: string
        interfile:
          type: boolean
        license:
          type: string
        likelihood:
          type: string
        masvs:
          items:
            type: string
          type: array
        owasp:
          items:
            type: string
          type: array
        owaspapi:
          type: string
        precision:
          type: string
        references:
          items:
            type: string
          type: array
        remediation:
          type: string
        resources:
          items:
            type: string
          type: array
        rule_origin_note:
          type: string
        security_severity:
          type: string
        severity:
          type: string
        short_description:
          type: string
        source_rule_url:
          type: string
        source_url_open:
          type: string
        subcategory:
          items:
            type: string
          type: array
        tags:
          items:
            type: string
          type: array
        technology:
          items:
            type: string
          type: array
        version:
          description: The semantic version of this rule.
          type: string
        vulnerability:
          type: string
        vulnerability_class:
          items:
            type: string
          type: array
      title: Semgrep rule specifications
      type: object
    v1SemgrepEndpoints:
      properties:
        web:
          $ref: '#/components/schemas/v1SemgrepWeb'
      type: object
    v1SemgrepExposure:
      properties:
        exclude:
          items:
            type: string
