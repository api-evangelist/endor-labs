openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Security Review Pull Request…
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: SecurityReviewPullRequestService
paths:
  /v1/namespaces/{object.tenant_meta.namespace}/security-review-pull-requests:
    patch:
      description: Updates a security review pull request with the information in the request body.
      operationId: SecurityReviewPullRequestService_UpdateSecurityReviewPullRequest
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: object.tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityReviewPullRequestServiceUpdateSecurityReviewPullRequestBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1SecurityReviewPullRequest'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: UpdateSecurityReviewPullRequest
      tags:
      - SecurityReviewPullRequestService
      x-internal: true
  /v1/namespaces/{tenant_meta.namespace}/security-review-pull-requests:
    get:
      description: Lists the security review pull requests in a given namespace.
      operationId: SecurityReviewPullRequestService_ListSecurityReviewPullRequests
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: 'String of conditions to filter resources by.

          Filters may include any attribute along with the following operators:

          "==", "!=", ">", ">=", "<", "<=", "Contains", "In", "Matches", and

          "Exists". The logical operators "And" and "Or" are also supported.

          Expressions may be combined and grouped with parentheses.


          Examples:

          "spec.value == 5",

          "spec.value in ["a", "b", "c"]",

          "(meta.name == "xyz" and "spec.value in ["a","b"]) or (spec.value ==

          "c")".'
        in: query
        name: list_parameters.filter
        schema:
          type: string
      - description: 'Set the page token to start from.

          Use page tokens to page through list results or list specific pages.'
        in: query
        name: list_parameters.page_token
        schema:
          format: int32
          type: integer
      - description: 'Set the page size to limit the number of results returned.

          Default: 100. Max: 500.'
        in: query
        name: list_parameters.page_size
        schema:
          format: int32
          type: integer
      - description: Action to be executed with a request. Not supported for all endpoints.
        in: query
        name: list_parameters.action
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: list_parameters.mask
        schema:
          type: string
      - description: Get data from any child namespaces as well.
        in: query
        name: list_parameters.traverse
        schema:
          type: boolean
      - description: Field to sort objects by, for example, meta.name.
        in: query
        name: list_parameters.sort.path
        schema:
          type: string
      - description: 'Sort order. Default: ASC.'
        in: query
        name: list_parameters.sort.order
        schema:
          default: SORT_ENTRY_ORDER_UNSPECIFIED
          enum:
          - SORT_ENTRY_ORDER_UNSPECIFIED
          - SORT_ENTRY_ORDER_ASC
          - SORT_ENTRY_ORDER_DESC
          type: string
      - description: 'Return the number of objects matching the given list parameters.

          If count is set to true, the response is a CountResponse.

          Can be used together with filter and traverse.'
        in: query
        name: list_parameters.count
        schema:
          type: boolean
      - description: 'Group the objects based on this field.

          If there are multiple fields then the objects are grouped

          based on the uniqueness of all fields.

          Supports composite paths.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.aggregation_paths
        schema:
          type: string
      - description: 'Return the UUID of each object in each group as specified by

          aggregation_paths.'
        in: query
        name: list_parameters.group.show_aggregation_uuids
        schema:
          type: boolean
      - description: 'List of fields for which we want the unique count.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_count_paths
        schema:
          type: string
      - description: 'List of fields for which we want the unique values.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_value_paths
        schema:
          type: string
      - description: Only return objects from PR scans that match this context id.
        in: query
        name: list_parameters.ci_run_uuid
        schema:
          type: string
      - description: Page ID to retrieve.
        in: query
        name: list_parameters.page_id
        schema:
          type: string
      - description: 'Group the objects based on this time field,

          for example, meta.create_time.'
        in: query
        name: list_parameters.group_by_time.aggregation_paths
        schema:
          type: string
      - description: Return the UUIDs of the objects in each group.
        in: query
        name: list_parameters.group_by_time.show_aggregation_uuids
        schema:
          type: boolean
      - description: Interval unit by which the objects should be grouped.
        in: query
        name: list_parameters.group_by_time.interval
        schema:
          default: GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          enum:
          - GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          - GROUP_BY_TIME_INTERVAL_YEAR
          - GROUP_BY_TIME_INTERVAL_QUARTER
          - GROUP_BY_TIME_INTERVAL_MONTH
          - GROUP_BY_TIME_INTERVAL_WEEK
          - GROUP_BY_TIME_INTERVAL_DAY
          - GROUP_BY_TIME_INTERVAL_HOUR
          - GROUP_BY_TIME_INTERVAL_MINUTE
          - GROUP_BY_TIME_INTERVAL_SECOND
          type: string
      - description: 'Size of the time interval to group the objects by,

          for example, to group objects by 2-week intervals, set interval

          to GROUP_BY_TIME_INTERVAL_WEEK and group_size to 2.'
        in: query
        name: list_parameters.group_by_time.group_size
        schema:
          format: int32
          type: integer
      - description: 'Beginning of the time period to group objects.

          Defaults to the beginning of time.'
        in: query
        name: list_parameters.group_by_time.start_time
        schema:
          format: date-time
          type: string
      - description: 'End of the time period to group objects.

          Defaults to the current time.'
        in: query
        name: list_parameters.group_by_time.end_time
        schema:
          format: date-time
          type: string
      - description: 'The mode determines how the matching objects are counted

          in the produced time-series. Values allowed are:

          count (default) : is the number of items matching in every interval.

          sum: is the total number of items matching since the beginning of the

          aggregation time.'
        in: query
        name: list_parameters.group_by_time.mode
        schema:
          type: string
      - description: 'The aggregation_field is a field on the matched objects that we want to

          perform some operation in each interval (example : min, max, avg)'
        in: query
        name: list_parameters.group_by_time.aggregation_value_field
        schema:
          type: string
      - description: 'The aggreation_operator is the operator that we should use for the

          aggregation. Allowed values are: min, max, sum, avg'
        in: query
        name: list_parameters.group_by_time.aggregation_operator
        schema:
          type: string
      - description: 'If true, the results will not be paginated and

          only the first page will be returned. The order

          of the results is not guaranteed.'
        in: query
        name: list_parameters.disable_pagination
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListSecurityReviewPullRequestsResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: ListSecurityReviewPullRequests
      tags:
      - SecurityReviewPullRequestService
      x-internal: true
    post:
      description: 'Creates a security review pull request.


        The creation of the resource will be an upsert operation if the given spec.external_id and spec.platform_resource

        are already available.'
      operationId: SecurityReviewPullRequestService_CreateSecurityReviewPullRequest
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityReviewPullRequestServiceCreateSecurityReviewPullRequestBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1SecurityReviewPullRequest'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreateRepository
      tags:
      - SecurityReviewPullRequestService
      x-internal: true
  /v1/namespaces/{tenant_meta.namespace}/security-review-pull-requests/{uuid}:
    delete:
      description: Deletes a security review pull request specified by its UUID.
      operationId: SecurityReviewPullRequestService_DeleteSecurityReviewPullRequest
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the resource to be deleted.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: Action to be executed with delete request.
        in: query
        name: delete_parameters.action
        schema:
          type: string
      - description: 'Force will force the deletion of the resource if any

          checks fail.'
        in: query
        name: delete_parameters.force
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: DeleteSecurityReviewPullRequest
      tags:
      - SecurityReviewPullRequestService
      x-internal: true
    get:
      description: Fetches a security review pull request identified by a given UUID.
      operationId: SecurityReviewPullRequestService_GetSecurityReviewPullRequest
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the requested resource.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: get_parameters.mask
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1SecurityReviewPullRequest'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: GetSecurityReviewPullRequest
      tags:
      - SecurityReviewPullRequestService
      x-internal: true
components:
  schemas:
    SpecFindingsInfo:
      properties:
        critical_findings_count:
          description: Number of critical severity findings.
          format: int32
          type: integer
        high_findings_count:
          description: Number of high severity findings.
          format: int32
          type: integer
        low_findings_count:
          description: Number of low severity findings.
          format: int32
          type: integer
        medium_findings_count:
          description: Number of medium severity findings.
          format: int32
          type: integer
      type: object
    v1ListSecurityReviewPullRequestsResponseList:
      properties:
        objects:
          items:
            $ref: '#/components/schemas/v1SecurityReviewPullRequest'
          type: array
        response:
          $ref: '#/components/schemas/v1ListResponse'
      type: object
    PullRequestSecurityReviewResultInfoSecurityRelevantFunction:
      description: 'SecurityRelevantFunction represents a function or method that performs security-sensitive operations.

        or requires special security consideration during review.'
      properties:
        change_kind:
          $ref: '#/components/schemas/PullRequestSecurityReviewResultInfoChangeKind'
        description:
          title: Description of the function's purpose
          type: string
        name:
          title: Name of the function
          type: string
        security_labels:
          items:
            type: string
          title: Security classification or sensitivity level of the function
          type: array
      type: object
    GroupResponseGroupData:
      description: Information about objects matching the given key.
      properties:
        aggregation_count:
          $ref: '#/components/schemas/v1CountResponse'
        aggregation_uuids:
          description: 'List of UUIDs of the objects in the group.

            Only populated if show_aggregation_uuids is set.'
          items:
            type: string
          type: array
        aggregation_value:
          $ref: '#/components/schemas/v1GroupAggregationValueResponse'
        unique_counts:
          additionalProperties:
            $ref: '#/components/schemas/v1CountResponse'
          description: 'Map of counts for the given unique_count_paths fields.

            Only populated if unique_count_paths is set.'
          type: object
        unique_values:
          additionalProperties:
            items:
              type: object
            type: array
          description: 'Map of values for the given unique_value_paths fields.

            Only populated if unique_value_paths is set.'
          type: object
      type: object
    v1SecurityReviewPullRequest:
      description: SecurityReviewPullRequest represents a security review pull request.
      properties:
        context:
          $ref: '#/components/schemas/v1Context'
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1SecurityReviewPullRequestSpec'
        tenant_meta:
          $ref: '#/components/schemas/v1TenantMeta'
        uuid:
          description: The UUID of the security review pull request.
          readOnly: true
          type: string
      required:
      - meta
      - context
      type: object
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    v1IngestedObject:
      description: 'Raw ingested object from a 3rd party source,

        along with any additional metadata we want

        to add to the object.'
      properties:
        ingestion_time:
          description: Time the object was last ingested.
          format: date-time
          type: string
        raw:
          description: Generic representation of the object.
          type: object
        status:
          $ref: '#/components/schemas/IngestedObjectIngestedObjectStatus'
      required:
      - raw
      - ingestion_time
      - status
      type: object
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    v1UpdateRequest:
      description: Message used for all update requests.
      properties:
        force:
          description: 'Force will force the update of the resource if any

            checks fail.'
          type: boolean
        update_mask:
          description: Fields to update. Defaults to all fields.
          type: string
      type: object
    v1PlatformAccount:
      description: PlatformAccount represents an account of a user to third-party site like GitHub/Gitlab or some package platform.
      properties:
        ingested_object:
          $ref: '#/components/schemas/v1IngestedObject'
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1PlatformAccountSpec'
        tenant_meta:
          $ref: '#/components/schemas/v1TenantMeta'
        uuid:
          description: The UUID of a platform account.
          readOnly: true
          type: string
      required:
      - meta
      - ingested_object
      type: object
    v1GroupAggregationValueResponse:
      description: 'GroupAggregationValueResponse returns the value of the aggregation if

        requested.'
      properties:
        value:
          format: float
          type: number
      type: object
    PullRequestSecurityReviewResultInfoFileChanges:
      description: 'FileChanges tracks all modifications made to a specific file in the pull request.

        Provides a comprehensive view of how a file was changed and its security implications.'
      properties:
        added_lines:
          format: int32
          title: Number of lines added to the file
          type: integer
        change_kind:
          $ref: '#/components/schemas/PullRequestSecurityReviewResultInfoChangeKind'
        changed_functions:
          items:
            $ref: '#/components/schemas/PullRequestSecurityReviewResultInfoSecurityRelevantFunction'
          title: List of security-relevant functions affected
          type: array
        code_change_description:
          items:
            $ref: '#/components/schemas/PullRequestSecurityReviewResultInfoChangeDescription'
          title: Detailed descriptions of individual changes
          type: array
        path:
          title: Path to the modified file
          type: string
        purpose:
          title: Overall purpose or role of the file
          type: string
        removed_lines:
          format: int32
          title: Number of lines removed from the file
          type: integer
      type: object
    PullRequestSecurityReviewResultInfoSecurityReviewCategory:
      default: SECURITY_REVIEW_CATEGORY_UNSPECIFIED
      description: "SecurityCategory represents the different categories of security aspects that can be evaluated.\n\n - SECURITY_REVIEW_CATEGORY_UNSPECIFIED: Default when category is unknown\n - SECURITY_REVIEW_CATEGORY_DEPENDENCY: Integration of external code, packages, and frameworks\n - SECURITY_REVIEW_CATEGORY_ACCESS_CONTROL: Authentication, authorization mechanisms and session management\n - SECURITY_REVIEW_CATEGORY_API_ENDPOINT: API and service entry points\n - SECURITY_REVIEW_CATEGORY_DATABASE: Database architecture and security\n - SECURITY_REVIEW_CATEGORY_CRYPTOGRAPHIC: Cryptographic systems and implementations\n - SECURITY_REVIEW_CATEGORY_PAYMENT_PROCESSING: Payment processing and financial systems\n - SECURITY_REVIEW_CATEGORY_MEMORY_PROTECTION: Memory management and protection\n - SECURITY_REVIEW_CATEGORY_PII_DATA_HANDLING: Processing of PII and sensitive information\n - SECURITY_REVIEW_CATEGORY_INPUT_VALIDATION: Input validation and processing security\n - SECURITY_REVIEW_CATEGORY_INFRASTRUCTURE: Infrastructure security\n - SECURITY_REVIEW_CATEGORY_CI_CD: CI/CD pipeline security\n - SECURITY_REVIEW_CATEGORY_CONFIGURATION: Application and infrastructure configuration\n - SECURITY_REVIEW_CATEGORY_NETWORK: Network security and communication protocols\n - SECURITY_REVIEW_CATEGORY_AI: AI/LLM integration security\n - SECURITY_REVIEW_CATEGORY_IMPROVEMENT: Improvement to the security posture\n - SECURITY_REVIEW_CATEGORY_VULNERABILITY: Vulnerability found in the code\n - SECURITY_REVIEW_CATEGORY_BUG: Bug found in the code"
      enum:
      - SECURITY_REVIEW_CATEGORY_UNSPECIFIED
      - SECURITY_REVIEW_CATEGORY_DEPENDENCY
      - SECURITY_REVIEW_CATEGORY_ACCESS_CONTROL
      - SECURITY_REVIEW_CATEGORY_API_ENDPOINT
      - SECURITY_REVIEW_CATEGORY_DATABASE
      - SECURITY_REVIEW_CATEGORY_CRYPTOGRAPHIC
      - SECURITY_REVIEW_CATEGORY_PAYMENT_PROCESSING
      - SECURITY_REVIEW_CATEGORY_MEMORY_PROTECTION
      - SECURITY_REVIEW_CATEGORY_PII_DATA_HANDLING
      - SECURITY_REVIEW_CATEGORY_INPUT_VALIDATION
      - SECURITY_REVIEW_CATEGORY_INFRASTRUCTURE
      - SECURITY_REVIEW_CATEGORY_CI_CD
      - SECURITY_REVIEW_CATEGORY_CONFIGURATION
      - SECURITY_REVIEW_CATEGORY_NETWORK
      - SECURITY_REVIEW_CATEGORY_AI
      - SECURITY_REVIEW_CATEGORY_IMPROVEMENT
      - SECURITY_REVIEW_CATEGORY_VULNERABILITY
      - SECURITY_REVIEW_CATEGORY_BUG
      type: string
    v1Context:
      description: Contexts keep objects from different scans separated.
      properties:
        id:
          description: The context ID, such as a pull request ID or branch reference.
          type: string
        tags:
          description: 'A list of tags applied to a context. Used primarily for CI and SBOM

            contexts.'
          items:
            type: string
          type: array
        type:
          $ref: '#/components/schemas/ContextContextType'
        will_be_deleted_at:
          description: 'Time that all objects in this context will be deleted.

            This field is deprecated and will be removed in the future.

            Please use the meta.will_be_deleted_at field instead.'
          format: date-time
          readOnly: true
          type: string
      required:
      - type
      - id
      type: object
    SecurityReviewPullRequestServiceCreateSecurityReviewPullRequestBody:
      description: SecurityReviewPullRequest represents a security review pull request.
      properties:
        context:
          $ref: '#/components/schemas/v1Context'
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1SecurityReviewPullRequestSpec'
        tenant_meta:
          description: Security review pull requests are associated with a tenant.
          title: Security review pull requests are associated with a tenant.
          type: object
        uuid:
          description: The UUID of the security review pull request.
          readOnly: true
          type: string
      required:
      - meta
      - context
      type: object
    IngestedObjectIngestedObjectStatus:
      default: INGESTED_OBJECT_STATUS_UNSPECIFIED
      description: ' - INGESTED_OBJECT_STATUS_LIGHT: Example: Use when a user exists because they are attached to a commit,

        but are not found on a direct lookup.'
      enum:
      - INGESTED_OBJECT_STATUS_UNSPECIFIED
      - INGESTED_OBJECT_STATUS_FOUND
      - INGESTED_OBJECT_STATUS_NOT_FOUND
      - INGESTED_OBJECT_STATUS_LIGHT
      type: string
    SpecCodeChanges:
      properties:
        added_lines:
          description: The number of added lines in the security review pull request.
          format: int32
          type: integer
        description:
          description: The description of the code changes.
          type: string
        file_changes:
          additionalProperties:
            $ref: '#/components/schemas/PullRequestSecurityReviewResultInfoFileChanges'
          description: 'The file changes in the security review pull request.

            The key is the file path and the value is the file changes.'
          type: object
        removed_lines:
          description: The number of removed lines in the security review pull request.
          format: int32
          type: integer
      type: object
    v1TenantMeta:
      description: Tenant related data for the tenant containing the resource.
      properties:
        namespace:
          description: 'Namespaces are a way to organize organizational units into virtual

            groupings of resources. Namespaces must be a fully qualified name,

            for example, the child namespace of namespace "endor.prod" called "app"

            is called "endor.prod.app".'
          type: string
      required:
      - namespace
      type: object
    SecurityReviewPullRequestSpecAnalysisIssue:
      properties:
        errors:
          description: Error messages related to this issue.
          items:
            type: string
          type: array
        skipped_files:
          description: Files that were skipped due to this issue.
          items:
            type: string
          type: array
        summarized_files:
          description: Files that were grouped together and summarized due to this issue.
          items:
            type: string
          type: array
        type:
          $ref: '#/components/schemas/SpecIssueType'
      type: object
    PullRequestSecurityReviewResultInfoChangeKind:
      default: CHANGE_KIND_UNSPECIFIED
