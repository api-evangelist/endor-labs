      - FINDING_CATEGORY_TOOLS
      - FINDING_CATEGORY_GHACTIONS
      - FINDING_CATEGORY_CONTAINER
      - FINDING_CATEGORY_SAST
      - FINDING_CATEGORY_AI_MODELS
      - FINDING_CATEGORY_SECURITY_REVIEW
      - FINDING_CATEGORY_SCA
      type: string
    v1ContainerBaseImageUpdateImpactRecordsQuerySeverity:
      default: SEVERITY_UNSPECIFIED
      description: "A severity bucket to page (the severity view).\n\n - SEVERITY_UNSPECIFIED: The severity was not set.\n - SEVERITY_CRITICAL: Critical-severity findings.\n - SEVERITY_HIGH: High-severity findings.\n - SEVERITY_MEDIUM: Medium-severity findings.\n - SEVERITY_LOW: Low-severity findings.\n - SEVERITY_NONE: Findings that carry no severity level, which a finding policy can emit.\nThey are counted in the totals but belong to none of the buckets above,\nso a caller sweeping every record has to ask for them by name."
      enum:
