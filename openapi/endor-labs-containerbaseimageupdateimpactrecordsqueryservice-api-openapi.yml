    v1FindingRecordScope:
      default: FINDING_RECORD_SCOPE_UNSPECIFIED
      description: "Which finding types populate the record-level fixed/introduced lists. Shared\nby the impact query, the records drill-down query, and the container context\ndiff queries. The severity/reachability COUNT fields are always computed both\nways (all_counts and vuln_counts); this selects only which findings appear in\nthe record lists and, correspondingly, which totals those record views\nreconcile against.\n\n - FINDING_RECORD_SCOPE_UNSPECIFIED: Unset; treated as FINDING_RECORD_SCOPE_ALL.\n - FINDING_RECORD_SCOPE_ALL: All finding types. Record views reconcile with all_counts / all_changes.\n - FINDING_RECORD_SCOPE_VULNERABILITY: Vulnerability findings only. Record views reconcile with vuln_counts /\nvuln_changes."
      enum:
      - FINDING_RECORD_SCOPE_UNSPECIFIED
      - FINDING_RECORD_SCOPE_ALL
      - FINDING_RECORD_SCOPE_VULNERABILITY
      type: string
    v1Meta:
      description: Common fields for all Endor Labs resources.
      properties:
        annotations:
