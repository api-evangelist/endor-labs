        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1ContainerBaseImageUpdateImpactRecordsQuerySpec'
        tenant_meta:
          description: The query is scoped to a tenant.
          title: The query is scoped to a tenant.
          type: object
        uuid:
          description: The UUID of the query.
          readOnly: true
          type: string
      required:
      - meta
      type: object
