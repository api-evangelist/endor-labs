openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Linter Result Service API
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: LinterResultService
paths:
  /v1/namespaces/{object.tenant_meta.namespace}/linter-results:
    patch:
      description: Updates a linter result.
      operationId: LinterResultService_UpdateLinterResult
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: object.tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinterResultServiceUpdateLinterResultBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1LinterResult'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: UpdateLinterResult
      tags:
      - LinterResultService
      x-internal: true
  /v1/namespaces/{tenant_meta.namespace}/linter-results:
    get:
      description: Lists all linter results.
      operationId: LinterResultService_ListLinterResults
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: 'String of conditions to filter resources by.

          Filters may include any attribute along with the following operators:

          "==", "!=", ">", ">=", "<", "<=", "Contains", "In", "Matches", and

          "Exists". The logical operators "And" and "Or" are also supported.

          Expressions may be combined and grouped with parentheses.


          Examples:

          "spec.value == 5",

          "spec.value in ["a", "b", "c"]",

          "(meta.name == "xyz" and "spec.value in ["a","b"]) or (spec.value ==

          "c")".'
        in: query
        name: list_parameters.filter
        schema:
          type: string
      - description: 'Set the page token to start from.

          Use page tokens to page through list results or list specific pages.'
        in: query
        name: list_parameters.page_token
        schema:
          format: int32
          type: integer
      - description: 'Set the page size to limit the number of results returned.

          Default: 100. Max: 500.'
        in: query
        name: list_parameters.page_size
        schema:
          format: int32
          type: integer
      - description: Action to be executed with a request. Not supported for all endpoints.
        in: query
        name: list_parameters.action
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: list_parameters.mask
        schema:
          type: string
      - description: Get data from any child namespaces as well.
        in: query
        name: list_parameters.traverse
        schema:
          type: boolean
      - description: Field to sort objects by, for example, meta.name.
        in: query
        name: list_parameters.sort.path
        schema:
          type: string
      - description: 'Sort order. Default: ASC.'
        in: query
        name: list_parameters.sort.order
        schema:
          default: SORT_ENTRY_ORDER_UNSPECIFIED
          enum:
          - SORT_ENTRY_ORDER_UNSPECIFIED
          - SORT_ENTRY_ORDER_ASC
          - SORT_ENTRY_ORDER_DESC
          type: string
      - description: 'Return the number of objects matching the given list parameters.

          If count is set to true, the response is a CountResponse.

          Can be used together with filter and traverse.'
        in: query
        name: list_parameters.count
        schema:
          type: boolean
      - description: 'Group the objects based on this field.

          If there are multiple fields then the objects are grouped

          based on the uniqueness of all fields.

          Supports composite paths.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.aggregation_paths
        schema:
          type: string
      - description: 'Return the UUID of each object in each group as specified by

          aggregation_paths.'
        in: query
        name: list_parameters.group.show_aggregation_uuids
        schema:
          type: boolean
      - description: 'List of fields for which we want the unique count.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_count_paths
        schema:
          type: string
      - description: 'List of fields for which we want the unique values.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_value_paths
        schema:
          type: string
      - description: Only return objects from PR scans that match this context id.
        in: query
        name: list_parameters.ci_run_uuid
        schema:
          type: string
      - description: Page ID to retrieve.
        in: query
        name: list_parameters.page_id
        schema:
          type: string
      - description: 'Group the objects based on this time field,

          for example, meta.create_time.'
        in: query
        name: list_parameters.group_by_time.aggregation_paths
        schema:
          type: string
      - description: Return the UUIDs of the objects in each group.
        in: query
        name: list_parameters.group_by_time.show_aggregation_uuids
        schema:
          type: boolean
      - description: Interval unit by which the objects should be grouped.
        in: query
        name: list_parameters.group_by_time.interval
        schema:
          default: GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          enum:
          - GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          - GROUP_BY_TIME_INTERVAL_YEAR
          - GROUP_BY_TIME_INTERVAL_QUARTER
          - GROUP_BY_TIME_INTERVAL_MONTH
          - GROUP_BY_TIME_INTERVAL_WEEK
          - GROUP_BY_TIME_INTERVAL_DAY
          - GROUP_BY_TIME_INTERVAL_HOUR
          - GROUP_BY_TIME_INTERVAL_MINUTE
          - GROUP_BY_TIME_INTERVAL_SECOND
          type: string
      - description: 'Size of the time interval to group the objects by,

          for example, to group objects by 2-week intervals, set interval

          to GROUP_BY_TIME_INTERVAL_WEEK and group_size to 2.'
        in: query
        name: list_parameters.group_by_time.group_size
        schema:
          format: int32
          type: integer
      - description: 'Beginning of the time period to group objects.

          Defaults to the beginning of time.'
        in: query
        name: list_parameters.group_by_time.start_time
        schema:
          format: date-time
          type: string
      - description: 'End of the time period to group objects.

          Defaults to the current time.'
        in: query
        name: list_parameters.group_by_time.end_time
        schema:
          format: date-time
          type: string
      - description: 'The mode determines how the matching objects are counted

          in the produced time-series. Values allowed are:

          count (default) : is the number of items matching in every interval.

          sum: is the total number of items matching since the beginning of the

          aggregation time.'
        in: query
        name: list_parameters.group_by_time.mode
        schema:
          type: string
      - description: 'The aggregation_field is a field on the matched objects that we want to

          perform some operation in each interval (example : min, max, avg)'
        in: query
        name: list_parameters.group_by_time.aggregation_value_field
        schema:
          type: string
      - description: 'The aggreation_operator is the operator that we should use for the

          aggregation. Allowed values are: min, max, sum, avg'
        in: query
        name: list_parameters.group_by_time.aggregation_operator
        schema:
          type: string
      - description: 'If true, the results will not be paginated and

          only the first page will be returned. The order

          of the results is not guaranteed.'
        in: query
        name: list_parameters.disable_pagination
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListLinterResultsResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: ListLinterResults
      tags:
      - LinterResultService
      x-internal: false
    post:
      description: Creates a Semgrep rule.
      operationId: LinterResultService_CreateLinterResult
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinterResultServiceCreateLinterResultBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1LinterResult'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreateLinterResult
      tags:
      - LinterResultService
      x-internal: true
  /v1/namespaces/{tenant_meta.namespace}/linter-results/{uuid}:
    delete:
      description: Deletes the linter result specified by the UUID.
      operationId: LinterResultService_DeleteLinterResult
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the resource to be deleted.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: Action to be executed with delete request.
        in: query
        name: delete_parameters.action
        schema:
          type: string
      - description: 'Force will force the deletion of the resource if any

          checks fail.'
        in: query
        name: delete_parameters.force
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: DeleteLinterResult
      tags:
      - LinterResultService
      x-internal: true
    get:
      description: Fetches the linter result identified by the UUID.
      operationId: LinterResultService_GetLinterResult
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the requested resource.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: get_parameters.mask
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1LinterResult'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: GetLinterResult
      tags:
      - LinterResultService
      x-internal: false
components:
  schemas:
    v1SarifResult:
      properties:
        code_flows:
          description: Code flow object representing a sequence of code locations that specify a data flow path.
          items:
            $ref: '#/components/schemas/v1SarifCodeFlow'
          type: array
        fingerprints:
          $ref: '#/components/schemas/v1SarifFingerprint'
        level:
          title: Severity level of the notification (e.g., "error", "warning")
          type: string
        locations:
          items:
            $ref: '#/components/schemas/v1SarifLocation'
          title: List of locations in the code where the finding was detected
          type: array
        message:
          $ref: '#/components/schemas/v1SarifText'
        partial_fingerprints:
          $ref: '#/components/schemas/v1SarifFingerprint'
        properties:
          $ref: '#/components/schemas/v1SarifResultProperty'
        rule_id:
          title: Unique identifier of the rule that triggered this result
          type: string
        suppressions:
          items:
            $ref: '#/components/schemas/v1SarifSuppression'
          type: array
      type: object
    v1SarifSuppression:
      properties:
        kind:
          $ref: '#/components/schemas/v1SarifSuppressionKind'
      type: object
    v1AISASTContextRegion:
      description: 'A source region whose content is hashed so a scheduled AI SAST refresh can

        detect whether that region changed since the finding was last scanned.'
      properties:
        content_hash:
          description: SHA-256 hex hash of the region's source at scan time.
          type: string
        location:
          $ref: '#/components/schemas/v1SourceLocation'
      type: object
    LinterResultServiceUpdateLinterResultBody:
      description: Request to update a linter result.
      properties:
        object:
          description: The meta parent_kind can take one of two values - PackageVersion or RepositoryVersion.
          properties:
            context:
              $ref: '#/components/schemas/v1Context'
            meta:
              $ref: '#/components/schemas/v1Meta'
            spec:
              $ref: '#/components/schemas/v1LinterResultSpec'
            tenant_meta:
              description: Linter results are associated with a tenant and namespace.
              title: Linter results are associated with a tenant and namespace.
              type: object
            uuid:
              description: The UUID of a linter result.
              readOnly: true
              type: string
          type: object
        request:
          $ref: '#/components/schemas/v1UpdateRequest'
      required:
      - meta
      - spec
      - context
      type: object
    v1SarifReportingDescriptorReference:
      description: A reference to a reporting descriptor.
      properties:
        guid:
          description: The globally unique identifier for the referenced reporting descriptor.
          type: string
        id:
          description: The id of the referenced reporting descriptor.
          type: string
        index:
          description: The index of the referenced reporting descriptor in the toolComponent.rules array.
          format: int32
          type: integer
        tool_component:
          $ref: '#/components/schemas/v1SarifToolComponentReference'
      type: object
    v1LinterCorrectnessAnalysis:
      description: LinterCorrectnessAnalysis represents an analysis of a linter result.
      properties:
        analysis_summary:
          description: Analysis summary, providing an explanation of the linter result and classification.
          type: string
        analyzer:
          $ref: '#/components/schemas/v1CorrectnessAnalyzer'
        code_fixes:
          description: Code fixes are potential fixes to the identified issue.
          items:
            $ref: '#/components/schemas/LinterCorrectnessAnalysisCodeFix'
          type: array
        code_references:
          description: Textual description of line references/ fields/variables , etc for the linter result.
          type: string
        confidence_level:
          $ref: '#/components/schemas/v1AIMetaConfidenceLevel'
        content_hash:
          description: 'sha256 over the source spans (finding location + taint dataflow) this analysis

            was computed against; a mismatch on rescan invalidates the cached verdict and

            forces re-analysis of the result.'
          type: string
        correctness:
          $ref: '#/components/schemas/v1Correctness'
        data_flow:
          description: Textual Description of the source to sink data flow analysis for the linter result.
          items:
            $ref: '#/components/schemas/LinterCorrectnessAnalysisDataFlowNode'
          type: array
        description:
          description: The textual description of the linter correctness analysis.
          type: string
        risk_assessment:
          description: Risk assessment for the linter result. Provides False/True positive classifaction and reasoning for the linter result..
          type: string
        sanitizers:
          description: The sanitizers used to determine the correctness of the linter result.
          items:
            type: string
          type: array
        security_control:
          description: Description of any sanitizers, validators, or mitigations found (or lack thereof) for the linter result.
          type: string
        security_impact:
          description: Description of the security impact/potential consequences for the linter result.
          type: string
        symbols:
          description: Key variables/symbols in the data flow path for the linter result.
          type: string
        technical_detail:
          description: Further technical details (eg results about the vulnerability type and exploitation potential) for the linter result.
          type: string
        version:
          description: The version of the linter correctness analysis.
          type: string
      required:
      - version
      - analyzer
      - correctness
      - confidence_level
      type: object
    v1SarifArtifactContent:
      description: Represents content of an artifact.
      properties:
        binary:
          title: Base64-encoded content
          type: string
        rendered:
          $ref: '#/components/schemas/v1SarifText'
        text:
          title: UTF-8 encoded content
          type: string
      type: object
    v1FindingClassification:
      default: FINDING_CLASSIFICATION_UNSPECIFIED
      description: "Classification of the finding type. Extensible for future categories.\n\n - FINDING_CLASSIFICATION_SECURITY_VULNERABILITY: Security vulnerability (e.g. SQL injection, XSS, hardcoded creds).\n - FINDING_CLASSIFICATION_LOGICAL_BUG: Logical bug (e.g. null pointer, resource leak, race condition)."
      enum:
      - FINDING_CLASSIFICATION_UNSPECIFIED
      - FINDING_CLASSIFICATION_SECURITY_VULNERABILITY
      - FINDING_CLASSIFICATION_LOGICAL_BUG
      type: string
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    v1SemgrepWeb:
      properties:
        exposure:
          $ref: '#/components/schemas/v1SemgrepExposure'
      type: object
    v1SarifSuppressionKind:
      default: KIND_UNSPECIFIED
      description: " - KIND_IN_SOURCE: Suppression is in the source code.\n - KIND_EXTERNAL: Suppression is external to the source code."
      enum:
      - KIND_UNSPECIFIED
      - KIND_IN_SOURCE
      - KIND_EXTERNAL
      type: string
    LinterCorrectnessAnalysisCodeFix:
      description: CodeFix represents a potential fix to a determined true positive linter result.
      properties:
        file_path:
          description: The file path of the code fix.
          type: string
        line_end:
          description: The end line number of the code fix.
          format: int32
          type: integer
        line_start:
          description: The start line number of the code fix.
          format: int32
          type: integer
        patch:
          description: The code fix to be applied.
          type: string
      required:
      - patch
      - file_path
      - line_start
      - line_end
      type: object
    v1AISastSummary:
      description: AI SAST summary.
      properties:
        call_stack:
          description: The path (call stack) of the vulnerable code.
          items:
            $ref: '#/components/schemas/v1LocationWithName'
          type: array
        cwe:
          description: The CWE of the vulnerability.
          type: string
        explanation:
          description: Free-form explanation of the vulnerability.
          type: string
        sanitizer_callsites:
          description: This are the locations of the callsites that are used to mitigate the vulnerability.
          items:
            $ref: '#/components/schemas/v1LocationWithName'
          type: array
        sanitizer_definitions:
          description: The sanitizer definitions locations that are used to mitigate the vulnerability.
          items:
            $ref: '#/components/schemas/v1LocationWithName'
          type: array
        semgrep_sink_trigger:
          $ref: '#/components/schemas/v1SemgrepTriggerPattern'
        semgrep_source_trigger:
          $ref: '#/components/schemas/v1SemgrepTriggerPattern'
      required:
      - call_stack
      - cwe
      - explanation
      type: object
    v1SemgrepRulePatternType:
      properties:
        by_side_effect:
          type: boolean
        exact:
          type: boolean
        focus_metavariable:
          items:
            type: string
          type: array
        from:
          type: string
        label:
          type: string
        management:
          $ref: '#/components/schemas/v1SemgrepManagement'
        metavariable_analysis:
          $ref: '#/components/schemas/v1SemgrepMetavariableAnalysis'
        metavariable_comparison:
          $ref: '#/components/schemas/v1SemgrepMetavariableComparison'
        metavariable_pattern:
          $ref: '#/components/schemas/v1SemgrepMetavariablePattern'
        metavariable_regex:
          $ref: '#/components/schemas/v1SemgrepMetavariableRegex'
        metavariable_type:
          $ref: '#/components/schemas/v1SemgrepMetavariableType'
        not_conflicting:
          type: boolean
        pattern:
          type: string
        pattern_either_new:
          items:
            $ref: '#/components/schemas/v1SemgrepRulePatternType'
          type: array
        pattern_inside:
          type: string
        pattern_inside_either:
          items:
            $ref: '#/components/schemas/v1SemgrepRulePatternType'
          type: array
        pattern_not:
          type: string
        pattern_not_inside:
          type: string
        pattern_not_regex:
          type: string
        pattern_regex:
          type: string
        patterns:
          items:
            $ref: '#/components/schemas/v1SemgrepRulePatternType'
          type: array
        requires:
          type: string
        to:
          type: string
      type: object
    v1SarifStackFrame:
      description: A single stack frame.
      properties:
        location:
          $ref: '#/components/schemas/v1SarifLocation'
        module:
          title: The name of the module that contains the location to which this stack frame refers
          type: string
        parameters:
          items:
            type: string
          title: The parameters passed to the function
          type: array
        thread_id:
          format: int32
          title: The thread identifier
          type: integer
      type: object
    SpecEndorFingerprint:
      description: 'An engine independent and rule agnostic fingerprint computed based on

        source location information.'
      properties:
        values:
          description: The fingerprint values.
          items:
            type: string
          type: array
      type: object
    v1SemgrepSummary:
      description: Semgrep summary.
      properties:
        ai_provider:
          type: string
        confidence:
          type: string
        cwes:
          items:
            type: string
          type: array
        description:
          type: string
        explanation:
          type: string
        impact:
          type: string
        languages:
          items:
            type: string
          type: array
        likelihood:
          type: string
        references:
          items:
            type: string
          type: array
        remediation:
          type: string
        rule_name:
          type: string
        rule_uuid:
          type: string
        rule_version:
          type: string
        severity:
          type: string
        tags:
          items:
            type: string
          type: array
      type: object
    SpecCVSSVersion:
      default: CVSS_VERSION_UNSPECIFIED
      description: The CVSS version.
      enum:
      - CVSS_VERSION_UNSPECIFIED
      - CVSS_VERSION_V2
      - CVSS_VERSION_V3
      - CVSS_VERSION_V4
      type: string
    v1SemgrepManagement:
      properties:
        endpoints:
          $ref: '#/components/schemas/v1SemgrepEndpoints'
      type: object
    v1SarifRelationship:
      description: A relationship between two locations.
      properties:
        description:
          $ref: '#/components/schemas/v1SarifText'
        kinds:
          description: A set of strings that describe the relationship.
          items:
            type: string
          type: array
        properties:
          description: Key/value pairs that provide additional information about the relationship.
          type: object
        target:
          description: The id of the location that is the target of the relationship.
          format: int32
          type: integer
      type: object
    v1SemgrepMetavariableType:
      properties:
        metavariable:
          type: string
        type:
          type: string
      type: object
    v1LocationType:
      default: LOCATION_TYPE_UNSPECIFIED
      description: "Classification of the location type within a data flow path.\n\n - LOCATION_TYPE_SOURCE: The source location.\n - LOCATION_TYPE_SINK: The sink location.\n - LOCATION_TYPE_INTERMEDIATE: The intermediate location.\n - LOCATION_TYPE_LOGICAL_BUG: The logical bug location."
      enum:
      - LOCATION_TYPE_UNSPECIFIED
      - LOCATION_TYPE_SOURCE
      - LOCATION_TYPE_SINK
      - LOCATION_TYPE_INTERMEDIATE
      - LOCATION_TYPE_LOGICAL_BUG
      type: string
    LinterResultServiceCreateLinterResultBody:
      description: The meta parent_kind can take one of two values - PackageVersion or RepositoryVersion.
      properties:
