openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Telemetry Service API
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: TelemetryService
paths:
  /v1/namespaces/{tenant_meta.namespace}/telemetries:
    post:
      description: Creates a telemetry.
      operationId: TelemetryService_CreateTelemetry
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryServiceCreateTelemetryBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Telemetry'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreateTelemetry
      tags:
      - TelemetryService
      x-internal: true
components:
  schemas:
    clientBucketSpan:
      description: 'A BucketSpan defines a number of consecutive buckets in a native

        histogram with their offset. Logically, it would be more

        straightforward to include the bucket counts in the Span. However,

        the protobuf representation is more compact in the way the data is

        structured here (with all the buckets in a single array separate

        from the Spans).'
      properties:
        length:
          description: Length of consecutive buckets.
          format: int64
          type: integer
        offset:
          description: Gap to previous span, or starting point for 1st span (which can be negative).
          format: int32
          type: integer
      type: object
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    clientUntyped:
      properties:
        value:
          format: double
          type: number
      type: object
    clientGauge:
      properties:
        value:
          format: double
          type: number
      type: object
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    prometheusclientMetric:
      properties:
        counter:
          $ref: '#/components/schemas/clientCounter'
        gauge:
          $ref: '#/components/schemas/clientGauge'
        histogram:
          $ref: '#/components/schemas/clientHistogram'
        label:
          items:
            $ref: '#/components/schemas/clientLabelPair'
          type: array
        summary:
          $ref: '#/components/schemas/clientSummary'
        timestamp_ms:
          format: int64
          type: string
        untyped:
          $ref: '#/components/schemas/clientUntyped'
      type: object
    TelemetryServiceCreateTelemetryBody:
      description: Telemetry represents the Prometheus metrics obtained from endorctl processes.
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1TelemetrySpec'
        tenant_meta:
          description: Namespace of the message that is accessed.
          title: Namespace of the message that is accessed.
          type: object
        uuid:
          description: The UUID of the telemetry.
          readOnly: true
          type: string
      required:
      - meta
      - spec
      type: object
    clientMetricType:
      default: COUNTER
      description: " - COUNTER: COUNTER must use the Metric field \"counter\".\n - GAUGE: GAUGE must use the Metric field \"gauge\".\n - SUMMARY: SUMMARY must use the Metric field \"summary\".\n - UNTYPED: UNTYPED must use the Metric field \"untyped\".\n - HISTOGRAM: HISTOGRAM must use the Metric field \"histogram\".\n - GAUGE_HISTOGRAM: GAUGE_HISTOGRAM must use the Metric field \"histogram\"."
      enum:
      - COUNTER
      - GAUGE
      - SUMMARY
      - UNTYPED
      - HISTOGRAM
      - GAUGE_HISTOGRAM
      type: string
    clientLabelPair:
      properties:
        name:
          type: string
        value:
          type: string
      type: object
    clientSummary:
      properties:
        created_timestamp:
          format: date-time
          type: string
        quantile:
          items:
            $ref: '#/components/schemas/clientQuantile'
          type: array
        sample_count:
          format: uint64
          type: string
        sample_sum:
          format: double
          type: number
      type: object
    v1TenantMeta:
      description: Tenant related data for the tenant containing the resource.
      properties:
        namespace:
          description: 'Namespaces are a way to organize organizational units into virtual

            groupings of resources. Namespaces must be a fully qualified name,

            for example, the child namespace of namespace "endor.prod" called "app"

            is called "endor.prod.app".'
          type: string
      required:
      - namespace
      type: object
    clientHistogram:
      properties:
        bucket:
          description: 'Buckets for the conventional histogram.


            Ordered in increasing order of upper_bound, +Inf bucket is optional.'
          items:
            $ref: '#/components/schemas/clientBucket'
          type: array
        created_timestamp:
          format: date-time
          type: string
        exemplars:
          description: Only used for native histograms. These exemplars MUST have a timestamp.
          items:
            $ref: '#/components/schemas/clientExemplar'
          type: array
        negative_count:
          description: Absolute count of each bucket.
          items:
            format: double
            type: number
          type: array
        negative_delta:
          description: 'Use either "negative_delta" or "negative_count", the former for

            regular histograms with integer counts, the latter for float

            histograms.


            Count delta of each bucket compared to previous one (or to zero for 1st bucket).'
          items:
            format: int64
            type: string
          type: array
        negative_span:
          description: Negative buckets for the native histogram.
          items:
            $ref: '#/components/schemas/clientBucketSpan'
          type: array
        positive_count:
          description: Absolute count of each bucket.
          items:
            format: double
            type: number
          type: array
        positive_delta:
          description: 'Use either "positive_delta" or "positive_count", the former for

            regular histograms with integer counts, the latter for float

            histograms.


            Count delta of each bucket compared to previous one (or to zero for 1st bucket).'
          items:
            format: int64
            type: string
          type: array
        positive_span:
          description: 'Positive buckets for the native histogram.

            Use a no-op span (offset 0, length 0) for a native histogram without any

            observations yet and with a zero_threshold of 0. Otherwise, it would be

            indistinguishable from a classic histogram.'
          items:
            $ref: '#/components/schemas/clientBucketSpan'
          type: array
        sample_count:
          format: uint64
          type: string
        sample_count_float:
          description: Overrides sample_count if > 0.
          format: double
          type: number
        sample_sum:
          format: double
          type: number
        schema:
          description: 'schema defines the bucket schema. Currently, valid numbers are -4 <= n <= 8.

            They are all for base-2 bucket schemas, where 1 is a bucket boundary in each case, and

            then each power of two is divided into 2^n logarithmic buckets.

            Or in other words, each bucket boundary is the previous boundary times 2^(2^-n).

            In the future, more bucket schemas may be added using numbers < -4 or > 8.'
          format: int32
          type: integer
        zero_count:
          description: Count in zero bucket.
          format: uint64
          type: string
        zero_count_float:
          description: Overrides sb_zero_count if > 0.
          format: double
          type: number
        zero_threshold:
          description: Breadth of the zero bucket.
          format: double
          type: number
      type: object
    clientQuantile:
      properties:
        quantile:
          format: double
          type: number
        value:
          format: double
          type: number
      type: object
    clientMetricFamily:
      properties:
        help:
          type: string
        metric:
          items:
            $ref: '#/components/schemas/prometheusclientMetric'
          type: array
        name:
          type: string
        type:
          $ref: '#/components/schemas/clientMetricType'
        unit:
          type: string
      type: object
    googleprotobufAny:
      additionalProperties: {}
      description: "`Any` contains an arbitrary serialized protocol buffer message along with a\nURL that describes the type of the serialized message.\n\nProtobuf library provides support to pack/unpack Any values in the form\nof utility functions or additional generated methods of the Any type.\n\nExample 1: Pack and unpack a message in C++.\n\n    Foo foo = ...;\n    Any any;\n    any.PackFrom(foo);\n    ...\n    if (any.UnpackTo(&foo)) {\n      ...\n    }\n\nExample 2: Pack and unpack a message in Java.\n\n    Foo foo = ...;\n    Any any = Any.pack(foo);\n    ...\n    if (any.is(Foo.class)) {\n      foo = any.unpack(Foo.class);\n    }\n    // or ...\n    if (any.isSameTypeAs(Foo.getDefaultInstance())) {\n      foo = any.unpack(Foo.getDefaultInstance());\n    }\n\n Example 3: Pack and unpack a message in Python.\n\n    foo = Foo(...)\n    any = Any()\n    any.Pack(foo)\n    ...\n    if any.Is(Foo.DESCRIPTOR):\n      any.Unpack(foo)\n      ...\n\n Example 4: Pack and unpack a message in Go\n\n     foo := &pb.Foo{...}\n     any, err := anypb.New(foo)\n     if err != nil {\n       ...\n     }\n     ...\n     foo := &pb.Foo{}\n     if err := any.UnmarshalTo(foo); err != nil {\n       ...\n     }\n\nThe pack methods provided by protobuf library will by default use\n'type.googleapis.com/full.type.name' as the type URL and the unpack\nmethods only use the fully qualified type name after the last '/'\nin the type URL, for example \"foo.bar.com/x/y.z\" will yield type\nname \"y.z\".\n\nJSON\n====\nThe JSON representation of an `Any` value uses the regular\nrepresentation of the deserialized, embedded message, with an\nadditional field `@type` which contains the type URL. Example:\n\n    package google.profile;\n    message Person {\n      string first_name = 1;\n      string last_name = 2;\n    }\n\n    {\n      \"@type\": \"type.googleapis.com/google.profile.Person\",\n      \"firstName\": <string>,\n      \"lastName\": <string>\n    }\n\nIf the embedded message type is well-known and has a custom JSON\nrepresentation, that representation will be embedded adding a field\n`value` which holds the custom JSON in addition to the `@type`\nfield. Example (for message [google.protobuf.Duration][]):\n\n    {\n      \"@type\": \"type.googleapis.com/google.protobuf.Duration\",\n      \"value\": \"1.212s\"\n    }"
      properties:
        '@type':
          description: "A URL/resource name that uniquely identifies the type of the serialized\nprotocol buffer message. This string must contain at least\none \"/\" character. The last segment of the URL's path must represent\nthe fully qualified name of the type (as in\n`path/google.protobuf.Duration`). The name should be in a canonical form\n(e.g., leading \".\" is not accepted).\n\nIn practice, teams usually precompile into the binary all types that they\nexpect it to use in the context of Any. However, for URLs which use the\nscheme `http`, `https`, or no scheme, one can optionally set up a type\nserver that maps type URLs to message definitions as follows:\n\n* If no scheme is provided, `https` is assumed.\n* An HTTP GET on the URL must yield a [google.protobuf.Type][]\n  value in binary format, or produce an error.\n* Applications are allowed to cache lookup results based on the\n  URL, or have them precompiled into a binary to avoid any\n  lookup. Therefore, binary compatibility needs to be preserved\n  on changes to types. (Use versioned type names to manage\n  breaking changes.)\n\nNote: this functionality is not currently available in the official\nprotobuf release, and it is not used for type URLs beginning with\ntype.googleapis.com. As of May 2023, there are no widely used type server\nimplementations and no plans to implement one.\n\nSchemes other than `http`, `https` (or the empty scheme) might be\nused with implementation specific semantics."
          type: string
      type: object
    v1Telemetry:
      description: Telemetry represents the Prometheus metrics obtained from endorctl processes.
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1TelemetrySpec'
        tenant_meta:
          $ref: '#/components/schemas/v1TenantMeta'
        uuid:
          description: The UUID of the telemetry.
          readOnly: true
          type: string
      required:
      - meta
      - spec
      type: object
    clientExemplar:
      properties:
        label:
          items:
            $ref: '#/components/schemas/clientLabelPair'
          type: array
        timestamp:
          description: OpenMetrics-style.
          format: date-time
          type: string
        value:
          format: double
          type: number
      type: object
    v1Meta:
      description: Common fields for all Endor Labs resources.
      properties:
        annotations:
          additionalProperties:
            type: string
          description: 'Annotations can be used to attach metadata to a resource message.

            Annotation values can be small or large, structured or unstructured,

            and may include characters not permitted by labels.

            The keys may contain alphanumerics, underscores (_), dots (.) and dashes

            (-). The values of an annotation must be 16384 bytes or smaller.'
          type: object
        create_time:
          description: 'Time the resource was created.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: 'Name and authentication source of the user who created the object,

            for example, ewok@endor.ai@google@api-key.'
          readOnly: true
          type: string
        description:
          description: Resource description. Must be less than 1024 bytes.
          type: string
        index_data:
          $ref: '#/components/schemas/v1IndexData'
        kind:
          description: 'Resource kind, for example, HelloResponse.

            Auto-generated using the protobuf message proto.MessageName().Name().'
          readOnly: true
          type: string
        name:
          description: Resource name. Must be 63 characters or less.
          type: string
        parent_kind:
          description: Parent object resource kind, for example, Project.
          type: string
        parent_uuid:
          description: Parent object UUID.
          type: string
        references:
          additionalProperties:
            $ref: '#/components/schemas/googleprotobufAny'
          description: Map of objects referenced in a query API.
          readOnly: true
          type: object
        tags:
          description: 'List of tags attached to the resource.

            Tags can be used to select objects and to find collections of objects that

            satisfy certain conditions. A tag must be 255 characters or less.'
          items:
            type: string
          type: array
        update_time:
          description: 'Time the resource was last updated.

            Note: Updated on all create/patch/delete operations.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: 'Name and authentication source of the last user who updated the object,

            for example, vulnerabilityingestor@endor.ai@x509.'
          readOnly: true
          type: string
        upsert_time:
          description: 'Time the resource was last upserted.


            Note:

            create_time is only set the first time the resource is created.

            upsert_time is set every time the resource is upseted.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        version:
          description: Message version.
          readOnly: true
          type: string
      required:
      - name
      type: object
    clientCounter:
      properties:
        created_timestamp:
          format: date-time
          type: string
        exemplar:
          $ref: '#/components/schemas/clientExemplar'
        value:
          format: double
          type: number
      type: object
    v1TelemetrySpec:
      properties:
        caller_prefix:
          description: Identifies where the metrics come from.
          type: string
        caller_version:
          description: Version of the caller.
          type: string
        execution_id:
          description: The UUID for the endorctl run.
          type: string
        metric_families:
          description: An array of metric families sent to the server.
          items:
            $ref: '#/components/schemas/clientMetricFamily'
          type: array
      required:
      - caller_prefix
      type: object
    clientBucket:
      description: 'A Bucket of a conventional histogram, each of which is treated as

        an individual counter-like time series by Prometheus.'
      properties:
        cumulative_count:
          description: Cumulative in increasing order.
          format: uint64
          type: string
        cumulative_count_float:
          description: Overrides cumulative_count if > 0.
          format: double
          type: number
        exemplar:
          $ref: '#/components/schemas/clientExemplar'
        upper_bound:
          description: Inclusive.
          format: double
          type: number
      type: object
