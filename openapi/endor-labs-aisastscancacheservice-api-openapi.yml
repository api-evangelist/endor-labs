openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference AISAST Scan Cache Service API
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: AISASTScanCacheService
paths:
  /v1/namespaces/{object.tenant_meta.namespace}/ai-sast-scan-caches:
    patch:
      description: Updates an AI SAST scan cache entry with the information in the request body.
      operationId: AISASTScanCacheService_UpdateAISASTScanCache
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: object.tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AISASTScanCacheServiceUpdateAISASTScanCacheBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1AISASTScanCache'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: UpdateAISASTScanCache
      tags:
      - AISASTScanCacheService
      x-internal: true
  /v1/namespaces/{tenant_meta.namespace}/ai-sast-scan-caches:
    get:
      description: Lists AI SAST scan cache entries in a given namespace.
      operationId: AISASTScanCacheService_ListAISASTScanCaches
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: 'String of conditions to filter resources by.

          Filters may include any attribute along with the following operators:

          "==", "!=", ">", ">=", "<", "<=", "Contains", "In", "Matches", and

          "Exists". The logical operators "And" and "Or" are also supported.

          Expressions may be combined and grouped with parentheses.


          Examples:

          "spec.value == 5",

          "spec.value in ["a", "b", "c"]",

          "(meta.name == "xyz" and "spec.value in ["a","b"]) or (spec.value ==

          "c")".'
        in: query
        name: list_parameters.filter
        schema:
          type: string
      - description: 'Set the page token to start from.

          Use page tokens to page through list results or list specific pages.'
        in: query
        name: list_parameters.page_token
        schema:
          format: int32
          type: integer
      - description: 'Set the page size to limit the number of results returned.

          Default: 100. Max: 500.'
        in: query
        name: list_parameters.page_size
        schema:
          format: int32
          type: integer
      - description: Action to be executed with a request. Not supported for all endpoints.
        in: query
        name: list_parameters.action
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: list_parameters.mask
        schema:
          type: string
      - description: Get data from any child namespaces as well.
        in: query
        name: list_parameters.traverse
        schema:
          type: boolean
      - description: Field to sort objects by, for example, meta.name.
        in: query
        name: list_parameters.sort.path
        schema:
          type: string
      - description: 'Sort order. Default: ASC.'
        in: query
        name: list_parameters.sort.order
        schema:
          default: SORT_ENTRY_ORDER_UNSPECIFIED
          enum:
          - SORT_ENTRY_ORDER_UNSPECIFIED
          - SORT_ENTRY_ORDER_ASC
          - SORT_ENTRY_ORDER_DESC
          type: string
      - description: 'Return the number of objects matching the given list parameters.

          If count is set to true, the response is a CountResponse.

          Can be used together with filter and traverse.'
        in: query
        name: list_parameters.count
        schema:
          type: boolean
      - description: 'Group the objects based on this field.

          If there are multiple fields then the objects are grouped

          based on the uniqueness of all fields.

          Supports composite paths.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.aggregation_paths
        schema:
          type: string
      - description: 'Return the UUID of each object in each group as specified by

          aggregation_paths.'
        in: query
        name: list_parameters.group.show_aggregation_uuids
        schema:
          type: boolean
      - description: 'List of fields for which we want the unique count.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_count_paths
        schema:
          type: string
      - description: 'List of fields for which we want the unique values.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_value_paths
        schema:
          type: string
      - description: Only return objects from PR scans that match this context id.
        in: query
        name: list_parameters.ci_run_uuid
        schema:
          type: string
      - description: Page ID to retrieve.
        in: query
        name: list_parameters.page_id
        schema:
          type: string
      - description: 'Group the objects based on this time field,

          for example, meta.create_time.'
        in: query
        name: list_parameters.group_by_time.aggregation_paths
        schema:
          type: string
      - description: Return the UUIDs of the objects in each group.
        in: query
        name: list_parameters.group_by_time.show_aggregation_uuids
        schema:
          type: boolean
      - description: Interval unit by which the objects should be grouped.
        in: query
        name: list_parameters.group_by_time.interval
        schema:
          default: GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          enum:
          - GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          - GROUP_BY_TIME_INTERVAL_YEAR
          - GROUP_BY_TIME_INTERVAL_QUARTER
          - GROUP_BY_TIME_INTERVAL_MONTH
          - GROUP_BY_TIME_INTERVAL_WEEK
          - GROUP_BY_TIME_INTERVAL_DAY
          - GROUP_BY_TIME_INTERVAL_HOUR
          - GROUP_BY_TIME_INTERVAL_MINUTE
          - GROUP_BY_TIME_INTERVAL_SECOND
          type: string
      - description: 'Size of the time interval to group the objects by,

          for example, to group objects by 2-week intervals, set interval

          to GROUP_BY_TIME_INTERVAL_WEEK and group_size to 2.'
        in: query
        name: list_parameters.group_by_time.group_size
        schema:
          format: int32
          type: integer
      - description: 'Beginning of the time period to group objects.

          Defaults to the beginning of time.'
        in: query
        name: list_parameters.group_by_time.start_time
        schema:
          format: date-time
          type: string
      - description: 'End of the time period to group objects.

          Defaults to the current time.'
        in: query
        name: list_parameters.group_by_time.end_time
        schema:
          format: date-time
          type: string
      - description: 'The mode determines how the matching objects are counted

          in the produced time-series. Values allowed are:

          count (default) : is the number of items matching in every interval.

          sum: is the total number of items matching since the beginning of the

          aggregation time.'
        in: query
        name: list_parameters.group_by_time.mode
        schema:
          type: string
      - description: 'The aggregation_field is a field on the matched objects that we want to

          perform some operation in each interval (example : min, max, avg)'
        in: query
        name: list_parameters.group_by_time.aggregation_value_field
        schema:
          type: string
      - description: 'The aggreation_operator is the operator that we should use for the

          aggregation. Allowed values are: min, max, sum, avg'
        in: query
        name: list_parameters.group_by_time.aggregation_operator
        schema:
          type: string
      - description: 'If true, the results will not be paginated and

          only the first page will be returned. The order

          of the results is not guaranteed.'
        in: query
        name: list_parameters.disable_pagination
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListAISASTScanCachesResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: ListAISASTScanCaches
      tags:
      - AISASTScanCacheService
      x-internal: true
    post:
      description: 'Creates an AI SAST scan cache entry. Upserts if a matching entry

        (same project, repository version, file path, and content hash)

        already exists, updating the outcome and segments in place.'
      operationId: AISASTScanCacheService_CreateAISASTScanCache
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AISASTScanCacheServiceCreateAISASTScanCacheBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1AISASTScanCache'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreateAISASTScanCache
      tags:
      - AISASTScanCacheService
      x-internal: true
  /v1/namespaces/{tenant_meta.namespace}/ai-sast-scan-caches/{uuid}:
    delete:
      description: Deletes an AI SAST scan cache entry specified by its UUID.
      operationId: AISASTScanCacheService_DeleteAISASTScanCache
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the resource to be deleted.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: Action to be executed with delete request.
        in: query
        name: delete_parameters.action
        schema:
          type: string
      - description: 'Force will force the deletion of the resource if any

          checks fail.'
        in: query
        name: delete_parameters.force
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: DeleteAISASTScanCache
      tags:
      - AISASTScanCacheService
      x-internal: true
    get:
      description: Fetches an AI SAST scan cache entry identified by its UUID.
      operationId: AISASTScanCacheService_GetAISASTScanCache
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the requested resource.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: get_parameters.mask
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1AISASTScanCache'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: GetAISASTScanCache
      tags:
      - AISASTScanCacheService
      x-internal: true
components:
  schemas:
    v1LocationType:
      default: LOCATION_TYPE_UNSPECIFIED
      description: "Classification of the location type within a data flow path.\n\n - LOCATION_TYPE_SOURCE: The source location.\n - LOCATION_TYPE_SINK: The sink location.\n - LOCATION_TYPE_INTERMEDIATE: The intermediate location.\n - LOCATION_TYPE_LOGICAL_BUG: The logical bug location."
      enum:
      - LOCATION_TYPE_UNSPECIFIED
      - LOCATION_TYPE_SOURCE
      - LOCATION_TYPE_SINK
      - LOCATION_TYPE_INTERMEDIATE
      - LOCATION_TYPE_LOGICAL_BUG
      type: string
    AISASTScanCacheServiceUpdateAISASTScanCacheBody:
      description: Request to update an AI SAST scan cache entry.
      properties:
        object:
          description: The scan cache entry to update.
          properties:
            meta:
              $ref: '#/components/schemas/v1Meta'
            spec:
              $ref: '#/components/schemas/v1AISASTScanCacheSpec'
            tenant_meta:
              description: Scan cache entries are associated with a tenant.
              title: Scan cache entries are associated with a tenant.
              type: object
            uuid:
              description: The UUID of the scan cache entry.
              readOnly: true
              type: string
          title: The scan cache entry to update.
          type: object
        request:
          $ref: '#/components/schemas/v1UpdateRequest'
      required:
      - meta
      - spec
      type: object
    v1AISASTContextRegion:
      description: 'A source region whose content is hashed so a scheduled AI SAST refresh can

        detect whether that region changed since the finding was last scanned.'
      properties:
        content_hash:
          description: SHA-256 hex hash of the region's source at scan time.
          type: string
        location:
          $ref: '#/components/schemas/v1SourceLocation'
      type: object
    GroupResponseGroupData:
      description: Information about objects matching the given key.
      properties:
        aggregation_count:
          $ref: '#/components/schemas/v1CountResponse'
        aggregation_uuids:
          description: 'List of UUIDs of the objects in the group.

            Only populated if show_aggregation_uuids is set.'
          items:
            type: string
          type: array
        aggregation_value:
          $ref: '#/components/schemas/v1GroupAggregationValueResponse'
        unique_counts:
          additionalProperties:
            $ref: '#/components/schemas/v1CountResponse'
          description: 'Map of counts for the given unique_count_paths fields.

            Only populated if unique_count_paths is set.'
          type: object
        unique_values:
          additionalProperties:
            items:
              type: object
            type: array
          description: 'Map of values for the given unique_value_paths fields.

            Only populated if unique_value_paths is set.'
          type: object
      type: object
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    v1FindingClassification:
      default: FINDING_CLASSIFICATION_UNSPECIFIED
      description: "Classification of the finding type. Extensible for future categories.\n\n - FINDING_CLASSIFICATION_SECURITY_VULNERABILITY: Security vulnerability (e.g. SQL injection, XSS, hardcoded creds).\n - FINDING_CLASSIFICATION_LOGICAL_BUG: Logical bug (e.g. null pointer, resource leak, race condition)."
      enum:
      - FINDING_CLASSIFICATION_UNSPECIFIED
      - FINDING_CLASSIFICATION_SECURITY_VULNERABILITY
      - FINDING_CLASSIFICATION_LOGICAL_BUG
      type: string
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    AISASTScanCacheCandidate:
      description: 'Candidate is one FINDING block of the detector report, kept so validation

        can be replayed without repeating detection.'
      properties:
        extra_key:
          description: Scanner-assigned identity carried into the validated AIResult.
          type: string
        file:
          description: Repository-relative file the candidate anchors to.
          type: string
        line_start:
          description: Anchored start line (1-indexed).
          format: int32
          type: integer
        report:
          description: 'The complete FINDING block as the detector wrote it, so validation sees

            exactly the report detection produced. Truncated to the cap on write.'
          type: string
        title:
          description: Title the detector gave the candidate; validation reports refer to it.
          type: string
      type: object
    v1UpdateRequest:
      description: Message used for all update requests.
      properties:
        force:
          description: 'Force will force the update of the resource if any

            checks fail.'
          type: boolean
        update_mask:
          description: Fields to update. Defaults to all fields.
          type: string
      type: object
    AIResultSAST:
      properties:
        attack_vector:
          description: Attack vector breakdown table when no exploit reproduction is emitted (the "## Attack Vector" section).
          type: string
        classification:
          $ref: '#/components/schemas/v1FindingClassification'
        context:
          $ref: '#/components/schemas/v1AISASTContext'
        cwes:
          description: The CWEs of the vulnerability.
          items:
            type: string
          type: array
        dataflow:
          description: 'Deprecated: use call_stack instead.

            One or more source locations representing the data flow path from a source to a sink.

            The locations are ordered and include the source, any intermediate nodes, and the sink.

            If only a single location is provided, it represents the sink location only.'
          items:
            $ref: '#/components/schemas/v1SourceLocation'
          type: array
        exploit_reproduction:
          description: Step-by-step exploit reproduction for high/critical true positives (the "## Exploit Reproduction" section).
          type: string
        fixed_strikes:
          description: 'Strictly consecutive scheduled-refresh FIXED verdicts. Deletion requires

            two: the first only stamps this counter and keeps the finding due. Reset

            by any non-FIXED outcome (STILL_PRESENT, UNKNOWN, agent error).'
          format: int32
          type: integer
        language:
          description: Programming language of the file where this result was found.
          type: string
        last_scan:
          description: 'When the scheduled AI SAST refresh last revalidated this finding. Unset

            for findings created before refresh tracking; drives refresh staleness.'
          format: date-time
          type: string
        location:
          $ref: '#/components/schemas/v1SourceLocation'
        refresh_attempts:
          description: 'Consecutive inconclusive scheduled-refresh attempts (agent error or

            UNKNOWN verdict); at the retry cap the refresh re-baselines last_scan

            instead of retrying forever. Reset on a definitive verdict.'
          format: int32
          type: integer
        remediation:
          description: Recommended remediation, including any unified-diff fix (the "## Remediation Guidance" section).
          type: string
        security_controls:
          description: Security controls assessment table (the "## Security Controls" section).
          type: string
        severity_scoring:
          description: Severity scoring breakdown (the "## Severity Scoring" section).
          type: string
        summary:
          description: Short prose summary of the vulnerability (the "## Summary" section).
          type: string
        validation_outcome:
          description: Validation outcome for unknown findings (the "## Validation Outcome" section).
          type: string
        validation_verdict:
          $ref: '#/components/schemas/v1ValidationVerdict'
        verification_scorecard:
          description: Verification scorecard with per-criterion verdicts (the "## Verification Scorecard" section).
          type: string
      type: object
    v1Language:
      default: LANGUAGE_UNSPECIFIED
      description: ' - LANGUAGE_GOSU: Gosu, a JVM language used by Guidewire applications.'
      enum:
      - LANGUAGE_UNSPECIFIED
      - LANGUAGE_GO
      - LANGUAGE_JAVA
      - LANGUAGE_SCALA
      - LANGUAGE_PYTHON
      - LANGUAGE_RUST
      - LANGUAGE_JS
      - LANGUAGE_RUBY
      - LANGUAGE_CSHARP
      - LANGUAGE_PHP
      - LANGUAGE_TYPESCRIPT
      - LANGUAGE_KOTLIN
      - LANGUAGE_SWIFT
      - LANGUAGE_OBJECTIVEC
      - LANGUAGE_C
      - LANGUAGE_CPP
      - LANGUAGE_SWIFTURL
      - LANGUAGE_CONAN
      - LANGUAGE_GOSU
      type: string
    v1GroupAggregationValueResponse:
      description: 'GroupAggregationValueResponse returns the value of the aggregation if

        requested.'
      properties:
        value:
          format: float
          type: number
      type: object
    v1AISASTScanCacheSpec:
      description: Spec holds the file-level scan state and embedded segment entries.
      properties:
        content_hash:
          description: 'SHA-256 hex hash of the full file content. Uses the same hashing

            approach as repoindexer/indexer.go calculateHash.'
          type: string
        file_path:
          description: Relative file path within the repository (e.g. "src/api/handler.go").
          type: string
        language:
          $ref: '#/components/schemas/v1Language'
        outcome:
          $ref: '#/components/schemas/AISASTScanCacheScanOutcome'
        project_uuid:
          description: The UUID of the project this scan cache entry belongs to.
          type: string
        ref:
          description: 'Git ref whose scan wrote this entry, as it appears on the scanned

            RepositoryVersion (e.g. "main", "refs/heads/release/1.2").


            Attribution only, never a key. Entries are keyed by content hash so that

            refs sharing a file''s content share its entry, which is what keeps the

            cost of scanning a second ref close to zero. A shared entry therefore

            names whichever ref wrote it last: read this to understand where an entry

            came from, and do not branch behavior on it.'
          type: string
        scanned_at:
          description: Timestamp of the last scan attempt for this file.
          format: date-time
          type: string
        scanned_at_sha:
          description: The commit SHA at which these segments were last scanned.
          type: string
        segments:
          description: Embedded per-segment scan states.
          items:
            $ref: '#/components/schemas/AISASTScanCacheSegmentEntry'
          type: array
        source_repository_version_uuid:
          description: 'RepositoryVersion whose LinterResults hold the findings these segments

            produced. Set to the scanned version, which is not necessarily the

            version this entry is parented to.


            A cache hit means "this content was already scanned"; it does not mean the

            findings are attached to the version being scanned now. This field names

            where they are, so a hit can be turned back into findings for another ref.


            Left unset rather than empty when the scanning version is unknown, so the

            pattern requires a real UUID whenever the field is present.'
          type: string
      required:
      - project_uuid
      - file_path
      - content_hash
      - outcome
      - scanned_at_sha
      - scanned_at
      type: object
    v1ListAISASTScanCachesResponse:
      description: Response returned for requests to list AI SAST scan cache entries.
      properties:
        count_response:
          $ref: '#/components/schemas/v1CountResponse'
        group_response:
          $ref: '#/components/schemas/v1GroupResponse'
        list:
          $ref: '#/components/schemas/v1ListAISASTScanCachesResponseList'
      type: object
    AIResultAILevel:
      default: AI_LEVEL_UNSPECIFIED
      description: "AI severity level.\n\n - AI_LEVEL_CRITICAL: Critical AI SAST.\n - AI_LEVEL_HIGH: High AI SAST.\n - AI_LEVEL_MEDIUM: Medium AI SAST.\n - AI_LEVEL_LOW: Low AI SAST."
      enum:
      - AI_LEVEL_UNSPECIFIED
      - AI_LEVEL_CRITICAL
      - AI_LEVEL_HIGH
      - AI_LEVEL_MEDIUM
      - AI_LEVEL_LOW
      type: string
    v1TenantMeta:
      description: Tenant related data for the tenant containing the resource.
      properties:
        namespace:
          description: 'Namespaces are a way to organize organizational units into virtual

            groupings of resources. Namespaces must be a fully qualified name,

            for example, the child namespace of namespace "endor.prod" called "app"

            is called "endor.prod.app".'
          type: string
      required:
      - namespace
      type: object
    AISASTScanCacheCompletedOutput:
      description: CompletedOutput distinguishes completed empty analysis from missing output.
      properties:
        findings:
          description: Findings with scanner-assigned identities, before publication review.
          items:
            $ref: '#/components/schemas/v1AIResult'
