    AISASTScanCacheServiceCreateAISASTScanCacheBody:
      description: 'AISASTScanCache tracks scan outcomes at file-level granularity for AI SAST

        incremental scanning. Each document contains the segments for a single

        file, enabling efficient bulk reads and writes against MongoDB. When the

        outcome changes (e.g. a previously failed file is retried successfully),

        the existing cache entry is updated in place.


        This is a cache: LinterResults remain the authoritative finding records.

        If the cache is lost, the system falls back to a full scan.'
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1AISASTScanCacheSpec'
        tenant_meta:
          description: Scan cache entries are associated with a tenant.
          title: Scan cache entries are associated with a tenant.
          type: object
        uuid:
          description: The UUID of the scan cache entry.
          readOnly: true
          type: string
      required:
      - meta
      - spec
      type: object
    AISASTScanCacheValidationState:
      default: VALIDATION_STATE_UNSPECIFIED
      description: "ValidationState says whether a bundle's verdicts are current.\n\n - VALIDATION_STATE_UNSPECIFIED: No validation is recorded.\n - VALIDATION_STATE_COMPLETE: Every candidate has a verdict produced under the recorded identity.\n - VALIDATION_STATE_PENDING: Validation did not finish; the bundle is kept and validation retried."
      enum:
      - VALIDATION_STATE_UNSPECIFIED
      - VALIDATION_STATE_COMPLETE
      - VALIDATION_STATE_PENDING
      type: string
    AISASTScanCacheDiscoveryState:
      default: DISCOVERY_STATE_UNSPECIFIED
      description: "DiscoveryState says what the detector produced for a segment.\n\n - DISCOVERY_STATE_UNSPECIFIED: No discovery result is recorded.\n - DISCOVERY_STATE_EMPTY: Detection completed and nominated no candidate. Reusable as a clean\nresult for any guidance that does not change what the detector sees.\n - DISCOVERY_STATE_CANDIDATES: Detection completed and nominated at least one candidate."
      enum:
      - DISCOVERY_STATE_UNSPECIFIED
      - DISCOVERY_STATE_EMPTY
      - DISCOVERY_STATE_CANDIDATES
      type: string
    v1ValidationVerdict:
      default: VALIDATION_VERDICT_UNSPECIFIED
      description: "Verdict from AI SAST validation about whether a reported finding is real.\nDistinct from FindingClassification, which describes the kind of issue.\n\n - VALIDATION_VERDICT_UNSPECIFIED: No verdict is recorded for this finding.\n - VALIDATION_VERDICT_TRUE_POSITIVE: Validation confirmed the finding.\n - VALIDATION_VERDICT_FALSE_POSITIVE: Validation refuted the finding.\n - VALIDATION_VERDICT_UNKNOWN: Validation could not determine whether the finding is real."
      enum:
      - VALIDATION_VERDICT_UNSPECIFIED
      - VALIDATION_VERDICT_TRUE_POSITIVE
      - VALIDATION_VERDICT_FALSE_POSITIVE
      - VALIDATION_VERDICT_UNKNOWN
      type: string
