          $ref: '#/components/schemas/v1AgentHookEventSpec'
        tenant_meta:
          $ref: '#/components/schemas/v1TenantMeta'
        uuid:
          description: The UUID of an AgentHookEvent.
          readOnly: true
          type: string
      required:
      - meta
      type: object
    v1SessionPermissionsCriteria:
      description: 'SessionPermissionsCriteria matches against AgentPermissionsConfig at

        any AgentConfigLevel. Each field is optional.'
      properties:
        allowed_command_matchers:
          description: Regex matchers for entries in permissions.allowed_commands.
          items:
            type: string
          type: array
        bypass_disabled:
          description: 'If set, match when permissions.bypass_disabled equals this value

            (e.g. false ⇒ "bypass is allowed").'
          type: boolean
        default_mode_matchers:
          description: Regex matchers for permissions.default_mode (e.g. "bypassPermissions").
          items:
            type: string
          type: array
        denied_command_matchers:
          description: Regex matchers for entries in permissions.denied_commands.
          items:
            type: string
          type: array
      type: object
    v1AgentMCPServer:
      description: AgentMCPServer represents a single named MCP server entry common to all agents.
      properties:
        args:
          description: Args are the command-line arguments passed to the server process.
          items:
            type: string
          type: array
        command:
          description: Command is the executable used for stdio-transport servers.
          type: string
        config_server_name:
          description: 'ConfigServerName is the user-authored mcp.json map key that named this

            server entry in the agent''s configuration (e.g. "claude-endor-cli-tools",

            "postgres"). It is the stable identifier per-tool hooks can use to look

            the entry up in the cached SESSION_START snapshot — Claude''s tool name

            shape "mcp__<server>__<tool>" carries this value, while Name carries the

            runtime program identity. Wrapped to distinguish "unset" from "".'
          type: string
        env:
          additionalProperties:
            type: string
          description: Env holds environment variables injected into the server process.
          type: object
        from_plugin:
          description: 'FromPlugin marks a server contributed by an enabled agent plugin''s manifest

            rather than by an mcp_servers entry a user wrote. Only the collector that

            walked the plugin registry can tell the two apart, and both inventory

            writers need the answer to agree, so it is stated here rather than inferred

            downstream from the "<plugin>/<server>" shape of config_server_name — a

            user-authored key may legitimately contain a slash ("@vendor/server").

            Wrapped to distinguish "unset" (a collector predating this field) from

            "false".'
          type: boolean
        headers:
          additionalProperties:
            type: string
          description: 'Headers are additional HTTP headers sent with requests.

            Populated by collectors when available; Cursor''s mcp.json has no headers

            field so this is empty for Cursor.'
          type: object
        name:
          description: 'Name is the canonical runtime identifier of the MCP server program — the

            value extracted from the command line (e.g. "endorctl" from

            "npx -y endorctl ai-tools mcp-server") or, for HTTP/SSE servers, the host

            slice of the URL. The backend uses this as the inventory document name

            so SESSION_START rows and per-tool rows (whose McpToolHook.server_name

            is derived the same way from the runtime URL/command) land on a single

            inventory document per logical server.'
          type: string
        transport:
          description: 'Transport is the MCP transport type: "stdio", "http", or "sse".

            Collectors must populate this; an empty value means the collector could

            not classify the server. Claude Code reads this from .mcp.json; Cursor

            derives it structurally from command/url since mcp.json has no transport

            field.'
          type: string
        url:
          description: URL is the endpoint for HTTP or SSE transport servers.
          type: string
      type: object
    v1MalwareCheckActivity:
      description: 'MalwareCheckActivity runs Endor''s malware lookup against the packages in a

        package-install command (a cmd_line event). It carries no regex matchers:

        matching the activity means running the check, and the block/allow verdict

        comes from the malware feed (MALWARE-status, non-contested records), not from

        the policy config.'
      properties:
        ecosystems:
          description: Ecosystems to check (e.g. "npm", "pypi", "cargo"). Empty means all ecosystems.
          items:
            type: string
          type: array
      type: object
    v1AskAction:
      description: AskAction allows asking the user with a message.
      properties:
        feedback_message:
