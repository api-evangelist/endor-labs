openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Agent Hook Event Service API
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: AgentHookEventService
paths:
  /v1/namespaces/{object.tenant_meta.namespace}/agent-hook-events:
    patch:
      description: Updates an AgentHookEvent specified by its UUID.
      operationId: AgentHookEventService_UpdateAgentHookEvent
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: object.tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentHookEventServiceUpdateAgentHookEventBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1AgentHookEvent'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: UpdateAgentHookEvent
      tags:
      - AgentHookEventService
      x-internal: true
  /v1/namespaces/{tenant_meta.namespace}/agent-hook-events:
    get:
      description: Lists all AgentHookEvents visible in a namespace.
      operationId: AgentHookEventService_ListAgentHookEvents
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: 'String of conditions to filter resources by.

          Filters may include any attribute along with the following operators:

          "==", "!=", ">", ">=", "<", "<=", "Contains", "In", "Matches", and

          "Exists". The logical operators "And" and "Or" are also supported.

          Expressions may be combined and grouped with parentheses.


          Examples:

          "spec.value == 5",

          "spec.value in ["a", "b", "c"]",

          "(meta.name == "xyz" and "spec.value in ["a","b"]) or (spec.value ==

          "c")".'
        in: query
        name: list_parameters.filter
        schema:
          type: string
      - description: 'Set the page token to start from.

          Use page tokens to page through list results or list specific pages.'
        in: query
        name: list_parameters.page_token
        schema:
          format: int32
          type: integer
      - description: 'Set the page size to limit the number of results returned.

          Default: 100. Max: 500.'
        in: query
        name: list_parameters.page_size
        schema:
          format: int32
          type: integer
      - description: Action to be executed with a request. Not supported for all endpoints.
        in: query
        name: list_parameters.action
        schema:
          type: string
      - description: List of fields to return (all fields are returned by default).
        in: query
        name: list_parameters.mask
        schema:
          type: string
      - description: Get data from any child namespaces as well.
        in: query
        name: list_parameters.traverse
        schema:
          type: boolean
      - description: Field to sort objects by, for example, meta.name.
        in: query
        name: list_parameters.sort.path
        schema:
          type: string
      - description: 'Sort order. Default: ASC.'
        in: query
        name: list_parameters.sort.order
        schema:
          default: SORT_ENTRY_ORDER_UNSPECIFIED
          enum:
          - SORT_ENTRY_ORDER_UNSPECIFIED
          - SORT_ENTRY_ORDER_ASC
          - SORT_ENTRY_ORDER_DESC
          type: string
      - description: 'Return the number of objects matching the given list parameters.

          If count is set to true, the response is a CountResponse.

          Can be used together with filter and traverse.'
        in: query
        name: list_parameters.count
        schema:
          type: boolean
      - description: 'Group the objects based on this field.

          If there are multiple fields then the objects are grouped

          based on the uniqueness of all fields.

          Supports composite paths.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.aggregation_paths
        schema:
          type: string
      - description: 'Return the UUID of each object in each group as specified by

          aggregation_paths.'
        in: query
        name: list_parameters.group.show_aggregation_uuids
        schema:
          type: boolean
      - description: 'List of fields for which we want the unique count.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_count_paths
        schema:
          type: string
      - description: 'List of fields for which we want the unique values.

          Supports arrays and maps.'
        in: query
        name: list_parameters.group.unique_value_paths
        schema:
          type: string
      - description: Only return objects from PR scans that match this context id.
        in: query
        name: list_parameters.ci_run_uuid
        schema:
          type: string
      - description: Page ID to retrieve.
        in: query
        name: list_parameters.page_id
        schema:
          type: string
      - description: 'Group the objects based on this time field,

          for example, meta.create_time.'
        in: query
        name: list_parameters.group_by_time.aggregation_paths
        schema:
          type: string
      - description: Return the UUIDs of the objects in each group.
        in: query
        name: list_parameters.group_by_time.show_aggregation_uuids
        schema:
          type: boolean
      - description: Interval unit by which the objects should be grouped.
        in: query
        name: list_parameters.group_by_time.interval
        schema:
          default: GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          enum:
          - GROUP_BY_TIME_INTERVAL_UNSPECIFIED
          - GROUP_BY_TIME_INTERVAL_YEAR
          - GROUP_BY_TIME_INTERVAL_QUARTER
          - GROUP_BY_TIME_INTERVAL_MONTH
          - GROUP_BY_TIME_INTERVAL_WEEK
          - GROUP_BY_TIME_INTERVAL_DAY
          - GROUP_BY_TIME_INTERVAL_HOUR
          - GROUP_BY_TIME_INTERVAL_MINUTE
          - GROUP_BY_TIME_INTERVAL_SECOND
          type: string
      - description: 'Size of the time interval to group the objects by,

          for example, to group objects by 2-week intervals, set interval

          to GROUP_BY_TIME_INTERVAL_WEEK and group_size to 2.'
        in: query
        name: list_parameters.group_by_time.group_size
        schema:
          format: int32
          type: integer
      - description: 'Beginning of the time period to group objects.

          Defaults to the beginning of time.'
        in: query
        name: list_parameters.group_by_time.start_time
        schema:
          format: date-time
          type: string
      - description: 'End of the time period to group objects.

          Defaults to the current time.'
        in: query
        name: list_parameters.group_by_time.end_time
        schema:
          format: date-time
          type: string
      - description: 'The mode determines how the matching objects are counted

          in the produced time-series. Values allowed are:

          count (default) : is the number of items matching in every interval.

          sum: is the total number of items matching since the beginning of the

          aggregation time.'
        in: query
        name: list_parameters.group_by_time.mode
        schema:
          type: string
      - description: 'The aggregation_field is a field on the matched objects that we want to

          perform some operation in each interval (example : min, max, avg)'
        in: query
        name: list_parameters.group_by_time.aggregation_value_field
        schema:
          type: string
      - description: 'The aggreation_operator is the operator that we should use for the

          aggregation. Allowed values are: min, max, sum, avg'
        in: query
        name: list_parameters.group_by_time.aggregation_operator
        schema:
          type: string
      - description: 'If true, the results will not be paginated and

          only the first page will be returned. The order

          of the results is not guaranteed.'
        in: query
        name: list_parameters.disable_pagination
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListAgentHookEventsResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: ListAgentHookEvents
      tags:
      - AgentHookEventService
      x-internal: true
    post:
      description: Creates an AgentHookEvent.
      operationId: AgentHookEventService_CreateAgentHookEvent
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentHookEventServiceCreateAgentHookEventBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1AgentHookEvent'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreateAgentHookEvent
      tags:
      - AgentHookEventService
      x-internal: true
  /v1/namespaces/{tenant_meta.namespace}/agent-hook-events/{uuid}:
    delete:
      description: Deletes an AgentHookEvent specified by its UUID.
      operationId: AgentHookEventService_DeleteAgentHookEvent
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      - description: The UUID of the resource to be deleted.
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: Action to be executed with delete request.
        in: query
        name: delete_parameters.action
        schema:
          type: string
      - description: 'Force will force the deletion of the resource if any

          checks fail.'
        in: query
        name: delete_parameters.force
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: DeleteAgentHookEvent
      tags:
      - AgentHookEventService
      x-internal: true
components:
  schemas:
    v1SessionMatch:
      description: 'SessionMatch describes a session that matched a policy. Unlike SkillMatch

        or McpServerMatch, the source data (SessionHook + AgentConfigSnapshot)

        is already carried by the surrounding AgentHookEvent, so this match

        only describes what fired.'
      properties:
        matched_criteria:
          description: 'The criteria category that fired (mirrors a SessionActivity sub-message

            name, e.g. "top_level", "sandbox", "permissions", "hook", "model").'
          type: string
        matched_value:
          description: 'The specific predicate value or pattern that matched

            (e.g. "default_mode=bypassPermissions", "any-level sandbox.enabled=false").'
          type: string
        message:
          description: Free-form human-readable explanation of what fired.
          type: string
      type: object
    SpecHookEventCategory:
      default: HOOK_EVENT_CATEGORY_UNSPECIFIED
      description: ' - HOOK_EVENT_CATEGORY_CONFIG: Changes to the agent''s own configuration, which are governance events

        rather than work the agent performed. Counted under

        AgenticInventory.config_hook_events, not file_hook_events, even though

        the event still carries a FileHook payload.'
      enum:
      - HOOK_EVENT_CATEGORY_UNSPECIFIED
      - HOOK_EVENT_CATEGORY_TOOL
      - HOOK_EVENT_CATEGORY_SESSION
      - HOOK_EVENT_CATEGORY_CMD
      - HOOK_EVENT_CATEGORY_FILE
      - HOOK_EVENT_CATEGORY_USER_PROMPT
      - HOOK_EVENT_CATEGORY_CONFIG
      type: string
    v1PolicyIntent:
      default: POLICY_INTENT_UNSPECIFIED
      description: "PolicyIntent says what kind of rule a policy encodes, and so whether the LLM\ncommand judge may rule on its matches. Only cmd_line policies are judged, so\ntoday the intent changes behavior only on a cmd_line policy.\n\n - POLICY_INTENT_UNSPECIFIED: Read as POLICY_INTENT_RISK, so a policy that never sets the field keeps the\nbehavior it had before the field existed.\n - POLICY_INTENT_RISK: The policy is a risk assessment. A judge scope may hand its matches to the\njudge, and the label can release, ask about, or block the command.\n - POLICY_INTENT_GOVERNANCE: The policy is an organisational rule, for example \"installs go through the\npackage firewall\". A verdict on how risky the command is answers a question\nthe rule does not ask, so no judge scope hands its matches to the judge.\nIts own action is final: no label releases it, and no label escalates it.\nNot valid with the AUTO action, which hands the decision to the judge."
      enum:
      - POLICY_INTENT_UNSPECIFIED
      - POLICY_INTENT_RISK
      - POLICY_INTENT_GOVERNANCE
      type: string
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
    v1SessionSandboxCriteria:
      description: 'SessionSandboxCriteria matches against AgentSandboxConfig at any

        AgentConfigLevel, and against the session''s resolved sandbox posture.

        Each field is optional.'
      properties:
        allowed_host_matchers:
          description: 'Regex matchers for entries in sandbox.allowed_network_hosts (catches

            overly permissive host rules like ".*").'
          items:
            type: string
          type: array
        enabled:
          description: 'If set, match when sandbox.enabled equals this value at any level

            (e.g. false ⇒ "sandbox is explicitly off at some level"). A level that

            does not set sandbox.enabled never matches. To match a session that runs

            unsandboxed, use `postures`.'
          type: boolean
        fail_if_unavailable:
          description: If set, match when sandbox.fail_if_unavailable equals this value.
          type: boolean
        postures:
          description: 'If set, match when the session''s resolved sandbox posture

            (SessionHook.sandbox_config_posture) is one of these values. This is the

            posture that the agent''s resolver derives from its own rules, such as

            defaults, precedence, and (where the resolver checks it) whether the

            sandbox can start on the host. It is not the raw config, which `enabled`

            reads. Blocklist policies only. Must be the only session criterion in the

            policy.'
          items:
            $ref: '#/components/schemas/v1SessionSandboxPosture'
          type: array
      type: object
    v1DependencyRiskMatch:
      description: 'DependencyRiskMatch describes a known-vulnerable dependency found by the

        dependency-risk check.'
      properties:
        direct:
          description: Whether the package is a direct dependency of the introduced package.
          type: boolean
        ecosystem:
          description: Ecosystem the package belongs to (e.g. "npm", "pypi").
          type: string
        fixed_version:
          description: Version the advisory names as fixed, when one is published.
          type: string
        introduced_by:
          description: Package the agent named, set on transitive matches (e.g. "express@4.18.2").
          type: string
        message:
          description: Human-readable explanation of what fired.
          type: string
        package_name:
          description: Package name (e.g. "path-to-regexp").
          type: string
        severity:
          description: Worst matched CVSS severity, as the Severity enum name (e.g. "SEVERITY_HIGH").
          type: string
        version:
          description: 'Version judged. For an unpinned install or a range spec, the highest

            satisfying version known to Endor; the message says so.'
          type: string
        vulnerability_id:
          description: CVE or GHSA id.
          type: string
      type: object
    SpecAgent:
      default: AGENT_UNSPECIFIED
      enum:
      - AGENT_UNSPECIFIED
      - AGENT_CURSOR
      - AGENT_CLAUDE
      - AGENT_CODEX
      - AGENT_COPILOT
      type: string
    v1McpDimensionThresholds:
      description: 'McpDimensionThresholds holds per-dimension score thresholds for

        McpServerActivity. Each field is optional; an unset dimension is ignored.

        Set dimensions are OR''d among themselves and with score_at_or_below:

        any single dimension at or below its threshold fires the predicate.

        Dimension names mirror AgenticInventory.McpScoreDimensions.'
      properties:
        authentication_authorization:
          description: 'Threshold for authentication & authorization (credential-less network

            access, hardcoded secrets).'
          format: float
          type: number
        input_validation_injection:
          description: 'Threshold for input validation & injection (shell/SQL/code injection,

            prompt-poisoning patterns).'
          format: float
          type: number
        operational_hygiene:
          description: 'Threshold for operational hygiene (spec conformance, destructive tool

            labeling).'
          format: float
          type: number
        supply_chain_provenance:
          description: 'Threshold for supply chain & provenance (malicious packages, CVEs,

            unverified publishers, unpinned deps).'
          format: float
          type: number
      type: object
    v1FileAccessMatch:
      description: FileAccessMatch describes a file access that matched a policy.
      properties:
        matched_file_name_pattern:
          description: File name pattern that matched.
          type: string
        matched_file_operation:
          $ref: '#/components/schemas/v1FileAccessActivityFileOperation'
        matched_text:
          description: Text the pattern matched, cut from the separator-normalized name, capped at 256 characters.
          type: string
      type: object
    v1ProcessingResult:
      default: PROCESSING_RESULT_UNSPECIFIED
      description: ProcessingResult indicates the downstream processing result of an event.
      enum:
      - PROCESSING_RESULT_UNSPECIFIED
      - PROCESSING_RESULT_COMPLETED
      - PROCESSING_RESULT_FAILED
      type: string
    v1AgentHookPolicyScope:
      description: 'AgentHookPolicyScope restricts a policy to a subset of events by matching

        against per-event identity carried on AgentHookEvent.Spec (repository, user).

        Scope is evaluated once, before activity-kind matching, so it applies

        uniformly to all activity kinds.


        Match logic: an unset scope (or a scope with no matchers set) applies to

        every event. When set, configured matcher branches are AND''d — every set

        branch must produce a hit; within a branch the regexes are OR''d (any one

        matching satisfies the branch); an empty branch is ignored. A scope miss

        makes the policy a no-op for the event for both blocklist and allowlist

        match types (the policy simply does not apply).'
      properties:
        repository_matchers:
          description: 'Regex matchers for the repository from AgentHookEvent.Spec.repository

            (e.g. "github\\.com/acme/.*", ".*-infra$"). OR''d among themselves.'
          items:
            type: string
          type: array
        user_matchers:
          description: 'Regex matchers for the user/account from AgentHookEvent.Spec.user

            (e.g. "alice", "svc-.*", ".*@example\\.com"). "Account" in the ticket

            maps to this per-session user identity; there is no separate account

            entity. OR''d among themselves.'
          items:
            type: string
          type: array
      type: object
    v1DiscoveredSkill:
      description: DiscoveredSkill represents a skill found during session-start scanning.
      properties:
        allowed_tools:
          description: Tools declared in SKILL.md frontmatter (allowed-tools).
          items:
            type: string
          type: array
        compatibility:
          description: Environment requirements from SKILL.md frontmatter (agentskills.io standard field).
          type: string
        content:
          description: Base64-encoded SKILL.md content for backend scoring. Capped at 128 KB.
          type: string
        content_hash:
          description: SHA-256 hash of the SKILL.md content.
          type: string
        description:
          description: Human-readable description from SKILL.md frontmatter.
          type: string
        file_count:
          description: Number of files in the skill directory (including SKILL.md).
          format: int32
          type: integer
        license:
          description: License from SKILL.md frontmatter (agentskills.io standard field).
          type: string
        name:
          description: Skill name from SKILL.md frontmatter or directory name fallback.
          type: string
        path:
          description: Path to the SKILL.md file within the workspace or user home directory.
          type: string
      type: object
    v1InternalToolHook:
      description: InternalToolHook contains payload for internal tool-related hooks.
      properties:
        tool_input:
          description: Tool invocation input; structure is tool-specific (use Struct for JSON).
          type: object
        tool_name:
          description: Name of the tool (e.g. "Bash", "Glob", "AskUserQuestion", "Skill").
          type: string
        tool_response:
          description: Tool result; structure is tool-specific (e.g. stdout/stderr or filenames).
          type: object
      type: object
    v1McpToolMatch:
      description: McpToolMatch describes a tool call that matched a policy.
      properties:
        matched_server_name_pattern:
          description: Matched server name pattern.
          type: string
        matched_tool_input_pattern:
          description: Tool input pattern that matched.
          type: string
        matched_tool_name_pattern:
          description: Matched tool name pattern.
          type: string
        mcp_server_name:
          description: MCP server name (e.g. "jira").
          type: string
        message:
          description: Describes what exactly matched.
          type: string
        tool_name:
          description: Tool name (e.g. "open bug").
          type: string
      type: object
    v1SessionActivity:
      description: 'SessionActivity matches sessions by posture predicates over SessionHook

        fields and the captured AgentConfigSnapshot. Sessions have no stable

        name, so matching uses field predicates instead of name regexes.


        Each sub-message is optional; if set, all its predicates are AND''d.

        Sub-messages are also AND''d with each other. Predicates that target

        AgentConfigSnapshot evaluate across repository / user / enterprise

        levels (any-level satisfies). MCP-server-related criteria intentionally

        live on McpServerActivity, not here.'
      properties:
        hook:
          $ref: '#/components/schemas/v1SessionHookCriteria'
        model:
          $ref: '#/components/schemas/v1SessionModelCriteria'
        permissions:
          $ref: '#/components/schemas/v1SessionPermissionsCriteria'
        sandbox:
          $ref: '#/components/schemas/v1SessionSandboxCriteria'
        top_level:
          $ref: '#/components/schemas/v1SessionTopLevelCriteria'
      type: object
    v1AgentInstructionFile:
      description: 'AgentInstructionFile represents a rule or instruction file discovered during

        configuration scanning. Content is not stored; only paths and hashes are

        captured to detect changes without exposing potentially sensitive content.'
      properties:
        content_hash:
          description: ContentHash is the SHA-256 hex digest of the file content.
          type: string
        name:
          description: Name is the base filename without extension (e.g. "security" from "security.mdc").
          type: string
        path:
          description: Path is the absolute filesystem path to the instruction file.
          type: string
      type: object
    SpecHookEventName:
      default: HOOK_EVENT_NAME_UNSPECIFIED
      description: "HookEventName identifies the kind of agent lifecycle or tool event.\nDifferent agents use different names, so here we will have a normalized list.\n\n - HOOK_EVENT_NAME_CONFIG_CHANGE: Agent configuration changed mid-session (e.g. a settings file edit or\na /sandbox toggle). Distinct from a file operation so that queries can\nname it and so file-activity counters exclude settings churn:\nAgenticAggregate keys file_access_events and edit_operations on this\nname, and AgenticInventory counts these under config_hook_events\nrather than file_hook_events."
      enum:
      - HOOK_EVENT_NAME_UNSPECIFIED
      - HOOK_EVENT_NAME_SESSION_START
      - HOOK_EVENT_NAME_SESSION_STOP
      - HOOK_EVENT_NAME_USER_PROMPT_SUBMIT
      - HOOK_EVENT_NAME_PRE_TOOL_USE
      - HOOK_EVENT_NAME_POST_TOOL_USE
      - HOOK_EVENT_NAME_PRE_CMD
      - HOOK_EVENT_NAME_POST_CMD
      - HOOK_EVENT_NAME_PRE_FILE_OPERATION
      - HOOK_EVENT_NAME_POST_FILE_OPERATION
      - HOOK_EVENT_NAME_CONFIG_CHANGE
      type: string
    v1SessionTopLevelCriteria:
      description: 'SessionTopLevelCriteria matches against SessionHook top-level fields

        (composer_mode, source, is_background_agent) and the per-session

        user identity carried on AgentHookEvent.Spec.user.'
      properties:
        composer_mode_matchers:
          description: Regex matchers for composer_mode (e.g. "agent", "ask", "edit").
          items:
            type: string
          type: array
        group_matchers:
          description: 'Regex matchers against the resolved org groups in

            AgentHookEvent.Spec.identity.groups. A match fires when any group

            matches any matcher (e.g. "platform", "security").'
          items:
            type: string
          type: array
        is_background_agent:
          description: If set, match when is_background_agent equals this value.
          type: boolean
        role_matchers:
          description: 'Regex matchers against the resolved org roles in

            AgentHookEvent.Spec.identity.roles. A match fires when any role

            matches any matcher (e.g. "contractor", "admin").'
          items:
            type: string
          type: array
        source_matchers:
          description: Regex matchers for source (e.g. "startup", "resume", "clear").
          items:
            type: string
          type: array
        user_name_matchers:
          description: 'Regex matchers for the user name from AgentHookEvent.Spec.user

            (e.g. "alice", "svc-.*", ".*@example\\.com").'
          items:
            type: string
          type: array
      type: object
    v1DependencyRiskActivitySeverity:
      default: SEVERITY_UNSPECIFIED
      description: "Severity levels, mirroring Vuln.Spec.CVSSV3Severity.Level.\n\n - SEVERITY_UNSPECIFIED: Unset. min_cvss_severity treats this as HIGH.\n - SEVERITY_LOW: CVSS low (0.1 - 3.9).\n - SEVERITY_MEDIUM: CVSS medium (4.0 - 6.9).\n - SEVERITY_HIGH: CVSS high (7.0 - 8.9).\n - SEVERITY_CRITICAL: CVSS critical (9.0 - 10.0)."
      enum:
      - SEVERITY_UNSPECIFIED
      - SEVERITY_LOW
      - SEVERITY_MEDIUM
      - SEVERITY_HIGH
      - SEVERITY_CRITICAL
      type: string
    AgentHookPolicyMatchAgentHookPolicyMatchType:
      default: AGENT_HOOK_POLICY_MATCH_TYPE_UNSPECIFIED
      description: "The type of policy match.\n\n - AGENT_HOOK_POLICY_MATCH_TYPE_MALWARE: A package flagged as malware by the malware check.\n - AGENT_HOOK_POLICY_MATCH_TYPE_SECRETS: A secret detected in file content by the secrets check.\n - AGENT_HOOK_POLICY_MATCH_TYPE_DEPENDENCY_RISK: A known-vulnerable dependency detected by the dependency-risk check."
      enum:
      - AGENT_HOOK_POLICY_MATCH_TYPE_UNSPECIFIED
      - AGENT_HOOK_POLICY_MATCH_TYPE_MCP_TOOL_CALL
      - AGENT_HOOK_POLICY_MATCH_TYPE_CMD_LINE
      - AGENT_HOOK_POLICY_MATCH_TYPE_FILE_ACCESS
      - AGENT_HOOK_POLICY_MATCH_TYPE_SKILL
      - AGENT_HOOK_POLICY_MATCH_TYPE_MCP_SERVER
      - AGENT_HOOK_POLICY_MATCH_TYPE_SESSION
      - AGENT_HOOK_POLICY_MATCH_TYPE_MALWARE
      - AGENT_HOOK_POLICY_MATCH_TYPE_SECRETS
      - AGENT_HOOK_POLICY_MATCH_TYPE_DEPENDENCY_RISK
      type: string
    v1SecretsMatch:
      description: 'SecretsMatch describes a secret detected by the secrets check. It carries only

        the rule and location, never the secret value, so a finding can be surfaced

        without leaking the credential.'
      properties:
        column:
          description: Column in the scanned content where the secret starts.
          format: int32
          type: integer
        fingerprint:
          description: Unique finding fingerprint, for dedup and cross-round false-positive suppression.
          type: string
        line:
          description: Line number in the scanned content where the secret was found.
          format: int32
          type: integer
        message:
          description: Human-readable explanation of what fired.
          type: string
        rule_description:
          description: Friendly rule name (e.g. "AWS Access Key").
          type: string
        rule_id:
          description: Detection rule that fired (e.g. "aws-access-token", "github-pat").
          type: string
      type: object
    AutoModeActivityJudgeScope:
      default: JUDGE_SCOPE_UNSPECIFIED
      description: "JudgeScope says which commands reach the judge. It is one selector rather\nthan a set of booleans so that no two modes can be in force at once.\n\n - JUDGE_SCOPE_UNSPECIFIED: Judge nothing. The policy still supplies deployment_context to the\ncmd_line policies that carry the AUTO action and judge on their own.\n\nThis is also what an endorctl too old to know a value added later reads,\nso every future value fails safe.\n - JUDGE_SCOPE_MATCHED_COMMANDS: Judge the commands a RISK command policy already matched, treating the\naction of each matched policy as AUTO.\n\nThis overrides an explicit customer decision in BOTH directions: a policy\nthat says block stops blocking and asks the judge, and one that says alert\nor feedback can escalate to a block on a suspicious label. The override\nlasts only as long as the judge answers — with no label each policy keeps\nits own action, so an outage degrades to the enforcement the tenant had.\nA GOVERNANCE policy is never overridden, and a command that only a\ngovernance policy matched is not judged at all.\n - JUDGE_SCOPE_ALL_COMMANDS: Judge every command and stand the RISK command policies down. The malware\nand secrets checks are untouched: they carry real detections rather than\nregular expressions.\n\nThe patterns are still evaluated. They are stood down by a label coming\nback rather than by this scope alone, which is what lets a judge that\ncannot be reached fall back to the verdict they produced.\n\nAn allowlist stands down on the same terms as a blocklist, so a command\nabsent from the set a tenant permitted runs anyway if the judge finds\nnothing wrong with it. Mark a command policy GOVERNANCE to keep its\naction final: a governance match keeps its own action under every label.\nThe judge still rules on the command itself, so a review or suspicious\nlabel also raises an ask or a block against the auto-mode policy, next to\nthe governance match."
      enum:
      - JUDGE_SCOPE_UNSPECIFIED
      - JUDGE_SCOPE_MATCHED_COMMANDS
      - JUDGE_SCOPE_ALL_COMMANDS
      type: string
    v1AgentPermissionsConfig:
      description: AgentPermissionsConfig normalizes permission rules across agents.
      properties:
        additional_directories:
          description: 'AdditionalDirectories lists extra working directories the agent may access.

            Claude Code: from permissions.additionalDirectories. Cursor: from CLI allowedPaths.'
          items:
            type: string
          type: array
        allowed_commands:
          description: 'AllowedCommands lists shell command patterns that are auto-approved.

            For Claude Code these are permission rule strings (e.g. "Bash(git:*)").'
          items:
            type: string
          type: array
        allowed_mcp_servers:
          description: 'AllowedMcpServers lists MCP server names permitted by managed policy.

            Populated from Claude Code managed settings; empty for Cursor.'
          items:
            type: string
          type: array
        allowed_tools:
          description: 'AllowedTools lists MCP tool names that are auto-approved.

            Populated primarily from Cursor configs; Claude Code uses rule strings instead.'
          items:
            type: string
          type: array
        bypass_disabled:
          description: 'BypassDisabled indicates whether bypass-permissions mode is disabled.

            Populated from Claude Code only.'
          type: boolean
        default_mode:
          description: 'DefaultMode is the permission mode used when no explicit rule matches.

            Populated from Claude Code only (e.g. "default", "bypassPermissions").'
          type: string
        denied_commands:
          description: DeniedCommands lists shell command patterns that are blocked.
          items:
            type: string
          type: array
        denied_mcp_servers:
          description: 'DeniedMcpServers lists MCP server names blocked by managed policy.

            Populated from Claude Code managed settings; empty for Cursor.'
          items:
            type: string
          type: array
        denied_tools:
          description: DeniedTools lists MCP tool names that are blocked.
          items:
            type: string
          type: array
      type: object
    v1CmdLineMatch:
      description: CmdLineMatch describes a command-line invocation that matched a policy.
      properties:
        command_source:
          $ref: '#/components/schemas/CmdLineMatchCommandSource'
        matched_cmd_pattern:
          title: matched cmd pattern
          type: string
        matched_text:
          description: Text the pattern matched, cut from the heredoc-stripped command, capped at 256 characters.
          type: string
        mcp_server_name:
          description: 'MCP server that carried the command (e.g. "workspace"). Set only when

            command_source is COMMAND_SOURCE_MCP_TOOL_INPUT.'
          type: string
        tool_name:
          description: 'MCP tool that carried the command (e.g. "bash"). Set only when

            command_source is COMMAND_SOURCE_MCP_TOOL_INPUT.'
          type: string
      type: object
    v1SessionSandboxPosture:
      default: SESSION_SANDBOX_POSTURE_UNSPECIFIED
      description: "SessionSandboxPosture mirrors SandboxConfigPosture (agent_hook_event.proto)\nvalue for value. It exists because this file cannot import that one.\nKeep the two in step: the same numbers and the same name suffixes.\n\n - SESSION_SANDBOX_POSTURE_UNSPECIFIED: No posture was evaluated by the client.\n - SESSION_SANDBOX_POSTURE_UNKNOWN: The client evaluated configuration but could not determine posture.\n - SESSION_SANDBOX_POSTURE_ENABLED: Configuration indicates sandboxing is enabled for the session.\n - SESSION_SANDBOX_POSTURE_DISABLED: Configuration indicates sandboxing is disabled for the session."
      enum:
      - SESSION_SANDBOX_POSTURE_UNSPECIFIED
      - SESSION_SANDBOX_POSTURE_UNKNOWN
      - SESSION_SANDBOX_POSTURE_ENABLED
      - SESSION_SANDBOX_POSTURE_DISABLED
      type: string
    v1AutoAction:
      description: 'AutoAction hands the decision on a matched command to the LLM judge: the

        command is judged on its own security intent and effect, and the label that

        comes back is the decision — benign allows, review asks, suspicious blocks.


        It carries no message on purpose. The agent sees the model''s own reason,

        naming the concrete thing it saw, and a policy-authored string would either be

        ignored or contradict it. The evaluator converts a matched AUTO policy into a

        plain ask or block carrying that reason before the verdict is computed, so the

        verdict is still read off ordinary action kinds.


        Valid only on cmd_line activities, with either match type, and never on a

        POLICY_INTENT_GOVERNANCE policy. On an ALLOWLIST the permitted set acts as a

        prefilter: a listed command never reaches the judge, and one outside it is

        judged rather than refused outright.


        Requires an endorctl new enough to know the field. An older client drops it

        (maniprest unmarshals with DiscardUnknown), is left with an empty action kind,

        and allows — so switching a policy to AUTO silently loses enforcement of that

        policy on clients below the minimum version.'
      type: object
    v1LlmJudgment:
      description: 'LlmJudgment is one judgment the LLM judge made while an event was evaluated,

        recorded so the cost, the latency, the label distribution and the accuracy of

        the judge can be measured on real traffic rather than assumed.


        It lives on the event and not on the policy match. One command is one judge

        call but zero or more matches, so a record per match would duplicate and every

        count run against it would double-count; and a record on the match could not

        cover the commands that matched nothing, which under JUDGE_SCOPE_ALL_COMMANDS

        are the majority.'
      properties:
        ai_request_uuid:
          description: 'Join key to the AIRequest row for this call, which carries CompletionUsage

            and the credit accounting.


            Cost is derived from that row and the price table of the day, never stored

            here: a stored currency figure goes stale on a price change and cannot be

            recomputed. Note the derived figure is a FLOOR — the hook client retries a

            failed POST and each retry bills another inference, while only the attempt

            that returned leaves its uuid here.'
          type: string
        cached_tokens:
          description: 'Tokens served from the provider''s prompt cache. The rubric is a standing

            prefix, so this reports whether it is actually being cached — something the

            RFC''s cost table assumes rather than measures.'
          format: int32
          type: integer
        completion_tokens:
          description: 'Tokens the label itself cost. Small by design: a large value means the model

            is explaining itself rather than answering.'
          format: int32
          type: integer
        confidence:
          description: 'The model''s own 0.0-1.0 self-report, advisory only: recorded so a threshold

            can be calibrated against real data rather than guessed.'
          format: float
          type: number
        error:
          description: 'Set when the judge could not be reached, timed out, or returned something

            unusable. Without it a fail-open allow reads in the data as a real allow and

            the fail-open rate cannot be measured at all.'
          type: string
        judged_matches:
          description: 'The policy matches handed to the judge, as the patterns produced them and

            before the label acted on them.


            This is the only record of what the judge decided against. A benign label

            removes these matches from policy_matches, and a review or suspicious label

            rewrites their action, so without this copy an event cannot say which policy

            fired or what it would have done. Empty when the judge ruled on a command no

            pattern matched, which JUDGE_SCOPE_ALL_COMMANDS does for most commands.'
          items:
            $ref: '#/components/schemas/v1AgentHookPolicyMatch'
          type: array
        kind:
          $ref: '#/components/schemas/v1LlmJudgmentKind'
        label:
          $ref: '#/components/schemas/v1QueryCommandClassificationLabel'
        latency_ms:
          description: 'Round trip as the client measured it, covering assembling the request and

            mapping the answer back. The one number here that the server-side AIRequest

            row cannot produce.'
          format: int64
          type: string
        model:
          description: 'The model that produced the label, as served — the backend rewrites the

            requested model when aliasing or fallback applies.'
          type: string
        prompt_tokens:
          description: Tokens the prompt cost.
          format: int32
          type: integer
        reason:
          description: 'One clause naming the concrete thing the model saw. This is also the text

            the agent is shown when a judgment raises an ask or a block, which is why an

            AUTO policy carries no message of its own.'
          type: string
        rubric_version:
          description: 'Version of the rubric the label was produced under. A label recorded today

            is not comparable to one recorded after the rubric changed, which is the

            whole reason the rubric is embedded verbatim rather than assembled per call.'
          type: string
      type: object
    v1GroupAggregationValueResponse:
      description: 'GroupAggregationValueResponse returns the value of the aggregation if

        requested.'
      properties:
        value:
          format: float
          type: number
      type: object
    v1AgentHookActivity:
      description: Activity describes what kind of hook activity the policy applies to.
      properties:
        auto_mode:
          $ref: '#/components/schemas/v1AutoModeActivity'
        cmd_line:
          $ref: '#/components/schemas/v1CmdLineActivity'
        dependency_risk:
          $ref: '#/components/schemas/v1DependencyRiskActivity'
        file_access:
          $ref: '#/components/schemas/v1FileAccessActivity'
        malware_check:
          $ref: '#/components/schemas/v1MalwareCheckActivity'
        mcp_server:
          $ref: '#/components/schemas/v1McpServerActivity'
        mcp_tool_call:
          $ref: '#/components/schemas/v1McpToolCallActivity'
        secrets_check:
          $ref: '#/components/schemas/v1SecretsCheckActivity'
        session:
          $ref: '#/components/schemas/v1SessionActivity'
        skill:
          $ref: '#/components/schemas/v1SkillActivity'
      type: object
    v1McpToolCallActivity:
      description: McpToolCallActivity matches tool calls to a specific MCP server and tool.
      properties:
        mcp_server_name:
          description: MCP server name (e.g. "jira").
          type: string
        server_name_matchers:
          description: Optional regex matchers for MCP server name.
          items:
            type: string
          type: array
        tool_input_matchers:
          description: Optional regex matchers for tool input (e.g. ".*AI.*").
          items:
            type: string
          type: array
        tool_name:
          description: Tool name (e.g. "open bug").
          type: string
        tool_name_matchers:
          description: Optional regex matchers for tool name.
          items:
            type: string
          type: array
      type: object
    v1SandboxConfigPosture:
      default: SANDBOX_CONFIG_POSTURE_UNSPECIFIED
      description: "SandboxConfigPosture is the session-level sandbox posture derived from agent configuration.\n\n - SANDBOX_CONFIG_POSTURE_UNSPECIFIED: No posture was evaluated by this client.\n - SANDBOX_CONFIG_POSTURE_UNKNOWN: The client evaluated configuration but could not determine posture.\n - SANDBOX_CONFIG_POSTURE_ENABLED: Configuration indicates sandboxing is enabled for the session.\n - SANDBOX_CONFIG_POSTURE_DISABLED: Configuration indicates sandboxing is disabled for the session."
      enum:
      - SANDBOX_CONFIG_POSTURE_UNSPECIFIED
      - SANDBOX_CONFIG_POSTURE_UNKNOWN
      - SANDBOX_CONFIG_POSTURE_ENABLED
      - SANDBOX_CONFIG_POSTURE_DISABLED
      type: string
    v1CmdHook:
      description: CmdHook contains payload for command-line related hooks.
      properties:
        cmd_line:
          description: Command line that was executed.
          type: string
        tool_input:
          description: Tool invocation input; structure is tool-specific (use Struct for JSON).
          type: object
        tool_response:
          description: Tool result; structure is tool-specific (e.g. stdout/stderr or filenames).
          type: object
      type: object
    v1BlockAction:
      description: BlockAction blocks the activity and shows a message.
      properties:
        feedback_message:
          description: Feedback message shown to the user when the action is blocked.
          type: string
        message:
          type: string
      type: object
    googleprotobufAny:
      additionalProperties: {}
      description: "`Any` contains an arbitrary serialized protocol buffer message along with a\nURL that describes the type of the serialized message.\n\nProtobuf library provides support to pack/unpack Any values in the form\nof utility functions or additional generated methods of the Any type.\n\nExample 1: Pack and unpack a message in C++.\n\n    Foo foo = ...;\n    Any any;\n    any.PackFrom(foo);\n    ...\n    if (any.UnpackTo(&foo)) {\n      ...\n    }\n\nExample 2: Pack and unpack a message in Java.\n\n    Foo foo = ...;\n    Any any = Any.pack(foo);\n    ...\n    if (any.is(Foo.class)) {\n      foo = any.unpack(Foo.class);\n    }\n    // or ...\n    if (any.isSameTypeAs(Foo.getDefaultInstance())) {\n      foo = any.unpack(Foo.getDefaultInstance());\n    }\n\n Example 3: Pack and unpack a message in Python.\n\n    foo = Foo(...)\n    any = Any()\n    any.Pack(foo)\n    ...\n    if any.Is(Foo.DESCRIPTOR):\n      any.Unpack(foo)\n      ...\n\n Example 4: Pack and unpack a message in Go\n\n     foo := &pb.Foo{...}\n     any, err := anypb.New(foo)\n     if err != nil {\n       ...\n     }\n     ...\n     foo := &pb.Foo{}\n     if err := any.UnmarshalTo(foo); err != nil {\n       ...\n     }\n\nThe pack methods provided by protobuf library will by default use\n'type.googleapis.com/full.type.name' as the type URL and the unpack\nmethods only use the fully qualified type name after the last '/'\nin the type URL, for example \"foo.bar.com/x/y.z\" will yield type\nname \"y.z\".\n\nJSON\n====\nThe JSON representation of an `Any` value uses the regular\nrepresentation of the deserialized, embedded message, with an\nadditional field `@type` which contains the type URL. Example:\n\n    package google.profile;\n    message Person {\n      string first_name = 1;\n      string last_name = 2;\n    }\n\n    {\n      \"@type\": \"type.googleapis.com/google.profile.Person\",\n      \"firstName\": <string>,\n      \"lastName\": <string>\n    }\n\nIf the embedded message type is well-known and has a custom JSON\nrepresentation, that representation will be embedded adding a field\n`value` which holds the custom JSON in addition to the `@type`\nfield. Example (for message [google.protobuf.Duration][]):\n\n    {\n      \"@type\": \"type.googleapis.com/google.protobuf.Duration\",\n      \"value\": \"1.212s\"\n    }"
      properties:
        '@type':
          description: "A URL/resource name that uniquely identifies the type of the serialized\nprotocol buffer message. This string must contain at least\none \"/\" character. The last segment of the URL's path must represent\nthe fully qualified name of the type (as in\n`path/google.protobuf.Duration`). The name should be in a canonical form\n(e.g., leading \".\" is not accepted).\n\nIn practice, teams usually precompile into the binary all types that they\nexpect it to use in the context of Any. However, for URLs which use the\nscheme `http`, `https`, or no scheme, one can optionally set up a type\nserver that maps type URLs to message definitions as follows:\n\n* If no scheme is provided, `https` is assumed.\n* An HTTP GET on the URL must yield a [google.protobuf.Type][]\n  value in binary format, or produce an error.\n* Applications are allowed to cache lookup results based on the\n  URL, or have them precompiled into a binary to avoid any\n  lookup. Therefore, binary compatibility needs to be preserved\n  on changes to types. (Use versioned type names to manage\n  breaking changes.)\n\nNote: this functionality is not currently available in the official\nprotobuf release, and it is not used for type URLs beginning with\ntype.googleapis.com. As of May 2023, there are no widely used type server\nimplementations and no plans to implement one.\n\nSchemes other than `http`, `https` (or the empty scheme) might be\nused with implementation specific semantics."
          type: string
      type: object
    v1FeedbackAction:
      description: FeedbackAction prompts the user with a message without blocking.
      properties:
        feedback_message:
          type: string
        message:
          type: string
      type: object
    v1McpServerSource:
      default: MCP_SERVER_SOURCE_UNSPECIFIED
      description: "McpServerSource is where an MCP server came from. Orthogonal to ServerType,\nwhich answers \"where does it run\": a vendor connector is a connector by\nsource and REMOTE by type at the same time. Declared here rather than in\nagentic_inventory.proto because that file imports this one, not the reverse.\n\n - MCP_SERVER_SOURCE_UNSPECIFIED: Not classified: no config snapshot was available to check the server\nagainst. Distinct from \"checked and absent\", which is CLIENT_INJECTED.\n - MCP_SERVER_SOURCE_PROJECT_CONFIG: Registered in the workspace's own checked-in agent config.\n - MCP_SERVER_SOURCE_USER_CONFIG: Registered in the user's home-directory agent config.\n - MCP_SERVER_SOURCE_ENTERPRISE_CONFIG: Registered in the OS-managed enterprise agent config.\n - MCP_SERVER_SOURCE_PLUGIN: Supplied by an agent plugin's manifest rather than by an mcp_servers entry.\n - MCP_SERVER_SOURCE_VENDOR_CONNECTOR: Vendor hosted connector enabled on the user's agent account, for\nexample a claude.ai connector. Never present in local config.\n - MCP_SERVER_SOURCE_CLIENT_RESERVED: A name the client reserves for one of its own built in servers, so\nuser config cannot register under it. Highest confidence verdict.\n - MCP_SERVER_SOURCE_CLIENT_INJECTED: Injected by the client at runtime but not on the reserved list: other\nproduct surfaces, IDE bridges, host applications. Absent from a config\nsnapshot that was loaded."
      enum:
      - MCP_SERVER_SOURCE_UNSPECIFIED
      - MCP_SERVER_SOURCE_PROJECT_CONFIG
      - MCP_SERVER_SOURCE_USER_CONFIG
      - MCP_SERVER_SOURCE_ENTERPRISE_CONFIG
      - MCP_SERVER_SOURCE_PLUGIN
      - MCP_SERVER_SOURCE_VENDOR_CONNECTOR
      - MCP_SERVER_SOURCE_CLIENT_RESERVED
      - MCP_SERVER_SOURCE_CLIENT_INJECTED
      type: string
    v1AgentIdentity:
      description: 'AgentIdentity is the org identity resolved for the account behind an event,

        sourced from the agent provider''s org directory. Only the caller''s own

        identity is ever resolved on a client (self-scoped).'
      properties:
        display_name:
          description: Display name of the resolved user.
          type: string
        email:
          description: Corporate email of the resolved user.
          type: string
        groups:
          description: Org groups / teams the user belongs to.
          items:
            type: string
          type: array
        roles:
          description: Org roles the user holds.
          items:
            type: string
          type: array
      type: object
    v1Meta:
      description: Common fields for all Endor Labs resources.
      properties:
        annotations:
          additionalProperties:
            type: string
          description: 'Annotations can be used to attach metadata to a resource message.

            Annotation values can be small or large, structured or unstructured,

            and may include characters not permitted by labels.

            The keys may contain alphanumerics, underscores (_), dots (.) and dashes

            (-). The values of an annotation must be 16384 bytes or smaller.'
          type: object
        create_time:
          description: 'Time the resource was created.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: 'Name and authentication source of the user who created the object,

            for example, ewok@endor.ai@google@api-key.'
          readOnly: true
          type: string
        description:
          description: Resource description. Must be less than 1024 bytes.
          type: string
        index_data:
          $ref: '#/components/schemas/v1IndexData'
        kind:
          description: 'Resource kind, for example, HelloResponse.

            Auto-generated using the protobuf message proto.MessageName().Name().'
          readOnly: true
          type: string
        name:
          description: Resource name. Must be 63 characters or less.
          type: string
        parent_kind:
          description: Parent object resource kind, for example, Project.
          type: string
        parent_uuid:
          description: Parent object UUID.
          type: string
        references:
          additionalProperties:
            $ref: '#/components/schemas/googleprotobufAny'
          description: Map of objects referenced in a query API.
          readOnly: true
          type: object
        tags:
          description: 'List of tags attached to the resource.

            Tags can be used to select objects and to find collections of objects that

            satisfy certain conditions. A tag must be 255 characters or less.'
          items:
            type: string
          type: array
        update_time:
          description: 'Time the resource was last updated.

            Note: Updated on all create/patch/delete operations.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: 'Name and authentication source of the last user who updated the object,

            for example, vulnerabilityingestor@endor.ai@x509.'
          readOnly: true
          type: string
        upsert_time:
          description: 'Time the resource was last upserted.


            Note:

            create_time is only set the first time the resource is created.

            upsert_time is set every time the resource is upseted.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        version:
          description: Message version.
          readOnly: true
          type: string
      required:
      - name
      type: object
    v1AgentHookPolicy:
      description: 'AgentHookPolicy describes a policy to apply when agent hook events match a

        given activity. When the activity matches, the action (e.g. feedback, block,

        alert) is applied.'
      properties:
        action:
          $ref: '#/components/schemas/v1AgentHookAction'
        activity:
          $ref: '#/components/schemas/v1AgentHookActivity'
        enabled:
          description: Whether this policy is active.
          type: boolean
        intent:
          $ref: '#/components/schemas/v1PolicyIntent'
        inventory_classification:
          $ref: '#/components/schemas/v1InventoryClassification'
        name:
          description: Name of the policy.
          type: string
        scope:
          $ref: '#/components/schemas/v1AgentHookPolicyScope'
        system:
          description: Whether this is a system-defined policy (vs user-defined).
          type: boolean
      type: object
    v1McpToolHook:
      description: McpToolHook contains payload for MCP tool-related hooks.
      properties:
        cmd_line:
          description: 'Shell command this call runs, when the tool is a shell (Claude Desktop''s

            local agent mode exposes server "workspace", tool "bash"). Such a call is

            indistinguishable in what it can do from the agent''s own Bash tool, but the

            command arrives inside tool_input, where nothing that reads CmdHook.cmd_line

            can find it. Lifting it here gives the two paths one field to read, so a

            consumer does not have to re-derive the shell-tool vocabulary to see the

            highest-signal action an agent takes. Empty for every non-shell tool.'
          type: string
        server_host:
          description: Host or URL of the server (e.g. "localhost", "https://api.example.com").
          type: string
        server_name:
          description: Name of the server (e.g. "filesystem", "postgres-mcp", "github-mcp", "enfor-cli-tools").
          type: string
        server_type:
          $ref: '#/components/schemas/v1ServerType'
        source:
          $ref: '#/components/schemas/v1McpServerSource'
        tool_input:
          description: Tool invocation input; structure is tool-specific (use Struct for JSON).
          type: object
        tool_name:
          description: Name of the tool (e.g. "Bash", "Glob", "AskUserQuestion", "Skill").
          type: string
        tool_response:
          description: Tool result; structure is tool-specific (e.g. stdout/stderr or filenames).
          type: object
      type: object
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    AgentHookActionMatchType:
      default: MATCH_TYPE_UNSPECIFIED
      description: 'We may want to trigger when the activity matches the patterns in the policy (blocklist)

        or alternatively when the activity does not match the patterns in the policy (allowlist).'
      enum:
      - MATCH_TYPE_UNSPECIFIED
      - MATCH_TYPE_BLOCKLIST
      - MATCH_TYPE_ALLOWLIST
      type: string
    v1HarnessSandbox:
      default: HARNESS_SANDBOX_UNSPECIFIED
      description: "HarnessSandbox identifies sandboxing around the agent harness itself.\n\n - HARNESS_SANDBOX_UNSPECIFIED: Harness sandboxing was not evaluated.\n - HARNESS_SANDBOX_NONE_DETECTED: No harness sandbox was detected.\n - HARNESS_SANDBOX_CONTAINER_DIY: The harness appears to run inside a generic container.\n - HARNESS_SANDBOX_DEDICATED_TOOL: The harness is managed by a dedicated sandbox tool.\n - HARNESS_SANDBOX_SANDBOX_RUNTIME: The harness is managed by a sandbox runtime.\n - HARNESS_SANDBOX_UNKNOWN: Checked but could not be classified."
      enum:
      - HARNESS_SANDBOX_UNSPECIFIED
      - HARNESS_SANDBOX_NONE_DETECTED
      - HARNESS_SANDBOX_CONTAINER_DIY
      - HARNESS_SANDBOX_DEDICATED_TOOL
      - HARNESS_SANDBOX_SANDBOX_RUNTIME
      - HARNESS_SANDBOX_UNKNOWN
      type: string
    AgentHookEventSpecFileOperation:
      default: FILE_OPERATION_UNSPECIFIED
      description: FileOperation identifies the type of file access.
      enum:
      - FILE_OPERATION_UNSPECIFIED
      - FILE_OPERATION_READ
      - FILE_OPERATION_WRITE
      - FILE_OPERATION_DELETE
      - FILE_OPERATION_EDIT
      type: string
    v1TenantMeta:
      description: Tenant related data for the tenant containing the resource.
      properties:
        namespace:
          description: 'Namespaces are a way to organize organizational units into virtual

            groupings of resources. Namespaces must be a fully qualified name,

            for example, the child namespace of namespace "endor.prod" called "app"

            is called "endor.prod.app".'
