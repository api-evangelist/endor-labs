            tenant_meta:
              description: AgentHookEvent are associated with a tenant or are global.
              title: AgentHookEvent are associated with a tenant or are global.
              type: object
            uuid:
              description: The UUID of an AgentHookEvent.
              readOnly: true
              type: string
          type: object
        request:
          $ref: '#/components/schemas/v1UpdateRequest'
      required:
      - meta
      type: object
    v1SecretsCheckActivity:
      description: 'SecretsCheckActivity runs Endor''s secret detection over file content (the

        proposed content of a write/edit, or a file read scanned from disk). Matching

        the activity means running the scan; the verdict comes from the findings, not

        from the policy config.'
      properties:
        exclude_file_patterns:
          description: 'Skip files whose path matches one of these regexes (e.g. test fixtures,

            "*.example" files, vendored dirs). Applied after include_file_patterns.'
          items:
            type: string
          type: array
        exclude_rule_ids:
          description: 'Rule IDs whose findings this policy ignores. Matched as for

            include_rule_ids, and applied after it, so an id in both is ignored.'
          items:
            type: string
          type: array
        file_operations:
          description: 'File operations to scan. Empty means write and edit; scanning a read means

            reading the file from disk, so reads are opt-in.'
          items:
            $ref: '#/components/schemas/v1FileAccessActivityFileOperation'
          type: array
        include_file_patterns:
          description: 'Only scan files whose path matches one of these regexes. Empty means all

            files the event covers.'
          items:
            type: string
          type: array
        include_rule_ids:
          description: 'Rule IDs whose findings this policy acts on, compared exactly and

            case-sensitively against the rule id on each finding

            (SecretRule.spec.rule_id, e.g. "aws-access-token"). Empty means every rule in

            the tenant''s effective ruleset.'
          items:
            type: string
          type: array
      type: object
    v1CmdLineActivity:
      description: CmdLineActivity matches command-line execution by regex patterns.
      properties:
        patterns:
          description: Patterns to match against the command (e.g. "rm -rf /.*", "curl .* \\| bash").
          items:
            type: string
          type: array
      type: object
    v1AiToolInventory:
      description: AiToolInventory contains all AI development tools detected on the host machine.
      properties:
        detections:
          description: Detected AI tools.
          items:
            $ref: '#/components/schemas/v1AiToolDetection'
          type: array
      type: object
    v1LlmJudgmentKind:
      default: KIND_UNSPECIFIED
      description: "What the judge was asked to rule on.\n\n - KIND_COMMAND_RISK: Risk of a shell command the agent proposed to run."
      enum:
      - KIND_UNSPECIFIED
      - KIND_COMMAND_RISK
      type: string
    v1SkillActivity:
      description: 'SkillActivity matches skills by name patterns and/or score thresholds.

        Match logic: configured branches are AND''d — when both name_matchers

        and score predicates are set, both must hold for the match to fire;

        when only one is set, only that one must hold; if neither is set,

        the activity never matches. Within the score branch, score_at_or_below

        and every set field of dimension_at_or_below are OR''d: any single

        satisfied threshold fires the branch. When score predicates are set

        but no SkillMeta is available for the skill, the score branch is

        configured-but-cannot-fire, failing the AND with the name branch

        (fail-safe).'
      properties:
        dimension_at_or_below:
          $ref: '#/components/schemas/v1SkillDimensionThresholds'
        name_matchers:
          description: 'Regex matchers for skill name (e.g. "untrusted-.*", "experimental-.*").

            AND''d with the score-predicate branch when both are configured.'
          items:
            type: string
          type: array
        score_at_or_below:
          description: 'Match when the overall score is at or below this threshold

            (scores are 1-10, higher = safer). OR''d with dimension_at_or_below.'
          format: float
          type: number
      type: object
    CmdLineMatchCommandSource:
      default: COMMAND_SOURCE_UNSPECIFIED
      description: "CommandSource names the hook payload the evaluated command text was read\nfrom. A shell exposed as an MCP tool (e.g. Claude Desktop's \"workspace\"\nserver, tool \"bash\") carries its command in mcp_tool.tool_input rather\nthan in cmd_line, so CmdLine policies read from either payload and record\nwhich one they read.\n\n - COMMAND_SOURCE_UNSPECIFIED: Records written before the command source was tracked.\n - COMMAND_SOURCE_CMD_HOOK: spec.cmd_line: the agent's own shell tool.\n - COMMAND_SOURCE_MCP_TOOL_INPUT: spec.mcp_tool.tool_input: a shell exposed as an MCP tool."
      enum:
      - COMMAND_SOURCE_UNSPECIFIED
      - COMMAND_SOURCE_CMD_HOOK
      - COMMAND_SOURCE_MCP_TOOL_INPUT
      type: string
    v1AiToolCategory:
      default: AI_TOOL_CATEGORY_UNSPECIFIED
      description: "AiToolCategory classifies a detected AI development tool.\n\n - AI_TOOL_CATEGORY_SANDBOX_TOOL: Dedicated sandbox tools that wrap an agent, as opposed to an agent's own\nbuilt-in sandbox."
      enum:
      - AI_TOOL_CATEGORY_UNSPECIFIED
      - AI_TOOL_CATEGORY_IDE
      - AI_TOOL_CATEGORY_CLI_TOOL
      - AI_TOOL_CATEGORY_AGENT
      - AI_TOOL_CATEGORY_FRAMEWORK
      - AI_TOOL_CATEGORY_MCP_CONFIG
      - AI_TOOL_CATEGORY_IDE_EXTENSION
      - AI_TOOL_CATEGORY_SANDBOX_TOOL
      type: string
    v1MalwareMatch:
      description: 'MalwareMatch describes a package flagged by the malware check. The verdict

        comes from a MALWARE-status, non-contested record in Endor''s malware feed.'
      properties:
        ecosystem:
          description: Ecosystem the package belongs to (e.g. "npm", "pypi").
          type: string
        message:
          description: Human-readable explanation of what fired.
          type: string
        package_name:
          description: Package name (e.g. "reftest-helper-for-ae1x").
          type: string
        reasons:
          description: Why the package is flagged — indicators reported by the malware feed.
          items:
            type: string
          type: array
        source:
          description: Feed that flagged it, as the MalwareSource enum name (e.g. "MALWARE_SOURCE_AMF").
          type: string
        summary:
          description: Short title from the malware feed (e.g. "Malicious code in <pkg> (npm)").
          type: string
        version:
          description: Version from the install command, when it was pinned; empty for an unpinned install.
          type: string
      type: object
    v1ServerType:
      default: SERVER_TYPE_UNSPECIFIED
      description: ServerType indicates whether a tool server runs locally or remotely.
      enum:
      - SERVER_TYPE_UNSPECIFIED
      - SERVER_TYPE_LOCAL
      - SERVER_TYPE_REMOTE
      type: string
    v1SessionHook:
      properties:
        ai_tool_inventory:
          $ref: '#/components/schemas/v1AiToolInventory'
        composer_mode:
          description: 'Composer mode of the session.


            "agent", "ask", "edit"'
          type: string
        config:
          $ref: '#/components/schemas/v1AgentConfigSnapshot'
        harness_sandbox:
          $ref: '#/components/schemas/v1HarnessSandbox'
        harness_sandbox_detail:
          description: Additional harness sandbox classification detail.
          type: string
        is_background_agent:
          description: Whether the session is a background agent.
          type: boolean
        reason:
          description: 'Reason for the session.


            For SESSION_END: "completed", "aborted", "error"'
          type: string
        sandbox_config_posture:
          $ref: '#/components/schemas/v1SandboxConfigPosture'
        skills:
          description: Skills discovered in the workspace during session start.
          items:
            $ref: '#/components/schemas/v1DiscoveredSkill'
          type: array
        source:
          description: 'Source of the session.


            "startup", "resume", "clear"'
          type: string
      title: Session lifecycle metadata (only populated for SESSION_START/END)
      type: object
    v1GroupResponse:
      description: Response to a list group request.
      properties:
        groups:
          additionalProperties:
            $ref: '#/components/schemas/GroupResponseGroupData'
          description: 'Map indexed by values of the fields specified in aggregation_paths,

            for example, {"[{"key":"meta.kind","value":"Project"}]": {

            "aggregation_count": { "count": 1649 } } }.'
          type: object
      type: object
    v1AgentSandboxConfig:
      description: AgentSandboxConfig normalizes sandbox network and filesystem rules across agents.
      properties:
        allow_unsandboxed_commands:
          description: 'AllowUnsandboxedCommands allows the agent to escape the sandbox on

            demand. Wrapped to distinguish "unset" from "false".'
          type: boolean
        allowed_network_hosts:
          description: AllowedNetworkHosts lists hostnames/domains the agent may reach.
          items:
            type: string
          type: array
        blocked_network_hosts:
          description: 'BlockedNetworkHosts lists hostnames/domains the agent may not reach.

            Populated from Cursor configs only; Claude Code uses allowlist-only.'
          items:
            type: string
          type: array
        enabled:
          description: 'Enabled indicates whether sandboxing is turned on.

            Wrapped to distinguish "unset" from "false".'
          type: boolean
        excluded_commands:
          description: ExcludedCommands lists commands that always run outside the sandbox.
          items:
            type: string
          type: array
        fail_if_unavailable:
          description: 'FailIfUnavailable causes the agent to exit when sandboxing is unavailable.

            Wrapped to distinguish "unset" from "false".'
          type: boolean
        readable_paths:
          description: ReadablePaths lists filesystem paths the agent may read from.
          items:
            type: string
          type: array
        writable_paths:
          description: WritablePaths lists filesystem paths the agent may write to.
          items:
            type: string
          type: array
      type: object
    v1SessionHookCriteria:
      description: 'SessionHookCriteria matches against AgentHookConfig entries at any

        AgentConfigLevel. Each field is optional.'
      properties:
        command_matchers:
          description: Regex matchers for hook command strings (e.g. "curl .* \\| bash").
          items:
            type: string
          type: array
        event_name_matchers:
          description: Regex matchers for hook event_name (e.g. "PostToolUse").
          items:
            type: string
          type: array
      type: object
    v1QueryCommandClassificationLabel:
      default: LABEL_UNSPECIFIED
      description: "Label is the judgment on one command. Each value maps to an action the\nagent hook already has.\n\n - LABEL_UNSPECIFIED: No label was produced. Never treat this as a benign result.\n - LABEL_BENIGN: The command shows nothing concerning on its own.\n - LABEL_SUSPICIOUS: The command shows something concerning.\n - LABEL_REVIEW: The decision turns on context the model does not have, so the command\nbelongs in front of the user rather than being cleared or blocked."
      enum:
      - LABEL_UNSPECIFIED
      - LABEL_BENIGN
      - LABEL_SUSPICIOUS
      - LABEL_REVIEW
      type: string
    v1SessionModelCriteria:
      description: 'SessionModelCriteria matches against default_model and available_models

        at any AgentConfigLevel. Each field is optional.'
      properties:
        available_model_matchers:
          description: Regex matchers for entries in available_models.
          items:
            type: string
          type: array
        default_model_matchers:
          description: Regex matchers for default_model.
          items:
            type: string
          type: array
      type: object
    v1InventoryClassification:
      default: INVENTORY_CLASSIFICATION_UNSPECIFIED
      description: 'InventoryClassification declares the classification a policy assigns to a

        matched MCP server or skill when it fires. UNSPECIFIED means the policy

        plays no role in inventory classification (e.g. a session, file-access,

        or cmd-line policy, or an MCP/skill policy whose author only wants the

        per-event action).'
      enum:
      - INVENTORY_CLASSIFICATION_UNSPECIFIED
      - INVENTORY_CLASSIFICATION_ALLOW
      - INVENTORY_CLASSIFICATION_BLOCK
      - INVENTORY_CLASSIFICATION_SUSPICIOUS
      - INVENTORY_CLASSIFICATION_MALICIOUS
      type: string
    v1AlertAction:
      description: AlertAction records an alert with a message (e.g. for audit).
      properties:
        feedback_message:
          description: Feedback message shown to the user when the alert is raised.
          type: string
        message:
          type: string
      type: object
    SpecUserKind:
      default: USER_KIND_UNSPECIFIED
      description: "UserKind says which kind of identifier the user field carries. Agents\nname their users differently, so the value alone cannot be classified:\na bare login is indistinguishable from an OS login of the same spelling.\nA consumer that joins identities must read this before treating a user\nas an account.\n\n - USER_KIND_UNSPECIFIED: No kind was reported, which is what events from builds older than this\nfield look like. Treat the user field as unclassified rather than as\nany particular kind.\n - USER_KIND_EMAIL: Account email the agent itself reports.\n - USER_KIND_GITHUB_LOGIN: GitHub account handle, which is all GitHub Copilot records locally.\n - USER_KIND_OS_LOGIN: No agent account was resolved, so the user field repeats os_user.\nNever join on this as an account: one shared machine would merge every\ndeveloper who used it into a single identity.\n - USER_KIND_ASSERTED: Identifier supplied by the operator through the environment rather than\nread from the agent, so its shape is whatever the fleet configured."
      enum:
      - USER_KIND_UNSPECIFIED
      - USER_KIND_EMAIL
      - USER_KIND_GITHUB_LOGIN
      - USER_KIND_OS_LOGIN
      - USER_KIND_ASSERTED
      type: string
    v1AiToolDetection:
      description: AiToolDetection represents a single detected AI development tool.
      properties:
        category:
          $ref: '#/components/schemas/v1AiToolCategory'
        evidence:
          description: Evidence supporting the detection.
          items:
            $ref: '#/components/schemas/v1AiToolEvidence'
          type: array
        tool:
          description: Tool identifier (e.g. "cursor", "claude-code", "ollama").
          type: string
        vendor:
          description: Vendor name (e.g. "Anthropic", "OpenSource", "Google").
          type: string
      type: object
    v1AgentHookPolicyMatch:
      description: AgentHookPolicyMatch tracks a policy match.
      properties:
        cmd_line:
          $ref: '#/components/schemas/v1CmdLineMatch'
        dependency_risk:
          $ref: '#/components/schemas/v1DependencyRiskMatch'
        file_access:
          $ref: '#/components/schemas/v1FileAccessMatch'
        malware:
          $ref: '#/components/schemas/v1MalwareMatch'
        match_type:
          $ref: '#/components/schemas/AgentHookPolicyMatchAgentHookPolicyMatchType'
        mcp_server:
          $ref: '#/components/schemas/v1McpServerMatch'
        mcp_tool_call:
          $ref: '#/components/schemas/v1McpToolMatch'
        policy_matched:
          $ref: '#/components/schemas/v1AgentHookPolicy'
        secrets:
          $ref: '#/components/schemas/v1SecretsMatch'
        session:
          $ref: '#/components/schemas/v1SessionMatch'
        skill:
          $ref: '#/components/schemas/v1SkillMatch'
      type: object
    v1CountResponse:
      description: Response to a list count request.
      properties:
        count:
          description: Number of objects matching the given list parameters.
          format: int32
          type: integer
      type: object
    v1McpServerMatch:
      description: 'McpServerMatch describes an MCP server that matched a policy. Carries

        only the matched server''s name; consumers can fetch the full McpMeta

        from AgenticInventory if more detail is needed. Server-level match;

        for individual tool calls, see McpToolMatch.'
      properties:
        mcp_server_name:
          description: Name of the MCP server that matched.
          type: string
        message:
          description: 'Describes what exactly matched (e.g. "score at or below threshold 5",

            "supply_chain_provenance at or below 4").'
          type: string
      type: object
