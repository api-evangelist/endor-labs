      properties:
        file_name_patterns:
          description: Regex file patterns (e.g. "\\.env$", "secrets/.*", ".*\\.key$").
          items:
            type: string
          type: array
        file_operation:
          $ref: '#/components/schemas/v1FileAccessActivityFileOperation'
      type: object
    v1AgentHookConfig:
      description: 'AgentHookConfig represents one hook event binding: the event that triggers

        it and the commands that run in response.'
      properties:
        commands:
          description: Commands lists the shell commands registered for this event.
          items:
            type: string
          type: array
        event_name:
          description: EventName is the lifecycle hook event name (e.g. "PostToolUse").
          type: string
      type: object
    AgentHookEventServiceCreateAgentHookEventBody:
      description: 'AgentHookEvent represents a single event emitted by the agent runtime.

        Each event has a type, context, and optional type-specific payload.'
      properties:
        consumers_failed:
          description: Consumer keys that failed to process this event. Used for retry.
          items:
            type: string
          readOnly: true
          type: array
        meta:
          $ref: '#/components/schemas/v1Meta'
        processing_result:
          $ref: '#/components/schemas/v1ProcessingResult'
        spec:
          $ref: '#/components/schemas/v1AgentHookEventSpec'
        tenant_meta:
          description: AgentHookEvent are associated with a tenant or are global.
          title: AgentHookEvent are associated with a tenant or are global.
          type: object
        uuid:
          description: The UUID of an AgentHookEvent.
          readOnly: true
          type: string
      required:
      - meta
      type: object
    v1McpServerActivity:
      description: 'McpServerActivity matches MCP servers by name patterns and/or score

        thresholds. Match logic: configured branches are AND''d — when both

        server_name_matchers and score predicates are set, both must hold;

        when only one is set, only that one must hold; if neither is set,

        the activity never matches. Within the score branch, score_at_or_below

        and every set field of dimension_at_or_below are OR''d: any single

        satisfied threshold fires the branch. This is server-level matching;

        for per-tool-call matching, use McpToolCallActivity.'
      properties:
        dimension_at_or_below:
          $ref: '#/components/schemas/v1McpDimensionThresholds'
        score_at_or_below:
          description: 'Match when the overall score is at or below this threshold

            (scores are 1-10, higher = safer). OR''d with dimension_at_or_below.'
          format: float
          type: number
        server_name_matchers:
          description: 'Regex matchers for MCP server name (e.g. "untrusted-.*", "remote-.*").

            AND''d with the score-predicate branch when both are configured.'
          items:
            type: string
          type: array
      type: object
    v1AiToolEvidence:
      description: AiToolEvidence is a single key-value signal supporting an AI tool detection.
      properties:
        key:
          description: Evidence key (e.g. "install_path", "binary_path", "version", "config_path").
          type: string
        value:
          description: Evidence value.
          type: string
      type: object
    v1AgentHookEventSpec:
      properties:
        agent:
          $ref: '#/components/schemas/SpecAgent'
        agent_version:
          description: Agent version if available.
          type: string
        cmd_line:
          $ref: '#/components/schemas/v1CmdHook'
        cwd:
          description: Working directory when the event was captured.
          type: string
        device_id:
          description: Device ID if available.
          type: string
        duration_msec:
          description: Duration in milliseconds.
          format: float
          type: number
        error_message:
          description: Error message if the hook event failed.
          type: string
        file:
          $ref: '#/components/schemas/v1FileHook'
        has_policy_violation:
          description: Set to true when policy_matches is non-empty.
          type: boolean
        hook_event_category:
          $ref: '#/components/schemas/SpecHookEventCategory'
        hook_event_name:
          $ref: '#/components/schemas/SpecHookEventName'
        identity:
          $ref: '#/components/schemas/v1AgentIdentity'
        internal_tool:
          $ref: '#/components/schemas/v1InternalToolHook'
        is_interrupted:
          description: Whether the hook event was interrupted.
          type: boolean
        llm_judgments:
          description: 'Judgments the LLM judge made while this event was evaluated.


            Repeated because the judge will be asked more than one kind of question

            (prompt injection is Phase 1), not because one command produces several

            judgments: one command is one judge call, and a command that matches two

            policies still carries exactly one.


            A judgment here does NOT by itself mean the event violated a policy. Under

            JUDGE_SCOPE_ALL_COMMANDS most commands come back benign and match nothing, and

            those events carry a judgment with has_policy_violation unset. So does a

            command whose every match the judge released. The released matches are in

            LlmJudgment.judged_matches.'
          items:
            $ref: '#/components/schemas/v1LlmJudgment'
          type: array
        mcp_tool:
          $ref: '#/components/schemas/v1McpToolHook'
        model:
          description: Model involved.
          type: string
        os_user:
          description: 'Operating-system login of the account running the agent, carried

            alongside user rather than instead of it, and populated even when it

            repeats user.


            This is the key that links one person''s agent accounts, because the same

            developer is an email to one agent and a GitHub handle to another while

            staying one OS login underneath. Pair it with device_id: on a shared

            machine or a CI runner the login is a generic name such as "runner" or

            "root", and joining on it alone merges unrelated people.'
          type: string
        permission_mode:
          description: Permission mode at capture time (e.g. "default", "acceptEdits").
          type: string
        policy_matches:
          description: List of policy matches (if any).
          items:
            $ref: '#/components/schemas/v1AgentHookPolicyMatch'
          type: array
        raw_hook_event_name:
          description: Raw hook event name from the agent.
          type: string
        repository:
          description: Repository where the action happened.
          type: string
        sandbox_config_posture:
          $ref: '#/components/schemas/v1SandboxConfigPosture'
        session:
          $ref: '#/components/schemas/v1SessionHook'
        session_id:
          description: Session identifier for the agent run.
          type: string
        sub_session_id:
          description: Sub-session identifier for the agent run.
          type: string
        user:
          description: User name if available.
          type: string
        user_kind:
          $ref: '#/components/schemas/SpecUserKind'
      type: object
    v1SkillDimensionThresholds:
      description: 'SkillDimensionThresholds holds per-dimension score thresholds for

        SkillActivity. Each field is optional; an unset dimension is ignored.

        Set dimensions are OR''d among themselves and with score_at_or_below:

        any single dimension at or below its threshold fires the predicate.

        Dimension names mirror AgenticInventory.SkillScoreDimensions.'
      properties:
        data_protection:
          description: Threshold for data protection (credential access, exfiltration).
          format: float
          type: number
        external_dependencies:
          description: Threshold for external dependencies (untrusted sources, remote code).
          format: float
          type: number
        instruction_integrity:
          description: Threshold for instruction integrity (prompt injection, boundary violations).
          format: float
          type: number
        permission_boundaries:
          description: Threshold for permission boundaries (privilege claims, tool misuse).
          format: float
          type: number
      type: object
    v1FileHook:
      description: FileHook contains payload for file-related hooks.
      properties:
        file_name:
          description: File name or path.
          type: string
        operation:
          $ref: '#/components/schemas/AgentHookEventSpecFileOperation'
        tool_input:
          description: Tool invocation input; structure is tool-specific (use Struct for JSON).
          type: object
        tool_response:
          description: Tool result; structure is tool-specific (e.g. stdout/stderr or filenames).
          type: object
      type: object
    v1ListAgentHookEventsResponseList:
      properties:
        objects:
          items:
            $ref: '#/components/schemas/v1AgentHookEvent'
          type: array
        response:
          $ref: '#/components/schemas/v1ListResponse'
      type: object
    v1SkillMatch:
      description: 'SkillMatch describes a skill that matched a policy. Carries only the

        matched skill''s name; consumers can fetch the full SkillMeta from

        AgenticInventory if more detail is needed.'
      properties:
        message:
          description: 'Describes what exactly matched (e.g. "score at or below threshold 5",

            "instruction_integrity at or below 4").'
          type: string
        skill_name:
          description: Name of the skill that matched.
          type: string
      type: object
    v1AutoModeActivity:
      description: 'AutoModeActivity turns LLM command judging on for a namespace and says which

        commands reach the judge.


        It is an activity kind rather than a resource of its own so that it inherits

        the AgentHookPolicyDefinition machinery: namespace propagation, name-based

        deduplication, the JSONL policy-file cache, enabled, and scope.


        It never produces a match of its own. It is read before the per-policy loop to

        decide which commands are judged, and a match the judge raises is a CMD_LINE

        match attributed to this policy. The model stays server-owned: the policy

        carries no model name and no prompt, only deployment_context.


        EXACTLY ONE applies to an event — the most specifically scoped candidate, with

        the policy name breaking an equal rank — and it supplies the whole

        configuration. They are not unioned, unlike secrets_check or malware_check,

        because a mode is not a finding: OR is monotone, so nothing at a narrower

        scope could ever turn a setting back off. A policy that loses is named in a

        warning, stays enabled and listed, and does nothing.'
      properties:
        deployment_context:
          description: 'Free-text lines describing the local deployment: which hosts are the

            organisation''s own, which registries are sanctioned, that ENDOR_TOKEN is

            expected on this machine.


            These fill the trust anchors the rubric names as deployment-supplied and

            ships empty; until they are set the rubric over-escalates on ordinary

            internal traffic. They are appended AFTER the rubric, so the rubric stays a

            byte-identical prefix the provider can serve from its cache.


            The bounds below are per entry. ValidatePolicy bounds the SUM at 8 KiB, the

            point past which the judge stops reading, so a tenant cannot store context

            that would be dropped unread on every call — nor a policy line long enough

            to break the JSONL reader that distributes the set to hooks.'
          items:
            type: string
          type: array
        judge_scope:
          $ref: '#/components/schemas/AutoModeActivityJudgeScope'
      type: object
    v1DependencyRiskActivity:
      description: 'DependencyRiskActivity checks the dependencies an event introduces (from an

        install command or a manifest/lockfile edit) against Endor''s vulnerability

        data. Matching the activity means running the check; the verdict comes from

        the lookup, not from the policy config.'
      properties:
        ecosystems:
          description: Ecosystems to check (e.g. "npm", "pypi"). Empty means all ecosystems.
          items:
            type: string
          type: array
        exclude_file_patterns:
          description: 'Skip files whose path matches one of these regexes. Applied after

            include_file_patterns.'
          items:
            type: string
          type: array
        include_file_patterns:
          description: 'Only check files whose path matches one of these regexes. Empty means every

            manifest/lockfile name the check recognizes.'
          items:
            type: string
          type: array
        include_transitives:
          description: Also check the packages the new dependency pulls in.
          type: boolean
        min_cvss_severity:
          $ref: '#/components/schemas/v1DependencyRiskActivitySeverity'
      type: object
    GroupResponseGroupData:
      description: Information about objects matching the given key.
      properties:
        aggregation_count:
          $ref: '#/components/schemas/v1CountResponse'
        aggregation_uuids:
          description: 'List of UUIDs of the objects in the group.

            Only populated if show_aggregation_uuids is set.'
