openapi: 3.2.0
info:
  description: Integrate your application with Endor Labs using the REST API.
  title: Endor Labs REST API Reference Policy Validation Service API
  version: '1.0'
servers:
- description: US (default)
  url: https://api.endorlabs.com
- description: EU (data residency)
  url: https://api.eu.endorlabs.com
tags:
- name: PolicyValidationService
paths:
  /v1/namespaces/{tenant_meta.namespace}/policy/validate:
    post:
      description: Creates a policy validation request.
      operationId: PolicyValidationService_CreatePolicyValidation
      parameters:
      - description: 'Namespaces are a way to organize organizational units into virtual

          groupings of resources. Namespaces must be a fully qualified name,

          for example, the child namespace of namespace "endor.prod" called "app"

          is called "endor.prod.app".'
        in: path
        name: tenant_meta.namespace
        required: true
        schema:
          type: string
        x-endor-name: Namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyValidationServiceCreatePolicyValidationBody'
        required: true
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1PolicyValidation'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
          description: An unexpected error response.
      summary: CreatePolicyValidation
      tags:
      - PolicyValidationService
      x-internal: true
components:
  schemas:
    v1TenantMeta:
      description: Tenant related data for the tenant containing the resource.
      properties:
        namespace:
          description: 'Namespaces are a way to organize organizational units into virtual

            groupings of resources. Namespaces must be a fully qualified name,

            for example, the child namespace of namespace "endor.prod" called "app"

            is called "endor.prod.app".'
          type: string
      required:
      - namespace
      type: object
    v1Meta:
      description: Common fields for all Endor Labs resources.
      properties:
        annotations:
          additionalProperties:
            type: string
          description: 'Annotations can be used to attach metadata to a resource message.

            Annotation values can be small or large, structured or unstructured,

            and may include characters not permitted by labels.

            The keys may contain alphanumerics, underscores (_), dots (.) and dashes

            (-). The values of an annotation must be 16384 bytes or smaller.'
          type: object
        create_time:
          description: 'Time the resource was created.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        created_by:
          description: 'Name and authentication source of the user who created the object,

            for example, ewok@endor.ai@google@api-key.'
          readOnly: true
          type: string
        description:
          description: Resource description. Must be less than 1024 bytes.
          type: string
        index_data:
          $ref: '#/components/schemas/v1IndexData'
        kind:
          description: 'Resource kind, for example, HelloResponse.

            Auto-generated using the protobuf message proto.MessageName().Name().'
          readOnly: true
          type: string
        name:
          description: Resource name. Must be 63 characters or less.
          type: string
        parent_kind:
          description: Parent object resource kind, for example, Project.
          type: string
        parent_uuid:
          description: Parent object UUID.
          type: string
        references:
          additionalProperties:
            $ref: '#/components/schemas/googleprotobufAny'
          description: Map of objects referenced in a query API.
          readOnly: true
          type: object
        tags:
          description: 'List of tags attached to the resource.

            Tags can be used to select objects and to find collections of objects that

            satisfy certain conditions. A tag must be 255 characters or less.'
          items:
            type: string
          type: array
        update_time:
          description: 'Time the resource was last updated.

            Note: Updated on all create/patch/delete operations.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        updated_by:
          description: 'Name and authentication source of the last user who updated the object,

            for example, vulnerabilityingestor@endor.ai@x509.'
          readOnly: true
          type: string
        upsert_time:
          description: 'Time the resource was last upserted.


            Note:

            create_time is only set the first time the resource is created.

            upsert_time is set every time the resource is upseted.


            Format: 2017-01-15T01:30:15.01Z

            RFC 3339: https://www.ietf.org/rfc/rfc3339.txt.'
          format: date-time
          readOnly: true
          type: string
        version:
          description: Message version.
          readOnly: true
          type: string
      required:
      - name
      type: object
    PolicyValidationServiceCreatePolicyValidationBody:
      description: PolicyValidation represents a policy validation request and response.
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1PolicyValidationSpec'
        tenant_meta:
          description: The tenant metadata restrict access to a specific tenant.
          title: The tenant metadata restrict access to a specific tenant.
          type: object
        uuid:
          description: The UUID of the resource.
          readOnly: true
          type: string
      required:
      - tenant_meta
      - meta
      - spec
      type: object
    PolicyPolicyType:
      default: POLICY_TYPE_UNSPECIFIED
      description: " - POLICY_TYPE_ADMISSION: POLICY_TYPE_ADMISSION will admit/reject pipeline runs.\nAdmission policies operate on Findings and are run during\na CI/CD pipeline. They may return data such as the uuids\nof findings that violate the policy.\n - POLICY_TYPE_NOTIFICATION: POLICY_TYPE_NOTIFICATION is for policies that generate notifications.\n - POLICY_TYPE_ML_FINDING: ML finding policies enable or disable algorithmic findings.\nNote that there is no input data for these policies,\nthey always return output, and the allowed value is ignored.\n - POLICY_TYPE_SYSTEM_FINDING: A system finding policy is created from a system policy\ntemplate. It processes data and creates new findings.\nSystem finding policies are run together with user and\nML (a.k.a. algorithmic) findings.\nSystem finding policies can only be enabled, disabled, and\nedited. They cannot be created or deleted.\n - POLICY_TYPE_USER_FINDING: A user finding policy is created from scratch or from a customer\npolicy template. It processes data and creates new findings.\nUser finding policies are run together with system and\nML (a.k.a. algorithmic) findings.\nUser finding policies can be created, enabled, disabled, edited,\nand deleted.\n - POLICY_TYPE_EXCEPTION: An exception policy identifies findings which should be\nexcluded from admission and notification policies. It is\ncreated from scratch or from an exception policy template.\n - POLICY_TYPE_REMEDIATION: A remediation policy identifies findings which should be\nremediated. It is created from scratch or from a remediation\npolicy template."
      enum:
      - POLICY_TYPE_UNSPECIFIED
      - POLICY_TYPE_ADMISSION
      - POLICY_TYPE_NOTIFICATION
      - POLICY_TYPE_FINDING
      - POLICY_TYPE_FINDING_CFG
      - POLICY_TYPE_ML_FINDING
      - POLICY_TYPE_SYSTEM_FINDING
      - POLICY_TYPE_USER_FINDING
      - POLICY_TYPE_EXCEPTION
      - POLICY_TYPE_REMEDIATION
      type: string
    googleprotobufAny:
      additionalProperties: {}
      description: "`Any` contains an arbitrary serialized protocol buffer message along with a\nURL that describes the type of the serialized message.\n\nProtobuf library provides support to pack/unpack Any values in the form\nof utility functions or additional generated methods of the Any type.\n\nExample 1: Pack and unpack a message in C++.\n\n    Foo foo = ...;\n    Any any;\n    any.PackFrom(foo);\n    ...\n    if (any.UnpackTo(&foo)) {\n      ...\n    }\n\nExample 2: Pack and unpack a message in Java.\n\n    Foo foo = ...;\n    Any any = Any.pack(foo);\n    ...\n    if (any.is(Foo.class)) {\n      foo = any.unpack(Foo.class);\n    }\n    // or ...\n    if (any.isSameTypeAs(Foo.getDefaultInstance())) {\n      foo = any.unpack(Foo.getDefaultInstance());\n    }\n\n Example 3: Pack and unpack a message in Python.\n\n    foo = Foo(...)\n    any = Any()\n    any.Pack(foo)\n    ...\n    if any.Is(Foo.DESCRIPTOR):\n      any.Unpack(foo)\n      ...\n\n Example 4: Pack and unpack a message in Go\n\n     foo := &pb.Foo{...}\n     any, err := anypb.New(foo)\n     if err != nil {\n       ...\n     }\n     ...\n     foo := &pb.Foo{}\n     if err := any.UnmarshalTo(foo); err != nil {\n       ...\n     }\n\nThe pack methods provided by protobuf library will by default use\n'type.googleapis.com/full.type.name' as the type URL and the unpack\nmethods only use the fully qualified type name after the last '/'\nin the type URL, for example \"foo.bar.com/x/y.z\" will yield type\nname \"y.z\".\n\nJSON\n====\nThe JSON representation of an `Any` value uses the regular\nrepresentation of the deserialized, embedded message, with an\nadditional field `@type` which contains the type URL. Example:\n\n    package google.profile;\n    message Person {\n      string first_name = 1;\n      string last_name = 2;\n    }\n\n    {\n      \"@type\": \"type.googleapis.com/google.profile.Person\",\n      \"firstName\": <string>,\n      \"lastName\": <string>\n    }\n\nIf the embedded message type is well-known and has a custom JSON\nrepresentation, that representation will be embedded adding a field\n`value` which holds the custom JSON in addition to the `@type`\nfield. Example (for message [google.protobuf.Duration][]):\n\n    {\n      \"@type\": \"type.googleapis.com/google.protobuf.Duration\",\n      \"value\": \"1.212s\"\n    }"
      properties:
        '@type':
          description: "A URL/resource name that uniquely identifies the type of the serialized\nprotocol buffer message. This string must contain at least\none \"/\" character. The last segment of the URL's path must represent\nthe fully qualified name of the type (as in\n`path/google.protobuf.Duration`). The name should be in a canonical form\n(e.g., leading \".\" is not accepted).\n\nIn practice, teams usually precompile into the binary all types that they\nexpect it to use in the context of Any. However, for URLs which use the\nscheme `http`, `https`, or no scheme, one can optionally set up a type\nserver that maps type URLs to message definitions as follows:\n\n* If no scheme is provided, `https` is assumed.\n* An HTTP GET on the URL must yield a [google.protobuf.Type][]\n  value in binary format, or produce an error.\n* Applications are allowed to cache lookup results based on the\n  URL, or have them precompiled into a binary to avoid any\n  lookup. Therefore, binary compatibility needs to be preserved\n  on changes to types. (Use versioned type names to manage\n  breaking changes.)\n\nNote: this functionality is not currently available in the official\nprotobuf release, and it is not used for type URLs beginning with\ntype.googleapis.com. As of May 2023, there are no widely used type server\nimplementations and no plans to implement one.\n\nSchemes other than `http`, `https` (or the empty scheme) might be\nused with implementation specific semantics."
          type: string
      type: object
    v1PolicyValidationRequest:
      description: 'PolicyValidationRequest represents a policy validation request.

        If no project is specified the policy is validated against all projects.'
      properties:
        disable_preview:
          description: Set to true to validate the policy without project data.
          type: boolean
        policy_type:
          $ref: '#/components/schemas/PolicyPolicyType'
        project_exceptions:
          description: 'The set of tags that projects that are matched

            with are excluded from the policy. Allows exceptions. Exceptions

            can be provided with or without selectors.'
          items:
            type: string
          type: array
        project_selector:
          items:
            type: string
          title: 'The set of tags that projects must have for the policy to be executed against. If left empty, the policy

            applies to all projects of the namespace. The items in the array

            correspond to an OR operator. (ie any project with a tag that matches any

            of the project_selector values will be matched.)'
          type: array
        project_uuid:
          description: The UUID of project to load data from [optional].
          type: string
        query_statements:
          description: 'List of OPA query statements that must be executed to

            evaluate the policy (for example, "data.packagename.allow").'
          items:
            type: string
          type: array
        resource_kinds:
          description: 'Identifies all resources that a policy requires.

            For example, "Project", "Repository", "RepositoryVersion", "PackageVersion", "DependencyMetadata", "Metric", "LinterResult", "Finding", etc.

            For the "Metric" resource you must also specify the corresponding parent resource kind.'
          items:
            type: string
          type: array
        rule:
          description: Policy Rego rule in text format.
          type: string
        target_kind:
          description: 'Repository, RepositoryVersion, or PackageVersion.

            This is usually the same as the finding parent kind.

            Only applicable to SYSTEM and USER_FINDING policies.'
          type: string
        template_uuid:
          description: The UUID of policy template from which the policy will be created.
          type: string
        template_values:
          additionalProperties:
            $ref: '#/components/schemas/PolicyTemplateParameterValues'
          description: The map of key-value pairs for parameters used to customize the policy Rego rule.
          type: object
      type: object
    PolicyTemplateParameterValues:
      properties:
        values:
          items:
            type: string
          title: List of template parameter values
          type: array
      type: object
    v1PolicyOutput:
      properties:
        allow:
          description: 'True if input data is accepted by policy.

            False if input data violates the expected state.'
          type: boolean
        raw:
          description: Raw policy output.
          items:
            type: object
          type: array
        violating_resources:
          additionalProperties:
            $ref: '#/components/schemas/v1ResourceUuids'
          description: 'Lists of UUIDs of resources that violate the policy,

            if applicable, indexed by resource name.'
          type: object
      type: object
    v1ResourceUuids:
      properties:
        uuids:
          description: The list of resource UUIDs.
          items:
            type: string
          type: array
      type: object
    googlerpcStatus:
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
          format: int32
          type: integer
        details:
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
          items:
            $ref: '#/components/schemas/googleprotobufAny'
          type: array
        message:
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
          type: string
      type: object
    PolicyValidationResult:
      description: PolicyValidationResult represents a policy validation result.
      properties:
        allow:
          description: 'True if input data is accepted by policy.

            False if input data is rejected by policy.

            Null if validation failed.'
          type: boolean
        evaluation_time:
          additionalProperties:
            format: int64
            type: string
          description: Time it took to evaluate the policy, in milliseconds, indexed by the project UUID.
          type: object
        policy_output:
          additionalProperties:
            $ref: '#/components/schemas/v1PolicyOutput'
          description: Parsed policy output indexed by the project UUID.
          type: object
        policy_rule:
          description: Policy rule from the request.
          type: string
        query_statements:
          description: List of policy query statements from the request.
          items:
            type: string
          type: array
        resource_kinds:
          description: List of resource kinds that the validated policy requires.
          items:
            type: string
          type: array
        valid_policy:
          description: 'Validation result.

            True if policy is valid.

            False if policy is not valid.'
          type: boolean
        validation_error:
          description: 'Validation error if applicable.

            Empty if policy is valid.'
          type: string
      required:
      - policy_rule
      - query_statements
      - valid_policy
      type: object
    v1PolicyValidation:
      description: PolicyValidation represents a policy validation request and response.
      properties:
        meta:
          $ref: '#/components/schemas/v1Meta'
        spec:
          $ref: '#/components/schemas/v1PolicyValidationSpec'
        tenant_meta:
          $ref: '#/components/schemas/v1TenantMeta'
        uuid:
          description: The UUID of the resource.
          readOnly: true
          type: string
      required:
      - tenant_meta
      - meta
      - spec
      type: object
    v1PolicyValidationSpec:
      properties:
        request:
          $ref: '#/components/schemas/v1PolicyValidationRequest'
        result:
          $ref: '#/components/schemas/PolicyValidationResult'
      required:
      - request
      type: object
    v1IndexData:
      description: 'IndexData is used to index the resource for search. It''s an internal

        object.'
      properties:
        data:
          items:
            type: string
          readOnly: true
          type: array
        search_score:
          description: search_score is the score of the resource for search. Internal use only.
          format: float
          readOnly: true
          type: number
        tenant:
          readOnly: true
          type: string
        will_be_deleted_at:
          description: Time that the resource will be deleted.
          format: date-time
          readOnly: true
          type: string
      type: object
