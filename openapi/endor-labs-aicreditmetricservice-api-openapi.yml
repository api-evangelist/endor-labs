    v1ListAICreditMetricsResponseList:
      properties:
        objects:
          items:
            $ref: '#/components/schemas/v1AICreditMetric'
          type: array
        response:
          $ref: '#/components/schemas/v1ListResponse'
      type: object
    v1AICreditMetricSpec:
      properties:
        accrued_date:
          description: Indicates the date when cost was calculated/accrured.
          format: date-time
          type: string
        ai_feature:
          $ref: '#/components/schemas/v1AIFeature'
        byok:
          description: 'Deprecated: read credential_class instead. Still written, derived from

            it, so readers have one release to move. Indicates the credits were

            accrued through customer-provided (bring your own key) credentials.

            Such records are kept for usage monitoring and are excluded from

            platform credit-limit enforcement. It is not part of the record

            identity: credential_class is.'
          readOnly: true
          type: boolean
        cached_token_count:
          description: 'The prompt tokens the provider served from, or wrote to, its prompt

            cache, as the provider reports them. OpenAI and Gemini count them inside

            prompt_token_count. Anthropic reports them in addition to it, and for

            Anthropic they are not in total_credit_count.'
          format: double
          readOnly: true
          type: number
        completion_token_count:
          description: The output tokens of total_credit_count, without the reasoning tokens.
          format: double
          readOnly: true
          type: number
        credential_class:
          $ref: '#/components/schemas/v1AICredentialClass'
        credential_ref:
          description: 'The uuid of the AI provider key the accrued usage billed against, unset

            unless the credential class is BYOK. Part of the record identity, so

            each key accrues into its own record for the day.'
          readOnly: true
          type: string
        embedding_call_count:
          description: 'The provider requests that returned embeddings for calls Endor made on

            the tenant''s behalf, as Endor observed them. One embedding call can

            span several provider requests. Unset on chat records.'
          format: double
          readOnly: true
          type: number
        embedding_document_count:
          description: The texts those provider requests embedded. Unset on chat records.
          format: double
          readOnly: true
          type: number
        embedding_model:
          $ref: '#/components/schemas/v1EmbeddingModel'
        failed_attempt_count:
          description: 'The provider responses that were received, billed, and then discarded,

            for example because the output failed schema validation. Their tokens

            are in failed_token_count and also in total_credit_count and the token

            breakdown.'
          format: double
          readOnly: true
          type: number
        failed_token_count:
          description: The part of total_credit_count that failed attempts consumed.
          format: double
          readOnly: true
          type: number
        llm:
          $ref: '#/components/schemas/SpecAvailableLLM'
        llm_cost:
          description: 'Indicates total cost accrued for using this specific AI model for the said AI feature on the accrued date,

            priced at the platform rate and including failed attempts. Unset for BYOK records: the customer''s provider

            account bills that usage, at a price the platform does not know.'
          format: double
          type: number
        prompt_token_count:
          description: The input tokens of total_credit_count, as the provider counts them.
          format: double
          readOnly: true
          type: number
        reasoning_token_count:
          description: 'The reasoning (thinking) output tokens of total_credit_count. Zero for

            providers that report none.'
          format: double
          readOnly: true
          type: number
        total_credit_count:
          description: 'Indicates total tokens/credits accrued for using this specific AI model for the said AI feature on the accrued date.

            On records opened after the token breakdown fields were added, it equals prompt_token_count + completion_token_count + reasoning_token_count.

            It includes the tokens of failed attempts.'
          format: double
          type: number
      required:
      - total_credit_count
      - accrued_date
      - llm
      type: object
